[package]
name = "sos-moteur-natif"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false
description = "StreamOS — moteur natif de capture, composition et encodage (sans OBS)"

# Aucune dépendance Tauri, aucun accès au domaine : ce crate doit rester
# compilable et testable seul (`cargo test -p sos-moteur-natif`).
# Contrat : docs/features/moteur-natif.md §3.

[dependencies]
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # Capture WGC (Windows Graphics Capture) + interop WinRT/D3D11.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
] }
