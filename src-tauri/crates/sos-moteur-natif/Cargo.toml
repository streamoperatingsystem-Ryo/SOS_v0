[package]
name = "sos-moteur-natif"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false
description = "StreamOS — moteur natif de capture, composition et encodage (sans OBS)"

# Aucune dépendance Tauri, aucun accès au domaine : ce crate doit rester
# compilable et testable seul (`cargo test -p sos-moteur-natif`).
# Contrat : docs/features/moteur-natif.md §3.

[dependencies]
log = "0.4"
# Décodage des polices de titre : les .woff2 du dépôt (servis au frontend)
# sont convertis en TTF **en mémoire** puis chargés par DirectWrite. Aucun
# téléchargement, aucun fichier écrit (CONTRAT FIGÉ vie privée).
wuff = "0.2"
# Contrats partagés (Sink, PaquetEncode, Conteneur, ErreurMoteur) : le moteur
# les implémente, il ne les redéfinit pas. Contrat §3.2.
sos-moteur-api = { path = "../sos-moteur-api" }
# Contrats de scène (anneau 0) : mapping widget porteur d'une cible -> source de capture.
sos-scene = { path = "../sos-scene" }

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # Capture WGC (Windows Graphics Capture) + interop WinRT/D3D11.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    # Énumération de fenêtres (exemple de vérification 2.2) : EnumWindows,
    # GetWindowTextW, GetForegroundWindow.
    "Win32_UI_WindowsAndMessaging",
    # Audio WASAPI (loopback + micro) — liaisons directes, aucune crate tierce.
    "Win32_Media_Audio",
    # Pipe nommé de l'entrée audio live du sidecar FFmpeg (output/ffmpeg.rs
    # `PipeAudio`) : CreateNamedPipeW + WriteFile — transport kernel local,
    # aucune socket (contrat vie privée).
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    # WriteFile (I/O du pipe) + gate de CreateNamedPipeW (SECURITY_ATTRIBUTES).
    "Win32_System_IO",
    "Win32_Security",
    # Encodage / décodage Media Foundation (MFT) + libération CoTaskMem.
    "Win32_Media_MediaFoundation",
    # Décodage d'images (PNG/JPG/BMP) via WIC — médias et fonds de scène.
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    # Texte natif : DirectWrite (mise en page, polices) + Direct2D (dessin
    # antialiasé avec alpha). `Foundation` porte `Numerics::Matrix3x2`.
    "Foundation_Numerics",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
] }
