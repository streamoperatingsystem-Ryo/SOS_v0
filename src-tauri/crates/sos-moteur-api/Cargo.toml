[package]
name = "sos-moteur-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false
description = "StreamOS — contrats des moteurs de diffusion (sans Tauri, sans Windows)"

# Contrat de l'anneau 2 : uniquement des types et des traits, aucune
# dépendance externe. Il ne dépend ni de Tauri, ni du domaine, ni de
# `windows` ; seul `sos-scene` (anneau 0) fournit le type `Scene` que
# `appliquer_scene` reçoit. Contrat : docs/features/moteur-natif.md §3.1 à §3.3.
[dependencies]
sos-scene = { path = "../sos-scene" }
