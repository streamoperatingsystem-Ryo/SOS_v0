<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamOS — Diffusion</title>
    <style>
      :root {
        --fond: #0a0a0a;
        --texte: #e0e0e0;
        --canvas-w: 1920px;
        --canvas-h: 1080px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: var(--canvas-w);
        height: var(--canvas-h);
        background: transparent;
        color: var(--texte);
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: var(--canvas-w);
        height: var(--canvas-h);
      }
      .widget-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .widget {
        position: absolute;
        background: rgba(224, 224, 224, 0.15);
        border: 1px solid rgba(224, 224, 224, 0.6);
        transform-origin: center center;
        overflow: hidden;
      }
      .widget img {
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;
        transform-origin: center center;
      }
      .widget video {
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;
        transform-origin: center center;
      }
      /* Overlay cadre SVG widget : position absolute, inset 0, au-dessus du
         média, pointer-events:none pour ne pas bloquer. */
      .cadre-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
      /* Overlay cadre app : bord extérieur du canvas, au-dessus des widgets. */
      #cadre-app-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 100;
      }
      #bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }
      /* Canvas qui affiche le fond avec les trous (destination-out).
         L'img/video source est display:none, sert uniquement de source
         pour drawImage. */
      #bg-canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }
      #bg img, #bg video {
        display: none;
      }
      /* Widget chat : bulles carte arrondie, zébrage via --fond, logo 12px,
         avatar 24px, badges IRC (mod/vip/sub/broadcaster), emojis visibles. */
      .widget.chat {
        background: var(--fond);
        overflow: hidden;
      }
      .chat-body {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-wrap: break-word;
        word-break: break-word;
        padding: 0.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        pointer-events: none;
        font-family: system-ui, "Segoe UI Emoji", "Apple Color Emoji",
          "Noto Color Emoji", sans-serif;
      }
      .chat-msg {
        display: flex;
        align-items: baseline;
        gap: 0.25rem;
        padding: 0.2rem 0.3rem;
        border-radius: 0.3rem;
        line-height: 1.25;
      }
      /* Zébrage --fond : pair légèrement plus clair, impair = fond nu. */
      .chat-msg.pair {
        background: rgba(255, 255, 255, 0.05);
      }
      .chat-msg .avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        flex-shrink: 0;
        align-self: center;
        object-fit: cover;
      }
      .chat-msg .badge {
        font-size: 0.6em;
        padding: 0 0.25rem;
        border-radius: 0.2rem;
        margin-right: 0.1rem;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
        align-self: center;
        line-height: 1.4;
      }
      .chat-msg .badge.mod { background: #00ad03; }
      .chat-msg .badge.vip { background: #e005b9; }
      .chat-msg .badge.sub { background: #6b35c9; }
      .chat-msg .badge.broadcaster { background: #9146ff; }
      .chat-msg .logo {
        flex-shrink: 0;
        align-self: center;
        opacity: 0.85;
      }
      .chat-msg .plat-badge {
        flex-shrink: 0;
        align-self: center;
        font-size: 0.55em;
        font-weight: 700;
        padding: 0 0.2rem;
        border-radius: 0.15rem;
        color: #fff;
        line-height: 1.4;
        margin-right: 0.1rem;
      }
      .chat-msg .plat-badge.twitch { background: #9146ff; }
      .chat-msg .plat-badge.kick { background: #53fc18; color: #000; }
      .chat-msg .plat-badge.youtube { background: #ff0000; }
      .chat-msg .plat-badge.tiktok { background: #000; }
      .chat-msg .pseudo {
        font-weight: 600;
        flex-shrink: 0;
      }
      .chat-msg .texte {
        flex: 1;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bg">
        <canvas id="bg-canvas"></canvas>
      </div>
    </div>
    <script>
      // ZÉRO import Tauri. État uniquement via WebSocket snapshot.
      // Aucun texte visible à l'écran — logs console seulement.
      // Dims canvas = résolution OBS reçue via snapshot (canvasW/canvasH),
      // fallback 1920×1080 si absente. Widgets jamais rescalés.
      const stageEl = document.getElementById("stage");
      const bgEl = document.getElementById("bg");
      const bgCanvas = document.getElementById("bg-canvas");
      const bgCtx = bgCanvas.getContext("2d");
      const rootStyle = document.documentElement.style;

      function applyCanvasDims(scene) {
        const w = (scene && scene.canvasW) || 1920;
        const h = (scene && scene.canvasH) || 1080;
        rootStyle.setProperty("--canvas-w", w + "px");
        rootStyle.setProperty("--canvas-h", h + "px");
        // Canvas physique = résolution scène (pas de scale CSS).
        if (bgCanvas.width !== w) bgCanvas.width = w;
        if (bgCanvas.height !== h) bgCanvas.height = h;
      }

      const FIT_CSS = {
        ajuster: "contain",
        remplir: "cover",
        etirer: "fill",
        centrer: "none",
        vignette: "scale-down",
        etendre: "cover"
      };

      const VIDEO_EXT = ["mp4", "webm"];
      function kindFromMedia(rel) {
        const ext = (rel.split(".").pop() || "").toLowerCase();
        return VIDEO_EXT.indexOf(ext) >= 0 ? "video" : "image";
      }

      // Map id → { el, wrapEl, mediaEl, mediaKey, kind, mediaTime }.
      // On diff : MAJ style only sur les widgets existants, on ne touche
      // JAMAIS à video.src / currentTime / load() — la vidéo continue.
      // RÈGLE : currentTime ne bouge QUE si le nom de fichier change.
      // Drag, resize, rotateX/Y, z-index, mediaFit = style seulement.
      const widgetMap = new Map();

      // Messages chat reçus via WS (type "chat"). Borné à 200.
      let chatMessages = [];
      const MAX_CHAT = 200;

      // Logo Twitch SVG (12px) — inline, pas de fichier à servir.
      const TWITCH_LOGO_SVG = '<svg class="logo" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">'
        + '<path fill="currentColor" d="M3 1L1.5 3.5V13H4.5V15H6L8 13H10.5L13.5 10V1H3ZM12 9.5L10 11.5H7L5 13.5V11.5H3V2H12V9.5Z"/>'
        + '<rect x="9" y="4" width="1" height="3"/><rect x="6" y="4" width="1" height="3"/></svg>';

      // Logo Kick SVG (K vert, marque Kick).
      const KICK_LOGO_SVG = '<svg class="logo" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">'
        + '<path fill="#53fc18" d="M5 2h4v6h2V6h2V4h2V2h4v6h-2v2h-2v4h2v2h2v6h-4v-2h-2v-2h-2v4H5z"/></svg>';

      // Retourne le logo/badge HTML selon la plateforme du message.
      // Twitch + Kick = SVG logo ; autres = badge texte coloré.
      function logoPlateforme(p) {
        if (p === "twitch") return TWITCH_LOGO_SVG;
        if (p === "kick") return KICK_LOGO_SVG;
        if (p === "youtube") return '<span class="plat-badge youtube">YT</span>';
        if (p === "tiktok") return '<span class="plat-badge tiktok">TT</span>';
        return "";
      }

      // Rend le contenu HTML d'un message chat (avatar + badges + logo + pseudo + texte).
      function renderChatMsg(m, i) {
        var logo = logoPlateforme(m.plateforme);
        var avatar = m.avatar
          ? '<img class="avatar" src="' + escapeHtml(m.avatar) + '" width="24" height="24" alt="" referrerpolicy="no-referrer">'
          : "";
        var badges = renderBadges(m.badges);
        return '<div class="chat-msg' + (i % 2 === 0 ? " pair" : "") + '">'
          + avatar
          + badges
          + logo
          + '<span class="pseudo"></span>'
          + '<span class="texte"></span>'
          + "</div>";
      }

      // Remplit un élément .chat-body avec les messages filtrés.
      // Échappement HTML du pseudo + texte (sécurité XSS).
      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // Parse le tag IRC `badges` (ex. "moderator/1,subscriber/12,vip/1")
      // → tableau d'identifiants courts : mod / vip / sub / broadcaster.
      // Badges inconnus ignorés. Ordre conservé (mod avant vip avant sub).
      function parseBadges(raw) {
        if (!raw) return [];
        var out = [];
        var parts = raw.split(",");
        for (var i = 0; i < parts.length; i++) {
          var name = parts[i].split("/")[0];
          if (name === "moderator") out.push("mod");
          else if (name === "vip") out.push("vip");
          else if (name === "subscriber") out.push("sub");
          else if (name === "broadcaster") out.push("broadcaster");
        }
        return out;
      }

      // Construit le HTML des badges chips pour un message.
      function renderBadges(badgesRaw) {
        var ids = parseBadges(badgesRaw);
        var html = "";
        for (var i = 0; i < ids.length; i++) {
          html += '<span class="badge ' + ids[i] + '">' + ids[i] + '</span>';
        }
        return html;
      }

      function fillChatBody(bodyEl, filtre, taillePolice) {
        var msgs = filtre === "unifie"
          ? chatMessages
          : chatMessages.filter(function (m) { return m.plateforme === filtre; });
        bodyEl.style.fontSize = taillePolice + "px";
        // Vider + reconstruire (simple, peu de messages).
        bodyEl.innerHTML = "";
        for (var i = 0; i < msgs.length; i++) {
          var m = msgs[i];
          var div = document.createElement("div");
          div.className = "chat-msg" + (i % 2 === 0 ? " pair" : "");
          var logo = logoPlateforme(m.plateforme);
          var avatar = m.avatar
            ? '<img class="avatar" src="' + escapeHtml(m.avatar) + '" width="24" height="24" alt="" referrerpolicy="no-referrer">'
            : "";
          var badges = renderBadges(m.badges);
          div.innerHTML = avatar
            + badges
            + logo
            + '<span class="pseudo">' + escapeHtml(m.pseudo) + "</span>"
            + '<span class="texte">' + escapeHtml(m.texte) + "</span>";
          bodyEl.appendChild(div);
        }
        // Auto-scroll en bas.
        bodyEl.scrollTop = bodyEl.scrollHeight;
      }

      // Re-rend les widgets chat existants (appelé sur nouveau message).
      function rerenderChatWidgets() {
        if (!currentScene || !currentScene.widgets) {
          console.log("[Chat] rerender: currentScene vide — AUCUN widget");
          return;
        }
        var nChat = 0, nFilled = 0;
        for (var i = 0; i < currentScene.widgets.length; i++) {
          var w = currentScene.widgets[i];
          if ((w.type || "media") !== "chat") continue;
          nChat++;
          var entry = widgetMap.get(w.id);
          if (entry && entry.chatBody) {
            fillChatBody(entry.chatBody, w.chatFiltre || "unifie", w.taillePolice || 16);
            nFilled++;
          } else {
            console.log("[Chat] rerender: widget " + w.id + " PAS dans widgetMap (DOM non créé)");
          }
        }
        console.log("[Chat] rerender: " + nChat + " widget(s) chat, " + nFilled + " rempli(s), " + chatMessages.length + " message(s)");
      }

      // État du fond de scène : { mediaEl, mediaKey, kind, mediaTime }.
      // mediaEl (img/video) est display:none — sert uniquement de source
      // pour drawImage dans peindreFond().
      let bgState = { mediaEl: null, mediaKey: "", kind: "", mediaTime: 0 };

      // Nom de fichier seul (sans dossier "medias/", sans query, sans URL).
      // C'est la seule clé qui détermine si on recrée le mediaEl.
      function mediaKey(rel) {
        if (!rel) return "";
        const noQuery = rel.split("?")[0];
        const parts = noQuery.split("/");
        return parts[parts.length - 1] || "";
      }

      function applyWidgetStyle(el, w) {
        el.style.left = w.x + "px";
        el.style.top = w.y + "px";
        el.style.width = w.largeur + "px";
        el.style.height = w.hauteur + "px";
        // zIndex est sur le wrapper (.widget-wrap), pas sur .widget.
        const rx = w.rotateX || 0;
        const ry = w.rotateY || 0;
        el.style.transform = "perspective(800px) rotateX(" + rx + "deg) rotateY(" + ry + "deg)";
      }

      function applyMediaStyle(mediaEl, w) {
        const fit = w.mediaFit || "ajuster";
        mediaEl.style.objectFit = FIT_CSS[fit] || "contain";
        mediaEl.style.objectPosition = fit === "centrer" ? "center" : "50% 50%";
        // Zoom + rotation 2D du média (cadre widget fixe, overflow:hidden coupe).
        const zoom = w.mediaZoom || 1;
        const rot = w.mediaRot || 0;
        mediaEl.style.transform = "rotate(" + rot + "deg) scale(" + zoom + ")";
        mediaEl.style.transformOrigin = "center center";
      }

      function createMedia(w, kind) {
        if (kind === "video") {
          // OBS : muet, pas de contrôles ni de clic. play/pause/loop gérés par
          // applyMediaState selon mediaPaused (snapshot WS depuis le dashboard).
          const vid = document.createElement("video");
          vid.src = "/" + w.media;
          vid.muted = true;
          vid.setAttribute("playsinline", "");
          return vid;
        }
        const img = document.createElement("img");
        img.src = "/" + w.media; // /medias/xxx.png → même origine :4321
        return img;
      }

      // Applique l'état lecture/pause/loop/seek d'une vidéo widget selon
      // mediaPaused/mediaTime. Tracker entry.mediaTime pour ne reset
      // currentTime que sur changement (pas sur chaque snapshot).
      function applyMediaState(entry, w) {
        if (!entry.mediaEl || entry.kind !== "video") return;
        const paused = w.mediaPaused !== false; // défaut true
        entry.mediaEl.loop = !paused;
        if (paused) {
          if (!entry.mediaEl.paused) entry.mediaEl.pause();
        } else {
          if (entry.mediaEl.paused) entry.mediaEl.play().catch(function () {});
        }
        const t = w.mediaTime || 0;
        if (entry.mediaTime !== t) {
          try { entry.mediaEl.currentTime = t; } catch (e) {}
          entry.mediaTime = t;
        }
      }

      // ===== Fond de scène : canvas destination-out =====
      // Le fond est dessiné sur #bg-canvas. Les trous (widgets w.trou=true)
      // sont EFFACÉS du canvas via destination-out → alpha 0 → OBS visible.

      // Calcule le rectangle source/dest pour drawImage selon le mode fit.
      // Retourne { sx, sy, sw, sh, dx, dy, dw, dh } ou null (centrer + img plus
      // petite que le canvas → pas de dessin).
      function fitRects(imgW, imgH, cw, ch, fit) {
        const ir = imgW / imgH;
        const cr = cw / ch;
        let dw, dh, dx, dy;
        if (fit === "etirer") {
          return { sx: 0, sy: 0, sw: imgW, sh: imgH, dx: 0, dy: 0, dw: cw, dh: ch };
        }
        if (fit === "centrer") {
          dw = imgW; dh = imgH; dx = (cw - dw) / 2; dy = (ch - dh) / 2;
          if (dw <= cw && dh <= ch) {
            return { sx: 0, sy: 0, sw: imgW, sh: imgH, dx, dy, dw, dh };
          }
          // Plus grand que le canvas → comme "ajuster" (scale-down).
          fit = "ajuster";
        }
        if (fit === "vignette") {
          // scale-down = min(naturel, contain)
          const scale = Math.min(cw / imgW, ch / imgH, 1);
          dw = imgW * scale; dh = imgH * scale;
          dx = (cw - dw) / 2; dy = (ch - dh) / 2;
          return { sx: 0, sy: 0, sw: imgW, sh: imgH, dx, dy, dw, dh };
        }
        if (fit === "remplir" || fit === "etendre") {
          // cover : remplit le canvas, crop le débordement
          if (ir > cr) {
            dh = ch; dw = ch * ir;
          } else {
            dw = cw; dh = cw / ir;
          }
          dx = (cw - dw) / 2; dy = (ch - dh) / 2;
          return { sx: 0, sy: 0, sw: imgW, sh: imgH, dx, dy, dw, dh };
        }
        // ajuster (contain) : tient dans le canvas, bands noires
        if (ir > cr) {
          dw = cw; dh = cw / ir;
        } else {
          dh = ch; dw = ch * ir;
        }
        dx = (cw - dw) / 2; dy = (ch - dh) / 2;
        return { sx: 0, sy: 0, sw: imgW, sh: imgH, dx, dy, dw, dh };
      }

      // Peint le fond sur #bg-canvas avec les trous (destination-out).
      // Appelée à chaque snapshot (image) ou via rAF (vidéo).
      function peindreFond(scene) {
        const cw = bgCanvas.width;
        const ch = bgCanvas.height;
        bgCtx.clearRect(0, 0, cw, ch);

        if (!bgState.mediaEl) return;
        const src = bgState.mediaEl;
        // Vidéo : readyState >= 2 (HAVE_CURRENT_DATA) pour drawImage.
        // Image : complete && naturalWidth > 0.
        const ready = bgState.kind === "video"
          ? (src.readyState >= 2)
          : (src.complete && src.naturalWidth > 0);
        if (!ready) return;

        const fit = scene.bgFit || "remplir";
        const r = fitRects(src.videoWidth || src.naturalWidth,
                           src.videoHeight || src.naturalHeight,
                           cw, ch, fit);
        if (!r) return;

        // Zoom + rotation 2D du fond : on dessine dans un sous-canvas temporaire
        // puis on drawImage avec transform. Plus simple : on set le transform
        // du ctx autour du centre du canvas, drawImage, puis reset.
        const zoom = scene.bgZoom || 1;
        const rot = (scene.bgRot || 0) * Math.PI / 180;
        bgCtx.save();
        bgCtx.globalCompositeOperation = "source-over";
        // Transform centré sur le canvas (origine = centre).
        bgCtx.translate(cw / 2, ch / 2);
        bgCtx.rotate(rot);
        bgCtx.scale(zoom, zoom);
        bgCtx.translate(-cw / 2, -ch / 2);
        try {
          bgCtx.drawImage(src, r.sx, r.sy, r.sw, r.sh, r.dx, r.dy, r.dw, r.dh);
        } catch (e) {
          // drawImage peut échouer si la vidéo n'est pas prête → ignore.
        }
        bgCtx.restore();

        // ===== Trous : destination-out =====
        // Efface alpha dans la zone de chaque widget trou. Le trou suit TOUTES
        // les transforms du widget (x y w h + rotateX/rotateY + perspective 800px),
        // même ordre que le CSS .widget-3d : rotateY puis rotateX puis perspective.
        // Fast path : rx=ry=0 → fillRect (sortie pixel-identique à v0.15b).
        function projectCorner(lx, ly, rx, ry, d) {
          const rxR = rx * Math.PI / 180;
          const ryR = ry * Math.PI / 180;
          // rotateY (autour de Y) : x' = cos(ry)*lx, z' = -sin(ry)*lx, y' = ly
          const x1 = Math.cos(ryR) * lx;
          const z1 = -Math.sin(ryR) * lx;
          const y1 = ly;
          // rotateX (autour de X) : y'' = cos(rx)*y' - sin(rx)*z', z'' = sin(rx)*y' + cos(rx)*z'
          const y2 = Math.cos(rxR) * y1 - Math.sin(rxR) * z1;
          const z2 = Math.sin(rxR) * y1 + Math.cos(rxR) * z1;
          // perspective(d) : w = 1 - z/d, px = x/w, py = y/w
          const w = 1 - z2 / d;
          return { x: x1 / w, y: y2 / w };
        }
        const PERSP = 800;
        bgCtx.save();
        bgCtx.globalCompositeOperation = "destination-out";
        const ws = scene.widgets || [];
        let n = 0;
        for (let i = 0; i < ws.length; i++) {
          const w = ws[i];
          if (w.trou === true) {
            const rx = w.rotateX || 0;
            const ry = w.rotateY || 0;
            if (rx === 0 && ry === 0) {
              // Fast path : rectangle AABB (identique v0.15b).
              bgCtx.fillRect(w.x, w.y, w.largeur, w.hauteur);
            } else {
              // Quad projeté : 4 coins locaux (relatifs au centre, z=0)
              // projetés par la même matrice que .widget-3d, puis translatés.
              const cx = w.x + w.largeur / 2;
              const cy = w.y + w.hauteur / 2;
              const hw = w.largeur / 2;
              const hh = w.hauteur / 2;
              const c0 = projectCorner(-hw, -hh, rx, ry, PERSP);
              const c1 = projectCorner( hw, -hh, rx, ry, PERSP);
              const c2 = projectCorner( hw,  hh, rx, ry, PERSP);
              const c3 = projectCorner(-hw,  hh, rx, ry, PERSP);
              bgCtx.beginPath();
              bgCtx.moveTo(cx + c0.x, cy + c0.y);
              bgCtx.lineTo(cx + c1.x, cy + c1.y);
              bgCtx.lineTo(cx + c2.x, cy + c2.y);
              bgCtx.lineTo(cx + c3.x, cy + c3.y);
              bgCtx.closePath();
              bgCtx.fill();
            }
            n++;
          }
        }
        bgCtx.restore();
        bgCtx.globalCompositeOperation = "source-over";
      }

      // Boucle rAF pour le fond vidéo (sinon frame figée sans trou).
      let rafId = 0;
      function startBgLoop() {
        if (rafId) return;
        function tick() {
          if (bgState.kind === "video" && bgState.mediaEl) {
            peindreFond(currentScene);
          }
          rafId = requestAnimationFrame(tick);
        }
        rafId = requestAnimationFrame(tick);
      }
      function stopBgLoop() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
      }

      // Applique l'état lecture/pause/loop/seek de la vidéo fond selon
      // bgPaused/bgTime. Tracker bgState.mediaTime pour ne reset currentTime
      // que sur changement.
      function applyBgState(state, scene) {
        if (!state.mediaEl || state.kind !== "video") return;
        const paused = scene.bgPaused !== false; // défaut true
        state.mediaEl.loop = !paused;
        if (paused) {
          if (!state.mediaEl.paused) state.mediaEl.pause();
        } else {
          if (state.mediaEl.paused) state.mediaEl.play().catch(function () {});
        }
        const t = scene.bgTime || 0;
        if (state.mediaTime !== t) {
          try { state.mediaEl.currentTime = t; } catch (e) {}
          state.mediaTime = t;
        }
      }

      // Rendu du fond de scène. Règle : ne recréer le mediaEl QUE si le nom
      // de fichier (bgMedia) ou le kind change. Sinon style only (mais le
      // mediaEl est display:none — le rendu visuel est sur #bg-canvas).
      function renderBg(scene) {
        const rel = scene.bgMedia || "";
        if (!rel) {
          if (bgState.mediaEl) {

        var numTop = Math.max(0, Math.floor((safeEndTop - safeStart) / 70));
        var numSide = Math.max(0, Math.floor((safeEndSide - safeStart) / 70));
        var smallHeartsSvg = "";
        for (var i = 0; i < numTop; i++) {
          var x = safeStart + (numTop > 0 ? (i + 1) * (safeEndTop - safeStart) / (numTop + 1) : 0);
          smallHeartsSvg += '<path d="' + heartShape(x, 0, smallHeartSize) + '" fill="' + blanc + '"/>';
          smallHeartsSvg += '<path d="' + heartShape(x, H, smallHeartSize) + '" fill="' + blanc + '"/>';
        }
        for (var j = 0; j < numSide; j++) {
          var y = safeStart + (numSide > 0 ? (j + 1) * (safeEndSide - safeStart) / (numSide + 1) : 0);
          smallHeartsSvg += '<path d="' + heartShape(0, y, smallHeartSize) + '" fill="' + blanc + '"/>';
          smallHeartsSvg += '<path d="' + heartShape(W, y, smallHeartSize) + '" fill="' + blanc + '"/>';
        }
        return '<svg width="' + svgW + '" height="' + svgH + '" viewBox="-' + margin + " -" + margin + " " + svgW + " " + svgH + '" preserveAspectRatio="none" style="position:absolute;top:-' + margin + "px;left:-" + margin + 'px;pointer-events:none;z-index:5;">'
          + "<defs>"
          + '<linearGradient id="' + gradId + '" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="' + palette.vif + '"/><stop offset="50%" stop-color="' + palette.clair + '"/><stop offset="100%" stop-color="' + palette.profond + '"/></linearGradient>'
          + '<linearGradient id="' + innerGradId + '" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="' + blanc + '" stop-opacity="0.7"/><stop offset="50%" stop-color="' + palette.pale + '" stop-opacity="0.5"/><stop offset="100%" stop-color="' + blanc + '" stop-opacity="0.7"/></linearGradient>'
          + '<clipPath id="' + clipId + '"><path d="' + borderPath + '"/></clipPath>'
          + "</defs>"
          + '<g clip-path="url(#' + clipId + ')">'
          + '<path d="' + borderPath + '" fill="none" stroke="' + palette.vif + '" stroke-width="' + (ep * 2) + '" stroke-linejoin="round" opacity="0.2"/>'
          + '<path d="' + borderPath + '" fill="none" stroke="url(#' + gradId + ')" stroke-width="' + ep + '" stroke-linejoin="round"/>'
          + '<path d="' + borderPath + '" fill="none" stroke="url(#' + innerGradId + ')" stroke-width="' + Math.max(1, ep * 0.3) + '" stroke-linejoin="round" opacity="0.7"/>'
          + "</g>"
          + "<g>" + cornerHeartsSvg + "</g>"
          + '<g opacity="0.75">' + smallHeartsSvg + "</g>"
          + "</svg>";
      }

      // --- Thin Line ---
      var THINLINE_VARIANTES = {
        graphite: { principal: "#2d2d2d", accent: "#4a4a4a" },
        argent: { principal: "#a0a0a0", accent: "#c0c0c0" },
        "blanc-pure": { principal: "#ffffff", accent: "#e0e0e0" }
      };
      function getThinLineClipSize(sw) {
        return Math.max(6, Math.round(clampStrokeWidth(sw) * 1.5));
      }
      function getThinLineClipPath(W, H, sw) {
        var r = getThinLineClipSize(sw);
        var rEff = Math.min(r, W / 4, H / 4);
        return "path('M " + rEff + " 0 L " + (W - rEff) + " 0 Q " + W + " 0 " + W + " " + rEff + " L " + W + " " + (H - rEff) + " Q " + W + " " + H + " " + (W - rEff) + " " + H + " L " + rEff + " " + H + " Q 0 " + H + " 0 " + (H - rEff) + " L 0 " + rEff + " Q 0 0 " + rEff + " 0 Z')";
      }
      function renderThinLine(W, H, idCadre, strokeWidth, variante) {
        var p = THINLINE_VARIANTES[variante] || THINLINE_VARIANTES.graphite;
        var ep = clampStrokeWidth(strokeWidth);
        var r = Math.min(getThinLineClipSize(ep), W / 4, H / 4);
        var margin = Math.max(4, ep);
        var svgW = W + margin * 2, svgH = H + margin * 2;
        var cornerLen = Math.max(10, ep * 3);
        var cornerGap = Math.max(3, ep * 0.8);
        return '<svg width="' + svgW + '" height="' + svgH + '" viewBox="-' + margin + " -" + margin + " " + svgW + " " + svgH + '" preserveAspectRatio="none" style="position:absolute;top:-' + margin + "px;left:-" + margin + 'px;pointer-events:none;z-index:5;">'
          + '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="' + r + '" ry="' + r + '" fill="none" stroke="' + p.principal + '" stroke-width="' + ep + '"/>'
          + '<g stroke="' + p.accent + '" stroke-width="' + Math.max(1, ep * 0.6) + '" fill="none" stroke-linecap="square">'
          + '<path d="M ' + (-cornerGap) + " " + (cornerLen + cornerGap) + " L " + (-cornerGap) + " " + (-cornerGap) + " L " + (cornerLen + cornerGap) + " " + (-cornerGap) + '"/>'
          + '<path d="M ' + (W - cornerLen - cornerGap) + " " + (-cornerGap) + " L " + (W + cornerGap) + " " + (-cornerGap) + " L " + (W + cornerGap) + " " + (cornerLen + cornerGap) + '"/>'
          + '<path d="M ' + (-cornerGap) + " " + (H - cornerLen - cornerGap) + " L " + (-cornerGap) + " " + (H + cornerGap) + " L " + (cornerLen + cornerGap) + " " + (H + cornerGap) + '"/>'
          + '<path d="M ' + (W - cornerLen - cornerGap) + " " + (H + cornerGap) + " L " + (W + cornerGap) + " " + (H + cornerGap) + " L " + (W + cornerGap) + " " + (H - cornerLen - cornerGap) + '"/>'
          + "</g>"
          + '<g fill="' + p.accent + '">'
          + '<circle cx="' + (W / 2) + '" cy="0" r="' + Math.max(2, ep * 0.5) + '"/>'
          + '<circle cx="' + (W / 2) + '" cy="' + H + '" r="' + Math.max(2, ep * 0.5) + '"/>'
          + '<circle cx="0" cy="' + (H / 2) + '" r="' + Math.max(2, ep * 0.5) + '"/>'
          + '<circle cx="' + W + '" cy="' + (H / 2) + '" r="' + Math.max(2, ep * 0.5) + '"/>'
          + "</g></svg>";
      }

      // --- Hexagon ---
      var HEXAGON_VARIANTES = {
        ambre: { principal: "#f59e0b", profond: "#b45309", clair: "#fcd34d" },
        azure: { principal: "#0ea5e9", profond: "#0369a1", clair: "#7dd3fc" },
        emerald: { principal: "#10b981", profond: "#047857", clair: "#6ee7b7" },
        violet: { principal: "#8b5cf6", profond: "#6d28d9", clair: "#c4b5fd" },
        steel: { principal: "#64748b", profond: "#334155", clair: "#cbd5e1" }
      };
      function getHexagonClipSize(sw) {
        return Math.max(12, Math.round(clampStrokeWidth(sw) * 4));
      }
      function getHexagonClipPath(W, H, sw) {
        var s = Math.min(getHexagonClipSize(sw), W / 4, H / 4);
        var parts = ["M " + s + " 0", "L " + (W - s) + " 0", "L " + W + " " + (s * 0.5), "L " + W + " " + (H - s * 0.5), "L " + (W - s) + " " + H, "L " + s + " " + H, "L 0 " + (H - s * 0.5), "L 0 " + (s * 0.5), "Z"];
        return "path('" + parts.join(" ") + "')";
      }
      function hexPath(cx, cy, r) {
        var pts = [];
        for (var i = 0; i < 6; i++) {
          var angle = (Math.PI / 3) * i - Math.PI / 6;
          pts.push((cx + r * Math.cos(angle)) + " " + (cy + r * Math.sin(angle)));
        }
        return "M " + pts.join(" L ") + " Z";
      }
      function renderHexagon(W, H, idCadre, strokeWidth, variante) {
        var p = HEXAGON_VARIANTES[variante] || HEXAGON_VARIANTES.ambre;
        var ep = clampStrokeWidth(strokeWidth);
        var s = Math.min(getHexagonClipSize(ep), W / 4, H / 4);
        var margin = Math.max(10, ep * 2.5);
        var svgW = W + margin * 2, svgH = H + margin * 2;
        var uid = (idCadre || "d").replace(/[^a-zA-Z0-9_-]/g, "-");
        var gradId = "grad-hex-" + uid, clipId = "clip-hex-" + uid;
        var borderPath = ["M " + s + " 0", "L " + (W - s) + " 0", "L " + W + " " + (s * 0.5), "L " + W + " " + (H - s * 0.5), "L " + (W - s) + " " + H, "L " + s + " " + H, "L 0 " + (H - s * 0.5), "L 0 " + (s * 0.5), "Z"].join(" ");
        var hexR = Math.max(5, ep * 1.4);
        var corners = [
          { cx: s * 0.5, cy: s * 0.35 }, { cx: W - s * 0.5, cy: s * 0.35 },
          { cx: s * 0.5, cy: H - s * 0.35 }, { cx: W - s * 0.5, cy: H - s * 0.35 }
        ];
        var cornerHexes = corners.map(function (c) {
          return '<path d="' + hexPath(c.cx, c.cy, hexR) + '" fill="none" stroke="' + p.clair + '" stroke-width="' + Math.max(1, ep * 0.35) + '"/>';
        }).join("");
        return '<svg width="' + svgW + '" height="' + svgH + '" viewBox="-' + margin + " -" + margin + " " + svgW + " " + svgH + '" preserveAspectRatio="none" style="position:absolute;top:-' + margin + "px;left:-" + margin + 'px;pointer-events:none;z-index:5;">'
          + "<defs>"
          + '<linearGradient id="' + gradId + '" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="' + p.principal + '"/><stop offset="100%" stop-color="' + p.profond + '"/></linearGradient>'
          + '<clipPath id="' + clipId + '"><path d="' + borderPath + '"/></clipPath>'
          + "</defs>"
          + '<g clip-path="url(#' + clipId + ')">'
          + '<path d="' + borderPath + '" fill="none" stroke="' + p.principal + '" stroke-width="' + (ep * 2) + '" stroke-linejoin="miter" opacity="0.2"/>'
          + '<path d="' + borderPath + '" fill="none" stroke="url(#' + gradId + ')" stroke-width="' + ep + '" stroke-linejoin="miter"/>'
          + '<path d="' + borderPath + '" fill="none" stroke="' + p.clair + '" stroke-width="' + Math.max(1, ep * 0.3) + '" stroke-linejoin="miter" opacity="0.6"/>'
          + "</g>"
          + '<g opacity="0.7">' + cornerHexes
          + '<path d="' + hexPath(W / 2, 0, hexR * 0.7) + '" fill="none" stroke="' + p.clair + '" stroke-width="' + Math.max(1, ep * 0.3) + '" opacity="0.5"/>'
          + '<path d="' + hexPath(W / 2, H, hexR * 0.7) + '" fill="none" stroke="' + p.clair + '" stroke-width="' + Math.max(1, ep * 0.3) + '" opacity="0.5"/></g>'
          + '<path d="' + borderPath + '" fill="none" stroke="' + p.clair + '" stroke-width="' + Math.max(1, ep * 0.2) + '" stroke-linejoin="miter" opacity="0.4" transform="translate(' + (ep * 0.6) + " " + (ep * 0.6) + ") scale(" + Math.max(0.01, 1 - (ep * 1.2) / W) + " " + Math.max(0.01, 1 - (ep * 1.2) / H) + ')"/>'
          + "</svg>";
      }

      // --- Dispatch ---
      var CADRES_RENDERERS = {
        cyberpunk: renderCyberpunk,
        story: renderStory,
        "thin-line": renderThinLine,
        hexagon: renderHexagon
      };
      var CADRES_CLIP_PATHS = {
        cyberpunk: getCyberpunkClipPath,
        story: getStoryClipPath,
        "thin-line": getThinLineClipPath,
        hexagon: getHexagonClipPath
      };

      function genererCadreSVG(cadre, W, H, idCadre) {
        if (!cadre) return "";
        var style = cadre.style || "carre";
        var variante = cadre.variante;
        var strokeWidth = cadre.strokeWidth || 4;
        var couleur = cadre.couleur || "#ffffff";
        var couleurFin = cadre.couleurFin || "#000000";
        if (style === "arrondis" || style === "carre") {
          return renderCadreInline(style, W, H, couleur, couleurFin, strokeWidth, idCadre);
        }
        var fn = CADRES_RENDERERS[style];
        if (fn) return fn(W, H, idCadre, strokeWidth, variante);
        return "";
      }

      function genererCadreClipPath(cadre, W, H) {
        if (!cadre) return null;
        var style = cadre.style || "carre";
        var variante = cadre.variante;
        var strokeWidth = cadre.strokeWidth || 4;
        if (style === "arrondis") {
          var r = Math.min(8, W / 4, H / 4);
          return "path('M " + r + " 0 L " + (W - r) + " 0 Q " + W + " 0 " + W + " " + r + " L " + W + " " + (H - r) + " Q " + W + " " + H + " " + (W - r) + " " + H + " L " + r + " " + H + " Q 0 " + H + " 0 " + (H - r) + " L 0 " + r + " Q 0 0 " + r + " 0 Z')";
        }
        if (style === "carre") return null;
        var fn = CADRES_CLIP_PATHS[style];
        if (!fn) return null;
        try { return fn(W, H, strokeWidth, variante); } catch (e) { return null; }
      }

      // Clé de hachage pour détecter les changements de cadre (évite recréer
      // le SVG à chaque snapshot si rien n'a bougé).
      function cadreKey(cadre, W, H) {
        if (!cadre) return "";
        return (cadre.style || "") + "|" + (cadre.variante || "") + "|"
          + (cadre.strokeWidth || 0) + "|" + (cadre.couleur || "") + "|"
          + (cadre.couleurFin || "") + "|" + Math.round(W) + "x" + Math.round(H);
      }

      // Applique le cadre widget sur un élément .widget : clip-path sur el +
      // overlay SVG dans un div .cadre-overlay enfant. Recrée seulement si
      // la clé a changé (style/variante/strokeWidth/dims).
      function applyCadreWidget(el, entry, w, cadre) {
        var cadreActif = cadre && cadre.actif && (cadre.strokeWidth || 0) > 0 && !w.trou;
        if (!cadreActif) {
          // Nettoyer : retirer clip-path + overlay si présent.
          el.style.clipPath = "";
          el.style.webkitClipPath = "";
          if (entry.cadreOverlayEl) {
            entry.cadreOverlayEl.remove();
            entry.cadreOverlayEl = null;
            entry.cadreKey = "";
          }
          return;
        }
        var newKey = cadreKey(cadre, w.largeur, w.hauteur);
        // Clip-path : appliquer à chaque fois (cheap, pas de recréation DOM).
        var clip = genererCadreClipPath(cadre, w.largeur, w.hauteur);
        if (clip) {
          el.style.clipPath = clip;
          el.style.webkitClipPath = clip;
        } else {
          el.style.clipPath = "";
          el.style.webkitClipPath = "";
        }
        // Overlay SVG : recréer seulement si la clé a changé.
        if (entry.cadreKey !== newKey) {
          if (entry.cadreOverlayEl) entry.cadreOverlayEl.remove();
          var overlay = document.createElement("div");
          overlay.className = "cadre-overlay";
          overlay.innerHTML = genererCadreSVG(cadre, w.largeur, w.hauteur, "w-" + w.id);
          el.appendChild(overlay);
          entry.cadreOverlayEl = overlay;
          entry.cadreKey = newKey;
        }
      }

      // Applique le cadre app (bord canvas) sur #stage. Un seul overlay global.
      var cadreAppOverlayEl = null;
      var cadreAppKey = "";
      function applyCadreApp(scene) {
        var cadre = scene.cadreApp;
        var cadreActif = cadre && cadre.actif && (cadre.strokeWidth || 0) > 0;
        if (!cadreActif) {
          if (cadreAppOverlayEl) {
            cadreAppOverlayEl.remove();
            cadreAppOverlayEl = null;
            cadreAppKey = "";
          }
          return;
        }
        var W = scene.canvasW || 1920;
        var H = scene.canvasH || 1080;
        var newKey = cadreKey(cadre, W, H);
        if (cadreAppKey === newKey && cadreAppOverlayEl) return;
        if (cadreAppOverlayEl) cadreAppOverlayEl.remove();
        var overlay = document.createElement("div");
        overlay.id = "cadre-app-overlay";
        overlay.innerHTML = genererCadreSVG(cadre, W, H, "app");
        stageEl.appendChild(overlay);
        cadreAppOverlayEl = overlay;
        cadreAppKey = newKey;
      }

      function connect() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(proto + "//" + location.host + "/ws");

        ws.onopen = () => {
          console.log("WS ok");
        };
        ws.onclose = () => {
          console.log("WS fermé — reconnexion dans 2s");
          setTimeout(connect, 2000);
        };
        ws.onerror = () => {
          console.error("WS erreur");
        };
        ws.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === "snapshot" && msg.scene) {
              currentScene = msg.scene;
              applyCanvasDims(msg.scene);
              renderScene(msg.scene);
              // Log types de widgets pour vérifier que les widgets chat existent.
              var types = (msg.scene.widgets || []).map(function (w) {
                return w.type || "media";
              });
              console.log("[Snapshot] widgets=" + (msg.scene.widgets || []).length + " types=[" + types.join(",") + "]");
            } else if (msg.type === "chat" && msg.message) {
              // Message chat IRC → push + trim + re-rendre les widgets chat.
              console.log("[Chat] message reçu pseudo=" + msg.message.pseudo + " avatar=" + (msg.message.avatar || "(none)"));
              chatMessages.push(msg.message);
              if (chatMessages.length > MAX_CHAT) {
                chatMessages = chatMessages.slice(chatMessages.length - MAX_CHAT);
              }
              rerenderChatWidgets();
            }
          } catch (e) {
            console.error("Message WS invalide:", e);
          }
        };
      }

      let currentScene = { widgets: [] };
      connect();
    </script>
  </body>
</html>
