      function assurerModulesRoot() {
        if (modulesRoot) return;
        modulesRoot = document.createElement("div");
        modulesRoot.id = "modules-root";
        stageEl.appendChild(modulesRoot);
      }

      /// Style commun (position/taille/police/opacité/accent) — à chaque
      /// snapshot (suit les resizes et le changement de cadre à chaud).
      function appliquerStyleModule(entry, m, fsDefaut) {
        var el = entry.el;
        el.style.left = m.x + "px";
        el.style.top = m.y + "px";
        el.style.width = m.largeur + "px";
        el.style.height = m.hauteur + "px";
        var fs = m.taille || fsDefaut;
        el.style.setProperty("--mod-fs", Math.max(8, Math.round(fs)) + "px");
        el.style.setProperty("--mod-font", m.police ? "'" + m.police + "', 'Segoe UI', sans-serif" : "'Segoe UI', system-ui, sans-serif");
        var op = typeof m.opacite === "number" ? Math.min(1, Math.max(0, m.opacite)) : 0.45;
        el.style.setProperty("--mod-opacite", String(op));
        el.style.setProperty("--mod-accent", bpmResoudreCouleurs().p);
        // Cadre SVG de la scène autour du module (opt-in). Dims connues
        // (inline px) → mesurable immédiatement après insertion.
        if (m.cadre) appliquerCadreOverlay(el, "module-" + entry.id);
        else nettoyerCadreOverlay(el, "module-" + entry.id);
      }

      function creerModuleEl(id) {
        var el = document.createElement("div");
        el.className = "module " + id;
        return el;
      }

      function renderModules(scene) {
        var mods = (scene && scene.modules) || {};
        assurerModulesRoot();
        for (var i = 0; i < MODULE_IDS.length; i++) {
          var id = MODULE_IDS[i];
          var m = mods[id];
          var entry = modulesMap[id];
          if (!m || !m.actif) {
            if (entry) {
              nettoyerCadreOverlay(entry.el, "module-" + id);
              entry.el.remove();
              delete modulesMap[id];
            }
            continue;
          }
          if (id === "horloge") renderModuleHorloge(entry, m);
          else if (id === "musique") renderModuleMusique(entry, m);
          else renderModuleObjectifs(entry, m);
        }
        assurerTickHorloge();
        if (modulesMap.musique) assurerTickMusique();
      }

      // --- Horloge ---
      function renderModuleHorloge(entry, m) {
        if (!entry) {
          var el = creerModuleEl("horloge");
          el.innerHTML =
            '<div class="mod-fond"></div>' +
            '<span class="mh-date"></span><span class="mh-sep"></span>' +
            '<span class="mh-heure"></span>';
          modulesRoot.appendChild(el);
          entry = modulesMap.horloge = {
            id: "horloge", el: el,
            dateEl: el.querySelector(".mh-date"),
            sepEl: el.querySelector(".mh-sep"),
            heureEl: el.querySelector(".mh-heure"),
          };
        }
        entry.afficherDate = m.afficherDate !== false;
        entry.secondes = m.secondes === true;
        entry.format12h = m.format12h === true;
        entry.dateEl.style.display = entry.afficherDate ? "" : "none";
        entry.sepEl.style.display = entry.afficherDate ? "" : "none";
        appliquerStyleModule(entry, m, m.hauteur * 0.42);
        majModuleHorloge();
      }

      function pad2(n) { return String(n).padStart(2, "0"); }

      function majModuleHorloge() {
        var e = modulesMap.horloge;
        if (!e) return;
        var d = new Date();
        if (e.afficherDate) {
          e.dateEl.textContent =
            pad2(d.getDate()) + " / " + pad2(d.getMonth() + 1) + " / " + pad2(d.getFullYear() % 100);
        }
        var h = d.getHours();
        var suffixe = "";
        if (e.format12h) {
          suffixe = h >= 12 ? "PM" : "AM";
          h = h % 12 || 12;
        }
        var txt = pad2(h) + " : " + pad2(d.getMinutes());
        if (e.secondes) txt += " : " + pad2(d.getSeconds());
        e.heureEl.textContent = txt;
        if (suffixe) {
          var sp = document.createElement("span");
          sp.className = "mh-ampm";
          sp.textContent = suffixe;
          e.heureEl.appendChild(sp);
        }
      }

      /// Tick 1 s partagé : démarré au premier module horloge, s'auto-arrête
      /// quand il disparaît.
      var horlogeTimer = null;
      function assurerTickHorloge() {
        if (!modulesMap.horloge) {
          if (horlogeTimer) { clearInterval(horlogeTimer); horlogeTimer = null; }
          return;
        }
        if (horlogeTimer) return;
        horlogeTimer = setInterval(majModuleHorloge, 1000);
      }

      // --- Musique en cours ---
      var MM_NB_POINTS = 5;
      function renderModuleMusique(entry, m) {
        if (!entry) {
          var el = creerModuleEl("musique");
          var pts = "";
          for (var i = 0; i < MM_NB_POINTS; i++) pts += "<i></i>";
          el.innerHTML =
            '<div class="mod-fond"></div>' +
            '<div class="mm-carte"><div class="mm-icone">♫</div>' +
              '<div class="mm-txt"><div class="mm-titre"></div><div class="mm-sous"></div></div></div>' +
            '<div class="mm-temps"><span class="mm-pos">00:00</span>' +
              '<span class="mm-points">' + pts + '</span><span class="mm-rest">00:00</span></div>';
          modulesRoot.appendChild(el);
          entry = modulesMap.musique = {
            id: "musique", el: el, key: null,
            titreEl: el.querySelector(".mm-titre"),
            sousEl: el.querySelector(".mm-sous"),
            posEl: el.querySelector(".mm-pos"),
            restEl: el.querySelector(".mm-rest"),
            pointEls: el.querySelectorAll(".mm-points i"),
          };
        }
        entry.el.classList.toggle("sans-temps", m.afficherTemps === false);
        appliquerStyleModule(entry, m, m.hauteur * 0.24);
        majModuleMusique();
      }

      /// MAJ texte + temps + points du module musique — lit musiqueCourant /
      /// musiqueAudio (même page). Texte seulement si changé.
      function majModuleMusique() {
        var e = modulesMap.musique;
        if (!e) return;
        var key = musiqueCourant ? musiqueCourant.titre + "|" + musiqueCourant.demandeur : "";
        if (e.key !== key) {
          e.key = key;
          if (musiqueCourant) {
            e.titreEl.textContent = musiqueCourant.titre;
            e.sousEl.textContent = musiqueCourant.demandeur
              ? "Demandé par @" + musiqueCourant.demandeur : "";
          } else {
            e.titreEl.textContent = "Aucune musique";
            e.sousEl.textContent = "Lance la musique avec !rs";
          }
        }
        var cur = 0, dur = NaN;
        if (musiqueAudio && musiqueCourant) {
          cur = musiqueAudio.currentTime;
          dur = musiqueAudio.duration;
        }
        e.posEl.textContent = musiqueCourant ? muFmtPad(cur) : "00:00";
        e.restEl.textContent = isFinite(dur) ? muFmtPad(Math.max(0, dur - cur)) : "00:00";
        var pct = isFinite(dur) && dur > 0 ? cur / dur : 0;
        var allumes = Math.round(pct * MM_NB_POINTS);
        for (var i = 0; i < e.pointEls.length; i++) {
          e.pointEls[i].classList.toggle("on", i < allumes);
        }
      }

      /// mm:ss avec minutes sur 2 chiffres (pastille temps).
      function muFmtPad(s) {
        if (!isFinite(s) || s < 0) return "00:00";
        return pad2(Math.floor(s / 60)) + ":" + pad2(Math.floor(s % 60));
      }

      // --- Objectifs du stream ---
      function renderModuleObjectifs(entry, m) {
        if (!entry) {
          var el = creerModuleEl("objectifs");
          el.innerHTML = '<div class="mod-fond"></div><div class="mo-titre"></div>';
          modulesRoot.appendChild(el);
          entry = modulesMap.objectifs = {
            id: "objectifs", el: el, key: null, lignes: [],
            titreEl: el.querySelector(".mo-titre"),
            ligneEls: {}, // ligne.id → { el, labelEl, actuelEl, cibleEl, fillEl }
          };
        }
        entry.titreEl.textContent = m.titre || "";
        var lignes = m.lignes || [];
        // Rebuild des lignes uniquement si la liste (ids/ordre/config) change.
        var key = JSON.stringify(lignes);
        if (entry.key !== key) {
          entry.key = key;
          entry.lignes = lignes;
          Object.keys(entry.ligneEls).forEach(function (k) { entry.ligneEls[k].el.remove(); });
          entry.ligneEls = {};
          var vide = entry.el.querySelector(".mo-vide");
          if (vide) vide.remove();
          if (!lignes.length) {
            var v = document.createElement("div");
            v.className = "mo-vide";
            v.textContent = "Ajoute des objectifs dans la modale Modules";
            entry.el.appendChild(v);
          }
          for (var i = 0; i < lignes.length; i++) {
            var lEl = document.createElement("div");
            lEl.className = "mo-ligne";
            lEl.innerHTML =
              '<div class="mo-haut"><span class="mo-label"></span>' +
              '<span class="mo-val"><span class="mo-actuel">N/A</span> / <span class="mo-cible">—</span></span></div>' +
              '<div class="mo-bar"><div class="mo-fill"></div></div>';
            entry.el.appendChild(lEl);
            entry.ligneEls[lignes[i].id] = {
              el: lEl,
              labelEl: lEl.querySelector(".mo-label"),
              actuelEl: lEl.querySelector(".mo-actuel"),
              cibleEl: lEl.querySelector(".mo-cible"),
              fillEl: lEl.querySelector(".mo-fill"),
            };
          }
        }
        // Taille : bornée pour que N lignes tiennent dans la hauteur.
        var n = Math.max(1, lignes.length);
        var fs = Math.min(m.hauteur / (n * 2.4 + (m.titre ? 1.6 : 0.8)), m.largeur * 0.075);
        appliquerStyleModule(entry, m, fs);
        majModulesObjectifs();
      }

      /// Libellé d'une ligne : label saisi > description du goal lié > label
      /// du type Helix > label de la métrique.
      function moLabel(l) {
        if (l.label) return l.label;
        if (l.goalId) {
          var g = goalsTwitchMap[l.goalId];
          if (g) return g.description || GOAL_TTYPE_LABELS[g.goal_type] || "Objectif";
          return "Objectif Twitch";
        }
        return GOAL_MET_LABELS[l.metrique || "followers"] || "Objectif";
      }

      /// MAJ valeurs/barres de toutes les lignes (frames communaute/viewers/
      /// goal-twitch + rendu). textContent/width uniquement.
      function majModulesObjectifs() {
        var e = modulesMap.objectifs;
        if (!e) return;
        for (var i = 0; i < e.lignes.length; i++) {
          var l = e.lignes[i];
          var refs = e.ligneEls[l.id];
          if (!refs) continue;
          var actuel, cible;
          if (l.goalId) {
            var g = goalsTwitchMap[l.goalId];
            actuel = g ? g.actuel : undefined;
            cible = g ? g.cible : 0;
          } else {
            actuel = goalValeur(l.plateforme || "twitch", l.metrique || "followers");
            cible = l.cible || 0;
          }
          refs.labelEl.textContent = moLabel(l);
          refs.actuelEl.textContent =
            typeof actuel === "number" ? actuel.toLocaleString("fr-FR") : "N/A";
          refs.cibleEl.textContent = cible ? cible.toLocaleString("fr-FR") : "—";
          var pct = cible && typeof actuel === "number"
            ? Math.min(100, Math.round((actuel / cible) * 100)) : 0;
          refs.fillEl.style.width = pct + "%";
        }
      }

      // ===== Module « Équaliseur » — overlay spectre audio sous les widgets =====
      // Le spectre est calculé côté Rust : capture WASAPI loopback du
      // périphérique de sortie par défaut (≈ « Desktop Audio » OBS) + micro
      // optionnel → FFT → 24 bandes normalisées 0..1 → frames `eq-spectrum`
      // (~30 Hz sur le canal chat). Ici : rendu canvas néon dans #eq-root
      // (z 0, juste après #bg dans le DOM → au-dessus du fond, sous tous
      // les widgets). rAF actif SEULEMENT quand le module est actif —
      // aucun texte, aucun élément DOM supplémentaire.
      var eqRoot = document.getElementById("eq-root");
      var eqCanvas = document.getElementById("eq-canvas");
      // ⚠️ Nom DÉDIÉ (eqCanvasCtx) : le spectre MUSIQUE déclare aussi un
      // `var eqCtx` plus bas (AudioContext, ~ligne 10239) — même scope
      // script, le dernier déclaré gagnerait et écraserait ce contexte 2d
      // par null → module Égaliseur jamais affiché (bug corrigé 2026-10-13,
      // même classe que la collision eqTick documentée plus bas).
      var eqCanvasCtx = eqCanvas.getContext("2d");
      var EQ_NB = 24;
      var eqCible = null;   // bandes cibles (dernière frame eq-spectrum)
      var eqBandes = null;  // bandes lissées affichées
      var eqCfg = null;     // { x, y, largeur, hauteur, bulles } — null = off
      var eqBulles = [];    // bulles en vie { x, y, r, vx, vy, a, ph }
      var eqRaf = null;
      var eqT0 = 0;

      /// Sync config depuis le snapshot (chaque renderScene) : rect du
      /// module + options + démarrage/arrêt de la boucle rAF. Zéro rAF
      /// quand le module est inactif.
      function renderModuleEqualiseur(scene) {
        var m = scene && scene.modules && scene.modules.equaliseur;
        // !eqCanvasCtx : contexte 2d indisponible (CEF dégradé) — no-op
        // gracieux, jamais d'exception ici : renderModuleEqualiseur est
        // appelé au milieu de renderScene, un throw figerait la couche
        // widgets.
        if (!m || !m.actif || !eqCanvasCtx) {
          eqCfg = null;
          eqCible = null;
          eqBulles = [];
          if (eqRaf) { cancelAnimationFrame(eqRaf); eqRaf = null; }
          eqRoot.style.display = "none";
          if (eqCanvasCtx) eqCanvasCtx.clearRect(0, 0, eqCanvas.width, eqCanvas.height);
          return;
        }
        var cw = scene.canvasW || 1920;
        var ch = scene.canvasH || 1080;
        if (eqCanvas.width !== cw || eqCanvas.height !== ch) {
          eqCanvas.width = cw;
          eqCanvas.height = ch;
        }
        // "block" OBLIGATOIRE : la feuille de style porte display:none sur
        // #eq-root — "" ne retirerait que le style inline et la couche
        // resterait invisible même avec le module actif.
        eqRoot.style.display = "block";
        eqCfg = {
          x: m.x, y: m.y,
          largeur: m.largeur, hauteur: m.hauteur,
          bulles: m.eqBulles !== false,
          couleur: m.eqCouleur,
          couleurFin: m.eqCouleurFin,
        };
        if (!eqRaf) {
          eqT0 = performance.now();
          eqRaf = requestAnimationFrame(eqOverlayTick);
        }
      }

      // Nom dédié : le tick spectre MUSIQUE s'appelle aussi eqTick plus bas
      // (eqTimer = setInterval(eqTick, 66)) — même scope script, le dernier
      // déclaré gagnerait et cette boucle rAF ne dessinerait jamais.
      function eqOverlayTick(t) {
        eqRaf = null;
        if (!eqCfg) return;
        var dt = Math.min(0.1, Math.max(0.001, (t - eqT0) / 1000));
        eqT0 = t;
        eqDessiner(dt);
        eqRaf = requestAnimationFrame(eqOverlayTick);
      }

      /// Frame de rendu : lissage attack/decay des bandes → barres néon
      /// dégradées (couleurs du cadre de scène) + bulles optionnelles qui
      /// montent au-dessus du bandeau proportionnellement à l'énergie.
      function eqDessiner(dt) {
        var ctx = eqCanvasCtx;
        var cfg = eqCfg;
        ctx.clearRect(0, 0, eqCanvas.width, eqCanvas.height);
        if (!eqBandes) eqBandes = new Array(EQ_NB).fill(0);
        // Montée rapide, retombée douce (constantes par seconde).
        var attaque = Math.min(1, dt * 14);
        var relache = Math.min(1, dt * 4.5);
        var maxV = 0;
        for (var i = 0; i < EQ_NB; i++) {
          var v = eqCible && typeof eqCible[i] === "number"
            ? Math.min(1, Math.max(0, eqCible[i])) : 0;
          var b = eqBandes[i];
          b += (v - b) * (v > b ? attaque : relache);
          eqBandes[i] = Math.max(0, b);
          if (b > maxV) maxV = b;
        }
        // Couleurs : CHOIX USER prioritaire (eqCouleur/eqCouleurFin du
        // module — décision explicite, respectée telle quelle), sinon
        // l'ACCENT du cadre de scène = extrémité la plus lumineuse (le p
        // de bpmResoudreCouleurs — même résolution que le placeholder
        // dashboard : accentCadre dans ModuleHud.svelte). L'apparence MIRE
        // l'aperçu dashboard : dégradé qui FOND vers le haut (placeholder
        // = linear-gradient to top, accent, transparent 130% → sommet à
        // ~23 % d'alpha), SAUF couleurFin user posée (dégradé p→s complet).
        // Pas de fallback gris : la couleur du cadre est un choix
        // utilisateur, sombre compris.
        var userP = cfg.couleur && bpmHexValide(cfg.couleur) ? cfg.couleur : null;
        var userS = cfg.couleurFin && bpmHexValide(cfg.couleurFin) ? cfg.couleurFin : null;
        var colP = userP || bpmResoudreCouleurs().p;
        var colHaut = userP && userS ? userS : "rgba(" + bpmHexVersRgb(colP) + ", 0.23)";
        var x0 = cfg.x, y0 = cfg.y, W = cfg.largeur, H = cfg.hauteur;
        var padX = W * 0.012;
        var pas = (W - padX * 2) / EQ_NB;
        var bw = Math.max(2, pas * 0.62);
        var grad = ctx.createLinearGradient(0, y0 + H, 0, y0);
        grad.addColorStop(0, colP);
        grad.addColorStop(1, colHaut);
        ctx.save();
        ctx.fillStyle = grad;
        ctx.shadowColor = colP;
        var rCoin = Math.min(6, bw / 2);
        for (var i = 0; i < EQ_NB; i++) {
          var vb = eqBandes[i];
          var h = Math.max(2, vb * H * 0.94);
          var x = x0 + padX + i * pas + (pas - bw) / 2;
          ctx.globalAlpha = 0.45 + vb * 0.5;
          ctx.shadowBlur = 10 + vb * 20;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(x, y0 + H - h, bw, h, [rCoin, rCoin, 0, 0]);
          else ctx.rect(x, y0 + H - h, bw, h);
          ctx.fill();
        }
        // Bulles — cercles néon translucides qui montent depuis les barres
        // et s'estompent vers le plafond (~1,6× la hauteur du module).
        if (cfg.bulles) {
          if (maxV > 0.12 && eqBulles.length < 80 &&
              Math.random() < dt * (2 + maxV * 20)) {
            eqBulles.push({
              x: x0 + padX + Math.random() * (W - padX * 2),
              y: y0 + H - Math.random() * 12,
              r: 1.5 + Math.random() * 4.5,
              vy: 26 + Math.random() * 55 + maxV * 45,
              vx: (Math.random() - 0.5) * 16,
              a: 0.3 + Math.random() * 0.45,
              ph: Math.random() * 6.2832,
            });
          }
          var plafond = y0 - H * 1.6;
          ctx.strokeStyle = colP;
          ctx.lineWidth = 1.2;
          ctx.shadowBlur = 8;
          for (var i = eqBulles.length - 1; i >= 0; i--) {
            var bu = eqBulles[i];
            bu.y -= bu.vy * dt;
            bu.x += bu.vx * dt;
            bu.ph += dt * 2.2;
            if (bu.y + bu.r < plafond || bu.y - bu.r > y0 + H) {
              eqBulles.splice(i, 1);
              continue;
            }
            var fondu = Math.min(1, Math.max(0, (bu.y - plafond) / (H * 0.5)));
            ctx.globalAlpha = bu.a * fondu;
            ctx.beginPath();
            ctx.arc(bu.x + Math.sin(bu.ph) * 7, bu.y, bu.r, 0, 6.2832);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      // Appliquer un snapshot reçu : met à jour currentScene, les dims canvas,
      // rend la scène, et rafraîchit les overlays (bandeau, alerte, welcome).
      // Extraite du handler WS pour être réutilisée par le fondu (rendu différé
      // au milieu du fade-to-black). Ne touche PAS au voile noir — c'est le
      // caller qui gère l'opacité du voile.
      function appliquerSnapshot(msg) {
        currentScene = msg.scene;
        applyCanvasDims(msg.scene);
        renderScene(msg.scene);
        // Rafraîchir les couleurs du bandeau (cadre widget a pu changer).
        bpmAppliquerCouleurs();
        // Rafraîchir le cadre SVG des overlays visibles (le cadre widget
        // de la scène a pu changer en live).
        if (alerteVisible && alerteCardEl) {
          appliquerCadreOverlay(alerteCardEl, "alerte");
        }
        if (welcomeRoot && welcomeRoot.style.display === "block" && welcomeClipEl) {
          appliquerCadreOverlay(welcomeClipEl, "welcome");
        }
        // Écran d'attente : cadre minuteur + couleurs suivent le cadre
        // widget de la nouvelle scène (BRB affiché pendant le changement).
        if (eaVisible && eaMinuteurEl) {
          appliquerCadreOverlay(eaMinuteurEl, "ecran-attente");
          eaAppliquerCouleurs();
        }
      }

      // Référence vers la WS courante pour les frames MONTANTES
      // (diffusion → Rust : resync speedrun/écran-attente, musique-ended).
      // `ws` est local à connect() et recréé à chaque reconnexion — on garde
      // la dernière socket ouverte ici.
      var wsCourant = null;
      /// Envoie une frame JSON vers le serveur :4321 (no-op si déconnectée).
      function wsSend(obj) {
        if (wsCourant && wsCourant.readyState === 1) {
          wsCourant.send(JSON.stringify(obj));
        }
      }

      function connect() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(proto + "//" + location.host + "/ws");

        ws.onopen = () => {
          wsCourant = ws;
          // Demander le resync de l'état speedrun (LSS) — la diffusion peut
          // se (re)connecter après le chargement du .lss côté dashboard, auquel
          // cas elle a manqué l'event WS. Le serveur re-émet la dernière run.
          ws.send(JSON.stringify({ type: "speedrun-resync" }));
          // Resync de l'écran d'attente aussi — les frames tick 1 Hz
          // couvrent la course, mais en pause il n'y a pas de tick :
          // re-push de la dernière frame par le serveur.
          ws.send(JSON.stringify({ type: "ecran-attente-resync" }));
          // Resync Just Chatting : le serveur renvoie toujours une frame
          // (actif:false si jamais togglé — couvre la connexion avant le 1er
          // toggle).
          ws.send(JSON.stringify({ type: "just-chatting-resync" }));
          // Resync musique : si une piste jouait pendant le reload du
          // browser source (OBS), le serveur re-émet musique-play.
          ws.send(JSON.stringify({ type: "musique-resync" }));
        };
        ws.onclose = () => {
          if (wsCourant === ws) wsCourant = null;
          setTimeout(connect, 2000);
        };
        ws.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === "snapshot" && msg.scene) {
              // Détecter un CHANGEMENT de scène (sceneId différent) vs une
              // simple édition de widgets (même scène). Le fondu au noir ne
              // se déclenche qu'au changement de scène — pas sur chaque edit
              // live, pour éviter de clignoter pendant l'édition.
              var nouveauId = msg.sceneId || null;
              var changement = nouveauId !== null && currentSceneId !== null && nouveauId !== currentSceneId;
              if (changement) {
                // Fondu au noir : voile → opacity 1 (300ms), puis rendu de la
                // nouvelle scène sous le voile, puis voile → opacity 0.
                // Annuler un fondu en cours (changement rapide de scène).
                if (fonduTimer) {
                  clearTimeout(fonduTimer);
                }
                voileNoirEl.style.opacity = "1";
                var msgCapture = msg;
                var idCapture = nouveauId;
                fonduTimer = setTimeout(function () {
                  fonduTimer = null;
                  appliquerSnapshot(msgCapture);
                  currentSceneId = idCapture;
                  // Laisser le navigateur peindre la nouvelle scène avant de
                  // révéler (requestAnimationFrame) → évite un flash partiel.
                  requestAnimationFrame(function () {
                    voileNoirEl.style.opacity = "0";
                  });
                }, FONDU_DEMI);
              } else {
                // Même scène (édition) ou 1er snapshot (currentSceneId null) :
                // rendu direct, pas de fondu.
                if (fonduTimer) {
                  // Un fondu était en cours mais on reçoit un snapshot de la
                  // même scène (ex. edit pendant un changement) → appliquer
                  // directement sous le voile.
                  clearTimeout(fonduTimer);
                  fonduTimer = null;
                  voileNoirEl.style.opacity = "0";
                }
                appliquerSnapshot(msg);
                if (nouveauId !== null) currentSceneId = nouveauId;
              }
            } else if (msg.type === "chat" && msg.message) {
              // Message chat → append incrémental (O(1)/widget, trim DOM
              // synchronisé avec le buffer — voir appendChatMessage).
              appendChatMessage(msg.message);
            } else if (msg.type === "viewers") {
              // Count viewers d'une plateforme (déjà dédupliqué côté Rust) :
              // number = live, null = hors-ligne/déconnecté → maj des barres.
              viewersParPlateforme[msg.plateforme] = msg.count;
              rerenderViewersBars();
              // Widgets goal métrique "viewers" de cette plateforme.
              majGoalWidgets(msg.plateforme);
              majModulesObjectifs();
            } else if (msg.type === "communaute") {
              // Compteurs communauté (followers/subs/sub_points/abonnes) —
              // déjà dédupliqués côté Rust. Maj des widgets goal concernés.
              communauteParPlateforme[msg.plateforme] = msg;
              majGoalWidgets(msg.plateforme);
              majModulesObjectifs();
            } else if (msg.type === "goal-twitch") {
              // Creator Goal Twitch déclaré : progression d'un objectif lié
              // (EventSub channel.goal.* temps réel + poll viewers.rs en
              // secours). termine = le goal a pris fin côté Twitch.
              goalsTwitchMap[msg.id] = msg;
              majGoalWidgetsLies();
              majModulesObjectifs();
            } else if (msg.type === "goal-atteint") {
              // Objectif franchi (viewers.rs — une fois par crossing ≥ cible,
              // réarmé sous la cible). Célébration contenue dans le widget.
              goalCelebrer(msg.widget_id);
            } else if (msg.type === "welcome-clip-play") {
              // Clip de bienvenue : afficher l'overlay autonome + jouer la vidéo.
              playWelcomeClip(msg);
            } else if (msg.type === "welcome-clip-stop") {
              // Stop : cacher l'overlay autonome + reset vidéo.
              stopWelcomeClip();
            } else if (msg.type === "welcome-clip-config") {
              // Config overlay (position/taille) — applique au root welcome.
              applyWelcomeOverlayConfig(msg.config || {});
            } else if (msg.type === "presentation-show") {
              // Présentation streamer : affiche voile + rideaux + carte.
              playPresentationShow(msg);
            } else if (msg.type === "presentation-hide") {
              // Rideaux se referment puis tout est masqué (~1,2 s).
              stopPresentation();
            } else if (msg.type === "presentation-mode") {
              // Bascule card/theatrical à chaud (toggle dashboard).
              appliquerModePresentation(msg.mode || "theatrical");
            } else if (msg.type === "presentation-clip-play") {
              // Lecteur clip plein écran au-dessus de la carte.
              presentationClipPlay(msg);
            } else if (msg.type === "presentation-clip-stop") {
              // Retire le lecteur clip (retour à la carte).
              presentationClipStop();
            } else if (msg.type === "presentation-audio-play") {
              // Joue une piste (voix one-shot, musique en boucle).
              presentationAudioPlay(msg.piste, msg.src);
            } else if (msg.type === "presentation-audio-stop") {
              // Stoppe une piste (ou "toutes").
              presentationAudioStop(msg.piste);
            } else if (msg.type === "bandeau-premier-message-play") {
              playBandeauPM(msg);
            } else if (msg.type === "bandeau-premier-message-stop") {
              stopBandeauPM();
            } else if (msg.type === "bandeau-premier-message-config") {
              applyBandeauPMConfig(msg.config || {});
            } else if (msg.type === "alerte-play") {
              // Alerte Twitch (follow/raid/sub/resub/subgift/bits).
              playAlerte(msg);
            } else if (msg.type === "alerte-stop") {
              stopAlerte();
            } else if (msg.type === "alerte-config") {
              applyAlerteConfig(msg.config || {});
            } else if (msg.type === "commande-play") {
              // Commande chat tapée par un viewer (!commande).
              playCommande(msg);
            } else if (msg.type === "commande-stop") {
              stopCommande();
            } else if (msg.type === "commande-config") {
              // Liste des commandes + overlay (position/taille du squelette
              // partagé). Le play porte déjà le contenu (texte/média/couleur).
              if (msg.overlay) applyCommandeOverlayConfig(msg.overlay || {});
            } else if (msg.type === "pad-play") {
              // Pad numérique : touche pressée → affiche média + joue son.
              playPad(msg);
            } else if (msg.type === "pad-stop") {
              stopPad();
            } else if (msg.type === "musique-play") {
              // "!rs <titre>" : joue la piste + ligne défilante dans les
              // widgets chat. piste = {id, titre, src, demandeur}.
              playMusique(msg);
            } else if (msg.type === "musique-stop") {
              stopMusique();
            } else if (msg.type === "musique-pause") {
              pauseMusique(!!msg.pause);
            } else if (msg.type === "musique-volume") {
              musiqueAppliquerVolume(msg.volume);
            } else if (msg.type === "eq-spectrum") {
              // Spectre audio système (capture WASAPI Rust → FFT → 24 bandes
              // 0..1, ~30 Hz). Consommé par la boucle rAF de l'équaliseur —
              // ignoré si le module n'est pas actif (eqCfg null).
              if (Array.isArray(msg.bandes)) eqCible = msg.bandes;
            } else if (msg.type === "input-viewer-etat") {
              // État des entrées (capture globale Rust → WS direct, throttle
              // 30Hz). Maj DOM directe des keycaps/boutons (pas de re-render).
              var _ivEtat = msg.etat || {};
              majInputViewerEtat(_ivEtat);
            } else if (msg.type === "speedrun-etat") {
              // État du timer speedrun (moteur Rust → WS direct). Maj DOM
              // directe du timer + phase + splits (pas de re-render).
              majSpeedrunEtat(msg.etat || {});
            } else if (msg.type === "ecran-attente-etat") {
              // Écran d'attente BRB : frame auto-réparatrice (config + chrono
              // complets à chaque tick Rust 1 Hz + transitions).
              majEcranAttente(msg.etat);
            } else if (msg.type === "just-chatting-etat") {
              // Just Chatting : maj l'état puis re-render de la scène courante
              // — jcDeriverScene applique/retire l'overlay à la volée.
              if (msg.etat) {
                jcEtat = msg.etat;
                renderScene(currentScene);
              }
            } else if (msg.type === "position-overlay-config") {
              // Squelette de position unifié (clip de bienvenue + alertes +
              // commandes). Applique la même position/taille aux trois.
              applyWelcomeOverlayConfig(msg.config || {});
              applyAlerteOverlayConfig(msg.config || {});
              applyCommandeOverlayConfig(msg.config || {});
              applyPadOverlayConfig(msg.config || {});
            }
          } catch (e) {
            console.error("Message WS invalide:", e);
          }
        };
      }

      // ===== Clip de bienvenue : overlay autonome (plus un widget de scène) =====
      //
      // L'overlay est créé une fois au démarrage (hors widgetMap), caché par
      // défaut. Il s'affiche au message WS welcome-clip-play, se cache au
      // welcome-clip-stop. Sa position/taille sont pilotées par welcome-clip-config
      // (défaut : bas-droite 480x270 sur canvas 1920x1080). Coordonnées en pixels
      // canvas (le stage n'est jamais rescalé — cf. commentaire en tête de fichier).

      var welcomeRoot = null;       // div racine positionnable (x/y/w/h, z)
      var welcomeVoileEl = null;    // voile noir opaque plein écran (spotlight)
      var welcomeClipEl = null;     // div.widget.welcome-clip (carte verticale)
      var welcomeEnteteEl = null;   // en-tête : avatar rond + pseudo + CTA + bio
      var welcomeAvatarEl = null;
      var welcomePseudoEl = null;
      var welcomeMsgEl = null;      // message de bienvenue (visible en spotlight)
      var welcomeBioEl = null;
      var welcomeFavorisEl = null;  // rangée des streamers mis en avant (spotlight)
      var welcomeVideoWrapEl = null; // wrapper 16:9 (aspect-ratio)
      var welcomeVideoEl = null;
      var welcomeDroiteEl = null;    // colonne droite : titre + clip (spotlight)
      var welcomePlateformeEl = null; // titre « Streamer Twitch » (spotlight)
      // Mode courant : false = squelette de position, true = spotlight plein
      // écran (utiliser_squelette = false dans la config welcome).
      var welcomeSpotlight = false;
      var welcomeSpotTimer = null;  // setTimeout fin d'intro spotlight (3 s)

      // Config par défaut (320x352, ratio ~11:10 — carte avatar+bio+clip 16:9).
      var welcomeConfig = { x: 1480, y: 580, largeur: 320, hauteur: 352 };

      /// Crée l'overlay welcome une fois (au démarrage). Idempotent.
      function initWelcomeOverlay() {
        if (welcomeRoot) return;

        welcomeRoot = document.createElement("div");
        welcomeRoot.className = "welcome-clip-root";
        welcomeRoot.style.position = "absolute";
        welcomeRoot.style.display = "none";
        welcomeRoot.style.zIndex = "9999";

        welcomeClipEl = document.createElement("div");
        welcomeClipEl.className = "widget welcome-clip";

        // En-tête (colonne centrée) : avatar rond → pseudo → CTA → bio.
        welcomeEnteteEl = document.createElement("div");
        welcomeEnteteEl.className = "welcome-clip-entete";

        welcomeAvatarEl = document.createElement("img");
        welcomeAvatarEl.className = "welcome-clip-avatar";
        welcomeAvatarEl.alt = "";
        welcomeAvatarEl.src = "";
        welcomeAvatarEl.style.display = "none";

        welcomePseudoEl = document.createElement("span");
        welcomePseudoEl.className = "welcome-clip-pseudo";

        welcomeMsgEl = document.createElement("span");
        welcomeMsgEl.className = "welcome-clip-message";

        var ctaEl = document.createElement("span");
        ctaEl.className = "welcome-clip-cta";
        ctaEl.textContent = "Checkout and follow";

        welcomeBioEl = document.createElement("span");
        welcomeBioEl.className = "welcome-clip-bio";
        welcomeBioEl.style.display = "none";

        welcomeFavorisEl = document.createElement("div");
        welcomeFavorisEl.className = "welcome-clip-favoris";
        welcomeFavorisEl.style.display = "none";

        welcomeEnteteEl.appendChild(welcomeAvatarEl);
        welcomeEnteteEl.appendChild(welcomePseudoEl);
        welcomeEnteteEl.appendChild(welcomeMsgEl);
        welcomeEnteteEl.appendChild(ctaEl);
        welcomeEnteteEl.appendChild(welcomeBioEl);
        welcomeEnteteEl.appendChild(welcomeFavorisEl);

        welcomeVideoEl = document.createElement("video");
        welcomeVideoEl.className = "welcome-clip-video";
        welcomeVideoEl.playsInline = true;
        welcomeVideoEl.autoplay = true;
        welcomeVideoEl.muted = PREVIEW;
        welcomeVideoEl.controls = false;
        welcomeVideoEl.preload = "auto";

        var videoWrap = document.createElement("div");
        videoWrap.className = "welcome-clip-video-wrap";

        videoWrap.appendChild(welcomeVideoEl);

        welcomeVideoWrapEl = videoWrap;

        welcomePlateformeEl = document.createElement("span");
        welcomePlateformeEl.className = "welcome-clip-plateforme";
        welcomePlateformeEl.textContent = "Streamer Twitch";

        // Colonne droite : titre (spotlight) + clip. Cachée tant qu'aucun
        // clip n'est prêt — c'est elle qu'on affiche/masque, pas le wrap.
        welcomeDroiteEl = document.createElement("div");
        welcomeDroiteEl.className = "welcome-clip-droite";
        welcomeDroiteEl.style.display = "none";
        welcomeDroiteEl.appendChild(welcomePlateformeEl);
        welcomeDroiteEl.appendChild(videoWrap);

        welcomeClipEl.appendChild(welcomeEnteteEl);
        welcomeClipEl.appendChild(welcomeDroiteEl);
        welcomeRoot.appendChild(welcomeClipEl);
        // Voile noir opaque plein écran (mode spotlight) — même z 9999 que le
        // root mais inséré AVANT dans le DOM : la carte reste au-dessus.
        welcomeVoileEl = document.createElement("div");
        welcomeVoileEl.className = "welcome-clip-voile";
        welcomeVoileEl.style.zIndex = "9999";
        welcomeVoileEl.style.display = "none";
        stageEl.appendChild(welcomeVoileEl);
        stageEl.appendChild(welcomeRoot);

        applyWelcomeOverlayConfig(welcomeConfig);
      }

      /// Applique la config (x/y/largeur) au root welcome. La hauteur est
      /// auto — la carte s'ajuste exactement à son contenu (avatar + bio +
      /// clip 16:9), sans espace vide en dessous.
      /// cfg.utiliser_squelette (welcome-clip-config) bascule le mode
      /// spotlight ; absent (position-overlay-config partagé) = mode conservé.
      function applyWelcomeOverlayConfig(cfg) {
        if (!welcomeRoot) return;
        if (typeof cfg.utiliser_squelette === "boolean") {
          welcomeSpotlight = !cfg.utiliser_squelette;
        }
        if (typeof cfg.x === "number") welcomeConfig.x = cfg.x;
        if (typeof cfg.y === "number") welcomeConfig.y = cfg.y;
        if (typeof cfg.largeur === "number") welcomeConfig.largeur = cfg.largeur;
        if (typeof cfg.hauteur === "number") welcomeConfig.hauteur = cfg.hauteur;
        if (welcomeSpotlight) {
          // Spotlight : carte centrée à 85 % via la classe .spot — nettoyer
          // les styles inline posés par le mode squelette (ils gagneraient).
          welcomeRoot.classList.add("spot");
          welcomeRoot.style.left = "";
          welcomeRoot.style.top = "";
          welcomeRoot.style.width = "";
          welcomeRoot.style.height = "";
          return;
        }
        welcomeRoot.classList.remove("spot");
        welcomeRoot.style.left = welcomeConfig.x + "px";
        welcomeRoot.style.top = welcomeConfig.y + "px";
        welcomeRoot.style.width = welcomeConfig.largeur + "px";
        // Hauteur auto : la carte grandit selon son contenu.
        welcomeRoot.style.height = "auto";
      }

      /// Joue un clip de bienvenue : affiche le bandeau immédiatement, puis
      /// charge la vidéo et ne l'affiche + la joue qu'une fois assez de données
      /// bufferées (canplay) → évite l'écran noir et le stuttering au démarrage.
      function playWelcomeClip(msg) {
        if (!welcomeRoot) {
          return;
        }
        var viewer = msg.viewer || {};
        var clip = msg.clip || {};

        // En-tête : avatar rond + pseudo + bio Twitch.
        if (viewer.avatar) {
          welcomeAvatarEl.src = viewer.avatar;
          welcomeAvatarEl.style.display = "block";
        } else {
          welcomeAvatarEl.style.display = "none";
        }
        welcomePseudoEl.textContent = viewer.display_name || viewer.login || "";
        // Message de bienvenue : rendu par CSS en mode spotlight seulement.
        welcomeMsgEl.textContent = msg.message || "";
        if (viewer.bio) {
          welcomeBioEl.textContent = viewer.bio;
          welcomeBioEl.style.display = "-webkit-box";
        } else {
          welcomeBioEl.style.display = "none";
        }

        // Streamers mis en avant par le viewer (sous la bio, spotlight).
        // msg.favoris = [{login, display_name, avatar, en_live}] — vide ou
        // absent hors spotlight / non-Twitch / fetch échoué.
        welcomeFavorisEl.innerHTML = "";
        var favoris = Array.isArray(msg.favoris) ? msg.favoris : [];
        if (favoris.length) {
          favoris.slice(0, 6).forEach(function (f) {
            var item = document.createElement("div");
            item.className = "welcome-clip-favori";
            var img = document.createElement("img");
            img.src = f.avatar || "";
            img.alt = "";
            var nom = document.createElement("span");
            nom.className = "fav-nom";
            nom.textContent = f.display_name || f.login || "";
            item.appendChild(img);
            if (f.en_live) {
              var live = document.createElement("span");
              live.className = "fav-live";
              item.appendChild(live);
            }
            item.appendChild(nom);
            welcomeFavorisEl.appendChild(item);
          });
          welcomeFavorisEl.style.display = "flex";
        } else {
          welcomeFavorisEl.style.display = "none";
        }

        // Mode d'affichage porté par la frame play : squelette de position
        // (défaut) ou spotlight plein écran (voile noir + carte 85 %).
        if (typeof msg.utiliser_squelette === "boolean") {
          welcomeSpotlight = !msg.utiliser_squelette;
        }
        // Pose la classe .spot + la position selon le mode.
        applyWelcomeOverlayConfig({});

        // Voile noir plein écran (spotlight uniquement), fondu 350 ms.
        // Le toggle passe par un rAF : sinon le navigateur ne voit jamais
        // opacity:0 (display:none → block + classe dans le même tick) et le
        // fondu d'entrée ne jouerait pas.
        if (welcomeVoileEl) {
          welcomeVoileEl.style.display = welcomeSpotlight ? "block" : "none";
          var voileSpot = welcomeSpotlight;
          var voile = welcomeVoileEl;
          requestAnimationFrame(function () {
            voile.classList.toggle("visible", voileSpot);
          });
        }

        // Phase intro spotlight : avatar seul 3 s puis split gauche/droite.
        if (welcomeSpotTimer) {
          clearTimeout(welcomeSpotTimer);
          welcomeSpotTimer = null;
        }
        welcomeRoot.classList.toggle("intro", welcomeSpotlight);

        // Afficher le root + la carte IMMÉDIATEMENT (le viewer voit tout de
        // suite qui arrive, pendant que la vidéo buffer en arrière-plan).
        welcomeRoot.style.display = "block";
        // Cadre SVG : mesurer la carte une fois affichée (hauteur auto).
        requestAnimationFrame(function () {
          appliquerCadreOverlay(welcomeClipEl, "welcome");
        });

        // Nettoyer les handlers précédents (au cas où stop n'a pas tourné).
        welcomeVideoEl.oncanplay = null;
        welcomeVideoEl.onerror = null;

        // Charger la vidéo. On ne l'affiche + ne la joue qu'à canplay (assez
        // de données pour démarrer sans stuttering). La vidéo reste cachée
        // pendant le buffering → pas d'écran noir.
        welcomeVideoEl.src = clip.mp4_url || "";

        if (welcomeSpotlight) {
          // Spotlight : la vidéo buffer pendant l'intro (3 s) puis démarre au
          // split. Le timer Rust a déjà +3 s (INTRO_SPOTLIGHT_MS).
          welcomeVideoEl.oncanplay = function () {
            // Le clip change la hauteur de la carte → re-mesurer le cadre.
            requestAnimationFrame(function () {
              appliquerCadreOverlay(welcomeClipEl, "welcome");
            });
            welcomeVideoEl.oncanplay = null;
          };
          welcomeSpotTimer = setTimeout(function () {
            welcomeSpotTimer = null;
            if (!welcomeRoot || welcomeRoot.style.display !== "block") return;
            welcomeRoot.classList.remove("intro");
            welcomeDroiteEl.style.display = "flex";
            welcomeVideoEl.play().catch(function () {});
            requestAnimationFrame(function () {
              appliquerCadreOverlay(welcomeClipEl, "welcome");
            });
          }, 3000);
        } else {
          welcomeVideoEl.oncanplay = function () {
            welcomeDroiteEl.style.display = "flex";
            welcomeVideoEl.play().catch(function () {});
            // La vidéo change la hauteur de la carte → re-mesurer le cadre.
            requestAnimationFrame(function () {
              appliquerCadreOverlay(welcomeClipEl, "welcome");
            });
            // One-shot : nettoyer après le 1er canplay.
            welcomeVideoEl.oncanplay = null;
          };
        }

        // À la fin de la vidéo → le timer Rust émettra welcome-clip-stop.
        // (pas de stop automatique ici — le timer Rust est la source de vérité)
      }

      /// Stop : cacher l'overlay + reset vidéo + retirer le cadre SVG.
      /// Coupe aussi l'intro spotlight en cours + masque le voile noir.
      function stopWelcomeClip() {
        if (!welcomeRoot) return;
        if (welcomeSpotTimer) {
          clearTimeout(welcomeSpotTimer);
          welcomeSpotTimer = null;
        }
        welcomeVideoEl.oncanplay = null;
        welcomeVideoEl.onerror = null;
        welcomeVideoEl.pause();
        welcomeVideoEl.removeAttribute("src");
        welcomeVideoEl.load();
        welcomeDroiteEl.style.display = "none";
        welcomeVideoEl.style.display = "block";
        welcomeFavorisEl.innerHTML = "";
        welcomeFavorisEl.style.display = "none";
        welcomeRoot.style.display = "none";
        welcomeRoot.classList.remove("intro");
        if (welcomeVoileEl) {
          welcomeVoileEl.classList.remove("visible");
          welcomeVoileEl.style.display = "none";
        }
        if (welcomeClipEl) nettoyerCadreOverlay(welcomeClipEl, "welcome");
      }

      // Initialiser l'overlay welcome dès le démarrage (avant connect).
      initWelcomeOverlay();

      // ===== Présentation streamer : overlay autonome =====
      //
      // Portage de la feature « streamers favoris » de l'ancienne app.
      // Overlay plein écran (z 10000+, au-dessus de toute la pile) piloté par
      // les frames presentation-* du dashboard (déclenchement 100 % manuel).
      // Deux modes : "theatrical" (voile + orbes + rideaux qui s'ouvrent,
      // carte 2 colonnes) et "card" (carte compacte seule, fondu simple).
      // Le clip joue dans un lecteur dédié par-dessus (z 10003) ; l'audio
      // (voix/musique) via <audio> sur /medias/ (même origine :4321).

      var presVoileEl = null;    // voile sombre + orbes + sol/spots/poussière
      var presRideauG = null;    // rideau gauche (50 % de large)
      var presRideauD = null;    // rideau droit
      var presValanceEl = null;  // cantonné festonné (haut, permanent theatrical)
      var presEmbrasseG = null;  // embrasse dorée gauche (rideau froncé)
      var presEmbrasseD = null;  // embrasse dorée droite
      var presPublicEl = null;   // rangées de spectateurs (premier plan)
      var presRootEl = null;     // conteneur carte (centré flex)
      var presAvatarEl = null;
      var presNomEl = null;
      var presLoginEl = null;
      var presBadgesEl = null;
      var presBioEl = null;
      var presJeuEl = null;      // jeu courant (« Joue à … »)
      var presLienEl = null;     // twitch.tv/<login>
      var presLiveEl = null;     // bandeau EN DIRECT + viewers
      var presTitreLiveEl = null;
      var presJeuxEl = null;     // boîtes des jeux récents
      var presClipsEl = null;    // grille 2×2 des clips récents
      var presFondEl = null;     // fond plein écran (bannière chaîne)
      var presFondImgEl = null;
      var presClipRootEl = null; // lecteur clip plein écran
      var presClipTitreEl = null;
      var presClipVideoEl = null;

      var presMode = "theatrical"; // mode courant ("theatrical" | "card")
      var presVisible = false;
      var presHideTimer = null;    // fin de la fermeture (rideaux ~1,2 s)
      // Audios courants : { voix: HTMLAudioElement|null, musique: … }
      var presAudios = { voix: null, musique: null };

      /// Crée l'overlay présentation une fois (au démarrage). Idempotent.
      function initPresentationOverlay() {
        if (presRootEl) return;

        // Voile sombre + orbes animés (theatrical uniquement).
        presVoileEl = document.createElement("div");
        presVoileEl.className = "pres-voile";
        // Fond « écran de cinéma » (bannière de chaîne) : 1er enfant du
        // voile → tout le décor (orbes/sol/spots/poussière) reste dessus.
        presFondEl = document.createElement("div");
        presFondEl.className = "pres-fond";
        presFondEl.style.display = "none";
        presFondImgEl = document.createElement("img");
        presFondImgEl.className = "pres-fond-img";
        presFondImgEl.alt = "";
        presFondEl.appendChild(presFondImgEl);
        presVoileEl.appendChild(presFondEl);
        ["o1", "o2", "o3"].forEach(function (n) {
          var orbe = document.createElement("div");
          orbe.className = "pres-orbe " + n;
          presVoileEl.appendChild(orbe);
        });
        // Sol de scène + faisceaux convergents + poussière : enfants du
        // voile → ils apparaissent/disparaissent avec son fondu.
        var presSol = document.createElement("div");
        presSol.className = "pres-sol";
        presVoileEl.appendChild(presSol);
        ["s1", "s2", "s3"].forEach(function (n) {
          var spot = document.createElement("div");
          spot.className = "pres-spot " + n;
          var spotI = document.createElement("div");
          spotI.className = "pres-spot-i";
          spot.appendChild(spotI);
          presVoileEl.appendChild(spot);
        });
        for (var ip = 0; ip < 20; ip++) {
          var p = document.createElement("div");
          p.className = "pres-poussiere";
          var sz = 2 + Math.random() * 3;
          p.style.width = sz + "px";
          p.style.height = sz + "px";
          p.style.left = (22 + Math.random() * 56) + "%";
          p.style.top = (8 + Math.random() * 78) + "%";
          p.style.setProperty("--pd", (8 + Math.random() * 9) + "s");
          p.style.setProperty("--pdl", (-Math.random() * 14) + "s");
          presVoileEl.appendChild(p);
        }

        presRideauG = document.createElement("div");
        presRideauG.className = "pres-rideau gauche";
        presRideauG.style.display = "none";
        presRideauD = document.createElement("div");
        presRideauD.className = "pres-rideau droite";
        presRideauD.style.display = "none";

        // Cantonné + embrasses (theatrical uniquement).
        presValanceEl = document.createElement("div");
        presValanceEl.className = "pres-valance";
        presValanceEl.style.display = "none";
        presEmbrasseG = document.createElement("div");
        presEmbrasseG.className = "pres-embrasse gauche";
        presEmbrasseG.style.display = "none";
        presEmbrasseD = document.createElement("div");
        presEmbrasseD.className = "pres-embrasse droite";
        presEmbrasseD.style.display = "none";

        // Public au premier plan (rangées générées une fois — le décor est
        // figé ensuite, seules les animations CSS tournent).
        presPublicEl = document.createElement("div");
        presPublicEl.className = "pres-public";
        presPublicEl.style.display = "none";
        construirePublic(presPublicEl);

        presRootEl = document.createElement("div");
        presRootEl.className = "pres-root";

        var carte = document.createElement("div");
        carte.className = "pres-carte";

        // Colonne gauche : avatar → nom → @login → badges → bio → jeu → lien.
        var colG = document.createElement("div");
        colG.className = "pres-col-gauche";

        presAvatarEl = document.createElement("img");
        presAvatarEl.className = "pres-avatar";
        presAvatarEl.alt = "";

        presNomEl = document.createElement("span");
        presNomEl.className = "pres-nom";
        presLoginEl = document.createElement("span");
        presLoginEl.className = "pres-login";
        presBadgesEl = document.createElement("div");
        presBadgesEl.className = "pres-badges";
        presBioEl = document.createElement("span");
        presBioEl.className = "pres-bio";
        presJeuEl = document.createElement("span");
        presJeuEl.className = "pres-jeu-courant";
        presLienEl = document.createElement("span");
        presLienEl.className = "pres-lien";

        colG.appendChild(presAvatarEl);
        colG.appendChild(presNomEl);
        colG.appendChild(presLoginEl);
        colG.appendChild(presBadgesEl);
        colG.appendChild(presBioEl);
        colG.appendChild(presJeuEl);
        colG.appendChild(presLienEl);

        // Colonne droite : EN DIRECT + titre live + jeux récents + clips.
        var colD = document.createElement("div");
        colD.className = "pres-col-droite";

        presLiveEl = document.createElement("span");
        presLiveEl.className = "pres-live";
        presTitreLiveEl = document.createElement("span");
        presTitreLiveEl.className = "pres-titre-live";
        presJeuxEl = document.createElement("div");
        presJeuxEl.className = "pres-jeux";
        presClipsEl = document.createElement("div");
        presClipsEl.className = "pres-clips";

        colD.appendChild(presLiveEl);
        colD.appendChild(presTitreLiveEl);
        colD.appendChild(presJeuxEl);
        colD.appendChild(presClipsEl);

        carte.appendChild(colG);
        carte.appendChild(colD);
        presRootEl.appendChild(carte);
        // Référence directe vers la carte (les classes .visible/mode y sont).
        presRootEl._carte = carte;

        // Lecteur clip plein écran (au-dessus de tout).
        presClipRootEl = document.createElement("div");
        presClipRootEl.className = "pres-clip-root";
        presClipTitreEl = document.createElement("span");
        presClipTitreEl.className = "pres-clip-titre";
        presClipVideoEl = document.createElement("video");
        presClipVideoEl.className = "pres-clip-video";
        presClipVideoEl.playsInline = true;
        presClipVideoEl.controls = false;
        presClipVideoEl.preload = "auto";
        presClipVideoEl.muted = PREVIEW;
        // Fin naturelle → retour à la carte (le dashboard peut aussi
        // stopper via presentation-clip-stop).
        presClipVideoEl.onended = function () {
          presentationClipStop();
        };
        presClipRootEl.appendChild(presClipTitreEl);
        presClipRootEl.appendChild(presClipVideoEl);

        stageEl.appendChild(presVoileEl);
        stageEl.appendChild(presRideauG);
        stageEl.appendChild(presRideauD);
        stageEl.appendChild(presValanceEl);
        stageEl.appendChild(presEmbrasseG);
        stageEl.appendChild(presEmbrasseD);
        stageEl.appendChild(presRootEl);
        stageEl.appendChild(presPublicEl);
        stageEl.appendChild(presClipRootEl);
      }

      /// Remplit .pres-public : 3 rangées de places (fauteuil bordeaux +
      /// silhouette tête/épaules) avec perspective — la rangée la plus
      /// proche est une rangée de grosses têtes floues sans fauteuil,
      /// coupée par le bas de l'écran. ~15 % des fauteuils restent vides.
      function construirePublic(root) {
        var rangees = [
          { bottom: 118, siegeW: 88,  siegeH: 74, tete: 44, gap: 126, offset: 24,  couleur: "#181116", flou: 0 },
          { bottom: 16,  siegeW: 116, siegeH: 94, tete: 60, gap: 160, offset: 92,  couleur: "#0b0709", flou: 0 },
          { bottom: -26, siegeW: 0,   siegeH: 0,  tete: 86, gap: 215, offset: 158, couleur: "#040203", flou: 1.6 }
        ];
        rangees.forEach(function (r) {
          var rangee = document.createElement("div");
          rangee.className = "pres-rangee";
          rangee.style.bottom = r.bottom + "px";
          for (var x = r.offset; x < 1920; x += r.gap + Math.round((Math.random() - 0.5) * 30)) {
            var place = document.createElement("div");
            place.className = "pres-place";
            place.style.left = x + "px";
            place.style.width = (r.siegeW ? r.siegeW + 24 : r.tete + 60) + "px";
            place.style.height = (r.siegeH + r.tete * 1.1 + 40) + "px";
            if (r.siegeW) {
              var siege = document.createElement("div");
              siege.className = "pres-siege";
              siege.style.width = r.siegeW + "px";
              siege.style.height = r.siegeH + "px";
              place.appendChild(siege);
            }
            // ~15 % des places restent vides (fauteuil sans spectateur) —
            // sauf la rangée avant qui n'a pas de fauteuil.
            if (!r.siegeW || Math.random() >= 0.15) {
              var tete = document.createElement("div");
              tete.className = "pres-tete";
              var t = Math.round(r.tete * (0.88 + Math.random() * 0.24));
              tete.style.width = t + "px";
              tete.style.height = Math.round(t * 1.08) + "px";
              tete.style.bottom = Math.round(r.siegeH * 0.55) + "px";
              tete.style.left = (50 + (Math.random() - 0.5) * 14) + "%";
              tete.style.background = r.couleur;
              if (r.flou) tete.style.filter = "blur(" + r.flou + "px)";
              tete.style.setProperty("--sw", (4 + Math.random() * 3.5) + "s");
              tete.style.setProperty("--swd", (-Math.random() * 8) + "s");
              place.appendChild(tete);
            }
            rangee.appendChild(place);
          }
          root.appendChild(rangee);
        });
      }

      /// Formate les viewers compacts (1234 → "1 234").
      function presFormatViewers(n) {
        return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      }

      /// Affiche la présentation : remplit les champs puis lance la
      /// chorégraphie selon le mode. Idempotent (un show en remplace un
      /// autre — nettoyage préalable).
      function playPresentationShow(msg) {
        if (!presRootEl) return;
        var d = msg.donnees || {};
        var mode = msg.mode === "card" ? "card" : "theatrical";

        // Annuler une fermeture en cours (show pendant les 1,2 s de rideaux).
        if (presHideTimer) {
          clearTimeout(presHideTimer);
          presHideTimer = null;
        }
        presentationClipStop();
        presentationAudioStop("toutes");

        presMode = mode;
        presVisible = true;

        // Champs — vides = élément masqué (display:none, pas de trou visuel).
        presAvatarEl.src = d.avatar || "";
        presAvatarEl.style.display = d.avatar ? "block" : "none";
        presNomEl.textContent = d.display_name || d.login || "";
        presLoginEl.textContent = d.login ? "@" + d.login : "";

        presBadgesEl.innerHTML = "";
        if (d.broadcaster_type === "partner" || d.broadcaster_type === "affiliate") {
          var badge = document.createElement("span");
          badge.className = "pres-badge" +
            (d.broadcaster_type === "affiliate" ? " affiliate" : "");
          badge.textContent =
            d.broadcaster_type === "partner" ? "PARTNER" : "AFFILIATE";
          presBadgesEl.appendChild(badge);
          presBadgesEl.style.display = "flex";
        } else {
          presBadgesEl.style.display = "none";
        }

        presBioEl.textContent = d.bio || "";
        presBioEl.style.display = d.bio ? "-webkit-box" : "none";
        presJeuEl.textContent = d.jeu_courant ? "Joue à : " + d.jeu_courant : "";
        presJeuEl.style.display = d.jeu_courant ? "block" : "none";
        presLienEl.textContent = d.login ? "twitch.tv/" + d.login : "";
        presLienEl.style.display = d.login ? "block" : "none";

        // Bandeau EN DIRECT (badge + viewers) — caché hors-ligne.
        if (d.en_live) {
          presLiveEl.textContent =
            "EN DIRECT" +
            (typeof d.viewers_live === "number"
              ? " · " + presFormatViewers(d.viewers_live)
              : "");
          presLiveEl.style.display = "inline-flex";
          presTitreLiveEl.textContent = d.titre_live || "";
          presTitreLiveEl.style.display = d.titre_live ? "block" : "none";
        } else {
          presLiveEl.style.display = "none";
          presTitreLiveEl.style.display = "none";
        }

        // Jeux récents (box art + nom), max 4 déjà borné côté Rust.
        presJeuxEl.innerHTML = "";
        var jeux = Array.isArray(d.jeux_recents) ? d.jeux_recents : [];
        jeux.forEach(function (g) {
          var item = document.createElement("div");
          item.className = "pres-jeu";
          var img = document.createElement("img");
          // Les box_art Helix ont des placeholders {width}x{height}.
          img.src = (g.box_art_url || "")
            .replace("{width}", "96")
            .replace("{height}", "128");
          img.alt = "";
          var nom = document.createElement("span");
          nom.textContent = g.name || "";
          item.appendChild(img);
          item.appendChild(nom);
          presJeuxEl.appendChild(item);
        });
        presJeuxEl.style.display = jeux.length ? "flex" : "none";

        // Clips récents : 4 premiers en grille 2×2 (thumb + durée + titre).
        presClipsEl.innerHTML = "";
        var clips = Array.isArray(d.clips) ? d.clips.slice(0, 4) : [];
        clips.forEach(function (c) {
          var item = document.createElement("div");
          item.className = "pres-clip";
          var img = document.createElement("img");
          img.src = c.thumbnail_url || "";
          img.alt = "";
          var duree = document.createElement("span");
          duree.className = "duree";
          duree.textContent = Math.round(c.duration || 0) + "s";
          var titre = document.createElement("span");
          titre.className = "titre";
          titre.textContent = c.title || "";
          item.appendChild(img);
          item.appendChild(duree);
          item.appendChild(titre);
          presClipsEl.appendChild(item);
        });
        presClipsEl.style.display = clips.length ? "grid" : "none";

        // Fond « écran de cinéma » : la bannière de chaîne couvre la scène
        // (sous les effets + le contenu). Absente → fond dégradé classique.
        presFondImgEl.src = d.banniere || "";
        presFondEl.style.display = d.banniere ? "block" : "none";

        // Chorégraphie d'entrée selon le mode.
        presRootEl.classList.toggle("mode-card", mode === "card");
        var carte = presRootEl._carte;
        carte.classList.remove("visible");
        presRootEl.style.display = "flex";

        if (mode === "card") {
          // Carte seule : pas de voile complet ni rideaux ni décor ni
          // public, fondu direct.
          presVoileEl.style.display = "block";
          presRideauG.style.display = "none";
          presRideauD.style.display = "none";
          presValanceEl.classList.remove("visible");
          presValanceEl.style.display = "none";
          presEmbrasseG.classList.remove("open");
          presEmbrasseD.classList.remove("open");
          presEmbrasseG.style.display = "none";
          presEmbrasseD.style.display = "none";
          presPublicEl.classList.remove("visible");
          presPublicEl.style.display = "none";
          requestAnimationFrame(function () {
            presVoileEl.classList.add("visible");
            carte.classList.add("visible");
          });
        } else {
          // Théâtral : voile + rideaux fermés + cantonné + public →
          // ouverture (1,2 s) → la carte apparaît en cours d'ouverture
          // (delay CSS 0,65 s) ; les embrasses suivent (delay CSS 0,75 s).
          presVoileEl.style.display = "block";
          presRideauG.classList.remove("open");
          presRideauD.classList.remove("open");
          presEmbrasseG.classList.remove("open");
          presEmbrasseD.classList.remove("open");
          presRideauG.style.display = "block";
          presRideauD.style.display = "block";
          presValanceEl.style.display = "block";
          presEmbrasseG.style.display = "block";
          presEmbrasseD.style.display = "block";
          presPublicEl.style.display = "block";
          // Double rAF : laisser le navigateur peindre les rideaux fermés
          // avant d'ajouter .open — sinon pas de transition visible.
          requestAnimationFrame(function () {
            presVoileEl.classList.add("visible");
            presValanceEl.classList.add("visible");
            presPublicEl.classList.add("visible");
            requestAnimationFrame(function () {
              presRideauG.classList.add("open");
              presRideauD.classList.add("open");
              presEmbrasseG.classList.add("open");
              presEmbrasseD.classList.add("open");
              carte.classList.add("visible");
            });
          });
        }
      }

      /// Bascule le mode à chaud (toggle dashboard pendant la présentation).
      /// Rejoue la chorégraphie visuelle sans re-télécharger les données.
      function appliquerModePresentation(mode) {
        if (!presRootEl || !presVisible) return;
        presMode = mode === "card" ? "card" : "theatrical";
        var carte = presRootEl._carte;
        presRootEl.classList.toggle("mode-card", presMode === "card");
        if (presMode === "card") {
          // Retirer rideaux + décor + public immédiatement (refermés
          // instantanément, comme les rideaux).
          presRideauG.classList.remove("open");
          presRideauD.classList.remove("open");
          presRideauG.style.display = "none";
          presRideauD.style.display = "none";
          presValanceEl.classList.remove("visible");
          presValanceEl.style.display = "none";
          presEmbrasseG.classList.remove("open");
          presEmbrasseD.classList.remove("open");
          presEmbrasseG.style.display = "none";
          presEmbrasseD.style.display = "none";
          presPublicEl.classList.remove("visible");
          presPublicEl.style.display = "none";
          carte.classList.add("visible");
        } else {
          presRideauG.style.display = "block";
          presRideauD.style.display = "block";
          presValanceEl.style.display = "block";
          presEmbrasseG.style.display = "block";
          presEmbrasseD.style.display = "block";
          presPublicEl.style.display = "block";
          carte.classList.remove("visible");
          // Double rAF comme playPresentationShow : un frame pour peindre
          // les éléments affichés, sinon les transitions ne jouent pas.
          requestAnimationFrame(function () {
            presValanceEl.classList.add("visible");
            presPublicEl.classList.add("visible");
            requestAnimationFrame(function () {
              presRideauG.classList.add("open");
              presRideauD.classList.add("open");
              presEmbrasseG.classList.add("open");
              presEmbrasseD.classList.add("open");
              carte.classList.add("visible");
            });
          });
        }
      }

      /// Ferme la présentation : les rideaux se referment (théâtral) puis
      /// tout est masqué après la transition. En mode card : fondu simple.
      function stopPresentation() {
        if (!presRootEl || !presVisible) return;
        presVisible = false;
        var carte = presRootEl._carte;
        carte.classList.remove("visible");
        presVoileEl.classList.remove("visible");

        if (presMode === "theatrical") {
          presRideauG.classList.remove("open");
          presRideauD.classList.remove("open");
          // Les embrasses s'effacent sans délai (le transition-delay n'est
          // posé que dans .open) — les rideaux se referment derrière elles.
          presEmbrasseG.classList.remove("open");
          presEmbrasseD.classList.remove("open");
        }
        presValanceEl.classList.remove("visible");
        presPublicEl.classList.remove("visible");
        // Attendre la fin des transitions (rideaux 1,2 s > voile/public 0,6 s).
        if (presHideTimer) clearTimeout(presHideTimer);
        presHideTimer = setTimeout(function () {
          presHideTimer = null;
          presRootEl.style.display = "none";
          presVoileEl.style.display = "none";
          presRideauG.style.display = "none";
          presRideauD.style.display = "none";
          presValanceEl.style.display = "none";
          presEmbrasseG.style.display = "none";
          presEmbrasseD.style.display = "none";
          presPublicEl.style.display = "none";
        }, presMode === "theatrical" ? 1250 : 500);

        // Couper clip + audios tout de suite (pas à la fin des rideaux).
        presentationClipStop();
        presentationAudioStop("toutes");
      }

      /// Joue un clip en plein écran par-dessus la carte.
      function presentationClipPlay(msg) {
        if (!presClipRootEl) return;
        presClipTitreEl.textContent = msg.titre || "";
        presClipVideoEl.oncanplay = null;
        presClipVideoEl.onerror = null;
        presClipRootEl.classList.add("visible");
        presClipVideoEl.src = msg.mp4_url || "";
        presClipVideoEl.oncanplay = function () {
          presClipVideoEl.oncanplay = null;
          presClipVideoEl.play().catch(function () {});
        };
        presClipVideoEl.onerror = function () {
          // Clip injouable → retirer le lecteur (retour à la carte).
          presentationClipStop();
        };
      }

      /// Retire le lecteur clip (retour à la carte présentation).
      function presentationClipStop() {
        if (!presClipRootEl) return;
        presClipRootEl.classList.remove("visible");
        presClipVideoEl.oncanplay = null;
        presClipVideoEl.onerror = null;
        presClipVideoEl.pause();
        presClipVideoEl.removeAttribute("src");
        presClipVideoEl.load();
      }

      /// Joue une piste audio : voix = one-shot, musique = boucle (elle
      /// accompagne la présentation jusqu'au stop/hide). src = "medias/…".
      function presentationAudioPlay(piste, src) {
        if (!src || PREVIEW) return;
        presentationAudioStop(piste);
        var audio = new Audio("/" + src);
        audio.loop = piste === "musique";
        audio.play().catch(function () {});
        presAudios[piste] = audio;
      }

      /// Stoppe une piste audio, ou "toutes".
      function presentationAudioStop(piste) {
        var clefs = piste === "toutes" ? ["voix", "musique"] : [piste];
        clefs.forEach(function (k) {
          var a = presAudios[k];
          if (a) {
            a.pause();
            a.currentTime = 0;
            presAudios[k] = null;
          }
        });
      }

      // Initialiser l'overlay présentation dès le démarrage.
      initPresentationOverlay();

      // ===== Bandeau premier message : overlay autonome =====
      //
      // Pleine largeur, en bas (défaut) ou en haut. Couleurs dérivées du cadre
      // widget de la scène active (currentScene.cadreWidget). Sans cadre actif,
      // thème noir & blanc (--fond #0a0a0a / --texte #e0e0e0).

      var bpmRoot = null;        // div racine positionnable
      var bpmBarre = null;       // barre pleine largeur
      var bpmAvatarEl = null;
      var bpmPseudoEl = null;
      var bpmMessageEl = null;
      var bpmVisible = false;

      // Config courante (position + duree). MAJ via bandeau-premier-message-config.
      var bpmConfig = { duree_ms: 6000, position: "bas" };

      // Couleurs par défaut (noir & blanc) — utilisées si aucun cadre actif.
      var BPM_COULEURS_DEFAUT = { p: "#e0e0e0", s: "#a0a0a0" };

      function bpmHexValide(h) {
        return /^#[0-9a-f]{6}$/i.test(String(h || ""));
      }

      /// Convertit #rrggbb → "r, g, b" pour rgba().
      function bpmHexVersRgb(hex) {
        var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ""));
        if (!m) return "224, 224, 224";
        var n = parseInt(m[1], 16);
        return ((n >> 16) & 0xff) + ", " + ((n >> 8) & 0xff) + ", " + (n & 0xff);
      }

      /// Luminance perceptuelle 0-255 d'un hex (rec.601) — 0 si invalide.
      function bpmLuminance(hex) {
        var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ""));
        if (!m) return 0;
        var n = parseInt(m[1], 16);
        return (
          ((n >> 16) & 0xff) * 0.299 +
          ((n >> 8) & 0xff) * 0.587 +
          (n & 0xff) * 0.114
        );
      }

      /// Assombrit une couleur hex d'un ratio (0 = inchangé, 1 = noir).
      function bpmAssombrir(hex, ratio) {
        var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ""));
        if (!m) return "#0a0a0a";
        var r = Math.min(1, Math.max(0, Number(ratio) || 0));
        var n = parseInt(m[1], 16);
        var rr = Math.round(((n >> 16) & 0xff) * (1 - r));
        var gg = Math.round(((n >> 8) & 0xff) * (1 - r));
        var bb = Math.round((n & 0xff) * (1 - r));
        function pad(v) { return v.toString(16).padStart(2, "0"); }
        return "#" + pad(rr) + pad(gg) + pad(bb);
      }

      /// Éclaircit une couleur hex d'un ratio (0 = inchangé, 1 = blanc).
      function bpmEclaircir(hex, ratio) {
        var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ""));
        if (!m) return "#f5f5f5";
        var r = Math.min(1, Math.max(0, Number(ratio) || 0));
        var n = parseInt(m[1], 16);
        var rr = Math.round(((n >> 16) & 0xff) + (255 - ((n >> 16) & 0xff)) * r);
        var gg = Math.round(((n >> 8) & 0xff) + (255 - ((n >> 8) & 0xff)) * r);
        var bb = Math.round((n & 0xff) + (255 - (n & 0xff)) * r);
        function pad(v) { return v.toString(16).padStart(2, "0"); }
        return "#" + pad(rr) + pad(gg) + pad(bb);
      }

      /// Résout les couleurs { p, s } depuis le cadre widget de la scène active.
      /// Tous les styles utilisent couleur/couleurFin (couleurFin invalide →
      /// dérivée de couleur, jamais de noir). Fallback → BPM_COULEURS_DEFAUT.
      function bpmResoudreCouleurs() {
        var cadre = currentScene && currentScene.cadreWidget;
        if (!cadre || !cadre.actif) return BPM_COULEURS_DEFAUT;
        var c1 = bpmHexValide(cadre.couleur) ? cadre.couleur : null;
        var c2 = bpmHexValide(cadre.couleurFin) ? cadre.couleurFin : null;
        if (c1 && c2) {
          // Cadre noir→couleur (défaut StreamOS) : couleur est #000000 — la
          // teinte visible est l'extrémité la plus lumineuse du gradient.
          if (bpmLuminance(c1) < bpmLuminance(c2)) return { p: c2, s: c1 };
          return { p: c1, s: c2 };
        }
        if (c1) return { p: c1, s: bpmAssombrir(c1, 0.25) };
        return BPM_COULEURS_DEFAUT;
      }

      /// Applique les couleurs CSS au root bandeau.
      function bpmAppliquerCouleurs() {
        if (!bpmRoot) return;
        var col = bpmResoudreCouleurs();
        bpmRoot.style.setProperty("--bpm-prim", col.p);
        bpmRoot.style.setProperty("--bpm-sec", col.s);
        bpmRoot.style.setProperty("--bpm-rgb-prim", bpmHexVersRgb(col.p));
        bpmRoot.style.setProperty("--bpm-rgb-sec", bpmHexVersRgb(col.s));
        // Fond barre : version assombrie de la primaire (teinte visible mais
        // assez sombre pour le texte blanc). Rendue OPAQUE dans le gradient
        // de .bandeau-pm-barre (noir -> teinte -> noir, fond solide).
        bpmRoot.style.setProperty("--bpm-rgb-fond", bpmHexVersRgb(bpmAssombrir(col.p, 0.55)));
      }

      /// Crée l'overlay bandeau une fois (au démarrage). Idempotent.
      function initBandeauPMOverlay() {
