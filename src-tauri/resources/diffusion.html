      /// Applique la config (position/duree/police) au root bandeau.
      function applyBandeauPMConfig(cfg) {
        if (typeof cfg.duree_ms === "number") bpmConfig.duree_ms = cfg.duree_ms;
        if (cfg.position === "bas" || cfg.position === "haut") {
          bpmConfig.position = cfg.position;
          if (bpmRoot) {
            bpmRoot.classList.remove("pos-bas", "pos-haut");
            bpmRoot.classList.add("pos-" + cfg.position);
          }
        }
        // Police : whitelist alphanumérique (injection CSS). "" = système.
        if (typeof cfg.police === "string" && bpmRoot) {
          if (/^[A-Za-z0-9]+$/.test(cfg.police)) {
            bpmRoot.style.setProperty("--bpm-fonte", "'" + cfg.police + "'");
          } else {
            bpmRoot.style.removeProperty("--bpm-fonte");
          }
        }
      }

      /// Affiche le bandeau avec les infos du viewer.
      function playBandeauPM(msg) {
        if (!bpmRoot) {
          return;
        }
        var viewer = msg.viewer || {};
        // Avatar
        if (viewer.avatar) {
          bpmAvatarEl.src = viewer.avatar;
          bpmAvatarEl.style.display = "inline-block";
        } else {
          bpmAvatarEl.style.display = "none";
        }
        bpmPseudoEl.textContent = viewer.display_name || "";
        bpmMessageEl.textContent = msg.message || "";

        // Rafraîchir les couleurs (la scène a pu changer depuis l'init).
        bpmAppliquerCouleurs();

        // Afficher (transition CSS gère l'animation).
        bpmRoot.style.display = "block";
        // Forcer un reflow pour rejouer la transition si déjà visible.
        void bpmRoot.offsetWidth;
        bpmRoot.classList.add("visible");
        bpmVisible = true;
      }

      /// Cache le bandeau.
      function stopBandeauPM() {
        if (!bpmRoot) return;
        bpmRoot.classList.remove("visible");
        bpmVisible = false;
        // Masquer complètement après la transition (500ms).
        setTimeout(function () {
          if (!bpmVisible && bpmRoot) bpmRoot.style.display = "none";
        }, 550);
      }

      // Initialiser l'overlay bandeau dès le démarrage (après currentScene).
      let currentScene = { widgets: [] };
      initBandeauPMOverlay();

      // ===== Alertes Twitch : overlay autonome (follow/raid/sub/resub/subgift/bits) =====
      //
      // Messages WS (émis par alertes.rs) :
      //   alerte-config → config complète par type (fallback couleurs/taille)
      //   alerte-play   → { alerte: { type, texte, son, couleur, taille_px, duree_ms } }
      //   alerte-stop   → cache l'overlay (autoritaire ; fallback timer local)
      // Son : fichier importé servi par :4321 sur /medias/ (chemin relatif).
      var alerteRoot = null;
      var alerteCardEl = null;
      var alerteTexteEl = null;
      var alerteMediaEl = null;
      var alerteConfig = {};
      // Position/taille de l'overlay — MÊME mécanique que welcomeConfig
      // (x/y/largeur poussés par alerte-config, hauteur auto = la carte
      // s'ajuste à son contenu).
      var alerteOverlay = { x: 660, y: 60, largeur: 600, hauteur: 120 };
      var alerteTimer = null;
      var alerteAudio = null;
      var alerteVisible = false;

      // ===== Cadre SVG sur les overlays (alerte + clip de bienvenue) =====
      //
      // Les cartes des overlays autonomes suivent le cadre widget de la scène
      // courante (currentScene.cadreWidget) — même règle que applyCadreWidget :
      // actif si actif && strokeWidth > 0. La carte est mesurée APRÈS affichage
      // (hauteur auto) → SVG généré à la taille réelle + clip-path sur la
      // carte. Clé de hash (cadreKey) pour ne recréer que si changé.
      var cadreOverlayEls = {}; // idCadre → { overlayEl, key }
      function appliquerCadreOverlay(carteEl, idCadre) {
        if (!carteEl) return;
        var cadre = currentScene && currentScene.cadreWidget ? currentScene.cadreWidget : null;
        var actif = cadre && cadre.actif && (cadre.strokeWidth || 0) > 0;
        var memo = cadreOverlayEls[idCadre];
        if (!actif) {
          if (memo) {
            if (memo.overlayEl) memo.overlayEl.remove();
            delete cadreOverlayEls[idCadre];
          }
          carteEl.style.clipPath = "";
          carteEl.style.webkitClipPath = "";
          return;
        }
        var W = carteEl.offsetWidth;
        var H = carteEl.offsetHeight;
        if (!W || !H) return; // carte pas encore mesurable → rappelé après affichage
        var newKey = cadreKey(cadre, W, H);
        if (memo && memo.key === newKey && memo.overlayEl && memo.overlayEl.parentNode === carteEl) return;
        if (memo && memo.overlayEl) memo.overlayEl.remove();
        var overlay = document.createElement("div");
        overlay.className = "cadre-overlay";
        overlay.innerHTML = genererCadreSVG(cadre, W, H, idCadre);
        carteEl.appendChild(overlay);
        var clip = genererCadreClipPath(cadre, W, H);
        if (clip) {
          carteEl.style.clipPath = clip;
          carteEl.style.webkitClipPath = clip;
        } else {
          carteEl.style.clipPath = "";
          carteEl.style.webkitClipPath = "";
        }
        cadreOverlayEls[idCadre] = { overlayEl: overlay, key: newKey };
      }

      /// Retire le cadre SVG d'une carte overlay (au stop).
      function nettoyerCadreOverlay(carteEl, idCadre) {
        var memo = cadreOverlayEls[idCadre];
        if (memo && memo.overlayEl) memo.overlayEl.remove();
        delete cadreOverlayEls[idCadre];
        if (carteEl) {
          carteEl.style.clipPath = "";
          carteEl.style.webkitClipPath = "";
        }
      }

      /// Crée l'overlay alerte une fois (au démarrage). Idempotent.
      function initAlerteOverlay() {
        if (alerteRoot) return;
        alerteRoot = document.createElement("div");
        alerteRoot.className = "alerte-root";
        alerteRoot.style.display = "none";
        var carte = document.createElement("div");
        carte.className = "alerte-card";
        alerteTexteEl = document.createElement("span");
        alerteTexteEl.className = "alerte-texte";
        carte.appendChild(alerteTexteEl);
        alerteCardEl = carte;
        alerteRoot.appendChild(carte);
        stageEl.appendChild(alerteRoot);
        // Position/taille par défaut (surchargées par alerte-config).
        applyAlerteOverlayConfig(alerteOverlay);
      }

      /// Applique la config (x/y/largeur) au root alerte — même mécanique que
      /// applyWelcomeOverlayConfig. La hauteur est auto (la carte s'ajuste à
      /// son contenu).
      function applyAlerteOverlayConfig(cfg) {
        if (!alerteRoot) return;
        if (typeof cfg.x === "number") alerteOverlay.x = cfg.x;
        if (typeof cfg.y === "number") alerteOverlay.y = cfg.y;
        if (typeof cfg.largeur === "number") alerteOverlay.largeur = cfg.largeur;
        if (typeof cfg.hauteur === "number") alerteOverlay.hauteur = cfg.hauteur;
        alerteRoot.style.left = alerteOverlay.x + "px";
        alerteRoot.style.top = alerteOverlay.y + "px";
        alerteRoot.style.width = alerteOverlay.largeur + "px";
      }

      /// Applique la config (couleurs/tailles par type + overlay position).
      function applyAlerteConfig(cfg) {
        alerteConfig = cfg || {};
        if (cfg.overlay) applyAlerteOverlayConfig(cfg.overlay);
      }

      /// Affiche l'alerte (média image/vidéo ou icône + texte + son) avec
      /// auto-hide fallback. Texte au-dessus, média dessous. Son : mode image
      /// → son importé ; mode vidéo → son porté par la vidéo.
      function playAlerte(msg) {
        if (!alerteRoot) {
          return;
        }
        var a = msg.alerte || {};
        var type = a.type || "";
        var cfgType = alerteConfig[type] || {};
        alerteTexteEl.textContent = a.texte || "";
        // Couleur du texte = couleur du cadre widget de la scène si actif,
        // sinon blanc (plus de champ couleur sur les alertes).
        var couleur = "#ffffff";
        var cadreW = currentScene && currentScene.cadreWidget;
        if (cadreW && cadreW.actif) {
          couleur = bpmResoudreCouleurs().p;
        }
        alerteRoot.style.setProperty("--alerte-couleur", couleur);
        alerteRoot.style.setProperty("--alerte-taille", (a.taille_px || cfgType.taille_px || 48) + "px");

        // Média : vidéo (son inclus) ou image (son séparé). Sans média →
        // icône emoji (comportement historique).
        if (alerteMediaEl) {
          alerteMediaEl.remove();
          alerteMediaEl = null;
        }
        if (a.media && a.media_kind === "video") {
          var vid = document.createElement("video");
          vid.className = "alerte-media";
          vid.src = "/" + a.media;
          vid.autoplay = true;
          vid.muted = PREVIEW;
          vid.setAttribute("playsinline", "");
          vid.oncanplay = function () {
            vid.oncanplay = null;
            // La vidéo change la hauteur de la carte → re-mesurer le cadre.
            appliquerCadreOverlay(alerteCardEl, "alerte");
          };
          alerteMediaEl = vid;
        } else if (a.media) {
          var img = document.createElement("img");
          img.className = "alerte-media";
          img.alt = "";
          img.onload = function () {
            img.onload = null;
            appliquerCadreOverlay(alerteCardEl, "alerte");
          };
          img.src = "/" + a.media;
          alerteMediaEl = img;
        }
        if (alerteMediaEl) {
          alerteMediaEl.style.display = "block";
          alerteCardEl.appendChild(alerteMediaEl);
        }

        // Son : mode image → son importé ; mode vidéo → rien de plus (le son
        // est dans la vidéo).
        if (alerteAudio) {
          alerteAudio.pause();
          alerteAudio = null;
        }
        if (a.son && a.media_kind !== "video" && !PREVIEW) {
          try {
            alerteAudio = new Audio("/" + a.son);
            alerteAudio.volume = 0.8;
            alerteAudio.play().catch(function () {});
          } catch {
          }
        }

        // Afficher (transition CSS gère le pop-in).
        alerteRoot.style.display = "block";
        void alerteRoot.offsetWidth;
        alerteRoot.classList.add("visible");
        alerteVisible = true;
        // Cadre SVG : mesurer la carte une fois affichée (hauteur auto).
        requestAnimationFrame(function () {
          appliquerCadreOverlay(alerteCardEl, "alerte");
        });

        // Fallback local : l'alerte-stop Rust est autoritaire, mais si perdu
        // (WS lag) on cache après duree_ms + 500ms de marge.
        if (alerteTimer) clearTimeout(alerteTimer);
        var duree = (a.duree_ms || cfgType.duree_ms || 5000) + 500;
        alerteTimer = setTimeout(function () {
          if (alerteVisible) stopAlerte();
        }, duree);
      }

      /// Cache l'alerte + stoppe le son/média.
      function stopAlerte() {
        if (alerteTimer) {
          clearTimeout(alerteTimer);
          alerteTimer = null;
        }
        if (alerteAudio) {
          alerteAudio.pause();
          alerteAudio = null;
        }
        if (alerteMediaEl) {
          if (alerteMediaEl.tagName === "VIDEO") {
            alerteMediaEl.pause();
            alerteMediaEl.removeAttribute("src");
            alerteMediaEl.load();
          }
          alerteMediaEl.remove();
          alerteMediaEl = null;
        }
        if (!alerteRoot) return;
        alerteRoot.classList.remove("visible");
        alerteVisible = false;
        if (alerteCardEl) nettoyerCadreOverlay(alerteCardEl, "alerte");
        setTimeout(function () {
          if (!alerteVisible && alerteRoot) alerteRoot.style.display = "none";
        }, 500);
      }

      // Initialiser l'overlay alerte dès le démarrage.
      initAlerteOverlay();

      // ===== Commandes chat (!commande → overlay diffusion) =====
      //
      // Même mécanique que les alertes : carte texte au-dessus + média
      // dessous, cadre SVG = cadre widget de la scène. z 9996 (sous les
      // alertes 9997). La config (liste des commandes) arrive par WS
      // commande-config ; le play/stop par commande-play / commande-stop.

      var commandeRoot = null;
      var commandeCardEl = null;
      var commandeTexteEl = null;
      var commandeMediaEl = null;
      var commandeTimer = null;
      var commandeAudio = null;
      var commandeVisible = false;
      // Position/taille de l'overlay — MÊME squelette que welcome/alertes
      // (poussé par commande-config / position-overlay-config).
      var commandeOverlay = { x: 660, y: 60, largeur: 600, hauteur: 120 };

      /// Crée l'overlay commande une fois (au démarrage). Idempotent.
      function initCommandeOverlay() {
        if (commandeRoot) return;
        commandeRoot = document.createElement("div");
        commandeRoot.className = "commande-root";
        commandeRoot.style.display = "none";
        var carte = document.createElement("div");
        carte.className = "commande-card";
        commandeTexteEl = document.createElement("span");
        commandeTexteEl.className = "commande-texte";
        carte.appendChild(commandeTexteEl);
        commandeCardEl = carte;
        commandeRoot.appendChild(carte);
        stageEl.appendChild(commandeRoot);
        // Position/taille par défaut (surchargées par commande-config).
        applyCommandeOverlayConfig(commandeOverlay);
      }

      /// Applique la config (x/y/largeur) au root commande — même mécanique
      /// que applyAlerteOverlayConfig. La hauteur est auto (carte = contenu).
      function applyCommandeOverlayConfig(cfg) {
        if (!commandeRoot) return;
        if (typeof cfg.x === "number") commandeOverlay.x = cfg.x;
        if (typeof cfg.y === "number") commandeOverlay.y = cfg.y;
        if (typeof cfg.largeur === "number") commandeOverlay.largeur = cfg.largeur;
        if (typeof cfg.hauteur === "number") commandeOverlay.hauteur = cfg.hauteur;
        commandeRoot.style.left = commandeOverlay.x + "px";
        commandeRoot.style.top = commandeOverlay.y + "px";
        commandeRoot.style.width = commandeOverlay.largeur + "px";
      }

      /// Affiche la commande (texte + média/son optionnels) + cadre SVG.
      function playCommande(msg) {
        if (!commandeRoot) {
          return;
        }
        var c = msg.commande || {};
        commandeTexteEl.textContent = c.texte || "";
        // Couleur du texte = couleur du cadre widget de la scène si actif,
        // sinon blanc (plus de champ couleur sur les commandes).
        var couleur = "#ffffff";
        var cadreW = currentScene && currentScene.cadreWidget;
        if (cadreW && cadreW.actif) {
          couleur = bpmResoudreCouleurs().p;
        }
        commandeRoot.style.setProperty("--commande-couleur", couleur);
        commandeRoot.style.setProperty(
          "--commande-taille",
          (c.taille_px || 48) + "px"
        );

        // Média : vidéo (son inclus) ou image (son séparé via c.son).
        if (commandeMediaEl) {
          commandeMediaEl.remove();
          commandeMediaEl = null;
        }
        if (c.media && c.media_kind === "video") {
          var vid = document.createElement("video");
          vid.className = "commande-media";
          vid.src = "/" + c.media;
          vid.autoplay = true;
          vid.muted = PREVIEW;
          vid.setAttribute("playsinline", "");
          vid.oncanplay = function () {
            vid.oncanplay = null;
            // La vidéo change la hauteur de la carte → re-mesurer le cadre.
            requestAnimationFrame(function () {
              appliquerCadreOverlay(commandeCardEl, "commande");
            });
          };
          commandeMediaEl = vid;
        } else if (c.media) {
          var img = document.createElement("img");
          img.className = "commande-media";
          img.alt = "";
          img.onload = function () {
            img.onload = null;
            appliquerCadreOverlay(commandeCardEl, "commande");
          };
          img.src = "/" + c.media;
          commandeMediaEl = img;
        }
        if (commandeMediaEl) {
          commandeMediaEl.style.display = "block";
          commandeCardEl.appendChild(commandeMediaEl);
        }

        // Son : mode image → son importé ; mode vidéo → son porté par la vidéo.
        if (commandeAudio) {
          commandeAudio.pause();
          commandeAudio = null;
        }
        if (c.son && c.media_kind !== "video" && !PREVIEW) {
          try {
            commandeAudio = new Audio("/" + c.son);
            commandeAudio.volume = 0.8;
            commandeAudio.play().catch(function () {});
          } catch {
          }
        }

        // Afficher (transition CSS gère le pop-in).
        commandeRoot.style.display = "block";
        void commandeRoot.offsetWidth;
        commandeRoot.classList.add("visible");
        commandeVisible = true;
        // Cadre SVG : mesurer la carte une fois affichée (hauteur auto).
        requestAnimationFrame(function () {
          appliquerCadreOverlay(commandeCardEl, "commande");
        });

        // Fallback local : le commande-stop Rust est autoritaire, mais si
        // perdu (WS lag) on cache après duree_ms + 500ms de marge.
        if (commandeTimer) clearTimeout(commandeTimer);
        var duree = (c.duree_ms || 5000) + 500;
        commandeTimer = setTimeout(function () {
          if (commandeVisible) stopCommande();
        }, duree);
      }

      /// Cache la commande + stoppe le son/média.
      function stopCommande() {
        if (commandeTimer) {
          clearTimeout(commandeTimer);
          commandeTimer = null;
        }
        if (commandeAudio) {
          commandeAudio.pause();
          commandeAudio = null;
        }
        if (commandeMediaEl) {
          if (commandeMediaEl.tagName === "VIDEO") {
            commandeMediaEl.pause();
            commandeMediaEl.removeAttribute("src");
            commandeMediaEl.load();
          }
          commandeMediaEl.remove();
          commandeMediaEl = null;
        }
        if (!commandeRoot) return;
        commandeRoot.classList.remove("visible");
        commandeVisible = false;
        if (commandeCardEl) nettoyerCadreOverlay(commandeCardEl, "commande");
        setTimeout(function () {
          if (!commandeVisible && commandeRoot) commandeRoot.style.display = "none";
        }, 500);
      }

      // Initialiser l'overlay commande dès le démarrage.
      initCommandeOverlay();

      // ===== Musique (!rs → bibliothèque locale → audio + ligne défilante) =====
      //
      // Frames WS : musique-play {piste:{id,titre,src,demandeur}, volume}
      // (UNE piste à la fois — Rust fait la file) / musique-stop /
      // musique-pause {pause} / musique-volume {volume}. L'affichage est la
      // ligne défilante .chat-musique dans l'en-tête de CHAQUE widget chat
      // (sous la barre viewers ; visible aussi en mode bulles car élément
      // séparé). La fin de piste est remontée en upstream WS
      // ("musique-ended" {id}) → Rust avance la file ; id vérifié côté Rust
      // (dedup si plusieurs browser sources connectées).
      // PREVIEW (miniature dashboard) : aucune lecture audio — le dashboard
      // entendrait la musique en double sinon.

      var musiqueAudio = null;
      // Piste courante pour la ligne défilante : {id, titre, demandeur}.
      var musiqueCourant = null;
      var musiqueVolume = 0.8;

      /// Remplit une ligne .chat-musique (deux copies du texte = défilement
      /// bouclé sans saut). txt vide → élément vidé (display:none via :empty).
      function remplirMusiqueEl(el, txt) {
        if (!txt) {
          el.innerHTML = "";
          return;
        }
        var esc = escapeHtml(txt);
        el.innerHTML =
          '<span class="musique-defile"><span>' + esc + "</span><span>" +
          esc + "</span></span>";
        // Durée proportionnelle à la longueur du titre (min 8 s).
        var duree = Math.max(8, txt.length * 0.22);
        el.firstChild.style.animationDuration = duree + "s";
      }

      /// Met à jour la ligne défilante de TOUS les widgets chat (comme
      /// rerenderViewersBars — widgetMap peut contenir plusieurs chats).
      function majMusiqueMarquee() {
        var txt = musiqueCourant
          ? "♪ " + musiqueCourant.titre + " — " + musiqueCourant.demandeur
          : "";
        widgetMap.forEach(function (entry) {
          if (entry.musiqueEl) remplirMusiqueEl(entry.musiqueEl, txt);
        });
      }

      /// Joue une piste (frame musique-play). La ligne défilante est mise à
      /// jour même en PREVIEW (info utile sur la miniature, audio coupé).
      function playMusique(msg) {
        var p = msg.piste || {};
        if (musiqueAudio) {
          musiqueAudio.pause();
          musiqueAudio = null;
        }
        musiqueCourant = {
          id: p.id || "",
          titre: p.titre || "",
          demandeur: p.demandeur || "",
        };
        if (typeof msg.volume === "number") musiqueVolume = msg.volume;
        majMusiqueMarquee();
        majMusiqueWidgets();
        if (PREVIEW || !p.src) return;
        try {
          var audio = new Audio("/" + p.src);
          audio.volume = musiqueVolume;
          var idCapture = musiqueCourant.id;
          // Durée fiable → remontée "musique-meta" : Rust la pose sur la
          // LectureEnCours (progression du lecteur dans l'onglet Musique).
          audio.onloadedmetadata = function () {
            if (isFinite(audio.duration)) {
              wsSend({ type: "musique-meta", id: idCapture, duree_s: audio.duration });
            }
          };
          // Fin OU erreur → remontée "musique-ended" : Rust avance la file.
          // Le clear local de la ligne est immédiat (ne pas attendre le WS).
          audio.onended = function () {
            wsSend({ type: "musique-ended", id: idCapture });
            if (musiqueCourant && musiqueCourant.id === idCapture) {
              eqArreter();
              musiqueCourant = null;
              majMusiqueMarquee();
              majMusiqueWidgets();
            }
          };
          audio.onerror = audio.onended;
          var pPlay = audio.play();
          if (pPlay && pPlay.catch) {
            // Autoplay refusé → remonter ended pour ne pas bloquer la file.
            pPlay.catch(function () {
              wsSend({ type: "musique-ended", id: idCapture });
            });
          }
          musiqueAudio = audio;
          eqDemarrer(p.src);
        } catch (e) {}
      }

      /// Stoppe la piste : audio coupé + ligne effacée (musique-stop).
      function stopMusique() {
        eqArreter();
        if (musiqueAudio) {
          musiqueAudio.pause();
          musiqueAudio = null;
        }
        musiqueCourant = null;
        majMusiqueMarquee();
        majMusiqueWidgets();
      }

      /// Pause/reprendre la piste courante (musique-pause {pause}).
      /// L'ombre de l'équalizer suit (sinon le spectre afficherait de la
      /// musique pendant que le stream est en pause).
      function pauseMusique(pause) {
        if (!musiqueAudio) return;
        if (pause) {
          musiqueAudio.pause();
          if (eqShadow) eqShadow.pause();
        } else {
          musiqueAudio.play().catch(function () {});
          if (eqShadow) {
            eqShadow.currentTime = musiqueAudio.currentTime;
            eqShadow.play().catch(function () {});
          }
        }
      }

      /// Volume à chaud (musique-volume {volume}) — appliqué à l'audio courant
      /// et mémorisé pour les pistes suivantes.
      function musiqueAppliquerVolume(v) {
        if (typeof v === "number") musiqueVolume = v;
        if (musiqueAudio) musiqueAudio.volume = musiqueVolume;
      }

      // ===== Équalizer spectre (audio « ombre » muette → AnalyserNode) =====
      //
      // L'<audio> AUDIBLE (musiqueAudio) n'entre JAMAIS dans le graphe Web
      // Audio : createMediaElementSource est irréversible et un AudioContext
      // suspendu couperait le son du stream. À la place, une seconde
      // <audio> muette joue le même fichier → source → analyser → gain(0)
      // → destination. Si le contexte ne démarre pas → fallback bandes
      // simulées (même rendu). Les bandes alimentent les widgets musique
      // locaux ET l'upstream "musique-spectrum" (~8 Hz) → relayé par Rust
      // vers le lecteur Winamp du dashboard.

      var eqCtx = null;
      var eqShadow = null;
      var eqAnalyser = null;
      var eqData = null;
      var eqMode = "off"; // "reel" | "simule" | "off"
      var eqTimer = null;
      var eqSent = 0;
      var NB_BANDES = 16;
      var eqBands = [];
      for (var eqi = 0; eqi < NB_BANDES; eqi++) eqBands.push(0);
      // Peak dots : crête par bande retombant doucement (signature Winamp).
      var eqPeaks = [];
      for (var eqj = 0; eqj < NB_BANDES; eqj++) eqPeaks.push(0);

      /// Démarre l'ombre + le graphe pour la piste src (appelé par
      /// playMusique après musiqueAudio). Échec → mode simulé.
      function eqDemarrer(src) {
        eqArreter();
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!eqCtx && AC) eqCtx = new AC();
          if (eqCtx) {
            eqShadow = new Audio("/" + src);
            var srcNode = eqCtx.createMediaElementSource(eqShadow);
            eqAnalyser = eqCtx.createAnalyser();
            eqAnalyser.fftSize = 64; // 32 bins → 16 bandes par paires
            eqAnalyser.smoothingTimeConstant = 0.75;
            var gain = eqCtx.createGain();
            gain.gain.value = 0; // MUET : l'ombre ne sort rien
            srcNode.connect(eqAnalyser);
            eqAnalyser.connect(gain);
            gain.connect(eqCtx.destination);
            eqShadow.currentTime = 0;
            eqShadow.play().catch(function () {});
            var p = eqCtx.resume();
            eqMode = "simule"; // provisoire tant que resume n'a pas tranché
            if (p && p.then) {
              p.then(function () {
                eqMode = eqCtx && eqCtx.state === "running" ? "reel" : "simule";
              }).catch(function () {
                eqMode = "simule";
              });
            }
          } else {
            eqMode = "simule";
          }
        } catch (e) {
          eqMode = "simule";
        }
        eqTimer = setInterval(eqTick, 66);
      }

      /// Stoppe l'ombre + le tick ; bandes à plat (une frame plate envoyée
      /// pour reset visuel du lecteur).
      function eqArreter() {
        if (eqTimer) {
          clearInterval(eqTimer);
          eqTimer = null;
        }
        if (eqShadow) {
          try {
            eqShadow.pause();
          } catch (e) {}
          eqShadow = null;
        }
        eqAnalyser = null;
        eqData = null;
        eqMode = "off";
        for (var i = 0; i < NB_BANDES; i++) {
          eqBands[i] = 0;
          eqPeaks[i] = 0;
        }
        majMusiqueEq();
        if (musiqueCourant) {
          wsSend({
            type: "musique-spectrum",
            id: musiqueCourant.id,
            bands: eqBands.slice(),
          });
        }
      }

      /// Tick EQ (~66 ms) : échantillonne les bandes réelles (analyser) ou
      /// simulées, met à jour les barres des widgets musique et envoie le
      /// spectre upstream ~1 frame sur 4 (~8 Hz).
      function eqTick() {
        var playing = !!(musiqueAudio && !musiqueAudio.paused);
        if (eqMode === "reel" && eqAnalyser) {
          if (!eqData || eqData.length !== eqAnalyser.frequencyBinCount) {
            eqData = new Uint8Array(eqAnalyser.frequencyBinCount);
          }
          eqAnalyser.getByteFrequencyData(eqData);
          for (var i = 0; i < NB_BANDES; i++) {
            var v = Math.max(eqData[i * 2] || 0, eqData[i * 2 + 1] || 0);
            // Montée immédiate, décroissance douce (effet Winamp).
            eqBands[i] = Math.max(v, eqBands[i] - 18);
          }
        } else {
          var t = Date.now() / 1000;
          for (var k = 0; k < NB_BANDES; k++) {
            var cible = playing
              ? 60 +
                140 *
                  Math.abs(Math.sin(t * (0.7 + k * 0.13) + k)) *
                  (0.55 + 0.45 * Math.sin(t * 2.3 + k * 2))
              : 0;
            eqBands[k] += (cible - eqBands[k]) * (playing ? 0.35 : 0.2);
          }
        }
        // Peak dots : accrochent la bande, retombent en ~1,5 s (66 ms × 11).
        for (var pi = 0; pi < NB_BANDES; pi++) {
          eqPeaks[pi] = Math.max(eqPeaks[pi] - 11, eqBands[pi]);
        }
        majMusiqueEq();
        eqSent++;
        if (musiqueCourant && eqSent % 4 === 0) {
          wsSend({
            type: "musique-spectrum",
            id: musiqueCourant.id,
            bands: eqBands.map(Math.round),
          });
        }
      }

      // ===== Widgets musique — maj DOM incrémentale (tick + events) =====

      /// mm:ss depuis des secondes (--:-- si non fini/négatif).
      function muFmt(s) {
        if (!isFinite(s) || s < 0) return "--:--";
        var m = Math.floor(s / 60);
        return m + ":" + String(Math.floor(s % 60)).padStart(2, "0");
      }

      /// MAJ texte + temps + barre d'UN widget musique. Texte seulement si
      /// changé (muKey) — le reste suit musiqueAudio.currentTime/duration.
      function majMusiqueWidget(entry) {
        var titre = musiqueCourant
          ? "♪ " + musiqueCourant.titre + " — " + musiqueCourant.demandeur
          : "♪ —"; // placeholder : la marquee n'est jamais blanche
        if (entry.muKey !== titre) {
          entry.muKey = titre;
          entry.muTxtEls[0].textContent = titre;
          entry.muTxtEls[1].textContent = titre;
          entry.muDefileEl.style.animationDuration =
            Math.max(8, titre.length * 0.22) + "s";
        }
        var cur = 0;
        var dur = NaN;
        if (musiqueAudio && musiqueCourant) {
          cur = musiqueAudio.currentTime;
          dur = musiqueAudio.duration;
        }
        entry.muPosEl.textContent = muFmt(cur);
        entry.muRestEl.textContent = isFinite(dur)
          ? " -" + muFmt(Math.max(0, dur - cur))
          : "";
        entry.muFillEl.style.width =
          (isFinite(dur) && dur > 0 ? Math.min(100, (cur / dur) * 100) : 0) + "%";
      }

      /// MAJ tous les widgets musique (appelé aux transitions play/stop)
      /// + le module HUD musique (même source musiqueCourant/musiqueAudio).
      function majMusiqueWidgets() {
        widgetMap.forEach(function (entry) {
          if (entry.kind === "musique") majMusiqueWidget(entry);
        });
        majModuleMusique();
      }

      /// MAJ les barres EQ + peak dots de tous les widgets musique.
      function majMusiqueEq() {
        widgetMap.forEach(function (entry) {
          if (entry.kind !== "musique" || !entry.muBars) return;
          for (var i = 0; i < NB_BANDES; i++) {
            entry.muBars[i].style.height =
              Math.max(4, Math.round((eqBands[i] / 255) * 100)) + "%";
            if (entry.muPeakEls && entry.muPeakEls[i]) {
              var peakPct = Math.min(100, Math.round((eqPeaks[i] / 255) * 100));
              var dot = entry.muPeakEls[i];
              // Masqué tant que la crête ne dépasse pas la barre.
              if (eqPeaks[i] > eqBands[i] + 6) {
                dot.style.display = "block";
                dot.style.bottom = peakPct + "%";
              } else {
                dot.style.display = "none";
              }
            }
          }
        });
      }

      /// Tick position 250 ms partagé : démarré à la création d'un widget
      /// musique OU du module HUD musique, s'auto-arrête quand plus aucun
      /// n'existe.
      var musiqueUiTimer = null;
      function assurerTickMusique() {
        if (musiqueUiTimer) return;
        musiqueUiTimer = setInterval(function () {
          var actif = !!modulesMap.musique;
          widgetMap.forEach(function (entry) {
            if (entry.kind === "musique") actif = true;
          });
          if (!actif) {
            clearInterval(musiqueUiTimer);
            musiqueUiTimer = null;
            return;
          }
          majMusiqueWidgets();
        }, 250);
      }

      // ===== Pad numérique (16 touches Numpad × 3 plages → overlay diffusion) =====
      //
      // Même squelette que alertes/commandes mais SANS texte (juste le média).
      // z 9995 (sous commandes 9996 et alertes 9997). Le pad est déclenché
      // manuellement par le streamer via le pavé numérique. La position/taille
      // est partagée avec welcome/alertes/commandes (position-overlay-config).
      // Audio : joué côté diffusion (OBS capte) ET côté dashboard (le user
      // entend sur son PC — géré par le store padNumerique.ts).

      var padRoot = null;
      var padCardEl = null;
      var padMediaEl = null;
      var padTimer = null;
      var padAudio = null;
      var padVisible = false;
      // Position/taille de l'overlay — MÊME squelette que welcome/alertes/commandes
      // (poussé par position-overlay-config).
      var padOverlay = { x: 660, y: 60, largeur: 600, hauteur: 120 };

      /// Crée l'overlay pad une fois (au démarrage). Idempotent.
      function initPadOverlay() {
        if (padRoot) return;
        padRoot = document.createElement("div");
        padRoot.className = "pad-root";
        padRoot.style.display = "none";
        var carte = document.createElement("div");
        carte.className = "pad-card";
        padCardEl = carte;
        padRoot.appendChild(carte);
        stageEl.appendChild(padRoot);
        // Position/taille par défaut (surchargées par position-overlay-config).
        applyPadOverlayConfig(padOverlay);
      }

      /// Applique la config (x/y/largeur) au root pad — même mécanique que
      /// applyAlerteOverlayConfig / applyCommandeOverlayConfig.
      function applyPadOverlayConfig(cfg) {
        if (!padRoot) return;
        if (typeof cfg.x === "number") padOverlay.x = cfg.x;
        if (typeof cfg.y === "number") padOverlay.y = cfg.y;
        if (typeof cfg.largeur === "number") padOverlay.largeur = cfg.largeur;
        if (typeof cfg.hauteur === "number") padOverlay.hauteur = cfg.hauteur;
        padRoot.style.left = padOverlay.x + "px";
        padRoot.style.top = padOverlay.y + "px";
        padRoot.style.width = padOverlay.largeur + "px";
      }

      /// Affiche le média du pad (image/vidéo) + joue le son + effets bounce/zoom.
      /// Pour l'audio pur : pas de média affiché, juste le son joué.
      function playPad(msg) {
        if (!padRoot) {
          return;
        }
        var p = msg.pad || {};
        var mediaType = p.media_type || "";
        var media = p.media || null;
        var mediaKind = p.media_kind || null;
        var son = p.son || null;
        var volume = typeof p.volume === "number" ? p.volume : 1.0;
        var dureeMs = p.duree_ms || 5000;
        var bounce = !!p.bounce;
        var zoom = !!p.zoom;

        // Nettoyer le média précédent.
        if (padMediaEl) {
          padMediaEl.remove();
          padMediaEl = null;
        }

        // Média : vidéo (son inclus) ou image (son séparé). Audio pur → pas de média.
        if (media && mediaKind === "video") {
          var vid = document.createElement("video");
          vid.className = "pad-media";
          vid.src = "/" + media;
          vid.autoplay = true;
          vid.muted = PREVIEW;
          vid.volume = volume;
          vid.setAttribute("playsinline", "");
          if (bounce) vid.classList.add("pad-bounce");
          if (zoom) vid.classList.add("pad-zoom");
          vid.oncanplay = function () {
            vid.oncanplay = null;
            requestAnimationFrame(function () {
              appliquerCadreOverlay(padCardEl, "pad");
            });
          };
          padMediaEl = vid;
        } else if (media) {
          var img = document.createElement("img");
          img.className = "pad-media";
          img.alt = "";
          if (bounce) img.classList.add("pad-bounce");
          if (zoom) img.classList.add("pad-zoom");
          img.onload = function () {
            img.onload = null;
            appliquerCadreOverlay(padCardEl, "pad");
          };
          img.src = "/" + media;
          padMediaEl = img;
        }
        if (padMediaEl) {
          padMediaEl.style.display = "block";
          padCardEl.appendChild(padMediaEl);
        }

        // Son : mode image → son importé ; mode vidéo → son porté par la vidéo ;
        // mode audio pur → son = média principal.
        if (padAudio) {
          padAudio.pause();
          padAudio = null;
        }
        var sonSrc = null;
        if (mediaType === "audio" && media) {
          sonSrc = media;
        } else if (son && mediaKind !== "video") {
          sonSrc = son;
        }
        if (sonSrc && !PREVIEW) {
          try {
            padAudio = new Audio("/" + sonSrc);
            padAudio.volume = volume;
            padAudio.play().catch(function () {});
          } catch {
          }
        }

        // Afficher (transition CSS gère le pop-in) — seulement si on a un média
        // à afficher (image/video). L'audio pur n'affiche rien.
        if (padMediaEl) {
          padRoot.style.display = "block";
          void padRoot.offsetWidth;
          padRoot.classList.add("visible");
          padVisible = true;
          // Cadre SVG : mesurer la carte une fois affichée.
          requestAnimationFrame(function () {
            appliquerCadreOverlay(padCardEl, "pad");
          });
        }

        // Fallback local : le pad-stop Rust est autoritaire, mais si perdu
        // (WS lag) on cache après duree_ms + 500ms de marge.
        if (padTimer) clearTimeout(padTimer);
        var duree = dureeMs + 500;
        padTimer = setTimeout(function () {
          if (padVisible || padAudio) stopPad();
        }, duree);
      }

      /// Cache le pad + stoppe le son/média.
      function stopPad() {
        if (padTimer) {
          clearTimeout(padTimer);
          padTimer = null;
        }
        if (padAudio) {
          padAudio.pause();
          padAudio = null;
        }
        if (padMediaEl) {
          if (padMediaEl.tagName === "VIDEO") {
            padMediaEl.pause();
            padMediaEl.removeAttribute("src");
            padMediaEl.load();
          }
          padMediaEl.remove();
          padMediaEl = null;
        }
        if (!padRoot) return;
        padRoot.classList.remove("visible");
        padVisible = false;
        if (padCardEl) nettoyerCadreOverlay(padCardEl, "pad");
        setTimeout(function () {
          if (!padVisible && padRoot) padRoot.style.display = "none";
        }, 500);
      }

      // Initialiser l'overlay pad dès le démarrage.
      initPadOverlay();

      // ===== Écran d'attente (BRB) — overlay plein écran =====
      //
      // Porté de l'ancienne app (features/ecran-attente). z 9990 : recouvre
      // toute la scène mais RESTE SOUS les overlays éphémères (pad 9995,
      // commandes 9996, alertes 9997, bandeau 9998, welcome 9999) qui popent
      // par-dessus pendant l'attente — comportement validé par l'utilisateur.
      //
      // Le chrono est détenu par Rust (tâche tokio 1 Hz) : la diffusion se
      // contente d'afficher `temps_restant` reçu dans les frames
      // `ecran-attente-etat` — auto-réparatrice (config + runtime complets à
      // chaque tick → un client reconnecté se réaligne à la frame suivante ;
      // `ecran-attente-resync` couvre les pauses sans tick).
      //
      // Le média (image/vidéo plein cadre cover, vidéo en boucle) n'est
      // RECONSTRUIT que si media|kind change — signature eaMediaSig — pour
      // ne pas recharger la vidéo à chaque tick. Le son est porté par la
      // vidéo (muted = !son, volume appliqué à chaque frame). Sans média →
      // dégradé animé teinté par les couleurs du cadre widget de la scène.
      // Le minuteur est une carte centrée portant le cadre SVG de la scène
      // (appliquerCadreOverlay) ; le titre est en dégradé de texte aux
      // couleurs du cadre (bpmResoudreCouleurs → --ea-prim/--ea-sec).

      var eaRoot = null;        // div racine plein écran
      var eaFondEl = null;      // dégradé animé (visible si pas de média)
      var eaVoileEl = null;     // voile de lisibilité au-dessus du média
      var eaMediaEl = null;     // <img> ou <video> courant
      var eaTitreEl = null;
      var eaMinuteurEl = null;  // carte minuteur (cadre SVG de la scène)
      var eaLabelEl = null;     // "Début dans" / "En pause"
      var eaTempsEl = null;     // "9:58" / "1:02:33"
      var eaMediaSig = "";      // signature "media|kind" de l'élément courant
      var eaVisible = false;
      // Layout « signature » (affichés uniquement si etat.layout !== "minimal")
      var eaStriesEl = null;    // 4 stries néon diagonales + comètes
      var eaStreamyWrap = null; // bloc mascotte (anneaux + image)
      var eaStreamyImg = null;  // streamy-loading / streamy-offline (pause)
      var eaWordmarkEl = null;  // wordmark StreamOS électrique
      var eaMorseEl = null;     // ligne morse ···−−−···

      /// Crée l'overlay écran d'attente une fois. Idempotent.
      function initEcranAttenteOverlay() {
        if (eaRoot) return;
        eaRoot = document.createElement("div");
        eaRoot.className = "ecran-attente-root";
        eaRoot.style.display = "none";

        eaFondEl = document.createElement("div");
        eaFondEl.className = "ecran-attente-fond";

        eaVoileEl = document.createElement("div");
        eaVoileEl.className = "ecran-attente-voile";

        eaTitreEl = document.createElement("div");
        eaTitreEl.className = "ecran-attente-titre";
        eaTitreEl.style.display = "none";

        eaMinuteurEl = document.createElement("div");
        eaMinuteurEl.className = "ecran-attente-minuteur";
        eaLabelEl = document.createElement("span");
        eaLabelEl.className = "ecran-attente-minuteur-label";
        eaTempsEl = document.createElement("span");
        eaTempsEl.className = "ecran-attente-temps";
        eaMinuteurEl.appendChild(eaLabelEl);
        eaMinuteurEl.appendChild(eaTempsEl);

        // ===== Layout « signature » : éléments de marque =====
        // Stries néon diagonales (4 coins, une comète glissante chacune).
        eaStriesEl = document.createElement("div");
        eaStriesEl.className = "ecran-attente-sig-stries";
        for (var i = 0; i < 4; i++) {
          var strie = document.createElement("div");
          strie.className = "sig-strie s" + (i + 1);
          var comet = document.createElement("span");
          comet.className = "sig-comet";
          strie.appendChild(comet);
          eaStriesEl.appendChild(strie);
        }

        // Mascotte Streamy + anneaux orbitaux (swap loading→offline en pause).
        eaStreamyWrap = document.createElement("div");
        eaStreamyWrap.className = "ecran-attente-sig-streamy";
        var orbite = document.createElement("div");
        orbite.className = "sig-orbite";
        eaStreamyImg = document.createElement("img");
        eaStreamyImg.className = "sig-mascotte";
        eaStreamyImg.alt = "";
        eaStreamyImg.src = "/brand/streamy-loading.png";
        eaStreamyWrap.appendChild(orbite);
        eaStreamyWrap.appendChild(eaStreamyImg);

        // Wordmark StreamOS électrique (fond noir neutralisé par screen).
        eaWordmarkEl = document.createElement("img");
        eaWordmarkEl.className = "ecran-attente-sig-wordmark";
        eaWordmarkEl.alt = "StreamOS";
        eaWordmarkEl.src = "/brand/wordmark.png";

        // Ligne morse ···−−−··· (3 points, 3 traits, 3 points).
        eaMorseEl = document.createElement("div");
        eaMorseEl.className = "ecran-attente-sig-morse";
        var morseKinds = ["p", "p", "p", "t", "t", "t", "p", "p", "p"];
        for (var mi = 0; mi < morseKinds.length; mi++) {
          var seg = document.createElement("i");
          seg.className = morseKinds[mi];
          eaMorseEl.appendChild(seg);
        }

        // Ordre de couche : fond → média (inséré avant le voile) → voile →
        // stries → streamy → wordmark → morse → titre → minuteur (le plus
        // haut dans l'overlay). Les éléments signature sont display:none
        // en layout minimal.
        eaRoot.appendChild(eaFondEl);
        eaRoot.appendChild(eaVoileEl);
        eaRoot.appendChild(eaStriesEl);
        eaRoot.appendChild(eaStreamyWrap);
        eaRoot.appendChild(eaWordmarkEl);
        eaRoot.appendChild(eaMorseEl);
        eaRoot.appendChild(eaTitreEl);
        eaRoot.appendChild(eaMinuteurEl);
        stageEl.appendChild(eaRoot);
      }

      /// Teinte le fond + le titre aux couleurs du cadre widget de la scène
      /// (même résolution que le bandeau : couleur/couleurFin unifiées,
      /// fallback neutre).
      function eaAppliquerCouleurs() {
        if (!eaRoot) return;
        var col = bpmResoudreCouleurs();
        eaRoot.style.setProperty("--ea-prim", col.p);
        eaRoot.style.setProperty("--ea-sec", col.s);
        eaRoot.style.setProperty("--ea-rgb-prim", bpmHexVersRgb(col.p));
        eaRoot.style.setProperty("--ea-rgb-sec", bpmHexVersRgb(col.s));
      }

      /// Formate des secondes → "M:SS" ou "H:MM:SS" (comme l'ancienne app).
      function eaFormatTemps(total) {
        var t = Math.max(0, Math.floor(total || 0));
        var h = Math.floor(t / 3600);
        var m = Math.floor((t % 3600) / 60);
        var s = t % 60;
        if (h > 0) {
          return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
        }
        return m + ":" + String(s).padStart(2, "0");
      }

      /// Construit/remplace l'élément média plein écran (img ou vidéo cover,
      /// vidéo en boucle). src = "/" + rel — même mécanique que playPad.
      function eaSetMedia(media, kind) {
        if (eaMediaEl) {
          if (eaMediaEl.tagName === "VIDEO") {
            eaMediaEl.pause();
            eaMediaEl.removeAttribute("src");
            eaMediaEl.load();
          }
          eaMediaEl.remove();
          eaMediaEl = null;
        }
        if (!media) {
          eaFondEl.style.display = "";
          return;
        }
        var el;
        if (kind === "video") {
          el = document.createElement("video");
          el.autoplay = true;
          el.loop = true; // la vidéo boucle tant que l'écran est actif
          el.setAttribute("playsinline", "");
        } else {
          el = document.createElement("img");
          el.alt = "";
        }
        el.className = "ecran-attente-media";
        el.src = "/" + media;
        eaMediaEl = el;
        // Entre le fond dégradé et le voile de lisibilité.
        eaRoot.insertBefore(el, eaVoileEl);
        eaFondEl.style.display = "none"; // média présent → dégradé masqué
      }

      /// Met à jour l'overlay depuis une frame ecran-attente-etat (tick
      /// 1 Hz Rust + transitions + resync). Auto-réparatrice : applique
      /// l'état complet à chaque appel.
      function majEcranAttente(etat) {
        if (!eaRoot) return;
        etat = etat || {};
        if (!etat.actif) {
          eaCacher();
          return;
        }

        // Média : reconstruit UNIQUEMENT si media|kind change — sinon la
        // vidéo se rechargerait à chaque tick (scintillement + re-buffer).
        var media = etat.media || null;
        var kind = etat.media_kind || null;
        var sig = (media || "") + "|" + (kind || "");
        if (sig !== eaMediaSig) {
          eaMediaSig = sig;
          eaSetMedia(media, kind);
        }

        // Layout : "signature" = marque StreamOS (défaut) ; "minimal" =
        // rendu historique (dégradé + titre + minuteur seuls). La classe
        // affiche/masque tout le bloc — live à chaque frame.
        var isSignature = etat.layout !== "minimal";
        eaRoot.classList.toggle("layout-signature", isSignature);

        // Son : porté par la vidéo (muted = !son) — appliqué à chaque frame
        // pour que les réglages son/volume soient live pendant l'attente.
        if (eaMediaEl && eaMediaEl.tagName === "VIDEO") {
          eaMediaEl.muted = !etat.son || PREVIEW;
          eaMediaEl.volume = Math.max(
            0,
            Math.min(1, typeof etat.volume === "number" ? etat.volume : 0.5)
          );
        }

        // Titre : dégradé aux couleurs du cadre (--ea-prim/--ea-sec).
        if (etat.afficher_titre && etat.titre) {
          eaTitreEl.textContent = etat.titre;
          eaTitreEl.style.display = "";
        } else {
          eaTitreEl.style.display = "none";
        }

        // Minuteur : label + temps (Rust = source de vérité, jamais de
        // décompte local — la diffusion reflète juste l'état reçu).
        var enPause = !!etat.en_pause;
        eaMinuteurEl.classList.toggle("en-pause", enPause);
        eaLabelEl.textContent = enPause ? "En pause" : "Début dans";
        eaTempsEl.textContent = eaFormatTemps(etat.temps_restant);

        // Swap mascotte : Streamy endormie quand le chrono est en pause.
        if (eaStreamyImg) {
          var streamySrc = enPause
            ? "/brand/streamy-offline.png"
            : "/brand/streamy-loading.png";
          if (eaStreamyImg.getAttribute("src") !== streamySrc) {
            eaStreamyImg.src = streamySrc;
          }
        }

        // Position + échelle de la carte minuteur (config live — le
        // drag/resize de la modale commit pendant que l'écran est actif →
        // déplacement en direct sur la diffusion). left/top = CENTRE de la
        // carte ; l'échelle passe par le transform (transform-origin centre).
        var mx = typeof etat.minuteur_x === "number" ? etat.minuteur_x : 960;
        var my = typeof etat.minuteur_y === "number" ? etat.minuteur_y : 540;
        var mec =
          typeof etat.minuteur_echelle === "number" ? etat.minuteur_echelle : 1;
        mec = Math.max(0.4, Math.min(3, mec));
        eaMinuteurEl.style.left = mx + "px";
        eaMinuteurEl.style.top = my + "px";
        eaMinuteurEl.style.transform =
          "translate(-50%, -50%) scale(" + mec + ")";

        // Position + échelle de Streamy et du wordmark (même mécanique que
        // le minuteur : left/top = centre, transform scale ; live à chaque
        // frame — le drag/resize de la modale se voit en direct).
        var stx = typeof etat.streamy_x === "number" ? etat.streamy_x : 170;
        var sty = typeof etat.streamy_y === "number" ? etat.streamy_y : 180;
        var ste =
          typeof etat.streamy_echelle === "number" ? etat.streamy_echelle : 0.6;
        ste = Math.max(0.3, Math.min(2, ste));
        eaStreamyWrap.style.left = stx + "px";
        eaStreamyWrap.style.top = sty + "px";
        eaStreamyWrap.style.transform =
          "translate(-50%, -50%) scale(" + ste + ")";

        var lx = typeof etat.logo_x === "number" ? etat.logo_x : 960;
        var ly = typeof etat.logo_y === "number" ? etat.logo_y : 140;
        var le =
          typeof etat.logo_echelle === "number" ? etat.logo_echelle : 1;
        le = Math.max(0.3, Math.min(2, le));
        eaWordmarkEl.style.left = lx + "px";
        eaWordmarkEl.style.top = ly + "px";
        eaWordmarkEl.style.transform =
          "translate(-50%, -50%) scale(" + le + ")";

        // Affichage + cadre SVG sur la carte minuteur (mesure après display).
        if (!eaVisible) {
          eaVisible = true;
          eaRoot.style.display = "block";
          void eaRoot.offsetWidth;
          eaRoot.classList.add("visible");
          eaAppliquerCouleurs();
          requestAnimationFrame(function () {
            appliquerCadreOverlay(eaMinuteurEl, "ecran-attente");
          });
        }
      }

      /// Cache l'overlay + stoppe le média (stop manuel ou fin de chrono —
      /// Rust émet la frame actif:false dans les deux cas).
      function eaCacher() {
        if (!eaRoot || !eaVisible) return;
        if (eaMediaEl && eaMediaEl.tagName === "VIDEO") {
          eaMediaEl.pause();
        }
        eaRoot.classList.remove("visible");
        eaVisible = false;
        nettoyerCadreOverlay(eaMinuteurEl, "ecran-attente");
        // Attendre la fin du fade-out avant de retirer le média du DOM.
        setTimeout(function () {
          if (!eaVisible && eaRoot) {
            eaRoot.style.display = "none";
            eaSetMedia(null, null);
            eaMediaSig = "";
          }
        }, 500);
      }

      // Initialiser l'overlay écran d'attente dès le démarrage.
      initEcranAttenteOverlay();
      connect();
    </script>
  </body>
</html>
