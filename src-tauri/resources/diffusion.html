<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamOS — Diffusion</title>
    <style>
      :root {
        --fond: #0a0a0a;
        --texte: #e0e0e0;
        --canvas-w: 1920px;
        --canvas-h: 1080px;
        /* Variables UI partagées avec le dashboard (app.css) — pour le rendu
           identique du widget speedrun côté diffusion. */
        --gris: #9a9a9a;
        --gris-fonce: #1c1c1c;
        --bordure: #3d3d3d;
        --rayon-petit: 5px;
        --rayon: 8px;
        --rayon-grand: 14px;
        --message-user-action-color: #e0a060;
        --message-ok-color: #22c55e;
        --message-error-color: #c0392b;
      }
      /* Polices Google Font (woff2, subset latin) pour les titres de widgets.
         Servies par :4321 sur /fonts/{name} (même origine que la diffusion). */
      @font-face { font-family: 'Anton'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Anton.woff2) format('woff2'); }
      @font-face { font-family: 'Audiowide'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Audiowide.woff2) format('woff2'); }
      @font-face { font-family: 'BebasNeue'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/BebasNeue.woff2) format('woff2'); }
      @font-face { font-family: 'BlackOpsOne'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/BlackOpsOne.woff2) format('woff2'); }
      @font-face { font-family: 'Bungee'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Bungee.woff2) format('woff2'); }
      @font-face { font-family: 'Caveat'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Caveat.woff2) format('woff2'); }
      @font-face { font-family: 'Creepster'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Creepster.woff2) format('woff2'); }
      @font-face { font-family: 'Fredoka'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Fredoka.woff2) format('woff2'); }
      @font-face { font-family: 'Lobster'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Lobster.woff2) format('woff2'); }
      @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Montserrat.woff2) format('woff2'); }
      @font-face { font-family: 'Orbitron'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Orbitron.woff2) format('woff2'); }
      @font-face { font-family: 'Oswald'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Oswald.woff2) format('woff2'); }
      @font-face { font-family: 'Pacifico'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Pacifico.woff2) format('woff2'); }
      @font-face { font-family: 'PermanentMarker'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/PermanentMarker.woff2) format('woff2'); }
      @font-face { font-family: 'PressStart2P'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/PressStart2P.woff2) format('woff2'); }
      @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Rajdhani.woff2) format('woff2'); }
      @font-face { font-family: 'Righteous'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Righteous.woff2) format('woff2'); }
      @font-face { font-family: 'RussoOne'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/RussoOne.woff2) format('woff2'); }
      @font-face { font-family: 'Satisfy'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Satisfy.woff2) format('woff2'); }
      @font-face { font-family: 'Teko'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Teko.woff2) format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: var(--canvas-w);
        height: var(--canvas-h);
        background: transparent;
        color: var(--texte);
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: var(--canvas-w);
        height: var(--canvas-h);
      }
      #voile-noir {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        z-index: 9999;
        transition: opacity 300ms ease;
      }
      .widget-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .widget {
        position: absolute;
        background: rgba(224, 224, 224, 0.15);
        border: 1px solid rgba(224, 224, 224, 0.6);
        transform-origin: center center;
        overflow: hidden;
      }
      /* Widget média morphé : canvas warpé (fill le widget) + source cachée
         (1px, opacity 0 — hors flux mais "rendue" pour que la vidéo décode). */
      .morph-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .morph-src {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      /* Widget trou : transparent (le trou est dans le canvas de fond via
         destination-out). Seul le cadre SVG est visible au-dessus du trou. */
      .widget.trou {
        background: transparent;
        border: none;
      }
      /* Widgets sansCadre (drop bibliothèque) : aucun contour 1px ni voile
         de fond rgba — le média seul est visible (le cadre SVG de scène est
         déjà exclu par applyCadreWidget). */
      .widget.sans-cadre {
        background: transparent;
        border: none;
      }
      .widget img {
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;
        transform-origin: center center;
      }
      .widget video {
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;
        transform-origin: center center;
      }
      /* Média de fond des widgets à contenu (chat / input-viewer / speedrun) :
         premier enfant du widget, absolute z-index 0 → le contenu peint
         par-dessus (voir .chat-body / .widget.inputviewer > * / .widget.speedrun > *).
         Les règles globales .widget img/video donnent déjà 100%/object-fit. */
      .media-fond {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      /* Carrousel d'images (mediaSlides) : pile d'imgs superposées dans le
         widget, fondu enchaîné par transition d'opacité. La règle globale
         .widget img donne déjà 100%/object-fit — fit/transform/filter posés
         inline par applyMediaStyle sur chaque slide. */
      .widget .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
      }
      .widget .slide.visible {
        opacity: 1;
      }
      /* Overlay cadre SVG widget : position absolute, inset 0, au-dessus du
         média, pointer-events:none pour ne pas bloquer. */
      .cadre-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
      /* Titre du widget (au-dessus ou en dessous) — hors .widget (non clippé
         par le cadre SVG). Positionné dans .widget-wrap (couvre toute la
         scène). Gradient de texte reprenant les couleurs du cadre actif. */
      .widget-titre {
        position: absolute;
        white-space: nowrap;
        pointer-events: none;
        z-index: 10;
        line-height: 1.1;
        font-weight: 400;
        text-align: center;
        /* Contour des lettres (couleur + épaisseur réglables) : inline via
           applyTitreWidget. paint-order:stroke sous le gradient (dashboard
           parité — sinon le contour mange les glyphes). */
        paint-order: stroke fill;
      }
      /* Titres du fond de l'application (haut/bas/gauche/droite) — hors #bg
         (non clippés). Positionnés sur #stage (couvre tout le canvas).
         Au-dessus du fond (z-index 1), sous les widgets. Gauche/droite =
         texte vertical (writing-mode, inline via applyTitreFond). Gradient
         de texte reprenant les couleurs du cadre unifié (cadreWidget).
         paint-order:stroke sous le gradient. */
      .bg-titre {
        position: absolute;
        white-space: nowrap;
        pointer-events: none;
        z-index: 1;
        line-height: 1.1;
        font-weight: 400;
        text-align: center;
        /* Contour des lettres (couleur + épaisseur réglables) : inline via
           applyTitreFond. paint-order:stroke sous le gradient. */
        paint-order: stroke fill;
      }
      /* Overlay cadre unifié — bord extérieur du canvas, au-dessus des
         widgets. Même CadreConfig (cadreWidget) que les widgets. */
      #cadre-app-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 100;
      }
      #bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }
      /* Overlay équaliseur (module scene.modules.equaliseur) — couche
         dédiée SOUS les widgets : z-index 0 comme #bg mais placée juste
         après lui dans le DOM → peinte au-dessus du fond, sous tous les
         widgets (z ≥ 0, insérés après dans #stage) et sous .bg-titre (z 1).
         Canvas plein stage, pointer-events:none, translucide — le fond de
         l'application reste visible à travers les barres/bulles. */
      #eq-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
        display: none;
      }
      #eq-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* Canvas qui affiche le fond avec les trous (destination-out).
         L'img/video source est display:none, sert uniquement de source
         pour drawImage. */
      #bg-canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }
      #bg img, #bg video {
        display: none;
      }
      /* Widget chat — style ASH (classique, ancienne app Rust).
         Coins carrés, zébrage odd/even, avatar rond, badges emoji,
         pseudo coloré (tag IRCv3 color ou fallback HSL depuis le hash),
         séparateur « : », emojis visibles.
         Fond + messages en glass glow : backdrop-filter blur + bg
         semi-transparent + glow reprenant la couleur du cadre SVG. */
      .widget.chat {
        background: rgba(10, 10, 10, 0.35);
        backdrop-filter: blur(10px) saturate(140%);
        -webkit-backdrop-filter: blur(10px) saturate(140%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18), 0 0 18px rgba(255, 255, 255, 0.08);
        overflow: hidden;
        /* Colonne : barre viewers (flex-shrink 0) + chat-body (flex 1). */
        display: flex;
        flex-direction: column;
      }
      /* Barre viewers en tête du widget chat : œil + une pastille
         (logo plateforme + count) par plateforme live. Cachée tant qu'aucun
         count n'est connu (:empty → display:none, layout identique à avant). */
      .chat-viewers {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.8em;
        padding: 0.3em 0.6em;
        flex-shrink: 0;
        position: relative;
        z-index: 1; /* au-dessus du média de fond (.media-fond z-index 0) */
        color: #fff;
        font-weight: 700;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        font-family: system-ui, "Segoe UI Emoji", "Apple Color Emoji",
          "Noto Color Emoji", sans-serif;
      }
      .chat-viewers:empty { display: none; }
      .chat-viewers .vplat { display: inline-flex; align-items: center; gap: 0.25em; }
      .chat-viewers .veye { opacity: 0.8; }
      .chat-viewers .logo { width: 1em; height: 1em; opacity: 0.85; }
      .chat-viewers .plat-badge {
        font-size: 0.55em;
        font-weight: 700;
        padding: 0 0.2rem;
        border-radius: 0.15rem;
        color: #fff;
        line-height: 1.4;
      }
      .chat-viewers .plat-badge.twitch { background: #9146ff; }
      .chat-viewers .plat-badge.kick { background: #53fc18; color: #000; }
      .chat-viewers .plat-badge.youtube { background: #ff0000; }
      .chat-viewers .plat-badge.tiktok { background: #000; }
      /* Ligne « musique en cours » sous la barre viewers : phrase défilante
         (marquee) remplie par musique-play, vidée par musique-stop. Élément
         SÉPARÉ de .chat-viewers car celle-ci est cachée en mode bulles —
         la ligne doit rester visible dans les deux styles de chat. */
      .chat-musique {
        display: flex;
        align-items: center;
        overflow: hidden;
        white-space: nowrap;
        padding: 0.22em 0.6em;
        flex-shrink: 0;
        position: relative;
        z-index: 1; /* au-dessus du média de fond */
        color: #fff;
        font-weight: 600;
        opacity: 0.92;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        font-family: system-ui, "Segoe UI Emoji", "Apple Color Emoji",
          "Noto Color Emoji", sans-serif;
      }
      .chat-musique:empty { display: none; }
      /* Piste défilante : deux copies identiques du texte → translateX
         0 → -50% boucle sans saut. Durée inline (proportionnelle au titre). */
      .musique-defile {
        display: inline-flex;
        animation: musiqueDefil 12s linear infinite;
      }
      .musique-defile > span { padding-right: 3em; }
      @keyframes musiqueDefil {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      .chat-body {
        width: 100%;
        /* flex:1 au lieu de height:100% — la barre viewers prend sa place
           au-dessus sans faire déborder le widget. */
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 4px;
        padding-top: 5%;
        display: flex;
        flex-direction: column;
        gap: 0;
        /* Au-dessus du média de fond (.media-fond z-index 0). */
        position: relative;
        z-index: 1;
        pointer-events: none;
        font-family: system-ui, "Segoe UI Emoji", "Apple Color Emoji",
          "Noto Color Emoji", sans-serif;
        /* Overlay OBS : scrollbar masquée — widget en lecture seule
           (pointer-events:none), une barre visible est du bruit. */
        scrollbar-width: none;
      }
      .chat-body::-webkit-scrollbar { display: none; }
      .chat-msg {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        padding: 4px 6px 4px 10px;
        word-wrap: break-word;
        overflow-wrap: anywhere;
        line-height: 1.4;
        /* Glass glow : fond glass transparent (rgba + backdrop blur, zébrage
           odd/even). La bordure gradient couleur cadre est appliquée en inline
           par fillChatBody (border-image) — le CEF d'OBS ne recalcule pas
           border-image quand une var() change dynamiquement. */
        border: 1px solid;
        border-radius: 0; /* carré */
        backdrop-filter: blur(6px) saturate(130%);
        -webkit-backdrop-filter: blur(6px) saturate(130%);
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.06);
        background: rgba(255, 255, 255, 0.07);
      }
      /* Zébrage : 1 message sur 2 en noir complet (alternance stricte). */
      .chat-msg:nth-child(even) {
        background: #000;
      }
      /* Taille en em (suit la taille de police du widget). width/height
         explicites OBLIGATOIRES : la règle globale `.widget img` étire les
         images à 100% (widgets média) et écraserait les attributs HTML. */
      .chat-msg .avatar {
        width: 1.8em;
        height: 1.8em;
        flex-shrink: 0;
        border-radius: 50%;
        object-fit: cover;
        margin-top: 2px;
        margin-left: 4px;
        /* Anneau couleur cadre appliqué en inline par fillChatBody
           (box-shadow ring qui suit le border-radius — border-image ne le suit pas). */
      }
      .chat-msg .chat-contenu {
        flex: 1;
        min-width: 0;
        word-wrap: break-word;
        overflow-wrap: anywhere;
      }
      /* Emote inline dans le texte (officielles Twitch + BTTV/7TV/FFZ).
         Même contrainte que .avatar : width/height explicites OBLIGATOIRES
         pour échapper à la règle globale `.widget img` (étire à 100%).
         Hauteur 1.5em = convention chat Twitch (~taille ligne). width:auto
         préserve le ratio des emotes larges. vertical-align aligne sur le
         texte (emote centrée sur la ligne). */
      .chat-msg .emote {
        /* inline-block OBLIGATOIRE : la règle globale `.widget img` impose
           display:block, qui casse le flux en ligne dans .texte et empile
           les emotes en colonne. */
        display: inline-block;
        width: auto;
        height: 1.5em;
        vertical-align: middle;
        margin: -0.1em 0.1em;
      }
      .chat-msg .badge {
        margin-right: 2px;
        font-size: 0.9em;
        vertical-align: middle;
      }
      .chat-msg .logo {
        flex-shrink: 0;
        align-self: center;
        opacity: 0.85;
        margin-right: 2px;
        vertical-align: middle;
      }
      .chat-msg .plat-badge {
        flex-shrink: 0;
        align-self: center;
        font-size: 0.55em;
        font-weight: 700;
        padding: 0 0.2rem;
        border-radius: 0.15rem;
        color: #fff;
        line-height: 1.4;
        margin-right: 0.1rem;
        vertical-align: middle;
      }
      .chat-msg .plat-badge.twitch { background: #9146ff; }
      .chat-msg .plat-badge.kick { background: #53fc18; color: #000; }
      .chat-msg .plat-badge.youtube { background: #ff0000; }
      .chat-msg .plat-badge.tiktok { background: #000; }
      .chat-msg .pseudo {
        font-weight: 700;
        margin-right: 2px;
      }
      .chat-msg .separateur {
        margin-right: 2px;
        opacity: 0.7;
      }
      .chat-msg .texte {
        word-wrap: break-word;
        overflow-wrap: anywhere;
      }

      /* Mode « bulles » (widget.chatStyle) : le WIDGET disparaît — on ne
         voit plus que les messages, détachés et plus gros (capture de
         référence). Concrètement :
         - fond glass / backdrop / box-shadow / clip-path du widget neutralisés
         - .cadre-overlay niveau widget masqué (le cadre SVG vit sur chaque
           bulle, pas autour du widget) — le clip-path du widget rognerait
           sinon les ornements des bulles au bord (inline → !important requis)
         - barre viewers masquée : chrome du widget, pas un message
         - padding du chat-body élargi : marge pour les ornements SVG qui
           débordent de la bulle (margin ~ep*2.5) sans être rognés par
           overflow:hidden du widget
         - .chat-msg en 1.3em : tout ce qui est en em suit (avatar, emotes,
           plat-badges) — zébrage off (carte autonome, fond uniforme),
           position:relative pour l'overlay .cadre-overlay par message. */
      .widget.chat.chat-bulles {
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        box-shadow: none;
        border: none !important;
        clip-path: none !important;
        -webkit-clip-path: none !important;
      }
      .widget.chat.chat-bulles > .cadre-overlay { display: none; }
      .widget.chat.chat-bulles .chat-viewers { display: none; }
      .widget.chat.chat-bulles .chat-body { gap: 0.6em; padding: 1.4em; }
      .widget.chat.chat-bulles .chat-msg {
        position: relative;
        font-size: 1.3em;
        padding: 6px 10px 6px 12px;
      }
      .widget.chat.chat-bulles .chat-msg:nth-child(even) {
        background: rgba(255, 255, 255, 0.07);
      }

      /* Widget clip de bienvenue : CARTE verticale (portrait, type téléphone) —
         avatar rond centré en haut, pseudo + CTA + bio en dessous, puis <video>
         16:9 qui streame le clip depuis le CDN signé. La carte occupe le rect
         x/y/largeur/hauteur de la config. Toutes les tailles en cqw (container
         query width) → responsive au resize depuis le dashboard. */
      .widget.welcome-clip {
        width: 100%;
        height: auto;
        box-sizing: border-box;
        background: rgba(10, 10, 10, 0.92);
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8cqw;
        padding: 1.5cqw;
        color: var(--texte);
        font-family: system-ui, "Segoe UI Emoji", "Apple Color Emoji",
          "Noto Color Emoji", sans-serif;
        container-type: inline-size;
        container-name: wc;
      }
      .welcome-clip-entete {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5cqw;
        width: 100%;
        flex-shrink: 0;
        pointer-events: none;
      }
      .welcome-clip-avatar {
        width: 16cqw;
        height: 16cqw;
        max-width: 72px;
        max-height: 72px;
        min-width: 28px;
        min-height: 28px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        border: 2px solid rgba(255, 255, 255, 0.35);
      }
      .welcome-clip-pseudo {
        font-weight: 700;
        font-size: clamp(0.65rem, 3.5cqw, 1.1rem);
        line-height: 1.2;
        text-align: center;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .welcome-clip-cta {
        font-size: clamp(0.5rem, 2.2cqw, 0.72rem);
        opacity: 0.6;
        font-style: italic;
        line-height: 1.1;
        text-align: center;
      }
      .welcome-clip-bio {
        font-size: clamp(0.55rem, 2.5cqw, 0.82rem);
        opacity: 0.85;
        line-height: 1.3;
        text-align: center;
        max-width: 92%;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow-wrap: break-word;
      }
      .welcome-clip-video-wrap {
        width: 100%;
        flex-shrink: 0;
        position: relative;
        border-radius: 6px;
        overflow: hidden;
        background: #000;
        /* 16:9 strict : aspect-ratio garantit le format quelle que soit la
           hauteur de la colonne (le clip n'est jamais étiré en hauteur). */
        aspect-ratio: 16 / 9;
        height: auto;
      }
      .welcome-clip-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        border-radius: 6px;
      }

      /* Mode « spotlight » (welcome : utiliser_squelette décoché) : voile noir
         opaque plein écran + carte centrée à 85 % du canvas en split
         avatar/bio à gauche / clip à droite. Intro de 3 s : l'avatar occupe
         toute la carte seul, puis transition (600 ms) vers le split. */
      .welcome-clip-voile {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
        transition: opacity 350ms ease;
        pointer-events: none;
      }
      .welcome-clip-voile.visible { opacity: 1; }
      /* Message de bienvenue (msg.message) — rendu en spotlight seulement ;
         la carte squelette garde son rendu historique. */
      .welcome-clip-message { display: none; }
      .welcome-clip-root.spot {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 85%;
      }
      .welcome-clip-root.spot .widget.welcome-clip {
        flex-direction: row;
        align-items: center;
        gap: 2.5cqw;
        padding: 3cqw;
        background: transparent;
      }
      .welcome-clip-root.spot .welcome-clip-entete {
        flex: 0 0 42%;
        gap: 1.2cqw;
        transition: flex-basis 600ms ease;
      }
      .welcome-clip-root.spot .welcome-clip-avatar {
        width: 22cqw;
        height: 22cqw;
        max-width: none;
        max-height: none;
        transition:
          width 600ms ease,
          height 600ms ease;
      }
      .welcome-clip-root.spot .welcome-clip-pseudo {
        font-size: clamp(1rem, 3cqw, 2.2rem);
      }
      .welcome-clip-root.spot .welcome-clip-message {
        display: block;
        font-size: clamp(0.8rem, 2.2cqw, 1.4rem);
        font-style: italic;
        opacity: 0.9;
        text-align: center;
        max-width: 100%;
        overflow-wrap: break-word;
      }
      .welcome-clip-root.spot .welcome-clip-cta {
        font-size: clamp(0.7rem, 1.6cqw, 1rem);
      }
      .welcome-clip-root.spot .welcome-clip-bio {
        font-size: clamp(0.8rem, 1.8cqw, 1.2rem);
        -webkit-line-clamp: 4;
        line-clamp: 4;
      }
      .welcome-clip-root.spot .welcome-clip-video-wrap {
        /* Colonne droite : le clip seul, 16:9, centré verticalement —
           rien en dessous. Sa hauteur découle de sa largeur (aspect-ratio),
           jamais de la hauteur de la carte. */
        width: 100%;
      }
      /* Colonne droite (titre + clip). En squelette : simple wrapper pleine
         largeur (le titre reste masqué). En spotlight : moitié droite,
         titre « Streamer Twitch » au-dessus du clip. */
      .welcome-clip-droite {
        display: flex;
        flex-direction: column;
        width: 100%;
        flex-shrink: 0;
      }
      .welcome-clip-root.spot .welcome-clip-droite {
        flex: 1;
        width: auto;
        align-self: center;
        align-items: center;
        gap: 1.4cqw;
      }
      .welcome-clip-plateforme { display: none; }
      .welcome-clip-root.spot .welcome-clip-plateforme {
        display: block;
        font-weight: 800;
        font-size: clamp(0.9rem, 2.6cqw, 1.7rem);
        letter-spacing: 0.38em;
        text-indent: 0.38em; /* compense le letter-spacing pour le centrage */
        text-transform: uppercase;
        background: linear-gradient(90deg, #c9a2ff, #9146ff 55%, #e0bfff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 14px rgba(145, 70, 255, 0.55));
      }
      .welcome-clip-root.spot .welcome-clip-plateforme::after {
        content: "";
        display: block;
        height: 2px;
        margin-top: 0.6cqw;
        background: linear-gradient(90deg, transparent, #9146ff, transparent);
      }
      /* Streamers mis en avant par le viewer (étagère favoris de sa page
         d'accueil Twitch) — sous la bio, côté gauche, spotlight uniquement. */
      .welcome-clip-favoris { display: none; }
      .welcome-clip-root.spot .welcome-clip-favoris {
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.2cqw;
        max-width: 100%;
      }
      .welcome-clip-favori {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4cqw;
        position: relative;
      }
      .welcome-clip-favori img {
        width: 4.5cqw;
        height: 4.5cqw;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(255, 255, 255, 0.35);
      }
      .welcome-clip-favori .fav-live {
        position: absolute;
        top: 0;
        right: 0;
        width: 1.1cqw;
        height: 1.1cqw;
        min-width: 8px;
        min-height: 8px;
        border-radius: 50%;
        background: #2ecc40;
        border: 2px solid #000;
      }
      .welcome-clip-favori .fav-nom {
        font-size: clamp(0.55rem, 1.4cqw, 0.9rem);
        opacity: 0.85;
        max-width: 9cqw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: center;
      }
      /* Intro spotlight : l'avatar seul occupe toute la carte — textes
         masqués (ils apparaissent au split), clip caché via display JS. */
      .welcome-clip-root.spot.intro .welcome-clip-entete { flex-basis: 100%; }
      .welcome-clip-root.spot.intro .welcome-clip-avatar {
        width: 44cqw;
        height: 44cqw;
      }
      .welcome-clip-root.spot.intro .welcome-clip-pseudo,
      .welcome-clip-root.spot.intro .welcome-clip-cta,
      .welcome-clip-root.spot.intro .welcome-clip-message,
      .welcome-clip-root.spot.intro .welcome-clip-bio,
      .welcome-clip-root.spot.intro .welcome-clip-favoris {
        display: none !important;
      }

      /* ===== Input Viewer (clavier + souris) — glass sombre + keycaps verre 3D
         Widget de scène : keycaps qui s'allument quand pressées (mode
         clavier) ou visuel de souris (boutons + position). Tailles en cqw
         (container query) → responsive au resize du widget. Maj DOM directe
         par classe (pas de re-render) — non énergivore.
         Refonte 2026-09-14 : fond glass flouté (backdrop-filter), keycaps en
         relief verre 3D (gradient + reflet ::before + ombres internes/externes),
         état pressé = couleur choisie + glow. */
      .widget.inputviewer {
        background: rgba(12, 14, 22, 0.55);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        backdrop-filter: blur(14px) saturate(140%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.2cqw;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.08);
        container-type: inline-size;
        display: flex;
        flex-direction: column;
      }
      /* Contenu input-viewer au-dessus du média de fond (.media-fond z 0).
         :not(.cadre-overlay) OBLIGATOIRE — l'overlay du cadre SVG est un
         enfant direct du widget et doit garder son position:absolute
         z-index 5 (.cadre-overlay, spécificité plus faible que ce sélecteur
         → sans l'exclusion, le cadre disparaissait). */
      .widget.inputviewer > *:not(.media-fond):not(.cadre-overlay) {
        position: relative;
        z-index: 1;
      }
      /* ===== Widget speedrun — rendu identique au dashboard (WidgetSpeedrun) =====
         Pas de glass/blur, couleurs via variables CSS partagées (--texte, --gris,
         --gris-fonce, --message-ok-color, --message-user-action-color, --rayon-petit).
         Base font-size héritée (16px, comme le dashboard) — les unités em
         reproduisent les mêmes tailles que le dashboard, indépendamment de la
         taille du widget. */
      .widget.speedrun {
        display: flex;
        flex-direction: column;
        gap: 6px;
        /* Marge verticale de sécurité : le cadre SVG (overlay z-index 5) peut
           manger le haut/bas du contenu selon son épaisseur/inclinaison. En em
           → suit srTaillePolice (font-size posée sur le widget). */
        padding: 0.8em 10px;
        font-family: "Rajdhani", "Segoe UI", sans-serif;
        color: var(--texte);
        overflow: hidden;
        height: 100%;
        box-sizing: border-box;
      }
      /* Contenu speedrun au-dessus du média de fond (.media-fond z 0).
         :not(.cadre-overlay) — voir règle input-viewer ci-dessus. */
      .widget.speedrun > *:not(.media-fond):not(.cadre-overlay) {
        position: relative;
        z-index: 1;
      }
      /* En-tête : titre du jeu centré en haut, catégorie juste en dessous,
         pastille de statut garée en coin (absolute) — comme le dashboard. */
      .sr-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        /* Ancre pour la pastille de statut (garée en coin, hors flux). */
        position: relative;
      }
      .sr-titre-jeu {
        font-size: 0.75em;
        font-weight: 600;
        color: var(--texte);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: center;
        /* En colonne centrée l'item shrink-wrappe son contenu : max-width
           pour que les titres longs ellipsent au lieu de déborder. */
        max-width: 100%;
        /* Ombre de lisibilité : titre clair sur fond sombre → ombre noire. */
        text-shadow: 0 1px 2px #000, 0 0 1px #000;
      }
      /* Catégorie sur sa propre ligne (comme le dashboard), un peu plus
         petite que le titre. */
      .sr-cat {
        color: var(--gris);
        font-weight: 400;
        font-size: 0.7em;
      }
      .sr-placeholder {
        color: var(--gris);
        font-style: italic;
        font-weight: 400;
      }
      .sr-status {
        /* Garée en coin haut-droit du header — hors du flux centré. */
        position: absolute;
        top: 0;
        right: 0;
        font-size: 0.7em;
        flex-shrink: 0;
      }
      .sr-status.ok { color: var(--message-ok-color); }
      .sr-status.attente { color: var(--message-user-action-color); }
      /* Timer : couleur pleine du cadre + ombre de contraste simple
         (--sr-ombre : noir ou blanc selon la luminance du cadre). Une seule
         couche — lisible sur tout fond. */
      .sr-timer {
        text-align: center;
        /* Marges L/R : inset face aux cadres épais. Fond « glace » teinté de
           la couleur du cadre (comme le glass des messages chat). */
        margin: 0 0.8em;
        padding: 0.15em 0.5em;
        background: color-mix(in srgb, var(--sr-grad-from, #e0e0e0) 15%, transparent);
        backdrop-filter: blur(8px);
        border-radius: var(--rayon-petit);
      }
      .sr-timer .sr-timer-valeur {
        font-size: 1.9em;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        line-height: 1;
        color: var(--sr-grad-from, #e0e0e0);
        text-shadow: 0 2px 4px var(--sr-ombre, #000);
      }
      .sr-timer.sr-running .sr-timer-valeur {
        filter: drop-shadow(0 0 0.4em color-mix(in srgb, var(--sr-grad-from, #e0e0e0) 40%, transparent));
      }
      .sr-timer.sr-ended .sr-timer-valeur {
        filter: drop-shadow(0 0 0.5em color-mix(in srgb, var(--sr-grad-from, #e0e0e0) 50%, transparent));
      }
      /* Phase pill + compteur */
      .sr-meta {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5em;
      }
      .sr-phase-pill {
        font-size: 0.65em;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 0.06em 0.5em;
        border-radius: 999px;
        color: var(--gris);
        background: color-mix(in srgb, var(--gris) 15%, transparent);
      }
      .sr-phase-pill.sr-running { color: var(--message-ok-color); background: color-mix(in srgb, var(--message-ok-color) 15%, transparent); }
      .sr-phase-pill.sr-paused { color: var(--message-user-action-color); background: color-mix(in srgb, var(--message-user-action-color) 15%, transparent); }
      .sr-phase-pill.sr-ended { color: var(--message-ok-color); background: color-mix(in srgb, var(--message-ok-color) 20%, transparent); }
      .sr-compteur {
        font-size: 0.7em;
        color: var(--gris);
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 2px #000;
      }
      /* Barre de progression */
      .sr-barre {
        height: 0.2em;
        border-radius: 999px;
        background: color-mix(in srgb, var(--gris) 20%, transparent);
        overflow: hidden;
      }
      .sr-barre-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--sr-grad-from, #e0e0e0), var(--sr-grad-to, #9a9a9a));
        transition: width 0.3s ease;
      }
      /* Splits — rendu identique au dashboard : gradient border simple
         (padding-box/border-box), pas de glass/blur, pas d'alternance noir. */
      .sr-splits {
        display: flex;
        flex-direction: column;
        gap: 0.2em;
        overflow-y: auto;
        flex: 1;
        min-height: 0;
        padding-top: 0.25em;
        /* Scrollbar thin (comme le chat) — discrète sur fond sombre. */
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      }
      .sr-splits::-webkit-scrollbar { width: 5px; }
      .sr-splits::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 999px;
      }
      .sr-splits::-webkit-scrollbar-track { background: transparent; }
      .sr-seg {
        display: flex;
        align-items: center;
        gap: 0.4em;
        padding: 0.4em;
        font-size: 0.78em;
        border: 1px solid transparent;
        border-radius: var(--rayon-petit);
        /* BG gradient : on garde la couleur du user (variable) mais on remplace
           la couleur claire par du noir profond → dégradé couleur user → noir.
           Teinte assombrie (35% sur noir) pour les splits non actifs afin que
           l'actif ressorte. */
        background: linear-gradient(135deg, color-mix(in srgb, var(--sr-grad-from, #e0e0e0) 35%, #000), #000000);
        transition: background 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      }
      .sr-seg-actif {
        /* Split en cours : dégradé couleur user pleine → noir + cadre fluo
           lumineux de la couleur variable (glow externe + interne). */
        background: linear-gradient(135deg, var(--sr-grad-from, #e0e0e0), #000000);
        border-color: var(--sr-grad-from, #e0e0e0);
        box-shadow:
          0 0 0.6em 0.15em var(--sr-grad-from, #e0e0e0),
          inset 0 0 0.5em color-mix(in srgb, var(--sr-grad-from, #e0e0e0) 25%, transparent);
        color: var(--texte);
      }
      .sr-seg-done {
        color: var(--gris);
        opacity: 0.6;
      }
      .sr-seg-nom {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-shadow: 0 1px 2px #000, 0 0 1px #000;
      }
      /* Colonne delta (dernière colonne, "+/−" façon LiveSplit) : vert =
         temps gagné vs PB (avance cumulée de la run), rouge = temps perdu,
         gris = neutre. Largeur pour "-1234.5" (delta cumulé en secondes +
         dixième) — la case reste visible même vide (jamais display:none).
         Variables sémantiques — jamais d'hex en dur. */
      .sr-seg-pb {
        font-variant-numeric: tabular-nums;
        color: var(--gris);
        font-size: 0.9em;
        text-shadow: 0 1px 2px #000;
        min-width: 4.5em;
        text-align: right;
        flex-shrink: 0;
      }
      .sr-seg-pb.delta-ahead { color: var(--message-ok-color); }
      .sr-seg-pb.delta-behind { color: var(--message-error-color); }
      .sr-seg-pb.delta-ahead,
      .sr-seg-pb.delta-behind { font-weight: 700; }
      /* Bordure du split entier selon le résultat : verte si gagné, rouge si
         perdu. Déclaré après .sr-seg-actif (même spécificité) → l'emporte
         aussi sur le split en cours. */
      .sr-seg.sr-seg-ahead { border-color: var(--message-ok-color); }
      .sr-seg.sr-seg-behind { border-color: var(--message-error-color); }
      /* Temps de segment (colonne milieu) : durée figée (passé), vivante
         (actif) ou PB du segment (non atteint). Couleur du cadre (gradient).
         Largeur de colonne fixe — visible même vide, jamais display:none. */
      .sr-seg-time {
        font-variant-numeric: tabular-nums;
        color: var(--sr-grad-from, #e0e0e0);
        font-size: 0.9em;
        font-weight: 600;
        text-shadow: 0 1px 2px #000;
        min-width: 3.6em;
        text-align: right;
        flex-shrink: 0;
      }
      /* Split actif : temps en couleur cadre + glow doux (une seule couche
         lumineuse + ombre noire de lisibilité). */
      .sr-seg-actif .sr-seg-time {
        color: var(--sr-grad-from, #e0e0e0);
        font-weight: 700;
        text-shadow:
          0 0 0.4em var(--sr-grad-from, #e0e0e0),
          0 1px 2px #000;
      }
      /* ===== Mode ligne (srLayout "ligne", ou "auto" sous le seuil de
         hauteur — voir srEstLigne) =====
         Façon LiveSplit horizontal : splits en scroll horizontal à gauche
         (cellules empilées nom / delta+temps), timer épinglé à droite.
         Header, meta et barre de progression masqués. */
      .widget.speedrun.sr-ligne {
        flex-direction: row;
        align-items: center;
        gap: 0.4em;
        padding: 0.3em 0.5em;
      }
      .widget.speedrun.sr-ligne .sr-header,
      .widget.speedrun.sr-ligne .sr-meta,
      .widget.speedrun.sr-ligne .sr-barre {
        display: none;
      }
      .widget.speedrun.sr-ligne .sr-timer {
        margin: 0;
        flex-shrink: 0;
        order: 2;
      }
      .widget.speedrun.sr-ligne .sr-timer .sr-timer-valeur {
        font-size: 1.4em;
      }
      .widget.speedrun.sr-ligne .sr-splits {
        flex-direction: row;
        align-items: stretch;
        overflow-x: auto;
        overflow-y: hidden;
        flex: 1;
        min-width: 0;
        padding-top: 0;
      }
      .widget.speedrun.sr-ligne .sr-splits::-webkit-scrollbar {
        width: 0;
        height: 5px;
      }
      /* Cellule empilée : nom en haut (pleine largeur via wrap), temps +
         delta côte à côte dessous. */
      .widget.speedrun.sr-ligne .sr-seg {
        flex-wrap: wrap;
        flex: 0 0 auto;
        min-width: 5.5em;
        max-width: 9em;
        padding: 0.15em 0.4em;
        gap: 0 0.4em;
        align-content: center;
      }
      .widget.speedrun.sr-ligne .sr-seg-nom { flex: 0 0 100%; }
      .widget.speedrun.sr-ligne .sr-seg-time { flex: 1; }
      .widget.speedrun.sr-ligne .sr-seg-time,
      .widget.speedrun.sr-ligne .sr-seg-pb {
        font-size: 0.75em;
      }
      /* ===== Widget objectif (goal) =====
         Compteur live actuel/cible + barre de progression — même
         structure que la vignette dashboard (label uppercase, compteur
         gras, barre fine ~78%), tailles un cran au-dessus pour la
         lisibilité en diffusion. Tailles proportionnelles à la
         HAUTEUR du widget via calc(var(--goal-h) * N) — la boîte est une
         barre fine (~280×90) : dimensionner sur la largeur débordait
         (~150px de contenu pour 90px). --goal-w/--goal-h posés en JS sur
         le chemin goal. PAS de cqw : absents du CEF de plusieurs versions
         d'OBS → contenu invisible en diffusion.
         Accent = gradient du cadre SVG (--sr-grad-from/to), comme le
         speedrun. La célébration est contenue au widget (voile interne +
         pulse ~6s sur frame goal-atteint) — elle ne touche PAS la file
         d'alertes globale. */
      .widget.goal {
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Le bloc entier (entête+chiffres+barre) est centré en hauteur —
           space-evenly étalait les rangées bord à bord (entête collée en
           haut, barre isolée en bas = « collé en haut »). */
        justify-content: center;
        gap: calc(var(--goal-h, 90px) * 0.06);
        padding: calc(var(--goal-h, 90px) * 0.09) calc(var(--goal-w, 280px) * 0.04);
        box-sizing: border-box;
        /* Carte sombre translucide — le fond verre clair .widget rend le
           texte clair illisible sur un jeu lumineux. Même teinte que
           .widget.chat (0.35) : l'ancienne 0.5 alourdissait le visuel vs
           la vignette dashboard quasi transparente. */
        background: rgba(10, 10, 10, 0.35);
        color: var(--texte);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .widget.goal > *:not(.media-fond):not(.cadre-overlay) {
        position: relative;
        z-index: 1;
      }
      .goal-entete {
        display: flex;
        align-items: center;
        gap: calc(var(--goal-h, 90px) * 0.06);
        font-size: calc(var(--goal-h, 90px) * 0.14);
        color: var(--gris);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .goal-entete .logo { width: calc(var(--goal-h, 90px) * 0.16); height: calc(var(--goal-h, 90px) * 0.16); }
      .goal-entete .plat-badge { font-size: calc(var(--goal-h, 90px) * 0.14); }
      .goal-chiffres {
        font-size: calc(var(--goal-h, 90px) * 0.26);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        text-shadow: 0 1px 2px #000;
      }
      .goal-chiffres .goal-sep,
      .goal-chiffres .goal-cible {
        color: var(--gris);
        font-weight: 500;
      }
      /* Track visible : alpha 0.32 + 4px min — à 0.18/3px la barre était
         invisible sur le fond sombre (le contenu paraissait non centré). */
      .goal-bar {
        width: 78%;
        height: calc(var(--goal-h, 90px) * 0.07);
        min-height: 4px;
        border-radius: 999px;
        background: rgba(224, 224, 224, 0.32);
        overflow: hidden;
      }
      .goal-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg,
          var(--sr-grad-from, #e0e0e0), var(--sr-grad-to, #9a9a9a));
        transition: width 0.5s ease;
      }
      /* Compteur ≥ cible (état persistant) : liseré lumineux sur la barre —
         distinct de la célébration one-shot ci-dessous. */
      .widget.goal.goal-plein .goal-fill {
        box-shadow: 0 0 calc(var(--goal-h, 90px) * 0.03) var(--sr-grad-from, #e0e0e0);
      }
      .goal-celebration {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: calc(var(--goal-h, 90px) * 0.16);
        font-weight: 700;
        color: var(--sr-grad-from, #fff);
        background: rgba(0, 0, 0, 0.55);
        opacity: 0;
        pointer-events: none;
        z-index: 2;
        transition: opacity 250ms ease;
        text-shadow: 0 0 calc(var(--goal-h, 90px) * 0.02) var(--sr-grad-from, #fff), 0 1px 2px #000;
      }
      .goal-celebration.visible { opacity: 1; }
      .widget.goal.goal-fete { animation: goalGlow 600ms ease-in-out 5; }
      /* Statut « Terminé » des goals liés (channel.goal.end) — invisible
         quand vide, n'ajoute aucune ligne au layout. */
      .goal-statut {
        font-size: calc(var(--goal-h, 90px) * 0.11);
        text-align: center;
        opacity: 0.75;
        letter-spacing: 0.05em;
      }
      .goal-statut:empty { display: none; }
      @keyframes goalGlow {
        0%, 100% { filter: none; }
        50% { filter: brightness(1.35) drop-shadow(0 0 calc(var(--goal-h, 90px) * 0.04) var(--sr-grad-from, #fff)); }
      }
      /* ===== Widget musique — mini-lecteur Winamp (LED + LCD + EQ + barre) =====
         CONTRAT VISUEL « skin classic » partagé : ce bloc est la référence,
         WidgetMusique.svelte (vignette dashboard) en est le miroir 1:1 et
         LecteurMusique.svelte (deck onglet Musique) réutilise la même
         palette. --mu-w/--mu-h posées inline à chaque snapshot (même
         technique que --goal-w/h — pas de cqw, absent du CEF de plusieurs
         versions d'OBS). musiqueMode "eq" (.mu-eq-only) = bandes seules. */

      /* ── Châssis métal sombre + bevel ── */
      .widget.musique {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: calc(var(--mu-h, 120px) * 0.06);
        padding: calc(var(--mu-h, 120px) * 0.07) calc(var(--mu-w, 340px) * 0.04);
        box-sizing: border-box;
        /* Couvre le fond verre clair .widget pour garder le LCD lisible
           sur un jeu lumineux. */
        border: 2px outset #555;
        border-radius: 3px;
        background: linear-gradient(180deg, #2e2e2e 0%, #1c1c1c 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        color: #4aff4a;
        font-family: "Lucida Console", Consolas, ui-monospace, monospace;
      }
      .widget.musique > *:not(.media-fond):not(.cadre-overlay) {
        position: relative;
        z-index: 1;
      }

      /* ── Barre de titre : dégradé bleu nuit + logo italique ── */
      .mu-titre {
        display: flex;
        align-items: center;
        height: calc(var(--mu-h, 120px) * 0.11);
        min-height: 8px;
        padding: 0 6px;
        border: 1px solid #111;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          #000028 0%,
          #1d1d6e 45%,
          #4a4ab8 62%,
          #000028 100%
        );
        font-style: italic;
        font-weight: 700;
        letter-spacing: 0.2em;
        font-size: calc(var(--mu-h, 120px) * 0.08);
        color: #d5d6ff;
        text-shadow: 0 0 4px rgba(150, 150, 255, 0.6);
        overflow: hidden;
        white-space: nowrap;
      }

      /* ── Rangée écrans : boîte LED temps (gauche) + LCD marquee
         (droite). Deux panneaux inset séparés — le compteur ne flotte
         plus dans une bande vide quand le titre est absent. ── */
      .mu-lcd {
        display: flex;
        align-items: stretch;
        gap: calc(var(--mu-w, 340px) * 0.02);
        min-width: 0;
        font-size: calc(var(--mu-h, 120px) * 0.14);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 0 6px rgba(74, 255, 74, 0.55);
      }
      .mu-temps {
        display: flex;
        align-items: center;
        padding: calc(var(--mu-h, 120px) * 0.05) 0.45em;
        border: 2px inset #444;
        border-radius: 2px;
        background: #050805;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .mu-rest { color: #2ea02e; font-size: 0.62em; }
      /* Marquee : deux copies du texte + translateX -50% (même technique
         que .musique-defile — boucle sans saut). */
      .mu-defile-wrap {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        padding: calc(var(--mu-h, 120px) * 0.05) 0.5em;
        border: 2px inset #444;
        border-radius: 2px;
        background: #0a140a;
        overflow: hidden;
        white-space: nowrap;
      }
      .mu-defile {
        display: inline-block;
        animation: musiqueDefil 12s linear infinite;
      }
      .mu-defile > span { padding-right: 3em; }

      /* ── Équalizer : 16 colonnes, barres montant du bas + peak dots ── */
      .mu-eq {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: calc(var(--mu-h, 120px) * 0.3);
        min-height: 14px;
        border: 2px inset #444;
        border-radius: 2px;
        background: #0a140a;
        padding: 3px 4px;
        box-sizing: border-box;
      }
      .mu-col {
        position: relative;
        flex: 1;
        height: 100%;
        display: flex;
        align-items: flex-end;
      }
      .mu-peak {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: #ff9c40;
        box-shadow: 0 0 4px rgba(255, 156, 64, 0.6);
      }
      .mu-bar {
        width: 100%;
        height: 4%;
        min-height: 2px;
        background: linear-gradient(180deg,
          #ff4040 0%, #ffb040 30%, #4aff4a 65%);
        box-shadow: 0 0 3px rgba(74, 255, 74, 0.35);
        transition: height 80ms linear;
      }

      /* ── Barre de progression crantée ── */
      .mu-posbar {
        height: calc(var(--mu-h, 120px) * 0.07);
        min-height: 5px;
        border: 1px inset #444;
        border-radius: 2px;
        background:
          repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 9px,
            rgba(0, 0, 0, 0.55) 9px,
            rgba(0, 0, 0, 0.55) 10px
          ),
          #101410;
        overflow: hidden;
      }
      .mu-posfill {
        height: 100%;
        width: 0%;
        background: linear-gradient(180deg, #7dff7d 0%, #2fd32f 100%);
        box-shadow: 0 0 5px rgba(74, 255, 74, 0.5);
        transition: width 250ms linear;
      }

      /* ── Mode "eq" : bandes seules occupant tout le widget. ── */
      .widget.musique.mu-eq-only .mu-titre,
      .widget.musique.mu-eq-only .mu-lcd,
      .widget.musique.mu-eq-only .mu-posbar { display: none; }
      .widget.musique.mu-eq-only .mu-eq { flex: 1; height: auto; }
      .iv-section {
        display: none;
        flex: 1;
        width: 100%;
        overflow: hidden;
      }
      .widget.inputviewer[data-mode="clavier"] .iv-section-clavier { display: flex; }
      .widget.inputviewer[data-mode="souris"] .iv-section-souris { display: flex; }
      .widget.inputviewer[data-mode="numpad"] .iv-section-numpad {
        display: flex;
        align-items: center;
        justify-content: center;
        /* Marges latérales renforcées (8%) : les cadres épais/inclinés ne
           mangent plus les touches des bords. */
        padding: 4% 8%;
      }
      .widget.inputviewer[data-mode="manette"] .iv-section-manette { display: flex; }
      /* ===== Châssis clavier/numpad — plaque SVG derrière les touches =====
         .iv-kb = boîte relative pleine surface ; .iv-kb-chassis (SVG étiré,
         preserveAspectRatio none) dessine plaque + plateau encaissé + câble ;
         .iv-kb-topbar = barre de LEDs non étirée (meet) calée en haut à
         droite ; .iv-kb-keys = zone des touches DOM par-dessus. */
      .iv-kb { position: relative; width: 100%; height: 100%; }
      .iv-kb-chassis { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      /* Plaque translucide : le média de fond transparaît sur la surface du
         châssis (rebords/contours). Les touches restent opaques (verre →
         keycap pleine) pour que le média ne passe PAS sous elles. */
      .iv-kb-plate { stroke: rgba(255, 255, 255, 0.10); stroke-width: 0.4; fill-opacity: 0.55; }
      .iv-kb-bed { fill: rgba(0, 0, 0, 0.35); stroke: rgba(255, 255, 255, 0.06); stroke-width: 0.3; }
      .iv-kb-cable { fill: rgba(0, 0, 0, 0.35); }
      .iv-kb-topbar {
        position: absolute;
        top: 1.5%;
        left: 4%;
        right: 4%;
        height: 8%;
        display: block;
      }
      .iv-kb-led {
        fill: rgba(255, 255, 255, 0.14);
        stroke: rgba(255, 255, 255, 0.15);
        stroke-width: 1;
        transition: fill 80ms ease, stroke 80ms ease, filter 80ms ease;
      }
      .iv-kb-topbar g.presse .iv-kb-led {
        fill: var(--inputviewer-couleur-presse, #8b5cf6);
        stroke: var(--inputviewer-couleur-presse, #8b5cf6);
        filter: drop-shadow(0 0 8px var(--inputviewer-couleur-presse, #8b5cf6));
      }
      .iv-kb-led-txt {
        fill: rgba(255, 255, 255, 0.35);
        font: 600 10px "Rajdhani", "Segoe UI", sans-serif;
        text-anchor: middle;
      }
      .iv-kb-keys { position: absolute; left: 4.5%; right: 4.5%; top: 11.5%; bottom: 5.5%; display: flex; }
      .iv-kb-keys > * { flex: 1; min-width: 0; }
      .iv-clavier {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        /* Le châssis porte les marges extérieures ; ici juste l'air interne
           entre plateau et keycaps. */
        padding: 0.5cqw 1.5cqw;
        gap: 0.3cqw;
        overflow: hidden;
      }
      .iv-rangee { display: flex; gap: 0.25cqw; width: 100%; }
      /* Keycap réaliste : gradient vertical (haut clair → bas sombre), reflet
         top via ::before, ombre interne (creux) + jupe sombre + ombre externe
         (la touche « sort » du plateau). */
      .iv-touche {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 6cqw;
        padding: 0.15cqw 0.2cqw;
        /* Keycap opaque : le média de fond ne doit transparaître que sur le
           châssis (rebords), pas sous les touches. */
        background: linear-gradient(180deg,
          #3d424e 0%,
          #272b33 55%,
          #1d2027 100%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 0.9cqw;
        color: #f0f0f0;
        font-size: 1.9cqw;
        line-height: 1;
        text-align: center;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
        white-space: nowrap;
        overflow: hidden;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.15) inset,
                    0 -1px 2px rgba(0, 0, 0, 0.3) inset,
                    0 3px 0 rgba(0, 0, 0, 0.40),
                    0 4px 8px rgba(0, 0, 0, 0.35);
        transition: background 80ms ease, transform 80ms ease, box-shadow 80ms ease;
      }
      /* Reflet vitreux en haut de la keycap (verre poli). */
      .iv-touche::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 45%;
        border-radius: 0.9cqw 0.9cqw 0 0;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.25) 0%,
          rgba(255, 255, 255, 0) 100%);
        pointer-events: none;
      }
      .iv-touche.presse {
        background: linear-gradient(180deg,
          var(--inputviewer-couleur-presse, #8b5cf6) 0%,
          color-mix(in srgb, var(--inputviewer-couleur-presse, #8b5cf6) 70%, #000) 100%);
        border-color: var(--inputviewer-couleur-presse, #8b5cf6);
        outline: 3px solid var(--inputviewer-couleur-presse, #8b5cf6);
        outline-offset: 3px;
        color: #fff;
        transform: scale(0.92) translateY(0.1cqw);
        box-shadow: 0 0 16px 2px var(--inputviewer-couleur-presse, #8b5cf6),
                    0 1px 0 rgba(255, 255, 255, 0.3) inset,
                    0 -2px 4px rgba(0, 0, 0, 0.4) inset;
      }
      .iv-espaceur { flex: 0.6; visibility: hidden; }
      .iv-fleches {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25cqw;
        margin-top: 0.3cqw;
      }
      .iv-fleches .iv-rangee { width: 100%; justify-content: center; }
      .iv-fleches .iv-touche { flex: 0 0 6cqw; }
      /* Souris — forme de souris (corps ovale + 2 boutons + molette) */
      /* ===== Souris — skin réaliste en SVG inline (vue de dessus) =====
         Corps de souris + zones de clic gauche/droite + molette crantée,
         générés par ivGenererSourisHTML (viewBox 360x520, meet → responsive).
         .presse toujours togglée sur les <g data-souris>, même variable
         --inputviewer-couleur-presse que les autres modes. */
      /* Corps translucide : le média transparaît sur la coque, pas sous les
         clics (zones opaques). */
      .iv-ms-corps { stroke: rgba(255, 255, 255, 0.12); stroke-width: 2; fill-opacity: 0.62; }
      .iv-ms-seam { fill: none; stroke: rgba(0, 0, 0, 0.4); stroke-width: 2; }
      .iv-ms-zone {
        stroke: rgba(255, 255, 255, 0.10);
        stroke-width: 1.5;
        transition: fill 80ms ease, stroke 80ms ease, filter 80ms ease;
      }
      .iv-ms-wheel-loge { fill: rgba(0, 0, 0, 0.25); }
      .iv-ms-wheel {
        stroke: rgba(255, 255, 255, 0.18);
        stroke-width: 1.5;
        transition: fill 80ms ease, stroke 80ms ease, filter 80ms ease;
      }
      .iv-ms-wheel-ridge { stroke: rgba(0, 0, 0, 0.35); stroke-width: 2; }
      .iv-ms-dpi { fill: rgba(255, 255, 255, 0.08); stroke: rgba(255, 255, 255, 0.10); stroke-width: 1; }
      .iv-ms-coord {
        fill: #aeb4c2;
        font: 600 16px "Rajdhani", "Segoe UI", sans-serif;
        text-anchor: middle;
        font-variant-numeric: tabular-nums;
      }
      .iv-section-souris g.presse .iv-ms-zone,
      .iv-section-souris g.presse .iv-ms-wheel {
        fill: var(--inputviewer-couleur-presse, #8b5cf6);
        stroke: var(--inputviewer-couleur-presse, #8b5cf6);
        filter: drop-shadow(0 0 12px var(--inputviewer-couleur-presse, #8b5cf6));
      }

      /* ===== Numpad (pavé numérique) — glass + keycaps verre 3D ===== */
      .iv-numpad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 1fr;
        gap: 1.2cqw;
        width: 100%;
        height: 100%;
        align-content: center;
      }
      .iv-numpad-touche {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 6cqw;
        padding: 0.4cqw;
        /* Keycap opaque : média visible sur le châssis, pas sous les touches. */
        background: linear-gradient(180deg,
          #3d424e 0%,
          #272b33 55%,
          #1d2027 100%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 1.6cqw;
        color: #f0f0f0;
        font-size: 2cqw;
        font-weight: 600;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.15) inset,
                    0 -1px 2px rgba(0, 0, 0, 0.3) inset,
                    0 3px 0 rgba(0, 0, 0, 0.40),
                    0 4px 8px rgba(0, 0, 0, 0.35);
        transition: background 80ms ease, transform 80ms ease, box-shadow 80ms ease;
      }
      .iv-numpad-touche::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 45%;
        border-radius: 1.6cqw 1.6cqw 0 0;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.25) 0%,
          rgba(255, 255, 255, 0) 100%);
        pointer-events: none;
      }
      .iv-numpad-touche.presse {
        background: linear-gradient(180deg,
          var(--inputviewer-couleur-presse, #8b5cf6) 0%,
          color-mix(in srgb, var(--inputviewer-couleur-presse, #8b5cf6) 70%, #000) 100%);
        border-color: var(--inputviewer-couleur-presse, #8b5cf6);
        outline: 3px solid var(--inputviewer-couleur-presse, #8b5cf6);
        outline-offset: 3px;
        color: #fff;
        transform: scale(0.92) translateY(0.1cqw);
        box-shadow: 0 0 16px 2px var(--inputviewer-couleur-presse, #8b5cf6),
                    0 1px 0 rgba(255, 255, 255, 0.3) inset,
                    0 -2px 4px rgba(0, 0, 0, 0.4) inset;
      }
      /* Touches double hauteur/largeur ( + , Enter , 0 ) */
      .iv-numpad-double-h { grid-row: span 2; }
      .iv-numpad-double-w { grid-column: span 2; }

      /* ===== Manette (gamepad) — 3 skins réalistes en SVG inline =====
         Les 3 skins (8bitdo/xbox/ps) sont chacun un <svg> complet généré par
         ivGenererManette*SVG — plus de markup DOM de boutons (supprimé). */
      .iv-manette { width: 100%; height: 100%; }
      /* ===== Skin 8BitDo ProFight — manette réaliste en SVG inline =====
         Tout le dessin (corps, gâchettes, D-pad, boutons) est un <svg>
         viewBox 760x420 + preserveAspectRatio="meet" → scale natif à toute
         taille de widget. L'état pressé reste .presse togglée par
         majInputViewerEtat sur les <g data-bouton>/<g data-dpad> ; la couleur
         vient toujours de --inputviewer-couleur-presse (même contrat).
         Les fills de base sont des gradients en <defs> (attributs fill) :
         la règle CSS .presse les écrase (priorité CSS > attribut). */
      .iv-manette.iv-manette-fig { display: block; padding: 0; gap: 0; }
      .iv-fig-canvas { display: block; width: 100%; height: 100%; }
      /* Corps translucide : le média de fond transparaît sur la coque et les
         rebords. Les boutons/touches/d-pads restent opaques (le média ne doit
         pas passer sous les touches). */
      .iv-fig-corps { stroke: rgba(255, 255, 255, 0.12); stroke-width: 2; fill-opacity: 0.62; }
      .iv-fig-corps-inner { fill: rgba(255, 255, 255, 0.03); stroke: rgba(255, 255, 255, 0.05); stroke-width: 1.5; }
      .iv-fig-home { stroke: rgba(255, 255, 255, 0.10); stroke-width: 1.5; transition: fill 80ms ease, filter 80ms ease; }
      .iv-fig-deco { fill: rgba(255, 255, 255, 0.10); }
      .iv-fig-dish { stroke: rgba(255, 255, 255, 0.08); stroke-width: 2; fill-opacity: 0.75; }
      .iv-fig-cross { stroke: rgba(255, 255, 255, 0.10); stroke-width: 1.5; }
      .iv-fig-hub { stroke: rgba(255, 255, 255, 0.10); stroke-width: 1.5; }
      .iv-fig-hub-dot { fill: rgba(255, 255, 255, 0.08); }
      .iv-fig-shoulder,
      .iv-fig-face,
      .iv-fig-pill {
        stroke: rgba(255, 255, 255, 0.15);
        stroke-width: 1.5;
        transition: fill 80ms ease, stroke 80ms ease, filter 80ms ease;
      }
      .iv-fig-btn-shadow { fill: rgba(0, 0, 0, 0.35); }
      .iv-fig-zone { fill: transparent; transition: fill 80ms ease, filter 80ms ease; }
      .iv-fig-sheen { fill: rgba(255, 255, 255, 0.12); pointer-events: none; }
      .iv-fig-sheen-line { fill: none; stroke: rgba(255, 255, 255, 0.07); stroke-width: 3; }
      .iv-fig-ico { fill: #aeb4c2; pointer-events: none; }
      .iv-fig-diag { fill: rgba(255, 255, 255, 0.12); transition: fill 80ms ease, filter 80ms ease; }
      .iv-fig-lbl {
        fill: #dfe3ec;
        font: 700 22px "Rajdhani", "Segoe UI", sans-serif;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }
      .iv-fig-lbl-sm { font-size: 11px; fill: #aeb4c2; }
      .iv-fig-arrow { font-size: 17px; fill: rgba(223, 227, 236, 0.40); }
      /* État pressé SVG : même variable que les autres modes, glow via
         drop-shadow (outline/box-shadow n'existent pas en SVG). Le fill CSS
         écrase le fill="url(#...)" de base (attribut de présentation). */
      .iv-manette-fig g.presse .iv-fig-shoulder,
      .iv-manette-fig g.presse .iv-fig-face,
      .iv-manette-fig g.presse .iv-fig-pill {
        fill: var(--inputviewer-couleur-presse, #8b5cf6);
        stroke: var(--inputviewer-couleur-presse, #8b5cf6);
        filter: drop-shadow(0 0 12px var(--inputviewer-couleur-presse, #8b5cf6));
      }
      .iv-manette-fig g.presse .iv-fig-zone {
        fill: var(--inputviewer-couleur-presse, #8b5cf6);
        fill-opacity: 0.85;
        filter: drop-shadow(0 0 10px var(--inputviewer-couleur-presse, #8b5cf6));
      }
      .iv-manette-fig g.presse .iv-fig-diag {
        fill: var(--inputviewer-couleur-presse, #8b5cf6);
        filter: drop-shadow(0 0 8px var(--inputviewer-couleur-presse, #8b5cf6));
      }
      .iv-manette-fig g.presse .iv-fig-home {
        fill: var(--inputviewer-couleur-presse, #8b5cf6);
        filter: drop-shadow(0 0 8px var(--inputviewer-couleur-presse, #8b5cf6));
      }
      .iv-manette-fig g.presse text { fill: #fff; }
      .iv-manette-fig g.presse .iv-fig-arrow { fill: #fff; }
      /* Sticks analogiques SVG (Xbox/PS) : base fixe + cap mobile. Le cap est
         déplacé par style.transform en px viewBox (voir majInputViewerEtat —
         les % de la version DOM ne s'appliquent pas à un élément SVG). */
      .iv-fig-stick { transition: transform 40ms ease-out; }
      .iv-fig-stick-base { stroke: rgba(255, 255, 255, 0.08); stroke-width: 2; fill-opacity: 0.75; }
      .iv-fig-stick-cap {
        stroke: rgba(255, 255, 255, 0.16);
        stroke-width: 1.5;
        transition: fill 80ms ease, stroke 80ms ease, filter 80ms ease;
      }
      .iv-fig-stick-ring { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-width: 2; }
      .iv-manette-fig g.presse .iv-fig-stick-cap,
      .iv-manette-fig g.actif .iv-fig-stick-cap {
        fill: var(--inputviewer-couleur-presse, #8b5cf6);
        stroke: var(--inputviewer-couleur-presse, #8b5cf6);
        filter: drop-shadow(0 0 12px var(--inputviewer-couleur-presse, #8b5cf6));
      }
      /* Xbox : lettres colorées façon 360 (mutées, lisibles sur sombre). */
      .iv-fig-lbl-a { fill: #7bc47f; }
      .iv-fig-lbl-b { fill: #e0685e; }
      .iv-fig-lbl-x { fill: #5e9de0; }
      .iv-fig-lbl-y { fill: #e0c45e; }
      /* PlayStation : symboles colorés façon DualShock. */
      .iv-fig-lbl-tri { fill: #7bc47f; }
      .iv-fig-lbl-squ { fill: #d78bb8; }
      .iv-fig-lbl-cir { fill: #e0685e; }
      .iv-fig-lbl-cro { fill: #6fa8e8; }
      /* Touchpad DualSense : zone rectangulaire centrale, en retrait. */
      .iv-fig-pad {
        stroke: rgba(255, 255, 255, 0.10);
        stroke-width: 1.5;
        transition: fill 80ms ease, filter 80ms ease;
      }
      .iv-manette-fig g.presse .iv-fig-pad {
        fill: var(--inputviewer-couleur-presse, #8b5cf6);
        filter: drop-shadow(0 0 12px var(--inputviewer-couleur-presse, #8b5cf6));
      }
      /* Les 3 skins manette (8bitdo/xbox/ps) sont des SVG inline : les labels
         sont des <text> dans le markup (::after ne fonctionne pas en SVG). */

      /* ===== Bandeau premier message =====
         Pleine largeur, en bas (défaut) ou en haut. Couleurs dérivées du
         cadre widget de la scène active (cf. résoudreCouleursCadre).
         Sans cadre actif → thème noir & blanc (--fond/--texte). */
      /* ===== Bandeau premier message =====
         Pleine largeur, en bas (défaut) ou en haut. Couleurs dérivées du
         cadre widget de la scène active (cf. résoudreCouleursCadre).
         Sans cadre actif → thème noir & blanc (--fond/--texte). */
      .bandeau-pm-root {
        position: absolute;
        left: 0;
        right: 0;
        z-index: 9998;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.45s ease;
      }
      .bandeau-pm-root.visible { opacity: 1; }
      .bandeau-pm-root.pos-bas { bottom: 0; transform: translateY(100%); }
      .bandeau-pm-root.pos-haut { top: 0; transform: translateY(-100%); }
      .bandeau-pm-root.pos-bas.visible { transform: translateY(0); }
      .bandeau-pm-root.pos-haut.visible { transform: translateY(0); }
      .bandeau-pm-root {
        transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.16, 1.08, 0.38, 0.98);
      }

      /* ===== Alertes Twitch (follow/raid/sub/resub/subgift/bits) =====
         Overlay autonome positionné par alerte-config (x/y/largeur — même
         mécanique que welcomeConfig ; hauteur auto = la carte s'ajuste à son
         contenu). z 9997 : sous bandeau 9998 et clips 9999. Carte texte
         au-dessus + média (image ou vidéo) dessous, son optionnel via
         /medias/. Cadre SVG = cadre widget de la scène (cf. appliquerCadreOverlay). */
      .alerte-root {
        position: absolute;
        z-index: 9997;
        pointer-events: none;
        opacity: 0;
        transition:
          opacity 0.35s ease,
          transform 0.4s cubic-bezier(0.16, 1.08, 0.38, 0.98);
        transform: scale(0.6);
      }
      .alerte-root.visible {
        opacity: 1;
        transform: scale(1);
      }
      .alerte-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.45em;
        padding: 0.5em 0.9em;
        background: rgba(10, 10, 10, 0.92);
        border: 2px solid rgba(224, 224, 224, 0.85);
        border-radius: 14px;
        box-shadow: 0 6px 32px rgba(0, 0, 0, 0.55);
        position: relative;
      }
      .alerte-texte {
        color: var(--alerte-couleur, #ffffff);
        font-size: var(--alerte-taille, 48px);
        font-weight: 700;
        line-height: 1.15;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        text-align: center;
        word-break: break-word;
      }
      /* Média d'alerte (image ou vidéo) affiché sous le texte. Masqué par
         défaut ; affiché par playAlerte quand la config a un média. */
      .alerte-media {
        display: none;
        width: 100%;
        max-height: 60vh;
        object-fit: contain;
        border-radius: 8px;
      }

      /* ===== Commandes chat (!commande → overlay diffusion) =====
         Même carte que les alertes (texte au-dessus + média dessous, cadre
         SVG = cadre widget de la scène). z 9996 : sous les alertes 9997. */
      .commande-root {
        position: absolute;
        z-index: 9996;
        pointer-events: none;
        opacity: 0;
        transition:
          opacity 0.35s ease,
          transform 0.4s cubic-bezier(0.16, 1.08, 0.38, 0.98);
        transform: scale(0.6);
      }
      .commande-root.visible {
        opacity: 1;
        transform: scale(1);
      }
      .commande-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.45em;
        padding: 0.5em 0.9em;
        background: rgba(10, 10, 10, 0.92);
        border: 2px solid rgba(224, 224, 224, 0.85);
        border-radius: 14px;
        box-shadow: 0 6px 32px rgba(0, 0, 0, 0.55);
        position: relative;
      }
      .commande-texte {
        color: var(--commande-couleur, #ffffff);
        font-size: var(--commande-taille, 48px);
        font-weight: 700;
        line-height: 1.15;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        text-align: center;
        word-break: break-word;
      }
      .commande-media {
        display: none;
        width: 100%;
        max-height: 60vh;
        object-fit: contain;
        border-radius: 8px;
      }

      /* ===== Pad numérique (16 touches Numpad × 3 plages → overlay diffusion) =====
         Même squelette que alertes/commandes (carte + média). z 9995 : sous
         les commandes 9996 et alertes 9997. Le pad est un déclenchement manuel
         par le streamer — il apparaît sous les alertes/commandes automatiques.
         Pas de texte (juste le média). Effets bounce/zoom optionnels. */
      .pad-root {
        position: absolute;
        z-index: 9995;
        pointer-events: none;
        opacity: 0;
        transition:
          opacity 0.3s ease,
          transform 0.3s cubic-bezier(0.16, 1.08, 0.38, 0.98);
        transform: scale(0.6);
      }
      .pad-root.visible {
        opacity: 1;
        transform: scale(1);
      }
      .pad-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: transparent;
        position: relative;
      }
      .pad-media {
        display: none;
        width: 100%;
        max-height: 80vh;
        object-fit: contain;
        border-radius: 8px;
      }
      .pad-media.pad-bounce {
        animation: pad-bounce 0.6s infinite ease-in-out;
      }
      .pad-media.pad-zoom {
        animation: pad-zoom 1.2s infinite ease-in-out;
      }
      @keyframes pad-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
      @keyframes pad-zoom {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }

      /* ===== Présentation streamer (portage « streamers favoris ») =====
         Overlay plein écran AUTONOME (pas un widget de scène) piloté par les
         frames WS presentation-show/-hide/-mode/-clip-play/-clip-stop/
         -audio-play/-audio-stop. z 10000+ : AU-DESSUS de toute la pile
         existante (écran d'attente 9990 → welcome 9999) — la présentation
         est une prise de scène délibérée et manuelle.
         Mode "theatrical" : voile sombre + orbes + sol de scène + faisceaux
         spot + poussière + rideaux rouges qui s'ouvrent en restant froncés
         en bordure (translateX ±27 % + scaleX, 1,2 s) + cantonné festonné
         permanent + embrasses dorées + public (sièges rouges + têtes) au
         premier plan. Mode "card" : même carte en version compacte, sans
         rideaux ni voile complet ni public (fondu simple). Le clip joue
         dans un lecteur plein écran au-dessus de tout (z 10004). */
      .pres-voile {
        position: absolute;
        inset: 0;
        z-index: 10000;
        pointer-events: none;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.5s ease;
        background: radial-gradient(ellipse at 50% 42%, #1b1b38 0%, #05050a 74%);
      }
      .pres-voile.visible { opacity: 1; }
      .pres-orbe {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.45;
        animation: pres-orbe 14s ease-in-out infinite alternate;
      }
      .pres-orbe.o1 { width: 620px; height: 620px; left: -140px; top: -160px;
        background: rgba(140, 60, 255, 0.35); }
      .pres-orbe.o2 { width: 560px; height: 560px; right: -120px; top: 12%;
        background: rgba(255, 60, 120, 0.28); animation-delay: -5s; }
      .pres-orbe.o3 { width: 520px; height: 520px; left: 34%; bottom: -240px;
        background: rgba(60, 110, 255, 0.30); animation-delay: -9s; }
      @keyframes pres-orbe {
        from { transform: translate(0, 0) scale(1); }
        to { transform: translate(60px, -40px) scale(1.12); }
      }
      .pres-rideau {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        z-index: 10001;
        pointer-events: none;
        transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        /* Plis larges (~88 px) : creux sombre → faîneau clair au centre du
           pli → creux. Le dégradé vertical assombrit le haut (ombre du
           cantonné) et le bas. */
        background:
          linear-gradient(180deg,
            rgba(0, 0, 0, 0.55) 0%,
            rgba(0, 0, 0, 0.12) 16%,
            rgba(0, 0, 0, 0) 42%,
            rgba(0, 0, 0, 0.38) 100%),
          repeating-linear-gradient(90deg,
            #3a060d 0px,
            #5c0c18 15px,
            #8f1526 34px,
            #b01c30 44px,
            #8f1526 54px,
            #5c0c18 73px,
            #3a060d 88px);
      }
      .pres-rideau.gauche {
        left: 0;
        border-right: 6px solid #c9a13b;
        transform-origin: left center;
        box-shadow: inset -60px 0 80px rgba(0, 0, 0, 0.65),
                    14px 0 36px rgba(0, 0, 0, 0.45);
      }
      .pres-rideau.droite {
        right: 0;
        border-left: 6px solid #c9a13b;
        transform-origin: right center;
        box-shadow: inset 60px 0 80px rgba(0, 0, 0, 0.65),
                    -14px 0 36px rgba(0, 0, 0, 0.45);
      }
      /* Ouvert : le rideau reste froncé en bordure (~11 % de l'écran) au
         lieu de sortir — les plis compressés par scaleX rendent le froncé,
         l'embrasse le retient visuellement. */
      .pres-rideau.gauche.open { transform: translateX(-27%) scaleX(0.5); }
      .pres-rideau.droite.open { transform: translateX(27%) scaleX(0.5); }
      /* Ourlet doré en bas du rideau. */
      .pres-rideau::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 14px;
        background: linear-gradient(180deg, #8a6c25 0%, #e8c55c 45%, #b8933a 100%);
      }
      /* Cantonné (valance) : drapé horizontal permanent — le proscenium du
         théâtre. Festons en demi-cercles sous le corps (192 px/feston → 10
         festons exacts sur 1920) ; le cercle doré du dessous, plus grand et
         décalé, dessine le liseré. */
      .pres-valance {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 110px;
        z-index: 10001;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.6s ease;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 55%),
          repeating-linear-gradient(90deg,
            #3a060d 0px,
            #5c0c18 15px,
            #8f1526 34px,
            #b01c30 44px,
            #8f1526 54px,
            #5c0c18 73px,
            #3a060d 88px);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55);
      }
      .pres-valance.visible { opacity: 1; }
      .pres-valance::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        height: 46px;
        background:
          radial-gradient(circle 100px at 50% 0%,
            #a01728 0%, #7a1220 60%, #4a0810 95%, transparent 100%)
            0 0 / 192px 40px repeat-x,
          radial-gradient(circle 104px at 50% 0%,
            #e8c55c 0%, #b8933a 68%, transparent 100%)
            0 4px / 192px 44px repeat-x;
      }
      /* Embrasses : bandes dorées obliques retenant le rideau froncé. Le
         transition-delay n'est posé que dans .open — à la fermeture
