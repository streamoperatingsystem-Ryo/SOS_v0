        story: renderStory,
        "thin-line": renderThinLine,
        hexagon: renderHexagon,
        mgstyle: renderMGStyle
      };
      var CADRES_CLIP_PATHS = {
        cyberpunk: getCyberpunkClipPath,
        story: getStoryClipPath,
        "thin-line": getThinLineClipPath,
        hexagon: getHexagonClipPath,
        mgstyle: getMGStyleClipPath
      };

      function genererCadreSVG(cadre, W, H, idCadre) {
        if (!cadre) return "";
        var style = cadre.style || "carre";
        var strokeWidth = cadre.strokeWidth || 4;
        var couleur = cadre.couleur || "#ffffff";
        var couleurFin = cadre.couleurFin || "";
        var gradientAngle = isFinite(cadre.gradientAngle) ? cadre.gradientAngle : 135;
        if (style === "arrondis" || style === "carre") {
          return renderCadreInline(style, W, H, couleur, couleurFin, strokeWidth, idCadre, gradientAngle);
        }
        var fn = CADRES_RENDERERS[style];
        if (fn) {
          return fn(W, H, idCadre, strokeWidth, couleur, couleurFin, gradientAngle);
        }
        return "";
      }

      function genererCadreClipPath(cadre, W, H) {
        if (!cadre) return null;
        var style = cadre.style || "carre";
        var strokeWidth = cadre.strokeWidth || 4;
        if (style === "arrondis") {
          var r = Math.min(8, W / 4, H / 4);
          return "path('M " + r + " 0 L " + (W - r) + " 0 Q " + W + " 0 " + W + " " + r + " L " + W + " " + (H - r) + " Q " + W + " " + H + " " + (W - r) + " " + H + " L " + r + " " + H + " Q 0 " + H + " 0 " + (H - r) + " L 0 " + r + " Q 0 0 " + r + " 0 Z')";
        }
        if (style === "carre") return null;
        var fn = CADRES_CLIP_PATHS[style];
        if (!fn) return null;
        try { return fn(W, H, strokeWidth); } catch (e) { return null; }
      }

      // Clé de hachage pour détecter les changements de cadre (évite recréer
      // le SVG à chaque snapshot si rien n'a bougé).
      function cadreKey(cadre, W, H) {
        if (!cadre) return "";
        return (cadre.style || "") + "|"
          + (cadre.strokeWidth || 0) + "|" + (cadre.couleur || "") + "|"
          + (cadre.couleurFin || "") + "|" + (cadre.gradientAngle ?? "") + "|"
          + Math.round(W) + "x" + Math.round(H);
      }

      // Dégradé de couleur d'un cadre pour le rendu du titre de widget.
      // Retourne { from, to } :
      // - Cadre actif → couleur/couleurFin du user (tous les styles).
      // - Pas de cadre actif (cadre null/inactif) → dégradé blanc→gris par défaut.
      function gradientCadre(cadre) {
        if (!cadre || !cadre.actif) {
          return { from: "#e0e0e0", to: "#9a9a9a" };
        }
        var c1 = cadre.couleur || "#ffffff";
        return { from: c1, to: cadre.couleurFin || c1 };
      }

      // Ombre de contraste (noir ou blanc) selon la luminance d'une couleur
      // hex : fait ressortir le texte/timer quel que soit le fond. Couleur claire
      // → ombre noire ; couleur sombre → ombre blanche. Utilisé pour le timer
      // gradient du widget speedrun (couleur du cadre).
      function contrasteOmbre(hex) {
        if (!hex || hex[0] !== "#") return "#000";
        var c = hex.length === 4
          ? "#" + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3]
          : hex;
        var r = parseInt(c.slice(1, 3), 16) / 255;
        var g = parseInt(c.slice(3, 5), 16) / 255;
        var b = parseInt(c.slice(5, 7), 16) / 255;
        var lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        return lum > 0.5 ? "#000" : "#fff";
      }

      // Applique le cadre widget sur un élément .widget : clip-path sur el +
      // overlay SVG dans un div .cadre-overlay enfant. Recrée seulement si
      // la clé a changé (style/couleurs/strokeWidth/dims).
      // w.sansCadre (widgets créés par drop) = opt-out : comme cadre inactif.
      function applyCadreWidget(el, entry, w, cadre) {
        var cadreActif = cadre && cadre.actif && (cadre.strokeWidth || 0) > 0 && w.sansCadre !== true;
        if (!cadreActif) {
          // Nettoyer : retirer clip-path + overlay si présent + rendre la
          // bordure à la règle CSS .widget (ne pas l'écraser en dur ici).
          el.style.clipPath = "";
          el.style.webkitClipPath = "";
          el.style.border = "";
          if (entry.cadreOverlayEl) {
            entry.cadreOverlayEl.remove();
            entry.cadreOverlayEl = null;
            entry.cadreKey = "";
          }
          return;
        }
        var newKey = cadreKey(cadre, w.largeur, w.hauteur);
        // Cadre actif : masquer la bordure native 1px de .widget (parité
        // dashboard .avec-cadre). border:none (PAS border-color:transparent) :
        // il faut aussi supprimer le décalage de 1px — la padding box redevient
        // [0,W], sinon l'overlay (inset:0 sur la padding box) décale le SVG et
        // overflow:hidden clippe le trait sur les bords droit/bas (anneau
        // blanc résiduel autour du cadre dans OBS).
        el.style.border = "none";
        // Clip-path : appliquer à chaque fois (cheap, pas de recréation DOM).
        var clip = genererCadreClipPath(cadre, w.largeur, w.hauteur);
        if (clip) {
          el.style.clipPath = clip;
          el.style.webkitClipPath = clip;
        } else {
          el.style.clipPath = "";
          el.style.webkitClipPath = "";
        }
        // Overlay SVG : recréer seulement si la clé a changé.
        if (entry.cadreKey !== newKey) {
          if (entry.cadreOverlayEl) entry.cadreOverlayEl.remove();
          var overlay = document.createElement("div");
          overlay.className = "cadre-overlay";
          overlay.innerHTML = genererCadreSVG(cadre, w.largeur, w.hauteur, "w-" + w.id);
          el.appendChild(overlay);
          entry.cadreOverlayEl = overlay;
          entry.cadreKey = newKey;
        }
      }

      // Applique les titres du widget (haut/bas/gauche/droite — jusqu'à 4
      // simultanés, style partagé) sur le .widget-wrap. Les titres sont hors
      // .widget (non clippés par le cadre SVG), avec un gradient de texte
      // reprenant les couleurs du cadre actif (fallback blanc→gris).
      // Crée/met à jour/supprime un élément .widget-titre par position selon
      // w.titreHaut/titreBas/titreGauche/titreDroite (gauche/droite =
      // texte vertical writing-mode).
      function applyTitreWidget(entry, w, cadre) {
        if (!entry.titreEls) entry.titreEls = {};
        var police = w.titrePolice || "BebasNeue";
        var taille = w.titreTaille || 24;
        var gras = w.titreGras || false;
        var italique = w.titreItalique || false;
        var souligne = w.titreSouligne || false;
        var espacement = w.titreEspacement || 0;
        // Contour des lettres : 0 = désactivé (0 stocké ≠ champ absent).
        var contourCouleur = w.titreContourCouleur || "#fff";
        var contourEpaisseur = w.titreContourEpaisseur;
        if (contourEpaisseur === undefined || contourEpaisseur === null) contourEpaisseur = 2;
        // Dégradé du texte : personnalisé si titreCouleur défini, sinon
        // celui du cadre actif — w.sansCadre = pas de cadre sur ce widget →
        // fallback blanc→gris (parité dashboard).
        var grad = w.titreCouleur
          ? { from: w.titreCouleur, to: w.titreCouleurFin || w.titreCouleur }
          : gradientCadre(w.sansCadre === true ? null : cadre);
        var cx = w.x + w.largeur / 2;
        var cy = w.y + w.hauteur / 2;
        var positions = ["haut", "bas", "gauche", "droite"];
        for (var i = 0; i < positions.length; i++) {
          var pos = positions[i];
          var champ = "titre" + pos.charAt(0).toUpperCase() + pos.slice(1);
          var titre = w[champ] || "";
          var el = entry.titreEls[pos];
          if (!titre) {
            if (el) {
              el.remove();
              delete entry.titreEls[pos];
            }
            continue;
          }
          if (!el) {
            el = document.createElement("div");
            el.className = "widget-titre";
            entry.wrapEl.appendChild(el);
            entry.titreEls[pos] = el;
          }
          el.textContent = titre;
          el.style.fontFamily = "'" + police + "', sans-serif";
          el.style.fontSize = taille + "px";
          el.style.fontStyle = italique ? "italic" : "normal";
          el.style.fontWeight = gras ? "700" : "400";
          el.style.textDecoration = souligne ? "underline" : "none";
          el.style.letterSpacing = espacement + "px";
          el.style.webkitTextStroke = contourEpaisseur + "px " + contourCouleur;
          el.style.background = "linear-gradient(135deg, " + grad.from + ", " + grad.to + ")";
          el.style.webkitBackgroundClip = "text";
          el.style.backgroundClip = "text";
          el.style.color = "transparent";
          if (pos === "haut") {
            el.style.left = cx + "px";
            el.style.right = "";
            el.style.top = w.y + "px";
            el.style.transform = "translate(-50%, -100%)";
            el.style.marginTop = "-2px";
            el.style.marginBottom = "";
            el.style.marginLeft = "";
            el.style.marginRight = "";
            el.style.writingMode = "";
          } else if (pos === "bas") {
            el.style.left = cx + "px";
            el.style.right = "";
            el.style.top = (w.y + w.hauteur) + "px";
            el.style.transform = "translateX(-50%)";
            el.style.marginTop = "2px";
            el.style.marginBottom = "";
            el.style.marginLeft = "";
            el.style.marginRight = "";
            el.style.writingMode = "";
          } else if (pos === "gauche") {
            el.style.left = w.x + "px";
            el.style.right = "";
            el.style.top = cy + "px";
            el.style.transform = "translate(-100%, -50%)";
            el.style.marginTop = "";
            el.style.marginBottom = "";
            el.style.marginLeft = "";
            el.style.marginRight = "2px";
            el.style.writingMode = "vertical-rl";
          } else {
            el.style.left = (w.x + w.largeur) + "px";
            el.style.right = "";
            el.style.top = cy + "px";
            el.style.transform = "translateY(-50%)";
            el.style.marginTop = "";
            el.style.marginBottom = "";
            el.style.marginLeft = "2px";
            el.style.marginRight = "";
            el.style.writingMode = "vertical-rl";
          }
        }
      }

      // Applique le cadre unifié au bord du canvas sur #stage. Un seul overlay
      // global. Source : scene.cadreWidget (champ canonique — le même cadre
      // que les widgets ; cadreApp legacy migré côté Rust au chargement).
      // bordActif === false → bord masqué, cadre widgets seuls conservé
      // (absent = true, rétro-compat vieilles scènes).
      var cadreAppOverlayEl = null;
      var cadreAppKey = "";
      function applyCadreApp(scene) {
        var cadre = scene.cadreWidget;
        var cadreActif = cadre && cadre.actif && (cadre.strokeWidth || 0) > 0 && cadre.bordActif !== false;
        if (!cadreActif) {
          if (cadreAppOverlayEl) {
            cadreAppOverlayEl.remove();
            cadreAppOverlayEl = null;
            cadreAppKey = "";
          }
          return;
        }
        var W = scene.canvasW || 1920;
        var H = scene.canvasH || 1080;
        var newKey = cadreKey(cadre, W, H);
        if (cadreAppKey === newKey && cadreAppOverlayEl) return;
        if (cadreAppOverlayEl) cadreAppOverlayEl.remove();
        var overlay = document.createElement("div");
        overlay.id = "cadre-app-overlay";
        overlay.innerHTML = genererCadreSVG(cadre, W, H, "app");
        stageEl.appendChild(overlay);
        cadreAppOverlayEl = overlay;
        cadreAppKey = newKey;
      }

      // Applique les titres du fond de l'application (haut/bas/gauche/droite
      // — intérieur du canvas, latéraux en texte vertical) sur #stage. Les
      // titres sont hors #bg (non clippés), avec un gradient de texte
      // reprenant les couleurs du cadre unifié (cadreWidget).
      // Crée/met à jour/supprime un élément .bg-titre par position selon
      // scene.bgTitreHaut/Bas/Gauche/Droite.
      var bgTitreEls = {};
      function applyTitreFond(scene) {
        var police = scene.bgTitrePolice || "BebasNeue";
        var taille = scene.bgTitreTaille || 24;
        var gras = scene.bgTitreGras || false;
        var italique = scene.bgTitreItalique || false;
        var souligne = scene.bgTitreSouligne || false;
        var espacement = scene.bgTitreEspacement || 0;
        // Contour des lettres : 0 = désactivé (0 stocké ≠ champ absent).
        var contourCouleur = scene.bgTitreContourCouleur || "#fff";
        var contourEpaisseur = scene.bgTitreContourEpaisseur;
        if (contourEpaisseur === undefined || contourEpaisseur === null) contourEpaisseur = 2;
        // Dégradé du texte : personnalisé si bgTitreCouleur défini, sinon
        // celui du cadre unifié (parité dashboard).
        var grad = scene.bgTitreCouleur
          ? { from: scene.bgTitreCouleur, to: scene.bgTitreCouleurFin || scene.bgTitreCouleur }
          : gradientCadre(scene.cadreWidget);
        var positions = ["haut", "bas", "gauche", "droite"];
        for (var i = 0; i < positions.length; i++) {
          var pos = positions[i];
          var champ = "bgTitre" + pos.charAt(0).toUpperCase() + pos.slice(1);
          var titre = scene[champ] || "";
          var el = bgTitreEls[pos];
          if (!titre) {
            if (el) {
              el.remove();
              delete bgTitreEls[pos];
            }
            continue;
          }
          if (!el) {
            el = document.createElement("div");
            el.className = "bg-titre";
            stageEl.appendChild(el);
            bgTitreEls[pos] = el;
          }
          el.textContent = titre;
          el.style.fontFamily = "'" + police + "', sans-serif";
          el.style.fontSize = taille + "px";
          el.style.fontStyle = italique ? "italic" : "normal";
          el.style.fontWeight = gras ? "700" : "400";
          el.style.textDecoration = souligne ? "underline" : "none";
          el.style.letterSpacing = espacement + "px";
          el.style.webkitTextStroke = contourEpaisseur + "px " + contourCouleur;
          el.style.background = "linear-gradient(135deg, " + grad.from + ", " + grad.to + ")";
          el.style.webkitBackgroundClip = "text";
          el.style.backgroundClip = "text";
          el.style.color = "transparent";
          if (pos === "haut") {
            el.style.left = "50%";
            el.style.right = "";
            el.style.transform = "translateX(-50%)";
            el.style.top = "8px";
            el.style.bottom = "";
            el.style.writingMode = "";
          } else if (pos === "bas") {
            el.style.left = "50%";
            el.style.right = "";
            el.style.transform = "translateX(-50%)";
            el.style.top = "";
            el.style.bottom = "8px";
            el.style.writingMode = "";
          } else if (pos === "gauche") {
            el.style.left = "8px";
            el.style.right = "";
            el.style.transform = "translateY(-50%)";
            el.style.top = "50%";
            el.style.bottom = "";
            el.style.writingMode = "vertical-rl";
          } else {
            el.style.left = "";
            el.style.right = "8px";
            el.style.transform = "translateY(-50%)";
            el.style.top = "50%";
            el.style.bottom = "";
            el.style.writingMode = "vertical-rl";
          }
        }
      }

      // Appliquer un snapshot reçu : met à jour currentScene, les dims canvas,
      // rend la scène, et rafraîchit les overlays (bandeau, alerte, welcome).
      // Extraite du handler WS pour être réutilisée par le fondu (rendu différé
      // au milieu du fade-to-black). Ne touche PAS au voile noir — c'est le
      // caller qui gère l'opacité du voile.
      function appliquerSnapshot(msg) {
        currentScene = msg.scene;
        applyCanvasDims(msg.scene);
        renderScene(msg.scene);
        // Rafraîchir les couleurs du bandeau (cadre widget a pu changer).
        bpmAppliquerCouleurs();
        // Rafraîchir le cadre SVG des overlays visibles (le cadre widget
        // de la scène a pu changer en live).
        if (alerteVisible && alerteCardEl) {
          appliquerCadreOverlay(alerteCardEl, "alerte");
        }
        if (welcomeRoot && welcomeRoot.style.display === "block" && welcomeClipEl) {
          appliquerCadreOverlay(welcomeClipEl, "welcome");
        }
        // Écran d'attente : cadre minuteur + couleurs suivent le cadre
        // widget de la nouvelle scène (BRB affiché pendant le changement).
        if (eaVisible && eaMinuteurEl) {
          appliquerCadreOverlay(eaMinuteurEl, "ecran-attente");
          eaAppliquerCouleurs();
        }
      }

      function connect() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(proto + "//" + location.host + "/ws");

        ws.onopen = () => {
          // Demander le resync de l'état speedrun (LSS) — la diffusion peut
          // se (re)connecter après le chargement du .lss côté dashboard, auquel
          // cas elle a manqué l'event WS. Le serveur re-émet la dernière run.
          ws.send(JSON.stringify({ type: "speedrun-resync" }));
          // Resync de l'écran d'attente aussi — les frames tick 1 Hz
          // couvrent la course, mais en pause il n'y a pas de tick :
          // re-push de la dernière frame par le serveur.
          ws.send(JSON.stringify({ type: "ecran-attente-resync" }));
          // Resync Just Chatting : le serveur renvoie toujours une frame
          // (actif:false si jamais togglé — couvre la connexion avant le 1er
          // toggle).
          ws.send(JSON.stringify({ type: "just-chatting-resync" }));
        };
        ws.onclose = () => {
          setTimeout(connect, 2000);
        };
        ws.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === "snapshot" && msg.scene) {
              // Détecter un CHANGEMENT de scène (sceneId différent) vs une
              // simple édition de widgets (même scène). Le fondu au noir ne
              // se déclenche qu'au changement de scène — pas sur chaque edit
              // live, pour éviter de clignoter pendant l'édition.
              var nouveauId = msg.sceneId || null;
              var changement = nouveauId !== null && currentSceneId !== null && nouveauId !== currentSceneId;
              if (changement) {
                // Fondu au noir : voile → opacity 1 (300ms), puis rendu de la
                // nouvelle scène sous le voile, puis voile → opacity 0.
                // Annuler un fondu en cours (changement rapide de scène).
                if (fonduTimer) {
                  clearTimeout(fonduTimer);
                }
                voileNoirEl.style.opacity = "1";
                var msgCapture = msg;
                var idCapture = nouveauId;
                fonduTimer = setTimeout(function () {
                  fonduTimer = null;
                  appliquerSnapshot(msgCapture);
                  currentSceneId = idCapture;
                  // Laisser le navigateur peindre la nouvelle scène avant de
                  // révéler (requestAnimationFrame) → évite un flash partiel.
                  requestAnimationFrame(function () {
                    voileNoirEl.style.opacity = "0";
                  });
                }, FONDU_DEMI);
              } else {
                // Même scène (édition) ou 1er snapshot (currentSceneId null) :
                // rendu direct, pas de fondu.
                if (fonduTimer) {
                  // Un fondu était en cours mais on reçoit un snapshot de la
                  // même scène (ex. edit pendant un changement) → appliquer
                  // directement sous le voile.
                  clearTimeout(fonduTimer);
                  fonduTimer = null;
                  voileNoirEl.style.opacity = "0";
                }
                appliquerSnapshot(msg);
                if (nouveauId !== null) currentSceneId = nouveauId;
              }
            } else if (msg.type === "chat" && msg.message) {
              // Message chat → append incrémental (O(1)/widget, trim DOM
              // synchronisé avec le buffer — voir appendChatMessage).
              appendChatMessage(msg.message);
            } else if (msg.type === "viewers") {
              // Count viewers d'une plateforme (déjà dédupliqué côté Rust) :
              // number = live, null = hors-ligne/déconnecté → maj des barres.
              viewersParPlateforme[msg.plateforme] = msg.count;
              rerenderViewersBars();
              // Widgets goal métrique "viewers" de cette plateforme.
              majGoalWidgets(msg.plateforme);
            } else if (msg.type === "communaute") {
              // Compteurs communauté (followers/subs/sub_points/abonnes) —
              // déjà dédupliqués côté Rust. Maj des widgets goal concernés.
              communauteParPlateforme[msg.plateforme] = msg;
              majGoalWidgets(msg.plateforme);
            } else if (msg.type === "goal-twitch") {
              // Creator Goal Twitch déclaré : progression d'un objectif lié
              // (EventSub channel.goal.* temps réel + poll viewers.rs en
              // secours). termine = le goal a pris fin côté Twitch.
              goalsTwitchMap[msg.id] = msg;
              majGoalWidgetsLies();
            } else if (msg.type === "goal-atteint") {
              // Objectif franchi (viewers.rs — une fois par crossing ≥ cible,
              // réarmé sous la cible). Célébration contenue dans le widget.
              goalCelebrer(msg.widget_id);
            } else if (msg.type === "welcome-clip-play") {
              // Clip de bienvenue : afficher l'overlay autonome + jouer la vidéo.
              playWelcomeClip(msg);
            } else if (msg.type === "welcome-clip-stop") {
              // Stop : cacher l'overlay autonome + reset vidéo.
              stopWelcomeClip();
            } else if (msg.type === "welcome-clip-config") {
              // Config overlay (position/taille) — applique au root welcome.
              applyWelcomeOverlayConfig(msg.config || {});
            } else if (msg.type === "bandeau-premier-message-play") {
              playBandeauPM(msg);
            } else if (msg.type === "bandeau-premier-message-stop") {
              stopBandeauPM();
            } else if (msg.type === "bandeau-premier-message-config") {
              applyBandeauPMConfig(msg.config || {});
            } else if (msg.type === "alerte-play") {
              // Alerte Twitch (follow/raid/sub/resub/subgift/bits).
              playAlerte(msg);
            } else if (msg.type === "alerte-stop") {
              stopAlerte();
            } else if (msg.type === "alerte-config") {
              applyAlerteConfig(msg.config || {});
            } else if (msg.type === "commande-play") {
              // Commande chat tapée par un viewer (!commande).
              playCommande(msg);
            } else if (msg.type === "commande-stop") {
              stopCommande();
            } else if (msg.type === "commande-config") {
              // Liste des commandes + overlay (position/taille du squelette
              // partagé). Le play porte déjà le contenu (texte/média/couleur).
              if (msg.overlay) applyCommandeOverlayConfig(msg.overlay || {});
            } else if (msg.type === "pad-play") {
              // Pad numérique : touche pressée → affiche média + joue son.
              playPad(msg);
            } else if (msg.type === "pad-stop") {
              stopPad();
            } else if (msg.type === "input-viewer-etat") {
              // État des entrées (capture globale Rust → WS direct, throttle
              // 30Hz). Maj DOM directe des keycaps/boutons (pas de re-render).
              var _ivEtat = msg.etat || {};
              majInputViewerEtat(_ivEtat);
            } else if (msg.type === "speedrun-etat") {
              // État du timer speedrun (moteur Rust → WS direct). Maj DOM
              // directe du timer + phase + splits (pas de re-render).
              majSpeedrunEtat(msg.etat || {});
            } else if (msg.type === "ecran-attente-etat") {
              // Écran d'attente BRB : frame auto-réparatrice (config + chrono
              // complets à chaque tick Rust 1 Hz + transitions).
              majEcranAttente(msg.etat);
            } else if (msg.type === "just-chatting-etat") {
              // Just Chatting : maj l'état puis re-render de la scène courante
              // — jcDeriverScene applique/retire l'overlay à la volée.
              if (msg.etat) {
                jcEtat = msg.etat;
                renderScene(currentScene);
              }
            } else if (msg.type === "position-overlay-config") {
              // Squelette de position unifié (clip de bienvenue + alertes +
              // commandes). Applique la même position/taille aux trois.
              applyWelcomeOverlayConfig(msg.config || {});
              applyAlerteOverlayConfig(msg.config || {});
              applyCommandeOverlayConfig(msg.config || {});
              applyPadOverlayConfig(msg.config || {});
            }
          } catch (e) {
            console.error("Message WS invalide:", e);
          }
        };
      }

      // ===== Clip de bienvenue : overlay autonome (plus un widget de scène) =====
      //
      // L'overlay est créé une fois au démarrage (hors widgetMap), caché par
      // défaut. Il s'affiche au message WS welcome-clip-play, se cache au
      // welcome-clip-stop. Sa position/taille sont pilotées par welcome-clip-config
      // (défaut : bas-droite 480x270 sur canvas 1920x1080). Coordonnées en pixels
      // canvas (le stage n'est jamais rescalé — cf. commentaire en tête de fichier).

      var welcomeRoot = null;       // div racine positionnable (x/y/w/h, z)
      var welcomeClipEl = null;     // div.widget.welcome-clip (carte verticale)
      var welcomeEnteteEl = null;   // en-tête : avatar rond + pseudo + CTA + bio
      var welcomeAvatarEl = null;
      var welcomePseudoEl = null;
      var welcomeBioEl = null;
      var welcomeVideoWrapEl = null; // wrapper 16:9 (padding-bottom)
      var welcomeVideoEl = null;

      // Config par défaut (320x352, ratio ~11:10 — carte avatar+bio+clip 16:9).
      var welcomeConfig = { x: 1480, y: 580, largeur: 320, hauteur: 352 };

      /// Crée l'overlay welcome une fois (au démarrage). Idempotent.
      function initWelcomeOverlay() {
        if (welcomeRoot) return;

        welcomeRoot = document.createElement("div");
        welcomeRoot.className = "welcome-clip-root";
        welcomeRoot.style.position = "absolute";
        welcomeRoot.style.display = "none";
        welcomeRoot.style.zIndex = "9999";

        welcomeClipEl = document.createElement("div");
        welcomeClipEl.className = "widget welcome-clip";

        // En-tête (colonne centrée) : avatar rond → pseudo → CTA → bio.
        welcomeEnteteEl = document.createElement("div");
        welcomeEnteteEl.className = "welcome-clip-entete";

        welcomeAvatarEl = document.createElement("img");
        welcomeAvatarEl.className = "welcome-clip-avatar";
        welcomeAvatarEl.alt = "";
        welcomeAvatarEl.src = "";
        welcomeAvatarEl.style.display = "none";

        welcomePseudoEl = document.createElement("span");
        welcomePseudoEl.className = "welcome-clip-pseudo";

        var ctaEl = document.createElement("span");
        ctaEl.className = "welcome-clip-cta";
        ctaEl.textContent = "Checkout and follow";

        welcomeBioEl = document.createElement("span");
        welcomeBioEl.className = "welcome-clip-bio";
        welcomeBioEl.style.display = "none";

        welcomeEnteteEl.appendChild(welcomeAvatarEl);
        welcomeEnteteEl.appendChild(welcomePseudoEl);
        welcomeEnteteEl.appendChild(ctaEl);
        welcomeEnteteEl.appendChild(welcomeBioEl);

        welcomeVideoEl = document.createElement("video");
        welcomeVideoEl.className = "welcome-clip-video";
        welcomeVideoEl.playsInline = true;
        welcomeVideoEl.autoplay = true;
        welcomeVideoEl.muted = false;
        welcomeVideoEl.controls = false;
        welcomeVideoEl.preload = "auto";

        var videoWrap = document.createElement("div");
        videoWrap.className = "welcome-clip-video-wrap";
        videoWrap.style.display = "none";

        videoWrap.appendChild(welcomeVideoEl);

        welcomeVideoWrapEl = videoWrap;

        welcomeClipEl.appendChild(welcomeEnteteEl);
        welcomeClipEl.appendChild(videoWrap);
        welcomeRoot.appendChild(welcomeClipEl);
        stageEl.appendChild(welcomeRoot);

        applyWelcomeOverlayConfig(welcomeConfig);
      }

      /// Applique la config (x/y/largeur) au root welcome. La hauteur est
      /// auto — la carte s'ajuste exactement à son contenu (avatar + bio +
      /// clip 16:9), sans espace vide en dessous.
      function applyWelcomeOverlayConfig(cfg) {
        if (!welcomeRoot) return;
        if (typeof cfg.x === "number") welcomeConfig.x = cfg.x;
        if (typeof cfg.y === "number") welcomeConfig.y = cfg.y;
        if (typeof cfg.largeur === "number") welcomeConfig.largeur = cfg.largeur;
        if (typeof cfg.hauteur === "number") welcomeConfig.hauteur = cfg.hauteur;
        welcomeRoot.style.left = welcomeConfig.x + "px";
        welcomeRoot.style.top = welcomeConfig.y + "px";
        welcomeRoot.style.width = welcomeConfig.largeur + "px";
        // Hauteur auto : la carte grandit selon son contenu.
        welcomeRoot.style.height = "auto";
      }

      /// Joue un clip de bienvenue : affiche le bandeau immédiatement, puis
      /// charge la vidéo et ne l'affiche + la joue qu'une fois assez de données
      /// bufferées (canplay) → évite l'écran noir et le stuttering au démarrage.
      function playWelcomeClip(msg) {
        if (!welcomeRoot) {
          return;
        }
        var viewer = msg.viewer || {};
        var clip = msg.clip || {};

        // En-tête : avatar rond + pseudo + bio Twitch.
        if (viewer.avatar) {
          welcomeAvatarEl.src = viewer.avatar;
          welcomeAvatarEl.style.display = "block";
        } else {
          welcomeAvatarEl.style.display = "none";
        }
        welcomePseudoEl.textContent = viewer.display_name || viewer.login || "";
        if (viewer.bio) {
          welcomeBioEl.textContent = viewer.bio;
          welcomeBioEl.style.display = "-webkit-box";
        } else {
          welcomeBioEl.style.display = "none";
        }

        // Afficher le root + la carte IMMÉDIATEMENT (le viewer voit tout de
        // suite qui arrive, pendant que la vidéo buffer en arrière-plan).
        welcomeRoot.style.display = "block";
        // Cadre SVG : mesurer la carte une fois affichée (hauteur auto).
        requestAnimationFrame(function () {
          appliquerCadreOverlay(welcomeClipEl, "welcome");
        });

        // Nettoyer les handlers précédents (au cas où stop n'a pas tourné).
        welcomeVideoEl.oncanplay = null;
        welcomeVideoEl.onerror = null;

        // Charger la vidéo. On ne l'affiche + ne la joue qu'à canplay (assez
        // de données pour démarrer sans stuttering). La vidéo reste cachée
        // pendant le buffering → pas d'écran noir.
        welcomeVideoEl.src = clip.mp4_url || "";

        welcomeVideoEl.oncanplay = function () {
          welcomeVideoWrapEl.style.display = "block";
          welcomeVideoEl.play().catch(function () {});
          // La vidéo change la hauteur de la carte → re-mesurer le cadre.
          requestAnimationFrame(function () {
            appliquerCadreOverlay(welcomeClipEl, "welcome");
          });
          // One-shot : nettoyer après le 1er canplay.
          welcomeVideoEl.oncanplay = null;
        };

        // À la fin de la vidéo → le timer Rust émettra welcome-clip-stop.
        // (pas de stop automatique ici — le timer Rust est la source de vérité)
      }

      /// Stop : cacher l'overlay + reset vidéo + retirer le cadre SVG.
      function stopWelcomeClip() {
        if (!welcomeRoot) return;
        welcomeVideoEl.oncanplay = null;
        welcomeVideoEl.onerror = null;
        welcomeVideoEl.pause();
        welcomeVideoEl.removeAttribute("src");
        welcomeVideoEl.load();
        welcomeVideoWrapEl.style.display = "none";
        welcomeVideoEl.style.display = "block";
        welcomeRoot.style.display = "none";
        if (welcomeClipEl) nettoyerCadreOverlay(welcomeClipEl, "welcome");
      }

      // Initialiser l'overlay welcome dès le démarrage (avant connect).
      initWelcomeOverlay();

      // ===== Bandeau premier message : overlay autonome =====
      //
      // Pleine largeur, en bas (défaut) ou en haut. Couleurs dérivées du cadre
      // widget de la scène active (currentScene.cadreWidget). Sans cadre actif,
      // thème noir & blanc (--fond #0a0a0a / --texte #e0e0e0).

      var bpmRoot = null;        // div racine positionnable
      var bpmBarre = null;       // barre pleine largeur
      var bpmAvatarEl = null;
      var bpmPseudoEl = null;
      var bpmMessageEl = null;
      var bpmVisible = false;

      // Config courante (position + duree). MAJ via bandeau-premier-message-config.
      var bpmConfig = { duree_ms: 6000, position: "bas" };

      // Couleurs par défaut (noir & blanc) — utilisées si aucun cadre actif.
      var BPM_COULEURS_DEFAUT = { p: "#e0e0e0", s: "#a0a0a0" };

      function bpmHexValide(h) {
        return /^#[0-9a-f]{6}$/i.test(String(h || ""));
      }

      /// Convertit #rrggbb → "r, g, b" pour rgba().
      function bpmHexVersRgb(hex) {
        var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ""));
        if (!m) return "224, 224, 224";
        var n = parseInt(m[1], 16);
        return ((n >> 16) & 0xff) + ", " + ((n >> 8) & 0xff) + ", " + (n & 0xff);
      }

      /// Assombrit une couleur hex d'un ratio (0 = inchangé, 1 = noir).
      function bpmAssombrir(hex, ratio) {
        var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ""));
        if (!m) return "#0a0a0a";
        var r = Math.min(1, Math.max(0, Number(ratio) || 0));
        var n = parseInt(m[1], 16);
        var rr = Math.round(((n >> 16) & 0xff) * (1 - r));
        var gg = Math.round(((n >> 8) & 0xff) * (1 - r));
        var bb = Math.round((n & 0xff) * (1 - r));
        function pad(v) { return v.toString(16).padStart(2, "0"); }
        return "#" + pad(rr) + pad(gg) + pad(bb);
      }

      /// Éclaircit une couleur hex d'un ratio (0 = inchangé, 1 = blanc).
      function bpmEclaircir(hex, ratio) {
        var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ""));
        if (!m) return "#f5f5f5";
        var r = Math.min(1, Math.max(0, Number(ratio) || 0));
        var n = parseInt(m[1], 16);
        var rr = Math.round(((n >> 16) & 0xff) + (255 - ((n >> 16) & 0xff)) * r);
        var gg = Math.round(((n >> 8) & 0xff) + (255 - ((n >> 8) & 0xff)) * r);
        var bb = Math.round((n & 0xff) + (255 - (n & 0xff)) * r);
        function pad(v) { return v.toString(16).padStart(2, "0"); }
        return "#" + pad(rr) + pad(gg) + pad(bb);
      }

      /// Résout les couleurs { p, s } depuis le cadre widget de la scène active.
      /// Tous les styles utilisent couleur/couleurFin (couleurFin invalide →
      /// dérivée de couleur, jamais de noir). Fallback → BPM_COULEURS_DEFAUT.
      function bpmResoudreCouleurs() {
        var cadre = currentScene && currentScene.cadreWidget;
        if (!cadre || !cadre.actif) return BPM_COULEURS_DEFAUT;
        var c1 = bpmHexValide(cadre.couleur) ? cadre.couleur : null;
        var c2 = bpmHexValide(cadre.couleurFin) ? cadre.couleurFin : null;
        if (c1 && c2) return { p: c1, s: c2 };
        if (c1) return { p: c1, s: bpmAssombrir(c1, 0.25) };
        return BPM_COULEURS_DEFAUT;
      }

      /// Applique les couleurs CSS au root bandeau.
      function bpmAppliquerCouleurs() {
        if (!bpmRoot) return;
        var col = bpmResoudreCouleurs();
        bpmRoot.style.setProperty("--bpm-prim", col.p);
        bpmRoot.style.setProperty("--bpm-sec", col.s);
        bpmRoot.style.setProperty("--bpm-rgb-prim", bpmHexVersRgb(col.p));
        bpmRoot.style.setProperty("--bpm-rgb-sec", bpmHexVersRgb(col.s));
        // Fond barre : version assombrie de la primaire (teinte visible mais
        // assez sombre pour le texte blanc). Rendue OPAQUE dans le gradient
        // de .bandeau-pm-barre (noir -> teinte -> noir, fond solide).
        bpmRoot.style.setProperty("--bpm-rgb-fond", bpmHexVersRgb(bpmAssombrir(col.p, 0.55)));
      }

      /// Crée l'overlay bandeau une fois (au démarrage). Idempotent.
      function initBandeauPMOverlay() {
        if (bpmRoot) return;

        bpmRoot = document.createElement("div");
        bpmRoot.className = "bandeau-pm-root pos-bas";
        bpmRoot.style.display = "none";

        bpmBarre = document.createElement("div");
        bpmBarre.className = "bandeau-pm-barre";

        var ligneEl = document.createElement("div");
        ligneEl.className = "bandeau-pm-ligne";

        var contenuEl = document.createElement("div");
        contenuEl.className = "bandeau-pm-contenu";

        // Badge "Premier message"
        var badgeEl = document.createElement("div");
        badgeEl.className = "bandeau-pm-badge";
        var badgeIcone = document.createElement("span");
        badgeIcone.className = "bandeau-pm-badge-icone";
        badgeIcone.textContent = "✦";
        var badgeTexte = document.createElement("span");
        badgeTexte.className = "bandeau-pm-badge-texte";
        badgeTexte.textContent = "Premier message";
        badgeEl.appendChild(badgeIcone);
        badgeEl.appendChild(badgeTexte);

        // Avatar
        bpmAvatarEl = document.createElement("img");
        bpmAvatarEl.className = "bandeau-pm-avatar";
        bpmAvatarEl.alt = "";
        bpmAvatarEl.style.display = "none";

        // Pseudo + message
        bpmPseudoEl = document.createElement("span");
        bpmPseudoEl.className = "bandeau-pm-pseudo";
        bpmMessageEl = document.createElement("span");
        bpmMessageEl.className = "bandeau-pm-message";

        var texteWrap = document.createElement("div");
        texteWrap.className = "bandeau-pm-texte";
        texteWrap.appendChild(bpmPseudoEl);
        texteWrap.appendChild(bpmMessageEl);

        contenuEl.appendChild(badgeEl);
        contenuEl.appendChild(bpmAvatarEl);
        contenuEl.appendChild(texteWrap);

        bpmBarre.appendChild(ligneEl);
        bpmBarre.appendChild(contenuEl);
        bpmRoot.appendChild(bpmBarre);
        stageEl.appendChild(bpmRoot);

        bpmAppliquerCouleurs();
      }

      /// Applique la config (position/duree) au root bandeau.
      function applyBandeauPMConfig(cfg) {
        if (typeof cfg.duree_ms === "number") bpmConfig.duree_ms = cfg.duree_ms;
        if (cfg.position === "bas" || cfg.position === "haut") {
          bpmConfig.position = cfg.position;
          if (bpmRoot) {
            bpmRoot.classList.remove("pos-bas", "pos-haut");
            bpmRoot.classList.add("pos-" + cfg.position);
          }
        }
      }

      /// Affiche le bandeau avec les infos du viewer.
      function playBandeauPM(msg) {
        if (!bpmRoot) {
          return;
        }
        var viewer = msg.viewer || {};
        // Avatar
        if (viewer.avatar) {
          bpmAvatarEl.src = viewer.avatar;
          bpmAvatarEl.style.display = "inline-block";
        } else {
          bpmAvatarEl.style.display = "none";
        }
        bpmPseudoEl.textContent = viewer.display_name || "";
        bpmMessageEl.textContent = msg.message || "";

        // Rafraîchir les couleurs (la scène a pu changer depuis l'init).
        bpmAppliquerCouleurs();

        // Afficher (transition CSS gère l'animation).
        bpmRoot.style.display = "block";
        // Forcer un reflow pour rejouer la transition si déjà visible.
        void bpmRoot.offsetWidth;
        bpmRoot.classList.add("visible");
        bpmVisible = true;
      }

      /// Cache le bandeau.
      function stopBandeauPM() {
        if (!bpmRoot) return;
        bpmRoot.classList.remove("visible");
        bpmVisible = false;
        // Masquer complètement après la transition (500ms).
        setTimeout(function () {
          if (!bpmVisible && bpmRoot) bpmRoot.style.display = "none";
        }, 550);
      }

      // Initialiser l'overlay bandeau dès le démarrage (après currentScene).
      let currentScene = { widgets: [] };
      initBandeauPMOverlay();

      // ===== Alertes Twitch : overlay autonome (follow/raid/sub/resub/subgift/bits) =====
      //
      // Messages WS (émis par alertes.rs) :
      //   alerte-config → config complète par type (fallback couleurs/taille)
      //   alerte-play   → { alerte: { type, texte, son, couleur, taille_px, duree_ms } }
      //   alerte-stop   → cache l'overlay (autoritaire ; fallback timer local)
      // Son : fichier importé servi par :4321 sur /medias/ (chemin relatif).
      var alerteRoot = null;
      var alerteCardEl = null;
      var alerteTexteEl = null;
      var alerteMediaEl = null;
      var alerteConfig = {};
      // Position/taille de l'overlay — MÊME mécanique que welcomeConfig
      // (x/y/largeur poussés par alerte-config, hauteur auto = la carte
      // s'ajuste à son contenu).
      var alerteOverlay = { x: 660, y: 60, largeur: 600, hauteur: 120 };
      var alerteTimer = null;
      var alerteAudio = null;
      var alerteVisible = false;

      // ===== Cadre SVG sur les overlays (alerte + clip de bienvenue) =====
      //
      // Les cartes des overlays autonomes suivent le cadre widget de la scène
      // courante (currentScene.cadreWidget) — même règle que applyCadreWidget :
      // actif si actif && strokeWidth > 0. La carte est mesurée APRÈS affichage
      // (hauteur auto) → SVG généré à la taille réelle + clip-path sur la
      // carte. Clé de hash (cadreKey) pour ne recréer que si changé.
      var cadreOverlayEls = {}; // idCadre → { overlayEl, key }
      function appliquerCadreOverlay(carteEl, idCadre) {
        if (!carteEl) return;
        var cadre = currentScene && currentScene.cadreWidget ? currentScene.cadreWidget : null;
        var actif = cadre && cadre.actif && (cadre.strokeWidth || 0) > 0;
        var memo = cadreOverlayEls[idCadre];
        if (!actif) {
          if (memo) {
            if (memo.overlayEl) memo.overlayEl.remove();
            delete cadreOverlayEls[idCadre];
          }
          carteEl.style.clipPath = "";
          carteEl.style.webkitClipPath = "";
          return;
        }
        var W = carteEl.offsetWidth;
        var H = carteEl.offsetHeight;
        if (!W || !H) return; // carte pas encore mesurable → rappelé après affichage
        var newKey = cadreKey(cadre, W, H);
        if (memo && memo.key === newKey && memo.overlayEl && memo.overlayEl.parentNode === carteEl) return;
        if (memo && memo.overlayEl) memo.overlayEl.remove();
        var overlay = document.createElement("div");
        overlay.className = "cadre-overlay";
        overlay.innerHTML = genererCadreSVG(cadre, W, H, idCadre);
        carteEl.appendChild(overlay);
        var clip = genererCadreClipPath(cadre, W, H);
        if (clip) {
          carteEl.style.clipPath = clip;
          carteEl.style.webkitClipPath = clip;
        } else {
          carteEl.style.clipPath = "";
          carteEl.style.webkitClipPath = "";
        }
        cadreOverlayEls[idCadre] = { overlayEl: overlay, key: newKey };
      }

      /// Retire le cadre SVG d'une carte overlay (au stop).
      function nettoyerCadreOverlay(carteEl, idCadre) {
        var memo = cadreOverlayEls[idCadre];
        if (memo && memo.overlayEl) memo.overlayEl.remove();
        delete cadreOverlayEls[idCadre];
        if (carteEl) {
          carteEl.style.clipPath = "";
          carteEl.style.webkitClipPath = "";
        }
      }

      /// Crée l'overlay alerte une fois (au démarrage). Idempotent.
      function initAlerteOverlay() {
        if (alerteRoot) return;
        alerteRoot = document.createElement("div");
        alerteRoot.className = "alerte-root";
        alerteRoot.style.display = "none";
        var carte = document.createElement("div");
        carte.className = "alerte-card";
        alerteTexteEl = document.createElement("span");
        alerteTexteEl.className = "alerte-texte";
        carte.appendChild(alerteTexteEl);
        alerteCardEl = carte;
        alerteRoot.appendChild(carte);
        stageEl.appendChild(alerteRoot);
        // Position/taille par défaut (surchargées par alerte-config).
        applyAlerteOverlayConfig(alerteOverlay);
      }

      /// Applique la config (x/y/largeur) au root alerte — même mécanique que
      /// applyWelcomeOverlayConfig. La hauteur est auto (la carte s'ajuste à
      /// son contenu).
      function applyAlerteOverlayConfig(cfg) {
        if (!alerteRoot) return;
        if (typeof cfg.x === "number") alerteOverlay.x = cfg.x;
        if (typeof cfg.y === "number") alerteOverlay.y = cfg.y;
        if (typeof cfg.largeur === "number") alerteOverlay.largeur = cfg.largeur;
        if (typeof cfg.hauteur === "number") alerteOverlay.hauteur = cfg.hauteur;
        alerteRoot.style.left = alerteOverlay.x + "px";
        alerteRoot.style.top = alerteOverlay.y + "px";
        alerteRoot.style.width = alerteOverlay.largeur + "px";
      }

      /// Applique la config (couleurs/tailles par type + overlay position).
      function applyAlerteConfig(cfg) {
        alerteConfig = cfg || {};
        if (cfg.overlay) applyAlerteOverlayConfig(cfg.overlay);
      }

      /// Affiche l'alerte (média image/vidéo ou icône + texte + son) avec
      /// auto-hide fallback. Texte au-dessus, média dessous. Son : mode image
      /// → son importé ; mode vidéo → son porté par la vidéo.
      function playAlerte(msg) {
        if (!alerteRoot) {
          return;
        }
        var a = msg.alerte || {};
        var type = a.type || "";
        var cfgType = alerteConfig[type] || {};
        alerteTexteEl.textContent = a.texte || "";
        // Couleur du texte = couleur du cadre widget de la scène si actif,
        // sinon blanc (plus de champ couleur sur les alertes).
        var couleur = "#ffffff";
        var cadreW = currentScene && currentScene.cadreWidget;
        if (cadreW && cadreW.actif) {
          couleur = bpmResoudreCouleurs().p;
        }
        alerteRoot.style.setProperty("--alerte-couleur", couleur);
        alerteRoot.style.setProperty("--alerte-taille", (a.taille_px || cfgType.taille_px || 48) + "px");

        // Média : vidéo (son inclus) ou image (son séparé). Sans média →
        // icône emoji (comportement historique).
        if (alerteMediaEl) {
          alerteMediaEl.remove();
          alerteMediaEl = null;
        }
        if (a.media && a.media_kind === "video") {
          var vid = document.createElement("video");
          vid.className = "alerte-media";
          vid.src = "/" + a.media;
          vid.autoplay = true;
          vid.setAttribute("playsinline", "");
          vid.oncanplay = function () {
            vid.oncanplay = null;
            // La vidéo change la hauteur de la carte → re-mesurer le cadre.
            appliquerCadreOverlay(alerteCardEl, "alerte");
          };
          alerteMediaEl = vid;
        } else if (a.media) {
          var img = document.createElement("img");
          img.className = "alerte-media";
          img.alt = "";
          img.onload = function () {
            img.onload = null;
            appliquerCadreOverlay(alerteCardEl, "alerte");
          };
          img.src = "/" + a.media;
          alerteMediaEl = img;
        }
        if (alerteMediaEl) {
          alerteMediaEl.style.display = "block";
          alerteCardEl.appendChild(alerteMediaEl);
        }

        // Son : mode image → son importé ; mode vidéo → rien de plus (le son
        // est dans la vidéo).
        if (alerteAudio) {
          alerteAudio.pause();
          alerteAudio = null;
        }
        if (a.son && a.media_kind !== "video") {
          try {
            alerteAudio = new Audio("/" + a.son);
            alerteAudio.volume = 0.8;
            alerteAudio.play().catch(function () {});
          } catch {
          }
        }

        // Afficher (transition CSS gère le pop-in).
        alerteRoot.style.display = "block";
        void alerteRoot.offsetWidth;
        alerteRoot.classList.add("visible");
        alerteVisible = true;
        // Cadre SVG : mesurer la carte une fois affichée (hauteur auto).
        requestAnimationFrame(function () {
          appliquerCadreOverlay(alerteCardEl, "alerte");
        });

        // Fallback local : l'alerte-stop Rust est autoritaire, mais si perdu
        // (WS lag) on cache après duree_ms + 500ms de marge.
        if (alerteTimer) clearTimeout(alerteTimer);
        var duree = (a.duree_ms || cfgType.duree_ms || 5000) + 500;
        alerteTimer = setTimeout(function () {
          if (alerteVisible) stopAlerte();
        }, duree);
      }

      /// Cache l'alerte + stoppe le son/média.
      function stopAlerte() {
        if (alerteTimer) {
          clearTimeout(alerteTimer);
          alerteTimer = null;
        }
        if (alerteAudio) {
          alerteAudio.pause();
          alerteAudio = null;
        }
        if (alerteMediaEl) {
          if (alerteMediaEl.tagName === "VIDEO") {
            alerteMediaEl.pause();
            alerteMediaEl.removeAttribute("src");
            alerteMediaEl.load();
          }
          alerteMediaEl.remove();
          alerteMediaEl = null;
        }
        if (!alerteRoot) return;
        alerteRoot.classList.remove("visible");
        alerteVisible = false;
        if (alerteCardEl) nettoyerCadreOverlay(alerteCardEl, "alerte");
        setTimeout(function () {
          if (!alerteVisible && alerteRoot) alerteRoot.style.display = "none";
        }, 500);
      }

      // Initialiser l'overlay alerte dès le démarrage.
      initAlerteOverlay();

      // ===== Commandes chat (!commande → overlay diffusion) =====
      //
      // Même mécanique que les alertes : carte texte au-dessus + média
      // dessous, cadre SVG = cadre widget de la scène. z 9996 (sous les
      // alertes 9997). La config (liste des commandes) arrive par WS
      // commande-config ; le play/stop par commande-play / commande-stop.

      var commandeRoot = null;
      var commandeCardEl = null;
      var commandeTexteEl = null;
      var commandeMediaEl = null;
      var commandeTimer = null;
      var commandeAudio = null;
      var commandeVisible = false;
      // Position/taille de l'overlay — MÊME squelette que welcome/alertes
      // (poussé par commande-config / position-overlay-config).
      var commandeOverlay = { x: 660, y: 60, largeur: 600, hauteur: 120 };

      /// Crée l'overlay commande une fois (au démarrage). Idempotent.
      function initCommandeOverlay() {
        if (commandeRoot) return;
        commandeRoot = document.createElement("div");
        commandeRoot.className = "commande-root";
        commandeRoot.style.display = "none";
        var carte = document.createElement("div");
        carte.className = "commande-card";
        commandeTexteEl = document.createElement("span");
        commandeTexteEl.className = "commande-texte";
        carte.appendChild(commandeTexteEl);
        commandeCardEl = carte;
        commandeRoot.appendChild(carte);
        stageEl.appendChild(commandeRoot);
        // Position/taille par défaut (surchargées par commande-config).
        applyCommandeOverlayConfig(commandeOverlay);
      }

      /// Applique la config (x/y/largeur) au root commande — même mécanique
      /// que applyAlerteOverlayConfig. La hauteur est auto (carte = contenu).
      function applyCommandeOverlayConfig(cfg) {
        if (!commandeRoot) return;
        if (typeof cfg.x === "number") commandeOverlay.x = cfg.x;
        if (typeof cfg.y === "number") commandeOverlay.y = cfg.y;
        if (typeof cfg.largeur === "number") commandeOverlay.largeur = cfg.largeur;
        if (typeof cfg.hauteur === "number") commandeOverlay.hauteur = cfg.hauteur;
        commandeRoot.style.left = commandeOverlay.x + "px";
        commandeRoot.style.top = commandeOverlay.y + "px";
        commandeRoot.style.width = commandeOverlay.largeur + "px";
      }

      /// Affiche la commande (texte + média/son optionnels) + cadre SVG.
      function playCommande(msg) {
        if (!commandeRoot) {
          return;
        }
        var c = msg.commande || {};
        commandeTexteEl.textContent = c.texte || "";
        // Couleur du texte = couleur du cadre widget de la scène si actif,
        // sinon blanc (plus de champ couleur sur les commandes).
        var couleur = "#ffffff";
        var cadreW = currentScene && currentScene.cadreWidget;
        if (cadreW && cadreW.actif) {
          couleur = bpmResoudreCouleurs().p;
        }
        commandeRoot.style.setProperty("--commande-couleur", couleur);
        commandeRoot.style.setProperty(
          "--commande-taille",
          (c.taille_px || 48) + "px"
        );

        // Média : vidéo (son inclus) ou image (son séparé via c.son).
        if (commandeMediaEl) {
          commandeMediaEl.remove();
          commandeMediaEl = null;
        }
        if (c.media && c.media_kind === "video") {
          var vid = document.createElement("video");
          vid.className = "commande-media";
          vid.src = "/" + c.media;
          vid.autoplay = true;
          vid.setAttribute("playsinline", "");
          vid.oncanplay = function () {
            vid.oncanplay = null;
            // La vidéo change la hauteur de la carte → re-mesurer le cadre.
            requestAnimationFrame(function () {
              appliquerCadreOverlay(commandeCardEl, "commande");
            });
          };
          commandeMediaEl = vid;
        } else if (c.media) {
          var img = document.createElement("img");
          img.className = "commande-media";
          img.alt = "";
          img.onload = function () {
            img.onload = null;
            appliquerCadreOverlay(commandeCardEl, "commande");
          };
          img.src = "/" + c.media;
          commandeMediaEl = img;
        }
        if (commandeMediaEl) {
          commandeMediaEl.style.display = "block";
          commandeCardEl.appendChild(commandeMediaEl);
        }

        // Son : mode image → son importé ; mode vidéo → son porté par la vidéo.
        if (commandeAudio) {
          commandeAudio.pause();
          commandeAudio = null;
        }
        if (c.son && c.media_kind !== "video") {
          try {
            commandeAudio = new Audio("/" + c.son);
            commandeAudio.volume = 0.8;
            commandeAudio.play().catch(function () {});
          } catch {
          }
        }

        // Afficher (transition CSS gère le pop-in).
        commandeRoot.style.display = "block";
        void commandeRoot.offsetWidth;
        commandeRoot.classList.add("visible");
        commandeVisible = true;
        // Cadre SVG : mesurer la carte une fois affichée (hauteur auto).
        requestAnimationFrame(function () {
          appliquerCadreOverlay(commandeCardEl, "commande");
        });

        // Fallback local : le commande-stop Rust est autoritaire, mais si
        // perdu (WS lag) on cache après duree_ms + 500ms de marge.
        if (commandeTimer) clearTimeout(commandeTimer);
        var duree = (c.duree_ms || 5000) + 500;
        commandeTimer = setTimeout(function () {
          if (commandeVisible) stopCommande();
        }, duree);
      }

      /// Cache la commande + stoppe le son/média.
      function stopCommande() {
        if (commandeTimer) {
          clearTimeout(commandeTimer);
          commandeTimer = null;
        }
        if (commandeAudio) {
          commandeAudio.pause();
          commandeAudio = null;
        }
        if (commandeMediaEl) {
          if (commandeMediaEl.tagName === "VIDEO") {
            commandeMediaEl.pause();
            commandeMediaEl.removeAttribute("src");
            commandeMediaEl.load();
          }
          commandeMediaEl.remove();
          commandeMediaEl = null;
        }
        if (!commandeRoot) return;
        commandeRoot.classList.remove("visible");
        commandeVisible = false;
        if (commandeCardEl) nettoyerCadreOverlay(commandeCardEl, "commande");
        setTimeout(function () {
          if (!commandeVisible && commandeRoot) commandeRoot.style.display = "none";
        }, 500);
      }

      // Initialiser l'overlay commande dès le démarrage.
      initCommandeOverlay();

      // ===== Pad numérique (16 touches Numpad × 3 plages → overlay diffusion) =====
      //
      // Même squelette que alertes/commandes mais SANS texte (juste le média).
      // z 9995 (sous commandes 9996 et alertes 9997). Le pad est déclenché
      // manuellement par le streamer via le pavé numérique. La position/taille
      // est partagée avec welcome/alertes/commandes (position-overlay-config).
      // Audio : joué côté diffusion (OBS capte) ET côté dashboard (le user
      // entend sur son PC — géré par le store padNumerique.ts).

      var padRoot = null;
      var padCardEl = null;
      var padMediaEl = null;
      var padTimer = null;
      var padAudio = null;
      var padVisible = false;
      // Position/taille de l'overlay — MÊME squelette que welcome/alertes/commandes
      // (poussé par position-overlay-config).
      var padOverlay = { x: 660, y: 60, largeur: 600, hauteur: 120 };

      /// Crée l'overlay pad une fois (au démarrage). Idempotent.
      function initPadOverlay() {
        if (padRoot) return;
        padRoot = document.createElement("div");
        padRoot.className = "pad-root";
        padRoot.style.display = "none";
        var carte = document.createElement("div");
        carte.className = "pad-card";
        padCardEl = carte;
        padRoot.appendChild(carte);
        stageEl.appendChild(padRoot);
        // Position/taille par défaut (surchargées par position-overlay-config).
        applyPadOverlayConfig(padOverlay);
      }

      /// Applique la config (x/y/largeur) au root pad — même mécanique que
      /// applyAlerteOverlayConfig / applyCommandeOverlayConfig.
      function applyPadOverlayConfig(cfg) {
        if (!padRoot) return;
        if (typeof cfg.x === "number") padOverlay.x = cfg.x;
        if (typeof cfg.y === "number") padOverlay.y = cfg.y;
        if (typeof cfg.largeur === "number") padOverlay.largeur = cfg.largeur;
        if (typeof cfg.hauteur === "number") padOverlay.hauteur = cfg.hauteur;
        padRoot.style.left = padOverlay.x + "px";
        padRoot.style.top = padOverlay.y + "px";
        padRoot.style.width = padOverlay.largeur + "px";
      }

      /// Affiche le média du pad (image/vidéo) + joue le son + effets bounce/zoom.
      /// Pour l'audio pur : pas de média affiché, juste le son joué.
      function playPad(msg) {
        if (!padRoot) {
          return;
        }
        var p = msg.pad || {};
        var mediaType = p.media_type || "";
        var media = p.media || null;
        var mediaKind = p.media_kind || null;
        var son = p.son || null;
        var volume = typeof p.volume === "number" ? p.volume : 1.0;
        var dureeMs = p.duree_ms || 5000;
        var bounce = !!p.bounce;
        var zoom = !!p.zoom;

        // Nettoyer le média précédent.
        if (padMediaEl) {
          padMediaEl.remove();
          padMediaEl = null;
        }

        // Média : vidéo (son inclus) ou image (son séparé). Audio pur → pas de média.
        if (media && mediaKind === "video") {
          var vid = document.createElement("video");
          vid.className = "pad-media";
          vid.src = "/" + media;
          vid.autoplay = true;
          vid.volume = volume;
          vid.setAttribute("playsinline", "");
          if (bounce) vid.classList.add("pad-bounce");
          if (zoom) vid.classList.add("pad-zoom");
          vid.oncanplay = function () {
            vid.oncanplay = null;
            requestAnimationFrame(function () {
              appliquerCadreOverlay(padCardEl, "pad");
            });
          };
          padMediaEl = vid;
        } else if (media) {
          var img = document.createElement("img");
          img.className = "pad-media";
          img.alt = "";
          if (bounce) img.classList.add("pad-bounce");
          if (zoom) img.classList.add("pad-zoom");
          img.onload = function () {
            img.onload = null;
            appliquerCadreOverlay(padCardEl, "pad");
          };
          img.src = "/" + media;
          padMediaEl = img;
        }
        if (padMediaEl) {
          padMediaEl.style.display = "block";
          padCardEl.appendChild(padMediaEl);
        }

        // Son : mode image → son importé ; mode vidéo → son porté par la vidéo ;
        // mode audio pur → son = média principal.
        if (padAudio) {
          padAudio.pause();
          padAudio = null;
        }
        var sonSrc = null;
        if (mediaType === "audio" && media) {
          sonSrc = media;
        } else if (son && mediaKind !== "video") {
          sonSrc = son;
        }
        if (sonSrc) {
          try {
            padAudio = new Audio("/" + sonSrc);
            padAudio.volume = volume;
            padAudio.play().catch(function () {});
          } catch {
          }
        }

        // Afficher (transition CSS gère le pop-in) — seulement si on a un média
        // à afficher (image/video). L'audio pur n'affiche rien.
        if (padMediaEl) {
          padRoot.style.display = "block";
          void padRoot.offsetWidth;
          padRoot.classList.add("visible");
          padVisible = true;
          // Cadre SVG : mesurer la carte une fois affichée.
          requestAnimationFrame(function () {
            appliquerCadreOverlay(padCardEl, "pad");
          });
        }

        // Fallback local : le pad-stop Rust est autoritaire, mais si perdu
        // (WS lag) on cache après duree_ms + 500ms de marge.
        if (padTimer) clearTimeout(padTimer);
        var duree = dureeMs + 500;
        padTimer = setTimeout(function () {
          if (padVisible || padAudio) stopPad();
        }, duree);
      }

      /// Cache le pad + stoppe le son/média.
      function stopPad() {
        if (padTimer) {
          clearTimeout(padTimer);
          padTimer = null;
        }
        if (padAudio) {
          padAudio.pause();
          padAudio = null;
        }
        if (padMediaEl) {
          if (padMediaEl.tagName === "VIDEO") {
            padMediaEl.pause();
            padMediaEl.removeAttribute("src");
            padMediaEl.load();
          }
          padMediaEl.remove();
          padMediaEl = null;
        }
        if (!padRoot) return;
        padRoot.classList.remove("visible");
        padVisible = false;
        if (padCardEl) nettoyerCadreOverlay(padCardEl, "pad");
        setTimeout(function () {
          if (!padVisible && padRoot) padRoot.style.display = "none";
        }, 500);
      }

      // Initialiser l'overlay pad dès le démarrage.
      initPadOverlay();

      // ===== Écran d'attente (BRB) — overlay plein écran =====
      //
      // Porté de l'ancienne app (features/ecran-attente). z 9990 : recouvre
      // toute la scène mais RESTE SOUS les overlays éphémères (pad 9995,
      // commandes 9996, alertes 9997, bandeau 9998, welcome 9999) qui popent
      // par-dessus pendant l'attente — comportement validé par l'utilisateur.
      //
      // Le chrono est détenu par Rust (tâche tokio 1 Hz) : la diffusion se
      // contente d'afficher `temps_restant` reçu dans les frames
      // `ecran-attente-etat` — auto-réparatrice (config + runtime complets à
      // chaque tick → un client reconnecté se réaligne à la frame suivante ;
      // `ecran-attente-resync` couvre les pauses sans tick).
      //
      // Le média (image/vidéo plein cadre cover, vidéo en boucle) n'est
      // RECONSTRUIT que si media|kind change — signature eaMediaSig — pour
      // ne pas recharger la vidéo à chaque tick. Le son est porté par la
      // vidéo (muted = !son, volume appliqué à chaque frame). Sans média →
      // dégradé animé teinté par les couleurs du cadre widget de la scène.
      // Le minuteur est une carte centrée portant le cadre SVG de la scène
      // (appliquerCadreOverlay) ; le titre est en dégradé de texte aux
      // couleurs du cadre (bpmResoudreCouleurs → --ea-prim/--ea-sec).

      var eaRoot = null;        // div racine plein écran
      var eaFondEl = null;      // dégradé animé (visible si pas de média)
      var eaVoileEl = null;     // voile de lisibilité au-dessus du média
      var eaMediaEl = null;     // <img> ou <video> courant
      var eaTitreEl = null;
      var eaMinuteurEl = null;  // carte minuteur (cadre SVG de la scène)
      var eaLabelEl = null;     // "Début dans" / "En pause"
      var eaTempsEl = null;     // "9:58" / "1:02:33"
      var eaMediaSig = "";      // signature "media|kind" de l'élément courant
      var eaVisible = false;
      // Layout « signature » (affichés uniquement si etat.layout !== "minimal")
      var eaStriesEl = null;    // 4 stries néon diagonales + comètes
      var eaStreamyWrap = null; // bloc mascotte (anneaux + image)
      var eaStreamyImg = null;  // streamy-loading / streamy-offline (pause)
      var eaWordmarkEl = null;  // wordmark StreamOS électrique
      var eaMorseEl = null;     // ligne morse ···−−−···

      /// Crée l'overlay écran d'attente une fois. Idempotent.
      function initEcranAttenteOverlay() {
        if (eaRoot) return;
        eaRoot = document.createElement("div");
        eaRoot.className = "ecran-attente-root";
        eaRoot.style.display = "none";

        eaFondEl = document.createElement("div");
        eaFondEl.className = "ecran-attente-fond";

        eaVoileEl = document.createElement("div");
        eaVoileEl.className = "ecran-attente-voile";

        eaTitreEl = document.createElement("div");
        eaTitreEl.className = "ecran-attente-titre";
        eaTitreEl.style.display = "none";

        eaMinuteurEl = document.createElement("div");
        eaMinuteurEl.className = "ecran-attente-minuteur";
        eaLabelEl = document.createElement("span");
        eaLabelEl.className = "ecran-attente-minuteur-label";
        eaTempsEl = document.createElement("span");
        eaTempsEl.className = "ecran-attente-temps";
        eaMinuteurEl.appendChild(eaLabelEl);
        eaMinuteurEl.appendChild(eaTempsEl);

        // ===== Layout « signature » : éléments de marque =====
        // Stries néon diagonales (4 coins, une comète glissante chacune).
        eaStriesEl = document.createElement("div");
        eaStriesEl.className = "ecran-attente-sig-stries";
        for (var i = 0; i < 4; i++) {
          var strie = document.createElement("div");
          strie.className = "sig-strie s" + (i + 1);
          var comet = document.createElement("span");
          comet.className = "sig-comet";
          strie.appendChild(comet);
          eaStriesEl.appendChild(strie);
        }

        // Mascotte Streamy + anneaux orbitaux (swap loading→offline en pause).
        eaStreamyWrap = document.createElement("div");
        eaStreamyWrap.className = "ecran-attente-sig-streamy";
        var orbite = document.createElement("div");
        orbite.className = "sig-orbite";
        eaStreamyImg = document.createElement("img");
        eaStreamyImg.className = "sig-mascotte";
        eaStreamyImg.alt = "";
        eaStreamyImg.src = "/brand/streamy-loading.png";
        eaStreamyWrap.appendChild(orbite);
        eaStreamyWrap.appendChild(eaStreamyImg);

        // Wordmark StreamOS électrique (fond noir neutralisé par screen).
        eaWordmarkEl = document.createElement("img");
        eaWordmarkEl.className = "ecran-attente-sig-wordmark";
        eaWordmarkEl.alt = "StreamOS";
        eaWordmarkEl.src = "/brand/wordmark.png";

        // Ligne morse ···−−−··· (3 points, 3 traits, 3 points).
        eaMorseEl = document.createElement("div");
        eaMorseEl.className = "ecran-attente-sig-morse";
        var morseKinds = ["p", "p", "p", "t", "t", "t", "p", "p", "p"];
        for (var mi = 0; mi < morseKinds.length; mi++) {
          var seg = document.createElement("i");
          seg.className = morseKinds[mi];
          eaMorseEl.appendChild(seg);
        }

        // Ordre de couche : fond → média (inséré avant le voile) → voile →
        // stries → streamy → wordmark → morse → titre → minuteur (le plus
        // haut dans l'overlay). Les éléments signature sont display:none
        // en layout minimal.
        eaRoot.appendChild(eaFondEl);
        eaRoot.appendChild(eaVoileEl);
        eaRoot.appendChild(eaStriesEl);
        eaRoot.appendChild(eaStreamyWrap);
        eaRoot.appendChild(eaWordmarkEl);
        eaRoot.appendChild(eaMorseEl);
        eaRoot.appendChild(eaTitreEl);
        eaRoot.appendChild(eaMinuteurEl);
        stageEl.appendChild(eaRoot);
      }

      /// Teinte le fond + le titre aux couleurs du cadre widget de la scène
      /// (même résolution que le bandeau : couleur/couleurFin unifiées,
      /// fallback neutre).
      function eaAppliquerCouleurs() {
        if (!eaRoot) return;
        var col = bpmResoudreCouleurs();
        eaRoot.style.setProperty("--ea-prim", col.p);
        eaRoot.style.setProperty("--ea-sec", col.s);
        eaRoot.style.setProperty("--ea-rgb-prim", bpmHexVersRgb(col.p));
        eaRoot.style.setProperty("--ea-rgb-sec", bpmHexVersRgb(col.s));
      }

      /// Formate des secondes → "M:SS" ou "H:MM:SS" (comme l'ancienne app).
      function eaFormatTemps(total) {
        var t = Math.max(0, Math.floor(total || 0));
        var h = Math.floor(t / 3600);
        var m = Math.floor((t % 3600) / 60);
        var s = t % 60;
        if (h > 0) {
          return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
        }
        return m + ":" + String(s).padStart(2, "0");
      }

      /// Construit/remplace l'élément média plein écran (img ou vidéo cover,
      /// vidéo en boucle). src = "/" + rel — même mécanique que playPad.
      function eaSetMedia(media, kind) {
        if (eaMediaEl) {
          if (eaMediaEl.tagName === "VIDEO") {
            eaMediaEl.pause();
            eaMediaEl.removeAttribute("src");
            eaMediaEl.load();
          }
          eaMediaEl.remove();
          eaMediaEl = null;
        }
        if (!media) {
          eaFondEl.style.display = "";
          return;
        }
        var el;
        if (kind === "video") {
          el = document.createElement("video");
          el.autoplay = true;
          el.loop = true; // la vidéo boucle tant que l'écran est actif
          el.setAttribute("playsinline", "");
        } else {
          el = document.createElement("img");
          el.alt = "";
        }
        el.className = "ecran-attente-media";
        el.src = "/" + media;
        eaMediaEl = el;
        // Entre le fond dégradé et le voile de lisibilité.
        eaRoot.insertBefore(el, eaVoileEl);
        eaFondEl.style.display = "none"; // média présent → dégradé masqué
      }

      /// Met à jour l'overlay depuis une frame ecran-attente-etat (tick
      /// 1 Hz Rust + transitions + resync). Auto-réparatrice : applique
      /// l'état complet à chaque appel.
      function majEcranAttente(etat) {
        if (!eaRoot) return;
        etat = etat || {};
        if (!etat.actif) {
          eaCacher();
          return;
        }

        // Média : reconstruit UNIQUEMENT si media|kind change — sinon la
        // vidéo se rechargerait à chaque tick (scintillement + re-buffer).
        var media = etat.media || null;
        var kind = etat.media_kind || null;
        var sig = (media || "") + "|" + (kind || "");
        if (sig !== eaMediaSig) {
          eaMediaSig = sig;
          eaSetMedia(media, kind);
        }

        // Layout : "signature" = marque StreamOS (défaut) ; "minimal" =
        // rendu historique (dégradé + titre + minuteur seuls). La classe
        // affiche/masque tout le bloc — live à chaque frame.
        var isSignature = etat.layout !== "minimal";
        eaRoot.classList.toggle("layout-signature", isSignature);

        // Son : porté par la vidéo (muted = !son) — appliqué à chaque frame
        // pour que les réglages son/volume soient live pendant l'attente.
        if (eaMediaEl && eaMediaEl.tagName === "VIDEO") {
          eaMediaEl.muted = !etat.son;
          eaMediaEl.volume = Math.max(
            0,
            Math.min(1, typeof etat.volume === "number" ? etat.volume : 0.5)
          );
        }

        // Titre : dégradé aux couleurs du cadre (--ea-prim/--ea-sec).
        if (etat.afficher_titre && etat.titre) {
          eaTitreEl.textContent = etat.titre;
          eaTitreEl.style.display = "";
        } else {
          eaTitreEl.style.display = "none";
        }

        // Minuteur : label + temps (Rust = source de vérité, jamais de
        // décompte local — la diffusion reflète juste l'état reçu).
        var enPause = !!etat.en_pause;
        eaMinuteurEl.classList.toggle("en-pause", enPause);
        eaLabelEl.textContent = enPause ? "En pause" : "Début dans";
        eaTempsEl.textContent = eaFormatTemps(etat.temps_restant);

        // Swap mascotte : Streamy endormie quand le chrono est en pause.
        if (eaStreamyImg) {
          var streamySrc = enPause
            ? "/brand/streamy-offline.png"
            : "/brand/streamy-loading.png";
          if (eaStreamyImg.getAttribute("src") !== streamySrc) {
            eaStreamyImg.src = streamySrc;
          }
        }

        // Position + échelle de la carte minuteur (config live — le
        // drag/resize de la modale commit pendant que l'écran est actif →
        // déplacement en direct sur la diffusion). left/top = CENTRE de la
        // carte ; l'échelle passe par le transform (transform-origin centre).
        var mx = typeof etat.minuteur_x === "number" ? etat.minuteur_x : 960;
        var my = typeof etat.minuteur_y === "number" ? etat.minuteur_y : 540;
        var mec =
          typeof etat.minuteur_echelle === "number" ? etat.minuteur_echelle : 1;
        mec = Math.max(0.4, Math.min(3, mec));
        eaMinuteurEl.style.left = mx + "px";
        eaMinuteurEl.style.top = my + "px";
        eaMinuteurEl.style.transform =
          "translate(-50%, -50%) scale(" + mec + ")";

        // Position + échelle de Streamy et du wordmark (même mécanique que
        // le minuteur : left/top = centre, transform scale ; live à chaque
        // frame — le drag/resize de la modale se voit en direct).
        var stx = typeof etat.streamy_x === "number" ? etat.streamy_x : 170;
        var sty = typeof etat.streamy_y === "number" ? etat.streamy_y : 180;
        var ste =
          typeof etat.streamy_echelle === "number" ? etat.streamy_echelle : 0.6;
        ste = Math.max(0.3, Math.min(2, ste));
        eaStreamyWrap.style.left = stx + "px";
        eaStreamyWrap.style.top = sty + "px";
        eaStreamyWrap.style.transform =
          "translate(-50%, -50%) scale(" + ste + ")";

        var lx = typeof etat.logo_x === "number" ? etat.logo_x : 960;
        var ly = typeof etat.logo_y === "number" ? etat.logo_y : 140;
        var le =
          typeof etat.logo_echelle === "number" ? etat.logo_echelle : 1;
        le = Math.max(0.3, Math.min(2, le));
        eaWordmarkEl.style.left = lx + "px";
        eaWordmarkEl.style.top = ly + "px";
        eaWordmarkEl.style.transform =
          "translate(-50%, -50%) scale(" + le + ")";

        // Affichage + cadre SVG sur la carte minuteur (mesure après display).
        if (!eaVisible) {
          eaVisible = true;
          eaRoot.style.display = "block";
          void eaRoot.offsetWidth;
          eaRoot.classList.add("visible");
          eaAppliquerCouleurs();
          requestAnimationFrame(function () {
            appliquerCadreOverlay(eaMinuteurEl, "ecran-attente");
          });
        }
      }

      /// Cache l'overlay + stoppe le média (stop manuel ou fin de chrono —
      /// Rust émet la frame actif:false dans les deux cas).
      function eaCacher() {
        if (!eaRoot || !eaVisible) return;
        if (eaMediaEl && eaMediaEl.tagName === "VIDEO") {
          eaMediaEl.pause();
        }
        eaRoot.classList.remove("visible");
        eaVisible = false;
        nettoyerCadreOverlay(eaMinuteurEl, "ecran-attente");
        // Attendre la fin du fade-out avant de retirer le média du DOM.
        setTimeout(function () {
          if (!eaVisible && eaRoot) {
            eaRoot.style.display = "none";
            eaSetMedia(null, null);
            eaMediaSig = "";
          }
        }, 500);
      }

      // Initialiser l'overlay écran d'attente dès le démarrage.
      initEcranAttenteOverlay();
      connect();
    </script>
  </body>
</html>
