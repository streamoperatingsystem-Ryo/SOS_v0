         (retrait de la classe) elles s'effacent sans délai. */
      .pres-embrasse {
        position: absolute;
        top: 57%;
        width: 290px;
        height: 30px;
        z-index: 10001;
        pointer-events: none;
        opacity: 0;
        border-radius: 999px;
        background: linear-gradient(180deg, #f0d070 0%, #c9a13b 55%, #8a6c25 100%);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      .pres-embrasse.gauche {
        left: -55px;
        transform: rotate(-24deg) translateY(-16px);
      }
      .pres-embrasse.droite {
        right: -55px;
        transform: rotate(24deg) translateY(-16px);
      }
      .pres-embrasse.open {
        opacity: 1;
        transition-delay: 0.75s;
      }
      .pres-embrasse.gauche.open { transform: rotate(-24deg) translateY(0); }
      .pres-embrasse.droite.open { transform: rotate(24deg) translateY(0); }
      /* Sol de scène + faisceaux + poussière : enfants du voile (fade
         automatique avec lui, mode theatrical uniquement). */
      .pres-sol {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 24%;
        pointer-events: none;
        background:
          radial-gradient(ellipse 62% 95% at 50% 112%,
            rgba(255, 214, 150, 0.10), transparent 60%),
          linear-gradient(180deg,
            transparent 0%,
            rgba(20, 11, 7, 0.78) 38%,
            #0b0503 100%);
      }
      /* Liseré de lumière en haut du sol. */
      .pres-sol::before {
        content: "";
        position: absolute;
        top: 0;
        left: 8%;
        right: 8%;
        height: 2px;
        background: linear-gradient(90deg,
          transparent, rgba(255, 220, 160, 0.18), transparent);
      }
      .pres-spot {
        position: absolute;
        top: -60px;
        width: 420px;
        height: 126%;
        pointer-events: none;
        transform-origin: 50% 0;
      }
      .pres-spot.s1 { left: 6%; transform: rotate(17deg); }
      .pres-spot.s2 { right: 6%; transform: rotate(-17deg); }
      .pres-spot.s3 { left: 50%; margin-left: -260px; width: 520px; }
      /* Le clip-path du faisceau est sur l'enfant : le parent porte l'angle
         de base, l'enfant le balancement — un seul transform par élément. */
      .pres-spot-i {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg,
          rgba(255, 238, 200, 0.16),
          rgba(255, 238, 200, 0.05) 55%,
          transparent 88%);
        clip-path: polygon(47% 0, 53% 0, 100% 100%, 0 100%);
        filter: blur(10px);
        transform-origin: 50% 0;
        animation: pres-spot-bal 11s ease-in-out infinite alternate;
      }
      .pres-spot.s2 .pres-spot-i { animation-delay: -4s; }
      .pres-spot.s3 .pres-spot-i { animation-delay: -7s; }
      @keyframes pres-spot-bal {
        from { transform: rotate(-1.4deg); }
        to { transform: rotate(1.4deg); }
      }
      .pres-poussiere {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 240, 210, 0.55);
        filter: blur(0.6px);
        pointer-events: none;
        animation: pres-poussiere-drift var(--pd, 12s) ease-in-out
          var(--pdl, 0s) infinite alternate;
      }
      @keyframes pres-poussiere-drift {
        from { transform: translate(0, 0); opacity: 0.12; }
        50% { opacity: 0.5; }
        to { transform: translate(26px, -42px); opacity: 0.22; }
      }
      /* Public au premier plan : rangées de fauteuils bordeaux + têtes
         silhouettées (la rangée la plus proche = grosses têtes floues
         coupées par le bas de l'écran). z 10003 : DEVANT la carte comme
         dans un vrai théâtre, SOUS le lecteur clip (10004). ~15 % des
         fauteuils restent vides. */
      .pres-public {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 240px;
        z-index: 10003;
        pointer-events: none;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      .pres-public.visible { opacity: 1; }
      /* Rangée = ligne d'ancrage horizontale (height:0) ; les places
         s'étendent vers le haut depuis cette ligne. */
      .pres-rangee {
        position: absolute;
        left: 0;
        right: 0;
        height: 0;
      }
      .pres-place { position: absolute; bottom: 0; }
      .pres-siege {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        background: linear-gradient(180deg,
          #7a1622 0%, #4d0a12 68%, #33060c 100%);
        border-radius: 46% 46% 8% 8% / 32% 32% 5% 5%;
        box-shadow: inset 0 8px 14px rgba(255, 120, 120, 0.10),
                    0 -2px 10px rgba(0, 0, 0, 0.35);
      }
      .pres-tete {
        position: absolute;
        left: 50%;
        bottom: 0;
        border-radius: 50%;
        background: #0b0709;
        transform: translateX(-50%);
        transform-origin: 50% 100%;
        /* Léger halo chaud en haut : lumière de scène sur les têtes. */
        box-shadow: 0 -4px 10px rgba(255, 205, 150, 0.10);
        animation: pres-tete-sway var(--sw, 5s) ease-in-out
          var(--swd, 0s) infinite alternate;
      }
      /* Épaules de la silhouette (hérite la couleur de la tête). */
      .pres-tete::after {
        content: "";
        position: absolute;
        left: -32%;
        right: -32%;
        top: 80%;
        height: 55%;
        border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        background: inherit;
      }
      @keyframes pres-tete-sway {
        from { transform: translateX(-50%) rotate(-1.5deg); }
        to { transform: translateX(-50%) rotate(1.5deg) translateY(-2px); }
      }
      .pres-root {
        position: absolute;
        inset: 0;
        z-index: 10002;
        pointer-events: none;
        display: none;
        align-items: center;
        justify-content: center;
      }
      /* Contenu « plaqué » sur l'écran de scène : pas de panneau (fond,
         bordure, ombre) — la lisibilité repose sur les text-shadow des
         textes et l'assombrissement du voile. max-width ~73 % : le contenu
         reste dans l'ouverture entre les rideaux froncés (~220 px/côté). */
      .pres-carte {
        display: flex;
        align-items: center;
        gap: 56px;
        max-width: 73%;
        opacity: 0;
        transform: translateY(26px) scale(0.94);
        /* Délai : la carte apparaît PENDANT l'ouverture des rideaux (1,2 s). */
        transition: opacity 0.55s ease 0.65s,
                    transform 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.15) 0.65s;
      }
      .pres-carte.visible { opacity: 1; transform: none; }
      /* Mode card : carte compacte, entrée immédiate (pas de rideaux). */
      .pres-root.mode-card .pres-carte {
        flex-direction: column;
        gap: 22px;
        max-width: 760px;
        text-align: center;
        transition-delay: 0s;
      }
      .pres-col-gauche {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        max-width: 460px;
        text-align: center;
      }
      .pres-avatar {
        width: 190px;
        height: 190px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 0 6px rgba(145, 70, 255, 0.55), 0 16px 50px rgba(0, 0, 0, 0.6);
      }
      .pres-root.mode-card .pres-avatar { width: 150px; height: 150px; }
      .pres-nom {
        font: 800 54px/1.05 "Segoe UI", system-ui, sans-serif;
        color: #fff;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
        word-break: break-word;
      }
      .pres-root.mode-card .pres-nom { font-size: 42px; }
      .pres-login {
        font: 600 24px/1.2 "Segoe UI", system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.65);
      }
      .pres-badges { display: flex; gap: 10px; }
      .pres-badge {
        font: 700 18px/1 "Segoe UI", system-ui, sans-serif;
        color: #fff;
        padding: 8px 16px;
        border-radius: 999px;
        background: linear-gradient(135deg, #772ce8, #9146ff);
        box-shadow: 0 4px 16px rgba(145, 70, 255, 0.45);
      }
      .pres-badge.affiliate { background: linear-gradient(135deg, #1f6feb, #3b82f6); }
      .pres-bio {
        font: 400 23px/1.45 "Segoe UI", system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.88);
        display: -webkit-box;
        -webkit-line-clamp: 5;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      }
      .pres-jeu-courant {
        font: 700 22px/1.2 "Segoe UI", system-ui, sans-serif;
        color: #ffd77a;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      }
      .pres-lien {
        font: 600 20px/1 "Segoe UI", system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.55);
        letter-spacing: 0.04em;
      }
      .pres-col-droite {
        display: flex;
        flex-direction: column;
        gap: 18px;
        max-width: 620px;
      }
      /* Fond « écran de cinéma » : la bannière de chaîne couvre toute la
         scène. C'est le 1er enfant du voile → orbes, sol, spots et
         poussière (enfants suivants) restent PAR-DESSUS, comme les rideaux
         (z 10001) et le contenu (z 10002). ::after = scrim sombre pour la
         lisibilité des infos. */
      .pres-fond {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .pres-fond-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .pres-fond::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg,
          rgba(5, 5, 10, 0.55) 0%,
          rgba(5, 5, 10, 0.32) 45%,
          rgba(5, 5, 10, 0.72) 100%);
      }
      .pres-root.mode-card .pres-col-droite { align-items: center; }
      .pres-live {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        align-self: flex-start;
        font: 800 22px/1 "Segoe UI", system-ui, sans-serif;
        color: #fff;
        background: #e91916;
        padding: 10px 18px;
        border-radius: 10px;
        box-shadow: 0 6px 22px rgba(233, 25, 22, 0.5);
      }
      .pres-root.mode-card .pres-live { align-self: center; }
      .pres-live::before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
      }
      .pres-titre-live {
        font: 600 22px/1.35 "Segoe UI", system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.8);
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      }
      .pres-jeux { display: flex; gap: 12px; align-items: flex-end; }
      .pres-jeu { display: flex; flex-direction: column; gap: 6px; width: 96px; }
      .pres-jeu img {
        width: 96px;
        height: 128px;
        object-fit: cover;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      }
      .pres-jeu span {
        font: 600 15px/1.2 "Segoe UI", system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.75);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-align: center;
      }
      .pres-clips {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .pres-clip {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.55);
        aspect-ratio: 16 / 9;
        background: rgba(255, 255, 255, 0.06);
      }
      .pres-clip img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .pres-clip .duree {
        position: absolute;
        right: 8px;
        bottom: 8px;
        font: 700 15px/1 "Segoe UI", system-ui, sans-serif;
        color: #fff;
        background: rgba(0, 0, 0, 0.75);
        padding: 4px 8px;
        border-radius: 6px;
      }
      .pres-clip .titre {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        font: 600 15px/1.3 "Segoe UI", system-ui, sans-serif;
        color: #fff;
        padding: 18px 10px 8px;
        background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.85));
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Lecteur clip plein écran (au-dessus de tout, public inclus). */
      .pres-clip-root {
        position: absolute;
        inset: 0;
        z-index: 10004;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.9);
        pointer-events: none;
      }
      .pres-clip-root.visible { display: flex; }
      .pres-clip-video {
        max-width: 88%;
        max-height: 82%;
        border-radius: 14px;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.85);
      }
      .pres-clip-titre {
        position: absolute;
        top: 44px;
        left: 8%;
        right: 8%;
        font: 700 30px/1.3 "Segoe UI", system-ui, sans-serif;
        color: #fff;
        text-align: center;
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.85);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ===== Modules HUD (scene.modules : horloge / musique / objectifs) =====
         Couche d'affichage SÉPARÉE des widgets — rectangles libres en px
         canvas, rendu minimaliste (fond translucide sombre, texte clair,
         accent = extrémité lumineuse du gradient du cadre actif via
         --mod-accent, résolu par bpmResoudreCouleurs). z 9000 : au-dessus
         des widgets, SOUS l'écran d'attente (9990) et les overlays
         éphémères (999x). Tailles en calc(var(--mod-fs)) — pas de cqw
         (absent du CEF de plusieurs versions d'OBS). */
      #modules-root {
        position: absolute;
        inset: 0;
        z-index: 9000;
        pointer-events: none;
        overflow: hidden;
      }
      .module {
        position: absolute;
        box-sizing: border-box;
        color: #f4f4f6;
        font-family: var(--mod-font, "Segoe UI", system-ui, sans-serif);
        font-size: var(--mod-fs, 20px);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }
      .module > *:not(.cadre-overlay) { position: relative; z-index: 1; }
      .module .mod-fond {
        position: absolute;
        inset: 0;
        z-index: 0;
        border-radius: 10px;
        background: rgba(10, 10, 14, var(--mod-opacite, 0.45));
      }
      /* --- Horloge : date │ heure --- */
      .module.horloge {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.7em;
        padding: 0 0.8em;
        white-space: nowrap;
      }
      .mh-date {
        letter-spacing: 0.25em;
        font-weight: 400;
        font-size: 0.78em;
        color: #d6d6dc;
        font-variant-numeric: tabular-nums;
      }
      .mh-sep {
        width: 2px;
        height: 1.1em;
        border-radius: 2px;
        background: var(--mod-accent, #e0e0e0);
        box-shadow: 0 0 6px var(--mod-accent, #e0e0e0);
      }
      .mh-heure {
        letter-spacing: 0.18em;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .mh-ampm { font-size: 0.5em; margin-left: 0.4em; color: #d6d6dc; }
      /* --- Musique : carte (icône + titre/sous-titre) + pastille temps --- */
      .module.musique {
        display: flex;
        align-items: stretch;
        gap: 0.5em;
        overflow: visible;
      }
      .module.musique .mod-fond { display: none; }
      .mm-carte, .mm-temps {
        display: flex;
        align-items: center;
        border-radius: 10px;
        background: rgba(10, 10, 14, var(--mod-opacite, 0.45));
        box-sizing: border-box;
        overflow: hidden;
      }
      .mm-carte {
        flex: 1;
        min-width: 0;
        gap: 0.6em;
        padding: 0.35em 0.6em 0.35em 0.35em;
      }
      .mm-icone {
        flex: none;
        width: 2.2em;
        height: 2.2em;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.08);
        color: var(--mod-accent, #e0e0e0);
        font-size: 1em;
      }
      .mm-txt { min-width: 0; display: flex; flex-direction: column; gap: 0.15em; }
      .mm-titre {
        font-weight: 700;
        font-size: 0.95em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mm-sous {
        font-size: 0.68em;
        color: #c9c9d0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mm-temps {
        flex: none;
        gap: 0.5em;
        padding: 0 0.7em;
        font-size: 0.62em;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.05em;
      }
      .mm-points { display: flex; gap: 0.3em; }
      .mm-points i {
        display: block;
        width: 0.45em;
        height: 0.45em;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
      }
      .mm-points i.on {
        background: var(--mod-accent, #e0e0e0);
        box-shadow: 0 0 4px var(--mod-accent, #e0e0e0);
      }
      .module.musique.sans-temps .mm-temps { display: none; }
      /* --- Objectifs : titre + lignes LABEL —— actuel / cible --- */
      .module.objectifs {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.55em;
        padding: 0.7em 0.9em;
      }
      .mo-titre {
        font-size: 0.6em;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #b9b9c2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mo-titre:empty { display: none; }
      .mo-ligne { display: flex; flex-direction: column; gap: 0.25em; }
      .mo-haut {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.6em;
        white-space: nowrap;
      }
      .mo-label {
        font-weight: 700;
        font-size: 0.72em;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mo-val {
        font-size: 0.72em;
        letter-spacing: 0.08em;
        font-variant-numeric: tabular-nums;
        color: #c9c9d0;
      }
      .mo-val .mo-actuel { color: var(--mod-accent, #e0e0e0); font-weight: 700; }
      .mo-bar {
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.22);
        overflow: hidden;
      }
      .mo-fill {
        height: 100%;
        width: 0%;
        background: var(--mod-accent, #e0e0e0);
        box-shadow: 0 0 6px var(--mod-accent, #e0e0e0);
        transition: width 0.5s ease;
      }
      .mo-vide {
        font-size: 0.65em;
        color: #b9b9c2;
        text-align: center;
      }

      /* ===== Écran d'attente (BRB) — overlay plein écran =====
         Porté de l'ancienne app (features/ecran-attente). z 9990 : recouvre
         toute la scène mais RESTE SOUS les overlays éphémères (pad 9995,
         commandes 9996, alertes 9997, bandeau 9998, welcome/voile 9999) qui
         popent par-dessus pendant l'attente — comportement validé.
         Média plein cadre (cover, vidéo en boucle) ; sans média → dégradé
         animé teinté par les couleurs du cadre widget (--ea-rgb-prim/sec,
         résolues via bpmResoudreCouleurs). La carte minuteur porte le cadre
         SVG de la scène (appliquerCadreOverlay) ; le titre est en dégradé
         de texte aux mêmes couleurs (--ea-prim/--ea-sec). */
      .ecran-attente-root {
        position: absolute;
        inset: 0;
        z-index: 9990;
        pointer-events: none;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.45s ease;
        background: #05050a;
      }
      .ecran-attente-root.visible { opacity: 1; }
      .ecran-attente-fond {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 60% at 20% 18%,
            rgba(var(--ea-rgb-prim, 139, 92, 246), 0.20), transparent 62%),
          radial-gradient(ellipse 70% 55% at 80% 78%,
            rgba(var(--ea-rgb-sec, 59, 130, 246), 0.16), transparent 65%),
          linear-gradient(160deg, #06060c 0%, #0b0b16 55%, #06060c 100%);
      }
      /* Halo dérivant lentement — animation CSS pure, coût quasi nul en CEF. */
      .ecran-attente-fond::before {
        content: "";
        position: absolute;
        inset: -18%;
        background:
          radial-gradient(circle at 32% 32%,
            rgba(var(--ea-rgb-prim, 139, 92, 246), 0.16), transparent 46%),
          radial-gradient(circle at 68% 62%,
            rgba(var(--ea-rgb-sec, 59, 130, 246), 0.13), transparent 52%);
        animation: ea-derive 22s ease-in-out infinite alternate;
      }
      @keyframes ea-derive {
        from { transform: translate3d(-4%, -3%, 0) scale(1); }
        to { transform: translate3d(4%, 3%, 0) scale(1.08); }
      }
      .ecran-attente-media {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Voile de lisibilité au-dessus du média (titre/minuteur détachés). */
      .ecran-attente-voile {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.45) 0%,
          transparent 30%,
          transparent 68%,
          rgba(0, 0, 0, 0.5) 100%
        );
      }
      .ecran-attente-titre {
        position: absolute;
        top: 7%;
        left: 0;
        right: 0;
        padding: 0 5%;
        text-align: center;
        font-size: 84px;
        font-weight: 800;
        letter-spacing: 0.04em;
        line-height: 1.1;
        background: linear-gradient(135deg, var(--ea-prim, #e0e0e0), var(--ea-sec, #9a9a9a));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.65));
      }
      /* Carte minuteur — position/échelle inline (minuteur_x/y/echelle de la
         config, drag/resize dans la modale dashboard ; left/top = centre).
         absolute = containing block pour le .cadre-overlay injecté par
         appliquerCadreOverlay. Padding en PX (pas d'em — ils se résoudraient
         contre les ~16px hérités, pas contre les chiffres 84px) : marges
         généreuses entre les chiffres et la bordure du cadre (consigne
         utilisateur — large marge gauche/droite, modérée haut/bas). */
      .ecran-attente-minuteur {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        transform-origin: center center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 24px 64px;
        background: rgba(8, 8, 14, 0.88);
        border: 2px solid rgba(224, 224, 224, 0.85); /* recouvert par le cadre SVG quand actif */
        border-radius: 14px;
        box-shadow: 0 10px 48px rgba(0, 0, 0, 0.6);
      }
      .ecran-attente-minuteur-label {
        font-size: 20px;
        font-weight: 600;
        color: #bdbdbd;
        text-transform: uppercase;
        letter-spacing: 0.22em;
      }
      /* Chiffres : dégradé de texte aux couleurs du cadre utilisateur
         (--ea-prim/--ea-sec = bpmResoudreCouleurs), nuancées de blanc pour
         la lisibilité — même mécanique que le titre, en plus doux. */
      .ecran-attente-temps {
        font-size: 84px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--ea-prim, #e0e0e0) 82%, #ffffff),
          color-mix(in srgb, var(--ea-sec, #9a9a9a) 60%, #ffffff)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 3px 18px rgba(0, 0, 0, 0.6));
      }
      .ecran-attente-minuteur.en-pause .ecran-attente-temps {
        opacity: 0.6;
      }

      /* ===== Layout « signature » StreamOS =====
         Éléments de marque posés AU-DESSUS du voile (même plan que titre/
         minuteur) : stries néon diagonales aux coins (comète glissante),
         mascotte Streamy en flottement + anneaux orbitaux, wordmark
         électrique en bas, ligne morse ···−−−···. Palette fixe
         cyan→violet→magenta (identité du site) ; l'aurora de fond garde
         la teinte du cadre (--ea-rgb-*). transform/opacity uniquement —
         coût quasi nul en CEF. Tout le bloc reste display:none hors
         .layout-signature (= rendu historique « minimal »). */
      .ecran-attente-sig-stries,
      .ecran-attente-sig-streamy,
      .ecran-attente-sig-wordmark,
      .ecran-attente-sig-morse {
        display: none;
      }
      .layout-signature .ecran-attente-sig-stries,
      .layout-signature .ecran-attente-sig-streamy,
      .layout-signature .ecran-attente-sig-wordmark {
        display: block;
      }
      .layout-signature .ecran-attente-sig-morse {
        display: flex;
      }

      /* Stries néon : 4 barres fines le long des diagonales aux coins
         (inspiré du bandeau du site). ::before = ligne sœur plus fine ;
         .sig-comet = segment brillant qui glisse le long de la barre. */
      .ecran-attente-sig-stries {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .sig-strie {
        position: absolute;
        width: 2px;
        height: 34vmin;
        border-radius: 2px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(103, 232, 249, 0.45) 30%,
          rgba(168, 85, 247, 0.45) 70%,
          transparent
        );
        box-shadow: 0 0 10px rgba(103, 232, 249, 0.3);
      }
      .sig-strie::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 8px;
        width: 1px;
        background: inherit;
        opacity: 0.5;
      }
      .sig-strie.s1 { top: -5vmin; left: 9vmin; transform: rotate(45deg); }
      .sig-strie.s2 { top: -5vmin; right: 9vmin; transform: rotate(-45deg); }
      .sig-strie.s3 { bottom: -5vmin; left: 9vmin; transform: rotate(-45deg); }
      .sig-strie.s4 { bottom: -5vmin; right: 9vmin; transform: rotate(45deg); }
      .sig-strie.s2 .sig-comet { animation-delay: 1.5s; }
      .sig-strie.s3 .sig-comet { animation-delay: 3s; }
      .sig-strie.s4 .sig-comet { animation-delay: 4.5s; }
      .sig-comet {
        position: absolute;
        left: -1px;
        top: 0;
        width: 4px;
        height: 18%;
        border-radius: 4px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(224, 255, 255, 0.95),
          transparent
        );
        filter: drop-shadow(0 0 6px rgba(103, 232, 249, 0.9));
        transform: translateY(-120%);
        animation: ea-comet 6s linear infinite;
      }
      @keyframes ea-comet {
        from { transform: translateY(-120%); }
        to { transform: translateY(620%); }
      }

      /* Mascotte Streamy : flottement lent + anneaux orbitaux derrière
         (clin d'œil aux .orb du dashboard et aux anneaux du logo SOS).
         Position/échelle inline (streamy_x/y/echelle de la config, drag/
         resize dans la modale ; left/top = centre, transform-origin
         centre) — défaut haut-gauche. */
      .ecran-attente-sig-streamy {
        position: absolute;
        left: 170px;
        top: 180px;
        transform: translate(-50%, -50%) scale(0.6);
        transform-origin: center center;
        width: 300px;
        height: 430px;
      }
      .sig-orbite {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 118%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 2px solid rgba(103, 232, 249, 0.22);
        box-shadow:
          0 0 26px rgba(103, 232, 249, 0.14),
          inset 0 0 26px rgba(139, 92, 246, 0.12);
      }
      /* Arcs brillants rotatifs : conic-gradient masqué en anneau —
         cyan extérieur, magenta intérieur en sens inverse. */
      .sig-orbite::before {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0 72%,
          rgba(103, 232, 249, 0.85) 86%,
          transparent 100%
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        animation: ea-orbite-tourne 9s linear infinite;
      }
      .sig-orbite::after {
        content: "";
        position: absolute;
        inset: 7%;
        border-radius: 50%;
        background: conic-gradient(
          from 180deg,
          transparent 0 78%,
          rgba(236, 72, 153, 0.7) 90%,
          transparent 100%
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        animation: ea-orbite-tourne 13s linear infinite reverse;
      }
      @keyframes ea-orbite-tourne {
        to { transform: rotate(360deg); }
      }
      .sig-mascotte {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0 34px rgba(139, 92, 246, 0.55));
        animation: ea-streamy-flotte 5.5s ease-in-out infinite;
      }
      @keyframes ea-streamy-flotte {
        0%, 100% { transform: translateY(-9px); }
        50% { transform: translateY(9px); }
      }

      /* Wordmark électrique — le fond noir du PNG est neutralisé par
         mix-blend-mode:screen (aucune retouche d'asset nécessaire).
         Position/échelle inline (logo_x/y/echelle ; left/top = centre) —
         défaut haut-centre, là où le titre texte par défaut se trouvait. */
      .ecran-attente-sig-wordmark {
        position: absolute;
        left: 960px;
        top: 140px;
        transform: translate(-50%, -50%);
        transform-origin: center center;
        width: 480px;
        mix-blend-mode: screen;
        opacity: 0.9;
        filter: drop-shadow(0 2px 14px rgba(0, 0, 0, 0.6));
      }

      /* Ligne morse ···−−−··· : 9 segments (i.p = point, i.t = trait)
         flashés en séquence sur un cycle de 9,5 s — la signature SOS. */
      .ecran-attente-sig-morse {
        position: absolute;
        left: 50%;
        bottom: 1.7%;
        transform: translateX(-50%);
        gap: 9px;
        align-items: center;
      }
      .ecran-attente-sig-morse i {
        display: block;
        height: 6px;
        border-radius: 4px;

      .bandeau-pm-barre {

      /* Mascotte Streamy : ancrée à droite de la barre, plus haute qu'elle —
         déborde vers le haut (pos-bas) ou vers le bas (pos-haut, sinon elle
         sortirait de l'écran). Lue aux couleurs du cadre via drop-shadow. */
      .bandeau-pm-streamy {

        bottom: -24px;

      .bandeau-pm-root.visible .bandeau-pm-streamy {

      @keyframes bpm-streamy-pop {

        55%  { transform: scaleX(-1) translateY(-8px) scale(1.06); opacity: 1; }

      /* Variante pos-haut : elle est sous la barre, le pop descend donc. */
      .bandeau-pm-root.pos-haut.visible .bandeau-pm-streamy {
        transform-origin: 50% 0%;
        animation-name: bpm-streamy-pop-haut;
      }
      @keyframes bpm-streamy-pop-haut {
        0%   { transform: scaleX(-1) translateY(-60px) scale(0.5);  opacity: 0; }
        55%  { transform: scaleX(-1) translateY(8px)   scale(1.06); opacity: 1; }
        75%  { transform: scaleX(-1) translateY(-3px)  scale(0.98); }
        100% { transform: scaleX(-1) translateY(0)     scale(1);    opacity: 1; }
