            + '<g class="iv-fig-stick" data-stick-indicateur="' + cote + '" data-bouton="' + btn + '">'
            + '<circle class="iv-fig-btn-shadow" cx="' + cx + '" cy="' + (cy + 4) + '" r="31"/>'
            + '<circle class="iv-fig-stick-cap" cx="' + cx + '" cy="' + cy + '" r="30" fill="url(#ivgp-btn)"/>'

            + '<rect class="iv-fig-face" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="12" fill="url(#ivgp-btn)"/>'

            + '<rect class="iv-fig-shoulder" x="' + (cx - 70) + '" y="6" width="140" height="80" rx="30" fill="url(#ivgp-btn)"/>'

            + '<rect class="iv-fig-sheen" x="' + (cx - 70) + '" y="56" width="140" height="12" rx="6"/>'

          + '<svg class="iv-fig-canvas" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet">'
          + '<defs>'
          + '<linearGradient id="ivgp-corps" x1="0" y1="0" x2="0" y2="1">'
          + '<stop offset="0" stop-color="#343a46"/><stop offset="0.45" stop-color="#22262e"/><stop offset="1" stop-color="#131519"/>'
          + '</linearGradient>'
          + '<linearGradient id="ivgp-btn" x1="0" y1="0" x2="0" y2="1">'
          + '<stop offset="0" stop-color="#474e5c"/><stop offset="1" stop-color="#21242c"/>'
          + '</linearGradient>'
          + '<radialGradient id="ivgp-dish" cx="0.5" cy="0.45" r="0.62">'
          + '<stop offset="0" stop-color="#1e2128"/><stop offset="1" stop-color="#0e1114"/>'
          + '</radialGradient>'
          + '</defs>'
          // Triggers L2/R2 derrière le corps.
          + trigger(6, 160, "L2") + trigger(7, 600, "R2")
          // Corps DualSense : haut large, deux grips qui plongent vers le bas.
          + '<path class="iv-fig-corps" fill="url(#ivgp-corps)" d="M380 60 C220 60 90 105 80 178 C72 240 88 305 118 348 C140 390 170 408 200 398 C232 387 244 350 248 318 L512 318 C516 350 528 387 560 398 C590 408 620 390 642 348 C672 305 688 240 680 178 C670 105 540 60 380 60 Z"/>'

          // Bumpers L1/R1 sur le bord supérieur.

          // Touchpad central cliquable (bouton 17) + liseré lumineux déco.
          + '<g data-bouton="17" class="iv-fig-btn"><rect class="iv-fig-pad" x="305" y="92" width="150" height="88" rx="12" fill="url(#ivgp-dish)"/></g>'
          + '<path class="iv-fig-sheen-line" d="M312 184 L448 184"/>'
          // Share (8) / Options (9) : petits boutons flanquant le touchpad.
          + '<g data-bouton="8" class="iv-fig-btn"><circle class="iv-fig-face" cx="288" cy="102" r="10" fill="url(#ivgp-btn)"/><rect class="iv-fig-ico" x="283" y="99" width="10" height="2" rx="1"/><rect class="iv-fig-ico" x="283" y="103" width="10" height="2" rx="1"/></g>'
          + '<g data-bouton="9" class="iv-fig-btn"><circle class="iv-fig-face" cx="472" cy="102" r="10" fill="url(#ivgp-btn)"/><rect class="iv-fig-ico" x="467" y="98" width="10" height="8" rx="1"/></g>'
          // Bouton PS (home, bouton 16) sous le touchpad.
          + '<g data-bouton="16" class="iv-fig-btn"><circle class="iv-fig-btn-shadow" cx="380" cy="209" r="13"/><circle class="iv-fig-face" cx="380" cy="205" r="12" fill="url(#ivgp-btn)"/><text class="iv-fig-lbl" x="380" y="205" style="font-size:8px">PS</text></g>'

          + dbtn("droite", 196, 154, 56, 42, "►", 232, 175)
          + '<circle class="iv-fig-hub" cx="185" cy="175" r="12" fill="url(#ivgp-btn)"/>'

          + face(2, 522, 177, "□", "iv-fig-lbl-squ")
          + face(1, 628, 177, "○", "iv-fig-lbl-cir")
          + face(0, 575, 224, "✕", "iv-fig-lbl-cro")

      // Manette : les 3 skins sont des SVG réalistes dédiés
      // (ivGenererManette*SVG). Valeur inconnue → xbox par défaut.
      function ivGenererManetteHTML(skin) {
        var s = skin || "xbox";
        if (s === "8bitdo") return ivGenererManette8BitDoSVG();
        if (s === "ps") return ivGenererManettePsSVG();
        return ivGenererManetteXboxSVG();
      }

      // Cadre « carre » actif sur ce widget ? (même condition qu'applyCadreWidget :
      // actif + strokeWidth > 0 + pas de sansCadre). Pilote le rx du châssis.
      function ivChassisCarre(w, cadre) {
        return !!(cadre && cadre.actif && (cadre.strokeWidth || 0) > 0
          && (cadre.style || "carre") === "carre" && w.sansCadre !== true);
      }

      function ivGenererHTML(w, cadre) {
        var mode = w.inputMode || "clavier";
        var carre = ivChassisCarre(w, cadre);
        if (mode === "souris") return ivGenererSourisHTML();
        if (mode === "numpad") return ivGenererNumpadHTML(carre);
        if (mode === "manette") return ivGenererManetteHTML(w.inputSkin);
        return ivGenererClavierHTML(w.inputLayout || "azerty", carre);
      }

      // Dernier état reçu (pour ne mettre à jour que les touches qui changent).
      var ivDernieresTouches = [];
      function majInputViewerEtat(etat) {
        var nouveau = etat.touches || [];
        var ancien = ivDernieresTouches;
        // Union ancien + nouveau : seules ces touches peuvent changer d'état.
        var aTraiter = {};
        for (var i = 0; i < ancien.length; i++) aTraiter[ancien[i]] = true;
        for (var j = 0; j < nouveau.length; j++) aTraiter[nouveau[j]] = true;
        var presseSet = {};
        for (var k = 0; k < nouveau.length; k++) presseSet[nouveau[k]] = true;
        var els = document.querySelectorAll(".widget.inputviewer [data-touche]");
        for (var e = 0; e < els.length; e++) {
          var code = els[e].getAttribute("data-touche");
          if (!aTraiter[code]) continue;
          var presse = !!presseSet[code];
          if (presse !== els[e].classList.contains("presse")) {
            els[e].classList.toggle("presse", presse);
          }
        }
        // Numpad : touches combinées (data-touche-alt + data-touche-alt2).
        // Reconnaît les chiffres du haut (Digit0-9) ET du pavé (Numpad0-9).
        var elsAlt = document.querySelectorAll(".widget.inputviewer [data-touche-alt]");
        for (var ea = 0; ea < elsAlt.length; ea++) {
          var code1 = elsAlt[ea].getAttribute("data-touche-alt");
          var code2 = elsAlt[ea].getAttribute("data-touche-alt2");
          if (!aTraiter[code1] && !aTraiter[code2]) continue;
          var presseAlt = !!(presseSet[code1] || presseSet[code2]);
          if (presseAlt !== elsAlt[ea].classList.contains("presse")) {
            elsAlt[ea].classList.toggle("presse", presseAlt);
          }
        }
        // Souris : boutons + position (mise à jour directe, throttlée côté Rust).
        var s = etat.souris || {};
        var conts = document.querySelectorAll(".widget.inputviewer[data-mode='souris']");
        for (var c = 0; c < conts.length; c++) {
          var cont = conts[c];
          var bg = cont.querySelector("[data-souris='gauche']");
          var bm = cont.querySelector("[data-souris='milieu']");
          var bd = cont.querySelector("[data-souris='droite']");
          if (bg) bg.classList.toggle("presse", !!s.gauche);
          if (bm) bm.classList.toggle("presse", !!s.milieu);
          if (bd) bd.classList.toggle("presse", !!s.droite);
          var xEl = cont.querySelector("[data-souris-x]");
          var yEl = cont.querySelector("[data-souris-y]");
          if (xEl) xEl.textContent = s.x || 0;
          if (yEl) yEl.textContent = s.y || 0;
        }
        // Manette : boutons (data-bouton) + D-pad (data-dpad) + sticks (data-stick).
        var m = etat.manette || {};
        var mBtns = m.boutons || [];
        var mAxes = m.axes || [];
        // D-pad state depuis boutons[12-15].
        var dpad = {
          haut: !!mBtns[12], bas: !!mBtns[13],
          gauche: !!mBtns[14], droite: !!mBtns[15]
        };
        var contsM = document.querySelectorAll(".widget.inputviewer[data-mode='manette']");
        for (var cm = 0; cm < contsM.length; cm++) {
          var contM = contsM[cm];
          // Mapping des touches (remap + inversion D-pad axes).
          var ivMap = contM._inputMapping || null;
          var mapBtns = (ivMap && ivMap.buttons) ? ivMap.buttons : null;
          var invY = !!(ivMap && ivMap.dpadInvertY);
          var invX = !!(ivMap && ivMap.dpadInvertX);
          // Si skin 8bitdo et D-pad boutons inactifs, lire les axes LeftStick
          // (axes[0]=X, axes[1]=Y) comme D-pad. La 8BitDo émule souvent une
          // DualShock4 et reporte le D-pad sur les axes LeftStick au lieu des
          // boutons D-pad. Convention : axes[1] < 0 = haut, axes[1] > 0 = bas.
          var elSkin = contM.querySelector(".iv-manette");
          var skin8bitdo = elSkin && elSkin.getAttribute("data-skin") === "8bitdo";
          if (skin8bitdo && !dpad.haut && !dpad.bas && !dpad.gauche && !dpad.droite) {
            var seuilAxe = 0.5;
            var axY = mAxes[1] || 0;
            var axX = mAxes[0] || 0;
            // Inversion optionnelle (bug 8BitDo : haut/bas inversés).
            if (invY) axY = -axY;
            if (invX) axX = -axX;
            if (axY < -seuilAxe) dpad.haut = true;
            if (axY > seuilAxe) dpad.bas = true;
            if (axX < -seuilAxe) dpad.gauche = true;
            if (axX > seuilAxe) dpad.droite = true;
          }
          // Boutons standard (data-bouton="0" à "19") avec remap optionnel.
          var btnEls = contM.querySelectorAll("[data-bouton]");
          for (var bi = 0; bi < btnEls.length; bi++) {
            var idx = parseInt(btnEls[bi].getAttribute("data-bouton"), 10);
            // Remap : idx = bouton affiché, mapBtns[idx] = index physique.
            var physIdx = (mapBtns && idx < mapBtns.length) ? mapBtns[idx] : idx;
            var bp = !!mBtns[physIdx];
            if (bp !== btnEls[bi].classList.contains("presse")) {
              btnEls[bi].classList.toggle("presse", bp);
            }
          }
          // D-Pad (data-dpad).
          var dpadEls = contM.querySelectorAll("[data-dpad]");
          for (var di = 0; di < dpadEls.length; di++) {
            var dir = dpadEls[di].getAttribute("data-dpad");
            var dp = false;
            switch (dir) {
              case "haut": dp = dpad.haut; break;
              case "bas": dp = dpad.bas; break;
              case "gauche": dp = dpad.gauche; break;
              case "droite": dp = dpad.droite; break;
              case "haut-gauche": dp = dpad.haut && dpad.gauche; break;
              case "haut-droite": dp = dpad.haut && dpad.droite; break;
              case "bas-gauche": dp = dpad.bas && dpad.gauche; break;
              case "bas-droite": dp = dpad.bas && dpad.droite; break;
            }
            if (dp !== dpadEls[di].classList.contains("presse")) {
              dpadEls[di].classList.toggle("presse", dp);
            }
          }
          // Joysticks (data-stick-indicateur).
          var stickEls = contM.querySelectorAll("[data-stick-indicateur]");
          for (var si = 0; si < stickEls.length; si++) {
            var stick = stickEls[si].getAttribute("data-stick-indicateur");
            var ax = stick === "gauche" ? (mAxes[0] || 0) : (mAxes[2] || 0);
            var ay = stick === "gauche" ? (mAxes[1] || 0) : (mAxes[3] || 0);
            var actif = Math.abs(ax) > 0.15 || Math.abs(ay) > 0.15;
            // Cap SVG (iv-fig-stick) : translate en px viewBox (le calc %
            // centré est pensé pour le cap DOM absolu, inutilisable en SVG).
            if (stickEls[si].classList.contains("iv-fig-stick")) {
              stickEls[si].style.transform = "translate(" + (ax * 26) + "px, " + (ay * 26) + "px)";
            } else {
              stickEls[si].style.transform = "translate(calc(-50% + " + (ax * 40) + "%), calc(-50% + " + (ay * 40) + "%))";
            }
            stickEls[si].classList.toggle("actif", actif);
          }
        }
        ivDernieresTouches = nouveau;
      }

      // ===== Speedrun : maj DOM directe du timer + phase + splits =====
      // L'état arrive par WS speedrun-etat (moteur Rust → WS direct).
      // Chaque message est un event individuel (type: "time"|"split"|"started"|…).
      // On maintient l'état consolidé dans l'entry (srPhase, srIndex, etc.)
      // et maj le DOM par textContent/classList — zéro re-render (CEF OBS
      // saccade sinon).

      /// Mappe un nom de phase vers un label court affiché.
      function srPhaseLabel(phase) {
        switch (phase) {
          case "Running": return "Running";
          case "Paused": return "Paused";
          case "Ended": return "Finished";
          default: return "Ready";
        }
      }

      /// Mappe un nom de phase vers une classe CSS courte (sr-running, etc.).
      function srPhaseCls(phase) {
        switch (phase) {
          case "Running": return "running";
          case "Paused": return "paused";
          case "Ended": return "ended";
          default: return "ready";
        }
      }

      /// Disposition du splitter : srLayout "ligne"/"colonne" forcent le mode ;
      /// "auto"/absent → splits en ligne (scroll horizontal, façon LiveSplit)
      /// si la hauteur du widget passe sous ~4× la taille de base (même seuil
      /// que WidgetSpeedrun.svelte — srTaillePolice fallback = 16, celui du
      /// fontSize appliqué ci-dessous).
      function srEstLigne(w) {
        if (w.srLayout === "ligne") return true;
        if (w.srLayout === "colonne") return false;
        var srTailleSeuil = w.srTaillePolice || 16;
        return (w.hauteur || 0) < srTailleSeuil * 4;
      }

      /// Parse un temps formaté "MM:SS.mmm" ou "HH:MM:SS.mmm" vers secondes.
      function srParseTime(str) {
        if (!str || str === "--/--/--") return 0;
        var parts = str.split(":");
        var h = 0, m = 0, s = 0;
        if (parts.length === 3) {
          h = parseFloat(parts[0]) || 0;
          m = parseFloat(parts[1]) || 0;
          s = parseFloat(parts[2]) || 0;
        } else if (parts.length === 2) {
          m = parseFloat(parts[0]) || 0;
          s = parseFloat(parts[1]) || 0;
        } else {
          s = parseFloat(parts[0]) || 0;
        }
        return h * 3600 + m * 60 + s;
      }

      /// Formate des secondes vers "MM:SS.cc" (2 décimales — dixièmes/centièmes).
      function srFormatSegment(secs) {
        if (secs < 0 || isNaN(secs)) return "--/--/--";
        var totalCs = Math.round(secs * 100);
        var h = Math.floor(totalCs / 360000);
        var m = Math.floor((totalCs % 360000) / 6000);
        var s = Math.floor((totalCs % 6000) / 100);
        var cs = totalCs % 100;
        if (h > 0) {
          return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") + "." + String(cs).padStart(2, "0");
        }
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") + "." + String(cs).padStart(2, "0");
      }

      /// Formate un delta signé (colonne "+/−") : signe toujours présent,
      /// secondes avec 1 dixième — MÊME au-delà de 60 s ("-2.4", "+62.4").
      /// Choix utilisateur : toujours en secondes, jamais m:ss.
      function srFormatDelta(secs) {
        var sign = secs < 0 ? "-" : "+";
        return sign + Math.abs(secs).toFixed(1);
      }

      /// Recrée le HTML de la liste des segments (quand le total change).
      /// Ordre des colonnes aligné sur le dashboard : nom | temps | delta.
      function srRecreerSplits(entry, segments) {
        var splitsEl = entry.el.querySelector(".sr-splits");
        if (!splitsEl) return;
        var html = "";
        for (var i = 0; i < segments.length; i++) {
          var seg = segments[i];
          html += '<div class="sr-seg" data-idx="' + i + '">' +
            '<span class="sr-seg-nom">' + (seg.nom || "") + '</span>' +
            '<span class="sr-seg-time"></span>' +
            '<span class="sr-seg-pb"></span>' +
            '</div>';
        }
        splitsEl.innerHTML = html;
      }

      /// Met à jour les classes actif/done des segments + barre + compteur +
      /// temps de run + scroll auto vers le segment actif.
      function srMajSegmentsVisuel(entry) {
        var splitsEl = entry.el.querySelector(".sr-splits");
        if (!splitsEl) return;
        var segs = splitsEl.querySelectorAll(".sr-seg");
        var idx = entry.srIndex;
        for (var j = 0; j < segs.length; j++) {
          // Durée PB du segment (référence LiveSplit : pb[j] − pb[j-1] en
          // cumul LSS ; real time d'abord, fallback game time). null si le
          // segment n'a pas de PB.
          var segDef = (entry.srSegments && j < entry.srSegments.length)
            ? entry.srSegments[j] : null;
          // Durée PB du segment = pb[j] − pb[j−1] — le .lss stocke les PB en
          // CUMUL. null si le segment OU le précédent n'a pas de PB : sans
          // pb[j−1], soustraire 0 rendrait le cumul entier au lieu de la durée.
          var segPb = null;
          if (segDef) {
            var pbCur = (segDef.pbRealTime != null) ? segDef.pbRealTime : segDef.pbGameTime;
            if (pbCur != null) {
              if (j === 0) {
                segPb = pbCur; // cumul du 1er segment = sa durée
              } else {
                var pPrev = entry.srSegments[j - 1];
                var pbPrev = pPrev
                  ? ((pPrev.pbRealTime != null) ? pPrev.pbRealTime : pPrev.pbGameTime)
                  : null;
                if (pbPrev != null) segPb = pbCur - pbPrev;
              }
            }
          }
          var enregistre = (entry.srSplitTimes && j < entry.srSplitTimes.length)
            ? entry.srSplitTimes[j] : "";
          var estActif = (idx !== null && j === idx);
          var enCours = estActif &&
            (entry.srPhase === "Running" || entry.srPhase === "Paused");
          // Delta cumulé vs PB — colonne "+/−" façon LiveSplit (avance/
          // retard de la run ENTIÈRE à ce split) : actif = chrono total
          // vivant − PB cumulé (défile à chaque tick), passé = cumul de
          // run enregistré − PB cumulé (figé au split), non atteint /
          // skippé / armé en NotRunning / sans PB = vide.
          var deltaTxt = "";
          var deltaSens = "";
          // PB cumulé au split j (le .lss stocke les PB en CUMUL — pas de
          // soustraction ; real time d'abord, fallback game time).
          var pbCumul = null;
          if (segDef) {
            pbCumul = (segDef.pbRealTime != null)
              ? segDef.pbRealTime
              : segDef.pbGameTime;
          }
          if (pbCumul !== null) {
            var cumulSecs = null;
            var cumulRec = (entry.srSplitCumuls && j < entry.srSplitCumuls.length)
              ? entry.srSplitCumuls[j]
              : null;
            if (idx !== null && j < idx && cumulRec) {
              cumulSecs = srParseTime(cumulRec);
            } else if (enCours) {
              cumulSecs = srParseTime(entry.srGameTime || entry.srRealTime);
            }
            if (cumulSecs !== null) {
              // Classer sur la valeur arrondie au dixième (cohérente avec
              // l'affichage : "+0.0" ne bascule pas de couleur).
              var dd = Math.round((cumulSecs - pbCumul) * 10) / 10;
              deltaTxt = srFormatDelta(dd);
              deltaSens = dd < 0 ? "ahead" : dd > 0 ? "behind" : "";
            }
          }
          // Classe de la ligne : actif/done + bordure résultat (ahead/behind).
          var segCls = "sr-seg";
          if (estActif) segCls += " sr-seg-actif";
          else if (idx !== null && j < idx) segCls += " sr-seg-done";
          if (deltaSens === "ahead") segCls += " sr-seg-ahead";
          else if (deltaSens === "behind") segCls += " sr-seg-behind";
          if (segs[j].className !== segCls) segs[j].className = segCls;
          // Colonne temps (droite) — sémantique LiveSplit :
          //   - passé avec temps enregistré : durée réalisée figée
          //   - actif : temps vivant du segment (0:00.00 si armé)
          //   - non atteint / skippé : durée PB du segment (vide si pas de PB)
          var timeEl = segs[j].querySelector(".sr-seg-time");
          if (timeEl) {
            var segTime;
            if (estActif) {
              segTime = entry.srSegTime || "00:00.00";
            } else if (idx !== null && j < idx && enregistre) {
              segTime = enregistre;
            } else {
              segTime = (segPb !== null) ? srFormatSegment(segPb) : "";
            }
            if (timeEl.textContent !== segTime) timeEl.textContent = segTime;
          }
          // Colonne delta (1ère colonne temps) : texte + couleur du résultat.
          var pbEl = segs[j].querySelector(".sr-seg-pb");
          if (pbEl) {
            if (pbEl.textContent !== deltaTxt) pbEl.textContent = deltaTxt;
            var pbCls = "sr-seg-pb" + (deltaSens ? " delta-" + deltaSens : "");
            if (pbEl.className !== pbCls) pbEl.className = pbCls;
          }
        }
        // Barre de progression
        var fill = entry.el.querySelector(".sr-barre-fill");
        if (fill) {
          var pct = 0;
          if (entry.srTotalSplits > 0 && idx !== null) {
            pct = Math.min(100, (idx / entry.srTotalSplits) * 100);
          }
          fill.style.width = pct + "%";
        }
        // Compteur
        var compteur = entry.el.querySelector(".sr-compteur");
        if (compteur && entry.srTotalSplits > 0) {
          compteur.textContent = (idx !== null ? idx : 0) + " / " + entry.srTotalSplits;
        }
        // Scroll auto : centrer le segment actif dans la liste (si la liste
        // déborde). Pas de smooth behavior — le CEF d'OBS saccade avec les
        // animations. Scroll instantané par calcul manuel. Mode ligne :
        // centrage horizontal (scrollLeft) au lieu de vertical (scrollTop).
        if (idx !== null && idx >= 0 && idx < segs.length) {
          var actif = segs[idx];
          if (entry.el.classList.contains("sr-ligne")) {
            var targetX = actif.offsetLeft - (splitsEl.clientWidth - actif.offsetWidth) / 2;
            if (targetX < 0) targetX = 0;
            if (Math.abs(splitsEl.scrollLeft - targetX) > 1) {
              splitsEl.scrollLeft = targetX;
            }
          } else {
            var containerH = splitsEl.clientHeight;
            var actifTop = actif.offsetTop;
            var actifH = actif.offsetHeight;
            // Centrer : scrollTop = top de l'actif - moitié du conteneur + moitié de l'actif
            var target = actifTop - (containerH - actifH) / 2;
            // Clamp ≥ 0
            if (target < 0) target = 0;
            if (Math.abs(splitsEl.scrollTop - target) > 1) {
              splitsEl.scrollTop = target;
            }
          }
        }
      }

      /// Met à jour le timer + phase pill selon l'état consolidé de l'entry.
      function srMajTimerEtPhase(entry) {
        // Timer
        var timerEl = entry.el.querySelector(".sr-timer");
        var timerVal = entry.el.querySelector(".sr-timer-valeur");
        if (timerVal) {
          var t = entry.srGameTime || entry.srRealTime || "00:00.00";
          if (timerVal.textContent !== t) {
            timerVal.textContent = t;
          }
        }
        if (timerEl) {
          var cls = "sr-timer sr-" + srPhaseCls(entry.srPhase);
          if (timerEl.className !== cls) timerEl.className = cls;
        }
        // Phase pill
        var pill = entry.el.querySelector(".sr-phase-pill");
        if (pill) {
          var label = srPhaseLabel(entry.srPhase);
          if (pill.textContent !== label) pill.textContent = label;
          var pillCls = "sr-phase-pill sr-" + srPhaseCls(entry.srPhase);
          if (pill.className !== pillCls) pill.className = pillCls;
        }
      }

      /// Met à jour l'en-tête (jeu + catégorie + statut connexion) selon l'état
      /// consolidé de l'entry. Reproduit le rendu dashboard (WidgetSpeedrun) :
      /// titre centré en haut, catégorie sur sa propre ligne dessous, pastille
      /// de statut en coin haut-droit (● connecté, ○ en attente).
      function srMajHeader(entry) {
        var header = entry.el.querySelector(".sr-header");
        if (!header) return;
        // Titre jeu + catégorie (ou placeholder si aucun splits chargé).
        var html = "";
        if (entry.srNomJeu || entry.srNomCategorie) {
          html = '<div class="sr-titre-jeu">' + (entry.srNomJeu || "") + '</div>' +
            (entry.srNomCategorie ? '<div class="sr-cat">' + entry.srNomCategorie + '</div>' : '');
        } else {
          html = '<div class="sr-titre-jeu"><span class="sr-placeholder">Aucun splits chargé</span></div>';
        }
        // Pastille de statut (comme le dashboard : ● si connecté, ○ si actif).
        if (entry.srConnecte) {
          html += '<span class="sr-status ok" title="' + (entry.srProcessus || "connecté") + '">●</span>';
        } else if (entry.srActif) {
          html += '<span class="sr-status attente" title="en attente…">○</span>';
        }
        // Fix 2026-09-21 (crash thermique PC) : majSpeedrunEtat s'exécute à
        // CHAQUE event WS speedrun (Time à 15Hz par tick quand le timer
        // court) et srMajHeader re-settait innerHTML inconditionnellement →
        // re-parse HTML inutile en continu dans le CEF d'OBS. L'entry (et
        // son élément .sr-header) n'est recréée qu'au rendu de scène : si le
        // HTML n'a pas changé, on ne touche pas au DOM.
        if (entry.srHeaderHtml !== html) {
          entry.srHeaderHtml = html;
          header.innerHTML = html;
        }
      }

      function majSpeedrunEtat(etat) {
        // Stocker les données LSS en attente (l'event peut arriver avant que
        // le widget speedrun soit créé dans widgetMap — race condition resync).
        if (etat.type === "lss") {
          pendingLss = etat;
        }
        // Même chose pour l'état consolidé (resync complet émis à la demande
        // de resync WS — rejoué si le widget est recréé après coup).
        if (etat.type === "etat") {
          pendingEtat = etat;
        }

        // Trouver le widget speedrun dans widgetMap.
        // widgetMap est une Map → itération par entries (for..of), PAS for..in
        // (for..in n'itère jamais les entrées d'une Map → events perdus).
        for (var [id, entry] of widgetMap) {
          if (entry.kind !== "speedrun") continue;

          // Dispatcher selon le type d'event.
          switch (etat.type) {
            case "started":
              entry.srPhase = "Running";
              entry.srActif = true;
              // index = split de départ (armé par clic en NotRunning, sinon 0).
              entry.srIndex = (etat.index !== undefined) ? etat.index : 0;
              entry.srSplitTimes = [];
              entry.srSplitCumuls = [];
              entry.srSegTime = "00:00.00";
              break;
            case "split":
              if (etat.index !== undefined) entry.srIndex = etat.index;
              // etat.time = durée du segment bouclé (le cumul de run voyage
              // dans etat.cumul). index = current_split_index après
              // incrément → segment bouclé = index − 1 (0-based).
              if (etat.time && etat.index !== undefined) {
                if (!entry.srSplitTimes) entry.srSplitTimes = [];
                var segIdx = etat.index - 1;
                while (entry.srSplitTimes.length <= segIdx) entry.srSplitTimes.push("");
                entry.srSplitTimes[segIdx] = etat.time;
              }
              // Cumul de run au split réalisé (base du delta cumulé).
              if (etat.cumul && etat.index !== undefined) {
                if (!entry.srSplitCumuls) entry.srSplitCumuls = [];
                var cumIdx = etat.index - 1;
                while (entry.srSplitCumuls.length <= cumIdx) entry.srSplitCumuls.push(null);
                entry.srSplitCumuls[cumIdx] = etat.cumul;
              }
              // Le nouveau segment repart de zéro (segmentTime réel arrive
              // au prochain tick Time).
              entry.srSegTime = "00:00.00";
              break;
            case "splitSkipped":
              if (etat.index !== undefined) entry.srIndex = etat.index;
              entry.srSegTime = "00:00.00";
              break;
            case "splitUndone":
              if (etat.index !== undefined) {
                entry.srIndex = etat.index;
                // Effacer le temps du split annulé (0-based = etat.index).
                if (entry.srSplitTimes && etat.index < entry.srSplitTimes.length) {
                  entry.srSplitTimes[etat.index] = "";
                }
                if (entry.srSplitCumuls && etat.index < entry.srSplitCumuls.length) {
                  entry.srSplitCumuls[etat.index] = null;
                }
              }
              // Le segment défait reprend là où il en était (d_k) — le temps
              // réel arrive au prochain tick Time.
              entry.srSegTime = null;
              break;
            case "reset":
              entry.srPhase = "NotRunning";
              entry.srIndex = null;
              entry.srGameTime = null;
              entry.srRealTime = "00:00.00";
              entry.srSplitTimes = [];
              entry.srSplitCumuls = [];
              entry.srSegTime = null;
              break;
            case "ended":
              entry.srPhase = "Ended";
              // etat.time = durée du dernier segment, etat.index = total.
              // Stocker le dernier split comme les autres (colonne droite
              // figée) — l'index à total retire le highlight « actif ».
              if (etat.index !== undefined) {
                entry.srIndex = etat.index;
                if (etat.time) {
                  if (!entry.srSplitTimes) entry.srSplitTimes = [];
                  var lastIdx = etat.index - 1;
                  while (entry.srSplitTimes.length <= lastIdx) entry.srSplitTimes.push("");
                  entry.srSplitTimes[lastIdx] = etat.time;
                }
                if (etat.cumul) {
                  if (!entry.srSplitCumuls) entry.srSplitCumuls = [];
                  var lastCumIdx = etat.index - 1;
                  while (entry.srSplitCumuls.length <= lastCumIdx) entry.srSplitCumuls.push(null);
                  entry.srSplitCumuls[lastCumIdx] = etat.cumul;
                }
              }
              entry.srSegTime = null;
              break;
            case "goto":
              // Clic sur une ligne : armement (NotRunning) ou retry de
              // segment. Tous les temps de la tentative sont effacés — les
              // précédents ne comptent pas comme finis (le PB reste affiché
              // via srSegments). Chrono de segment à zéro.
              if (etat.phase) entry.srPhase = etat.phase;
              if (etat.index !== undefined) entry.srIndex = etat.index;
              entry.srSplitTimes = [];
              entry.srSplitCumuls = [];
              entry.srSegTime =
                (etat.phase === "Running" || etat.phase === "Paused")
                  ? "00:00.00" : null;
              break;
            case "etat":
              // Resync complet (reload/reconnexion) : remplace tout l'état.
              if (etat.phase) entry.srPhase = etat.phase;
              entry.srIndex =
                (etat.index !== undefined && etat.index >= 0) ? etat.index : null;
              entry.srSplitTimes = (etat.splitTimes || []).map(function (t) { return t || ""; });
              entry.srSplitCumuls = (etat.splitCumuls || []).map(function (t) { return t || null; });
              if (etat.realTime) entry.srRealTime = etat.realTime;
              entry.srGameTime = etat.gameTime || etat.realTime || null;
              entry.srSegTime = etat.segmentTime || null;
              break;
            case "gameTime":
              if (etat.time) entry.srGameTime = etat.time;
              break;
            case "time":
              if (etat.realTime) entry.srRealTime = etat.realTime;
              if (etat.gameTime !== undefined && etat.gameTime !== null) {
                entry.srGameTime = etat.gameTime;
              } else if (etat.realTime) {
                entry.srGameTime = etat.realTime;
              }
              if (etat.segmentTime !== undefined) entry.srSegTime = etat.segmentTime;
              break;
            case "paused":
              entry.srPhase = "Paused";
              break;
            case "resumed":
              entry.srPhase = "Running";
              break;
            case "stopped":
              entry.srPhase = "NotRunning";
              entry.srIndex = null;
              entry.srGameTime = null;
              entry.srRealTime = "00:00.00";
              entry.srActif = false;
              entry.srConnecte = false;
              entry.srProcessus = null;
              entry.srSplitTimes = [];
              entry.srSplitCumuls = [];
              entry.srSegTime = null;
              break;
            case "connected":
              entry.srConnecte = true;
              if (etat.process) entry.srProcessus = etat.process;
              break;
            case "disconnected":
              // Sortie du jeu : le timer Rust a reset → l'affichage suit
              // (même nettoyage que reset + perte de connexion).
              entry.srConnecte = false;
              entry.srProcessus = null;
              entry.srPhase = "NotRunning";
              entry.srIndex = null;
              entry.srGameTime = null;
              entry.srRealTime = "00:00.00";
              entry.srSplitTimes = [];
              entry.srSplitCumuls = [];
              entry.srSegTime = null;
              break;
            case "lss":
              // Métadonnées LSS (jeu + catégorie + segments) — reçues quand
              // le dashboard charge un .lss. On peuple l'en-tête + la liste
              // des segments (la référence delta = PB du segment, calculée
              // depuis srSegments).
              entry.srNomJeu = etat.nomJeu || "";
              entry.srNomCategorie = etat.nomCategorie || "";
              entry.srSegments = etat.segments || [];
              entry.srTotalSplits = entry.srSegments.length;
              srRecreerSplits(entry, entry.srSegments);
              break;
            default:
              break;
          }

          // Maj DOM : en-tête (jeu + catégorie + statut)
          srMajHeader(entry);

          // Maj DOM : timer + phase pill
          srMajTimerEtPhase(entry);

          // Maj DOM : segments + barre + compteur
          srMajSegmentsVisuel(entry);
        }
      }

      // ===== Mode Just Chatting (frame WS just-chatting-etat) =====
      // Overlay non-destructif : la scène réelle (currentScene, JSON disque)
      // n'est JAMAIS mutée. Quand actif, on rend une COPIE de la scène où le
      // widget caméra et les widgets chat reçoivent les rects JC (fractions
      // 0-1 calculées en Rust × canvas réel) et les autres types sont filtrés
      // — le sweep `seen` retire leur DOM et peindreFond ne perce plus leurs
      // trous (leurs sources OBS disparaissent aussi). La caméra OBS est
      // déplacée par le dashboard (camera_sync), pas ici.
      let jcEtat = { actif: false, paysage: null, portrait: null };

      function jcDeriverScene(scene) {
        if (!jcEtat.actif || !scene || !scene.widgets) return scene;
        var cw = scene.canvasW || 1920;
        var ch = scene.canvasH || 1080;
        // Paysage si W >= H, portrait sinon (formule unique côté Rust).
        var layout = cw >= ch ? jcEtat.paysage : jcEtat.portrait;
        if (!layout || !layout.camera || !layout.chat) return scene;
        var widgets = [];
        for (var jci = 0; jci < scene.widgets.length; jci++) {
          var jcw = scene.widgets[jci];
          var jct = jcw.type || "media";
          if (jct !== "camera" && jct !== "chat") continue;
          var r = jct === "camera" ? layout.camera : layout.chat;
          var copie = Object.assign({}, jcw);
          copie.x = Math.round(r.x * cw);
          copie.y = Math.round(r.y * ch);
          copie.largeur = Math.round(r.w * cw);
          copie.hauteur = Math.round(r.h * ch);
          widgets.push(copie);
        }
        var copieScene = Object.assign({}, scene);
        copieScene.widgets = widgets;
        // JC = caméra + chat SEULS : modules HUD (horloge/musique/objectifs/
        // équaliseur) et capture OBS de fond neutralisés — parité avec
        // sceneDerivee (justChatting.ts). Scène persistée intacte : copie.
        copieScene.modules = {};
        copieScene.bgObsSource = undefined;
        return copieScene;
      }

      function renderScene(scene) {
        if (!scene || !scene.widgets) return;

        // Mode Just Chatting : rendre la scène DÉRIVÉE (copie — jamais la
        // scène réelle). Inactif → identité (jcDeriverScene retourne scene).
        scene = jcDeriverScene(scene);

        // Dims canvas (coords scène).
        applyCanvasDims(scene);

        // Fond de scène d'abord (calque sous les widgets, z-index 0).
        renderBg(scene);

        // Peindre le fond (image : une fois ; vidéo : rAF loop géré dans renderBg).
        peindreFond(scene);

        // Cadre de l'application (bord canvas) — un overlay global sur #stage.
        applyCadreApp(scene);

        // Titre du fond de l'application (intérieur haut/bas) — un élément
        // global sur #stage, sous les widgets.
        applyTitreFond(scene);

        // Équaliseur — overlay spectre dans #eq-root (z 0, juste après #bg
        // dans le DOM → sous tous les widgets). Ne fait que synchroniser
        // rect/options + boucle rAF ; le spectre arrive par eq-spectrum.
        renderModuleEqualiseur(scene);

        // Modules HUD (couche séparée des widgets, #modules-root z 9000).
        renderModules(scene);

        var seen = new Set();

        for (var i = 0; i < scene.widgets.length; i++) {
          var w = scene.widgets[i];
          var wtype = w.type || "media";

          // Trous + caméra : widget transparent (le trou est dans le canvas de
          // fond via destination-out). On crée un élément DOM transparent pour
          // pouvoir appliquer le cadre SVG au-dessus du trou, visible côté
          // diffusion/OBS. Le widget caméra = trou : la source OBS
          // "SOS-Caméra" (dshow_input sous SOS-Diffusion) apparaît à travers.
          if (w.trou === true || wtype === "camera") {
            seen.add(w.id);
            var trouEntry = widgetMap.get(w.id);
            // Transition média/chat → trou : l'entry existante a été créée
            // avec className="widget" (sans "trou") et contient peut-être un
            // <img>/<video>. Si on update sans recréer, le className reste
            // "widget" → background rgba(224,224,224,0.15) → voile gris sur le
            // trou. On détruit et recrée from scratch.
            if (trouEntry && trouEntry.kind !== "trou") {
              // Libérer le contexte GL si c'était un widget morphé.
              if (trouEntry.morphRendu) trouEntry.morphRendu.detruire();
              slidesArreter(trouEntry); // timer carrousel éventuel
              trouEntry.wrapEl.remove();
              widgetMap.delete(w.id);
              trouEntry = null;
            }
            if (trouEntry) {
              // UPDATE : style + cadre (recréé seulement si changé).
              applyWidgetStyle(trouEntry.el, w);
              trouEntry.wrapEl.style.zIndex = w.z;
              applyCadreWidget(trouEntry.el, trouEntry, w, scene.cadreWidget);
              applyTitreWidget(trouEntry, w, scene.cadreWidget);
            } else {
              // CREATE : conteneur transparent avec cadre SVG seulement.
              var trouWrap = document.createElement("div");
              trouWrap.className = "widget-wrap";
              trouWrap.style.zIndex = w.z;
              var trouEl = document.createElement("div");
              trouEl.className = "widget trou";
              applyWidgetStyle(trouEl, w);
              trouWrap.appendChild(trouEl);
              stageEl.appendChild(trouWrap);
              var trouNew = { el: trouEl, wrapEl: trouWrap, mediaEl: null, mediaKey: "", kind: "trou", mediaTime: 0, cadreOverlayEl: null, cadreKey: "", titreEls: null };
              widgetMap.set(w.id, trouNew);
              applyCadreWidget(trouEl, trouNew, w, scene.cadreWidget);
              applyTitreWidget(trouNew, w, scene.cadreWidget);
            }
            continue;
          }

          seen.add(w.id);
          var entry = widgetMap.get(w.id);
          // Transition trou → non-trou : l'entry a className="widget trou"
          // (background transparent, pas de border, pas de média). Si on update
          // sans recréer, le widget reste transparent sans border. On détruit
          // et recrée pour que le bon type (média/chat/caméra) reconstruise
          // l'élément avec la bonne structure DOM.
          if (entry && entry.kind === "trou") {
            entry.wrapEl.remove();
            widgetMap.delete(w.id);
            entry = null;
          }

          if (wtype === "chat") {
            // ===== Widget chat =====
            // Gradient du cadre SVG pour le border des messages (comme les
            // splits du speedrun — variables --sr-grad-from/--sr-grad-to).
            var chatGrad = gradientCadre(scene.cadreWidget);
            // Mise en forme : "bulles" = messages détachés + cadre SVG réel
            // par message (même CadreConfig que les widgets — voir
            // cadreParMessage). La clé de rebuild inclut la signature du
            // cadre par message + la largeur du widget (les SVG par bulle
            // sont mesurés : un resize impose un re-mesure).
            var newStyle = w.chatStyle === "bulles" ? "bulles" : "compact";
            var cadreMsg = newStyle === "bulles" ? cadreParMessage(scene, w) : null;
            var chatRebuildKey = newStyle + "|" + chatGrad.from + "|" + chatGrad.to + "|"
              + (cadreMsg
                ? cadreMsg.style + "|" + cadreMsg.strokeWidth + "|" + (cadreMsg.gradientAngle ?? "") + "|" + Math.round(w.largeur)
                : "");
            if (entry) {
              // UPDATE : style + re-remplir SEULEMENT si filtre/taille/couleurs
              // du cadre/style ont changé. Le border-image des messages est
              // inline (CEF ne recalcule pas les var() en dynamique) →
              // rebuild requis si le gradient bouge. Sinon le DOM suit déjà
              // le buffer via appendChatMessage (O(1)/message) : pas de
              // rebuild 200 nœuds à chaque snapshot.
              applyWidgetStyle(entry.el, w);
              entry.el.style.setProperty("--sr-grad-from", chatGrad.from);
              entry.el.style.setProperty("--sr-grad-to", chatGrad.to);
              entry.el.classList.toggle("chat-bulles", newStyle === "bulles");
              entry.wrapEl.style.zIndex = w.z;
              var newFiltre = w.chatFiltre || "unifie";
              var newTaille = w.taillePolice || 16;
              entry.cadreMsg = cadreMsg;
              if (entry.chatFiltre !== newFiltre || entry.taillePolice !== newTaille || entry.chatRebuildKey !== chatRebuildKey) {
                entry.chatFiltre = newFiltre;
                entry.taillePolice = newTaille;
                entry.chatRebuildKey = chatRebuildKey;
                fillChatBody(entry.chatBody, newFiltre, newTaille, chatGrad.from, chatGrad.to, cadreMsg);
              }
              if (entry.viewersBar) fillViewersBar(entry.viewersBar, newFiltre, newTaille);
              // Média de fond (sous les messages, recréé si changé).
              syncMediaFond(entry, w);
              // Cadre widget : clip-path + overlay SVG (recréé seulement si changé).
              applyCadreWidget(entry.el, entry, w, scene.cadreWidget);
              applyTitreWidget(entry, w, scene.cadreWidget);
            } else {
              // CREATE : conteneur chat.
              var wrapEl = document.createElement("div");
              wrapEl.className = "widget-wrap";
              wrapEl.style.zIndex = w.z;
              var el = document.createElement("div");
              el.className = "widget chat";
              if (newStyle === "bulles") el.classList.add("chat-bulles");
              applyWidgetStyle(el, w);
              el.style.setProperty("--sr-grad-from", chatGrad.from);
              el.style.setProperty("--sr-grad-to", chatGrad.to);
              var viewersBar = document.createElement("div");
              viewersBar.className = "chat-viewers";
              el.appendChild(viewersBar);
              // Ligne « musique en cours » (défilante) — entre la barre
              // viewers et le corps du chat, remplie par majMusiqueMarquee.
              var musiqueEl = document.createElement("div");
              musiqueEl.className = "chat-musique";
              el.appendChild(musiqueEl);
              var chatBody = document.createElement("div");
              chatBody.className = "chat-body";
              el.appendChild(chatBody);
              wrapEl.appendChild(el);
              stageEl.appendChild(wrapEl);
              var filtre = w.chatFiltre || "unifie";
              var taille = w.taillePolice || 16;
              fillChatBody(chatBody, filtre, taille, chatGrad.from, chatGrad.to, cadreMsg);
              fillViewersBar(viewersBar, filtre, taille);
              var chatNew = {
                el: el, wrapEl: wrapEl, mediaEl: null, mediaKey: "",
                kind: "chat", mediaTime: 0,
                chatBody: chatBody, viewersBar: viewersBar, musiqueEl: musiqueEl,
                chatFiltre: filtre, taillePolice: taille,
                chatRebuildKey: chatRebuildKey, cadreMsg: cadreMsg,
                cadreOverlayEl: null, cadreKey: "", titreEls: null
              };
              widgetMap.set(w.id, chatNew);
              // Média de fond (premier enfant, sous le chat-body).
              syncMediaFond(chatNew, w);
              // Cadre widget : clip-path + overlay SVG.
              applyCadreWidget(el, chatNew, w, scene.cadreWidget);
              applyTitreWidget(chatNew, w, scene.cadreWidget);
              // Widget (re)créé pendant qu'une piste joue → reremplir sa
              // ligne défilante (maj globale sur tous les widgets chat).
              majMusiqueMarquee();
            }
            continue;
          }

          // Les widgets "welcome-clip" ne sont plus rendus comme widgets de
          // scène : le clip de bienvenue est désormais un overlay autonome
          // (voir initWelcomeOverlay / playWelcomeClip / stopWelcomeClip plus
          // bas), piloté par les messages WS welcome-clip-play / -stop /
          // -config. On ignore ici tout widget résiduel de ce type (le Rust
          // filtre déjà ces widgets au chargement de scène, mais par sécurité
          // on skip aussi au rendu snapshot).
          if (wtype === "welcome-clip") {
            continue;
          }

          // ===== Widget input viewer (clavier + souris) =====
          // Markup généré UNE FOIS (recréé seulement si mode/layout change) ;
          // l'état des touches arrive par WS input-viewer-etat → maj DOM
          // directe par classe (majInputViewerEtat).
          if (wtype === "input-viewer") {
            seen.add(w.id);
            var ivEntry = widgetMap.get(w.id);
            var ivMode = w.inputMode || "clavier";
            var ivLayout = w.inputLayout || "azerty";
            var ivSkin = w.inputSkin || "xbox";
            var ivCouleur = w.inputCouleur || "#8b5cf6";
            // Le flag "carre" du châssis fait partie de la clé : un changement
            // de style de cadre régénère le markup (rx de la plaque).
            var ivKey = ivMode + "|" + ivLayout + "|" + ivSkin
              + "|" + (ivChassisCarre(w, scene.cadreWidget) ? "c" : "r");
            if (ivEntry && ivEntry.kind !== "inputviewer") {
              slidesArreter(ivEntry); // timer carrousel éventuel
              ivEntry.wrapEl.remove();
              widgetMap.delete(w.id);
              ivEntry = null;
            }
            if (ivEntry) {
              // UPDATE : style + contenu si mode/layout changé + couleur.
              applyWidgetStyle(ivEntry.el, w);
              ivEntry.wrapEl.style.zIndex = w.z;
              if (ivEntry.inputKey !== ivKey) {
                ivEntry.inputKey = ivKey;
                ivEntry.el.innerHTML = ivGenererHTML(w, scene.cadreWidget);
                // innerHTML a détruit l'overlay cadre SVG → forcer recréation.
                ivEntry.cadreOverlayEl = null;
                ivEntry.cadreKey = "";
                // innerHTML a AUSSI détruit le média de fond → forcer
                // recréation par syncMediaFond ci-dessous.
                ivEntry.mediaEl = null;
                ivEntry.mediaKey = "";
              }
              ivEntry.el.setAttribute("data-mode", ivMode);
              ivEntry.el.style.setProperty(
                "--inputviewer-couleur-presse",
                w.inputCouleur || "#8b5cf6"
              );
              ivEntry.inputMapping = w.inputMapping || null;
              ivEntry.el._inputMapping = ivEntry.inputMapping;
              // Média de fond (sous les keycaps, recréé si changé/détruit).
              syncMediaFond(ivEntry, w);
              applyCadreWidget(ivEntry.el, ivEntry, w, scene.cadreWidget);
              applyTitreWidget(ivEntry, w, scene.cadreWidget);
            } else {
              // CREATE : conteneur + markup clavier/souris.
              var ivWrap = document.createElement("div");
              ivWrap.className = "widget-wrap";
              ivWrap.style.zIndex = w.z;
              var ivEl = document.createElement("div");
              ivEl.className = "widget inputviewer";
              applyWidgetStyle(ivEl, w);
              ivEl.setAttribute("data-mode", ivMode);
              ivEl.style.setProperty(
                "--inputviewer-couleur-presse",
                w.inputCouleur || "#8b5cf6"
              );
              ivEl.innerHTML = ivGenererHTML(w, scene.cadreWidget);
              ivEl._inputMapping = w.inputMapping || null;
              ivWrap.appendChild(ivEl);
              stageEl.appendChild(ivWrap);
              var ivNew = {
                el: ivEl, wrapEl: ivWrap, mediaEl: null, mediaKey: "",
                kind: "inputviewer", mediaTime: 0, inputKey: ivKey,
                inputMapping: w.inputMapping || null,
                cadreOverlayEl: null, cadreKey: "", titreEls: null
              };
              widgetMap.set(w.id, ivNew);
              // Média de fond (premier enfant, sous le markup clavier/souris).
              syncMediaFond(ivNew, w);
              applyCadreWidget(ivEl, ivNew, w, scene.cadreWidget);
              applyTitreWidget(ivNew, w, scene.cadreWidget);
            }
            continue;
          }

          // ===== Widget speedrun splitter =====
          // Timer + splits rendus côté diffusion. L'état arrive par WS
          // speedrun-etat → maj DOM directe (textContent/classList, zéro
          // re-render — le CEF d'OBS saccade sinon).
          if (wtype === "speedrun") {
            seen.add(w.id);
            var srEntry = widgetMap.get(w.id);
            if (srEntry && srEntry.kind !== "speedrun") {
              slidesArreter(srEntry); // timer carrousel éventuel
              srEntry.wrapEl.remove();
              widgetMap.delete(w.id);
              srEntry = null;
            }
            if (srEntry) {
              // UPDATE : style + z-order + cadre.
              applyWidgetStyle(srEntry.el, w);
              // Disposition colonne/ligne (srLayout + seuil hauteur en auto).
              srEntry.el.classList.toggle("sr-ligne", srEstLigne(w));
              var srGrad = gradientCadre(scene.cadreWidget);
              srEntry.el.style.setProperty("--sr-grad-from", srGrad.from);
              srEntry.el.style.setProperty("--sr-grad-to", srGrad.to);
              // Ombre de contraste (noir/blanc) selon la luminance de la couleur
              // du cadre — fait ressortir le timer gradient.
              srEntry.el.style.setProperty("--sr-ombre", contrasteOmbre(srGrad.from));
              // Police Google Font + taille de base du splitter (comme le chat) :
              // toutes les tailles internes sont en em → suit cette base.
              var srPolice = w.srPolice || "Rajdhani";
              var srTaille = w.srTaillePolice || 16;
              srEntry.el.style.fontFamily = "'" + srPolice + "', 'Segoe UI', sans-serif";
              srEntry.el.style.fontSize = srTaille + "px";
              srEntry.wrapEl.style.zIndex = w.z;
              // Média de fond (sous le timer + les splits, recréé si changé).
              syncMediaFond(srEntry, w);
              applyCadreWidget(srEntry.el, srEntry, w, scene.cadreWidget);
              applyTitreWidget(srEntry, w, scene.cadreWidget);
            } else {
              // CREATE : conteneur + structure timer + splits.
              var srWrap = document.createElement("div");
              srWrap.className = "widget-wrap";
              srWrap.style.zIndex = w.z;
              var srEl = document.createElement("div");
              srEl.className = "widget speedrun";
              applyWidgetStyle(srEl, w);
              // Disposition colonne/ligne (srLayout + seuil hauteur en auto).
              srEl.classList.toggle("sr-ligne", srEstLigne(w));
              var srGrad = gradientCadre(scene.cadreWidget);
              srEl.style.setProperty("--sr-grad-from", srGrad.from);
              srEl.style.setProperty("--sr-grad-to", srGrad.to);
              // Ombre de contraste (noir/blanc) selon la luminance de la couleur
              // du cadre — fait ressortir le timer gradient.
              srEl.style.setProperty("--sr-ombre", contrasteOmbre(srGrad.from));
              // Police Google Font + taille de base du splitter (comme le chat) :
              // toutes les tailles internes sont en em → suit cette base.
              var srPolice = w.srPolice || "Rajdhani";
              var srTaille = w.srTaillePolice || 16;
              srEl.style.fontFamily = "'" + srPolice + "', 'Segoe UI', sans-serif";
              srEl.style.fontSize = srTaille + "px";
              srEl.innerHTML =
                '<div class="sr-header">' +
                  '<div class="sr-titre-jeu"><span class="sr-placeholder">Aucun splits chargé</span></div>' +
                '</div>' +
                '<div class="sr-timer sr-ready"><span class="sr-timer-valeur">00:00.00</span></div>' +
                '<div class="sr-meta">' +
                  '<span class="sr-phase-pill sr-ready">Ready</span>' +
                  '<span class="sr-compteur"></span>' +
                '</div>' +
                '<div class="sr-barre"><div class="sr-barre-fill" style="width:0%"></div></div>' +
                '<div class="sr-splits"></div>';
              srWrap.appendChild(srEl);
              stageEl.appendChild(srWrap);
              var srNew = {
                el: srEl, wrapEl: srWrap, mediaEl: null, mediaKey: "",
                kind: "speedrun", mediaTime: 0,
                cadreOverlayEl: null, cadreKey: "", titreEls: null,
                srTotalSplits: 0, srPhase: "NotRunning", srSegments: [],
                srIndex: null, srGameTime: null, srRealTime: "00:00.00",
                srNomJeu: "", srNomCategorie: "", srConnecte: false, srActif: false,
                srProcessus: null, srSplitTimes: [], srSplitCumuls: [],
                srSegTime: null
              };
              widgetMap.set(w.id, srNew);
              // Média de fond (premier enfant, sous le timer + les splits).
              syncMediaFond(srNew, w);
              applyCadreWidget(srEl, srNew, w, scene.cadreWidget);
              applyTitreWidget(srNew, w, scene.cadreWidget);
              // Appliquer le LSS en attente (race condition resync : l'event
              // LSS peut arriver avant la création du widget).
              if (pendingLss) {
                majSpeedrunEtat(pendingLss);
              }
              // Rejouer le dernier état consolidé si reçu (run en cours au
              // moment où le widget a été recréé — resync index + temps).
              if (pendingEtat) {
                majSpeedrunEtat(pendingEtat);
              }
            }
            continue;
          }

          // ===== Widget objectif (goal) =====
          // Compteur live + cible + barre de progression. Markup créé UNE
          // FOIS ; les valeurs arrivent par frames WS communaute/viewers →
          // majGoalValeur (textContent + width, zéro re-render). Célébration
          // interne sur goal-atteint (goalCelebrer). Cadre/titre = infra
          // partagée (applyCadreWidget/applyTitreWidget).
          if (wtype === "goal") {
            seen.add(w.id);
            var gEntry = widgetMap.get(w.id);
            if (gEntry && gEntry.kind !== "goal") {
              slidesArreter(gEntry); // timer carrousel éventuel
              gEntry.wrapEl.remove();
              widgetMap.delete(w.id);
              gEntry = null;
            }
            var gGrad = gradientCadre(scene.cadreWidget);
            var gKey = (w.goalPlateforme || "twitch") + "|" +
              (w.goalId ? "id:" + w.goalId : (w.goalMetrique || "followers"));
            if (gEntry) {
              // UPDATE : style + z + cadre + entête si plat/métrique/lien
              // changé. En mode lié le label peut aussi évoluer via les
              // frames goal-twitch (majGoalValeur le met à jour).
              applyWidgetStyle(gEntry.el, w);
              gEntry.el.style.setProperty("--sr-grad-from", gGrad.from);
              gEntry.el.style.setProperty("--sr-grad-to", gGrad.to);
              // --goal-w/--goal-h : base des tailles calc() du CSS goal
              // (pas de cqw — absent du CEF de plusieurs versions d'OBS).
              // MAJ à chaque snapshot → suit les resizes.
              gEntry.el.style.setProperty("--goal-w", w.largeur + "px");
              gEntry.el.style.setProperty("--goal-h", w.hauteur + "px");
              gEntry.wrapEl.style.zIndex = w.z;
              if (gEntry.goalKey !== gKey) {
                gEntry.goalKey = gKey;
                gEntry.goalEnteteEl.innerHTML =
                  logoPlateforme(w.goalPlateforme || "twitch") +
                  '<span class="goal-met">' + goalLabelEntete(w) + '</span>';
                gEntry.goalMetEl = gEntry.goalEnteteEl.querySelector(".goal-met");
              }
              majGoalValeur(gEntry, w);
              // Média de fond (sous le contenu, recréé si changé).
              syncMediaFond(gEntry, w);
              // Cadre à l'échelle « bulle » (cadreGoal) — même taille que
              // le cadre des messages chat en mode bulles.
              applyCadreWidget(gEntry.el, gEntry, w, cadreGoal(scene));
              applyTitreWidget(gEntry, w, scene.cadreWidget);
            } else {
              // CREATE : conteneur + entête (logo+métrique) + chiffres + barre.
              var gWrap = document.createElement("div");
              gWrap.className = "widget-wrap";
              gWrap.style.zIndex = w.z;
              var gEl = document.createElement("div");
              gEl.className = "widget goal";
              applyWidgetStyle(gEl, w);
              gEl.style.setProperty("--sr-grad-from", gGrad.from);
              gEl.style.setProperty("--sr-grad-to", gGrad.to);
              gEl.style.setProperty("--goal-w", w.largeur + "px");
              gEl.style.setProperty("--goal-h", w.hauteur + "px");
              gEl.innerHTML =
                '<div class="goal-entete">' +
                  logoPlateforme(w.goalPlateforme || "twitch") +
                  '<span class="goal-met">' + goalLabelEntete(w) + '</span>' +
                '</div>' +
                '<div class="goal-chiffres"><span class="goal-actuel">N/A</span>' +
                  '<span class="goal-sep">/</span><span class="goal-cible">—</span></div>' +
                '<div class="goal-bar"><div class="goal-fill"></div></div>' +
                '<div class="goal-statut"></div>' +
                '<div class="goal-celebration">🎉 Objectif atteint !</div>';
              gWrap.appendChild(gEl);
              stageEl.appendChild(gWrap);
              var gNew = {
                el: gEl, wrapEl: gWrap, mediaEl: null, mediaKey: "",
                kind: "goal", mediaTime: 0,
                goalKey: gKey,
                goalEnteteEl: gEl.querySelector(".goal-entete"),
                goalMetEl: gEl.querySelector(".goal-met"),
                goalActuelEl: gEl.querySelector(".goal-actuel"),
                goalCibleEl: gEl.querySelector(".goal-cible"),
                goalFillEl: gEl.querySelector(".goal-fill"),
                goalStatutEl: gEl.querySelector(".goal-statut"),
                goalCelebEl: gEl.querySelector(".goal-celebration"),
                goalTimer: null,
                cadreOverlayEl: null, cadreKey: "", titreEls: null
              };
              widgetMap.set(w.id, gNew);
              majGoalValeur(gNew, w);
              // Média de fond (premier enfant, sous le contenu).
              syncMediaFond(gNew, w);
              applyCadreWidget(gEl, gNew, w, cadreGoal(scene));
              applyTitreWidget(gNew, w, scene.cadreWidget);
            }
            continue;
          }

          // ===== Widget musique (mini-lecteur Winamp : LCD + EQ + barre) =====
          // Contenu piloté par les frames musique-* + le tick local
          // (musiqueAudio.currentTime — même page, pas besoin de la
          // progression Rust). musiqueMode "eq" = bandes seules.
          if (wtype === "musique") {
            seen.add(w.id);
            var muEntry = widgetMap.get(w.id);
            if (muEntry && muEntry.kind !== "musique") {
              slidesArreter(muEntry); // timer carrousel éventuel
              muEntry.wrapEl.remove();
              widgetMap.delete(w.id);
              muEntry = null;
            }
            var muMode = w.musiqueMode === "eq" ? "eq" : "player";
            if (muEntry) {
              // UPDATE : style + z + bascule de mode (classe — même DOM).
              applyWidgetStyle(muEntry.el, w);
              muEntry.el.style.setProperty("--mu-w", w.largeur + "px");
              muEntry.el.style.setProperty("--mu-h", w.hauteur + "px");
              muEntry.wrapEl.style.zIndex = w.z;
              if (muEntry.muMode !== muMode) {
                muEntry.muMode = muMode;
                muEntry.el.classList.toggle("mu-eq-only", muMode === "eq");
              }
              syncMediaFond(muEntry, w);
              applyCadreWidget(muEntry.el, muEntry, w, scene.cadreWidget);
              applyTitreWidget(muEntry, w, scene.cadreWidget);
            } else {
              // CREATE : conteneur + LCD (marquee + temps) + EQ 16 barres +
              // barre de position crantée.
              var muWrap = document.createElement("div");
              muWrap.className = "widget-wrap";
              muWrap.style.zIndex = w.z;
              var muEl = document.createElement("div");
              muEl.className = "widget musique" + (muMode === "eq" ? " mu-eq-only" : "");
              applyWidgetStyle(muEl, w);
              muEl.style.setProperty("--mu-w", w.largeur + "px");
              muEl.style.setProperty("--mu-h", w.hauteur + "px");
              muEl.innerHTML =
                '<div class="mu-titre">WINAMP</div>' +
                '<div class="mu-lcd">' +
                  '<span class="mu-temps"><span class="mu-pos">--:--</span>' +
                    '<span class="mu-rest"></span></span>' +
                  '<div class="mu-defile-wrap"><span class="mu-defile">' +
                    '<span class="mu-txt"></span><span class="mu-txt"></span>' +
                  '</span></div>' +
                '</div>' +
                '<div class="mu-eq"></div>' +
                '<div class="mu-posbar"><div class="mu-posfill"></div></div>';
              var muEqEl = muEl.querySelector(".mu-eq");
              var muBars = [];
              var muPeaks = [];
              for (var mbi = 0; mbi < 16; mbi++) {
                var muCol = document.createElement("div");
                muCol.className = "mu-col";
                var muPeak = document.createElement("div");
                muPeak.className = "mu-peak";
                muPeak.style.display = "none";
                var muBar = document.createElement("div");
                muBar.className = "mu-bar";
                muCol.appendChild(muPeak);
                muCol.appendChild(muBar);
                muEqEl.appendChild(muCol);
                muBars.push(muBar);
                muPeaks.push(muPeak);
              }
              muWrap.appendChild(muEl);
              stageEl.appendChild(muWrap);
              var muDefile = muEl.querySelector(".mu-defile");
              var muNew = {
                el: muEl, wrapEl: muWrap, mediaEl: null, mediaKey: "",
                kind: "musique", mediaTime: 0, muMode: muMode, muKey: null,
                muDefileEl: muDefile,
                muTxtEls: muDefile.querySelectorAll(".mu-txt"),
                muPosEl: muEl.querySelector(".mu-pos"),
                muRestEl: muEl.querySelector(".mu-rest"),
                muFillEl: muEl.querySelector(".mu-posfill"),
                muBars: muBars,
                muPeakEls: muPeaks,
                cadreOverlayEl: null, cadreKey: "", titreEls: null
              };
              widgetMap.set(w.id, muNew);
              majMusiqueWidget(muNew);
              syncMediaFond(muNew, w);
              applyCadreWidget(muEl, muNew, w, scene.cadreWidget);
              applyTitreWidget(muNew, w, scene.cadreWidget);
            }
            // Le tick 250 ms ne tourne que s'il reste un widget musique.
            assurerTickMusique();
            continue;
          }

          // ===== Widget média MORPHÉ (canvas GL) =====
          // Média avec morphs → canvas warpé (source cachée pour img/video).
          // Rendu one-shot image ; vidéo → boucle rAF (morphAssurerBoucle).
          if (w.media && w.morphs && w.morphs.length) {
            seen.add(w.id);
            var mMEntry = widgetMap.get(w.id);
            // Transition depuis un autre kind → détruire et recréer.
            if (mMEntry && mMEntry.kind !== "morph") {
              if (mMEntry.morphRendu) mMEntry.morphRendu.detruire();
              slidesArreter(mMEntry); // timer carrousel éventuel
              mMEntry.wrapEl.remove();
              widgetMap.delete(w.id);
              mMEntry = null;
            }
            if (!mMEntry) {
              var mWrap = document.createElement("div");
              mWrap.className = "widget-wrap";
              mWrap.style.zIndex = w.z;
              var mEl = document.createElement("div");
              mEl.className = "widget";
              applyWidgetStyle(mEl, w);
              var mCv = document.createElement("canvas");
              mCv.className = "morph-canvas";
              mEl.appendChild(mCv);
              var mSrc = createMedia(w, w.kind || kindFromMedia(w.media));
              mSrc.className = "morph-src";
              mEl.appendChild(mSrc);
              mWrap.appendChild(mEl);
              stageEl.appendChild(mWrap);
              try {
                mMEntry = {
                  el: mEl, wrapEl: mWrap, mediaEl: mSrc, mediaKey: mediaKey(w.media), kind: "morph",
                  mediaTime: 0, morphRendu: morphCreerRendu(mCv), morphOffscreen: null,
                  morphRaf: null, dernierW: w, cadreOverlayEl: null, cadreKey: "", titreEls: null
                };
              } catch {
                mMEntry = null;
              }
              if (mMEntry) {
                widgetMap.set(w.id, mMEntry);
              } else {
                // Pas de WebGL → traiter comme média normal (tombera dans le
                // chemin existant au prochain snapshot après nettoyage).
                mWrap.remove();
                seen.delete(w.id);
                continue;
              }
            }
            // UPDATE : style widget + média caché + état vidéo + rendu.
            applyWidgetStyle(mMEntry.el, w);
            mMEntry.wrapEl.style.zIndex = w.z;
            // Recréer la source cachée si le média a changé (comme le chemin
            // normal vérifie mediaKey — sinon l'ancien média resterait affiché).
            // Carrousel : la source devient la slide courante — le timer swap
            // le src, le rendu GL frame-par-frame suit sans autre travail.
            var mSlides = (w.mediaSlides && w.mediaSlides.length) ? w.mediaSlides : null;
            var mKey = mSlides ? slidesKeyOf(mSlides) : mediaKey(w.media);
            var mSec = slidesSecOf(w.mediaSlidesSec);
            if (mMEntry.mediaKey !== mKey) {
              mMEntry.mediaKey = mKey;
              mMEntry.mediaTime = w.mediaTime || 0;
              mMEntry.slidesList = mSlides;
              mMEntry.slideIdx = 0;
              mMEntry.slideSec = mSec;
              // Famille d'élément : carrousel = img, média vidéo = video (un
              // <video> n'affiche pas une image fixe) → remplacer si besoin.
              var mNeedVideo = mSlides ? false : ((w.kind || kindFromMedia(w.media || "")) === "video");
              if ((mMEntry.mediaEl.tagName === "VIDEO") !== mNeedVideo) {
                var mRepl = mNeedVideo ? createMedia(w, "video") : document.createElement("img");
                mRepl.className = "morph-src";
                mMEntry.mediaEl.replaceWith(mRepl);
                mMEntry.mediaEl = mRepl;
              }
              // Image : re-rendre au load si la slide n'est pas encore
              // chargée (le rendu one-shot ci-dessous partirait à vide).
              if (mMEntry.mediaEl.tagName === "IMG") {
                mMEntry.mediaEl.onload = function () { if (mMEntry.dernierW) morphRendreWidget(mMEntry, mMEntry.dernierW); };
              }
              mMEntry.mediaEl.src = "/" + (mSlides ? mSlides[0].rel : w.media);
              slidesDemarrerMorph(mMEntry);
            } else if (mSlides && mMEntry.slideSec !== mSec) {
              // Même liste, intervalle changé : recaler le timer sans
              // reconstruire (slide courante conservée).
              mMEntry.slideSec = mSec;
              slidesDemarrerMorph(mMEntry);
            }
            applyMediaState(mMEntry, w);
            mMEntry.dernierW = w;
            morphRendreWidget(mMEntry, w);
            applyCadreWidget(mMEntry.el, mMEntry, w, scene.cadreWidget);
            applyTitreWidget(mMEntry, w, scene.cadreWidget);
            if (mMEntry.mediaEl.tagName === "VIDEO") morphAssurerBoucle();
            continue;
          }

          // ===== Widget média (chemin existant) =====
          var kind = w.kind || (w.media ? kindFromMedia(w.media) : "image");
          var key = mediaKey(w.media);
          // Carrousel actif : liste non vide → prioritaire sur `media` (le
          // média unique reste stocké, il redevient visible si liste vidée).
          var slidesList = (w.mediaSlides && w.mediaSlides.length) ? w.mediaSlides : null;

          // Transition morph → média normal (morphs retirés) : l'entry "morph"
          // contient un canvas + source cachée → détruire et recréer from
          // scratch (le chemin normal ne sait pas remplacer un canvas).
          if (entry && entry.kind === "morph") {
            if (entry.morphRendu) entry.morphRendu.detruire();
            slidesArreter(entry); // timer carrousel morph éventuel
            entry.wrapEl.remove();
            widgetMap.delete(w.id);

      // --- MGStyle (Metal Gear Solid) ---

      // --- Tribal ---
