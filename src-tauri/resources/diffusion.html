<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamOS — Diffusion</title>
    <style>
      :root {
        --fond: #0a0a0a;
        --texte: #e0e0e0;
        --canvas-w: 1920px;
        --canvas-h: 1080px;
        /* Variables UI partagées avec le dashboard (app.css) — pour le rendu
           identique du widget speedrun côté diffusion. */
        --gris: #9a9a9a;
        --gris-fonce: #1c1c1c;
        --bordure: #3d3d3d;
        --rayon-petit: 5px;
        --rayon: 8px;
        --rayon-grand: 14px;
        --message-user-action-color: #e0a060;
        --message-ok-color: #22c55e;
        --message-error-color: #c0392b;
      }
      /* Polices Google Font (woff2, subset latin) pour les titres de widgets.
         Servies par :4321 sur /fonts/{name} (même origine que la diffusion). */
      @font-face { font-family: 'Anton'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Anton.woff2) format('woff2'); }
      @font-face { font-family: 'Audiowide'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Audiowide.woff2) format('woff2'); }
      @font-face { font-family: 'BebasNeue'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/BebasNeue.woff2) format('woff2'); }
      @font-face { font-family: 'BlackOpsOne'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/BlackOpsOne.woff2) format('woff2'); }
      @font-face { font-family: 'Bungee'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Bungee.woff2) format('woff2'); }
      @font-face { font-family: 'Caveat'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Caveat.woff2) format('woff2'); }
      @font-face { font-family: 'Creepster'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Creepster.woff2) format('woff2'); }
      @font-face { font-family: 'Fredoka'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Fredoka.woff2) format('woff2'); }
      @font-face { font-family: 'Lobster'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Lobster.woff2) format('woff2'); }
      @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Montserrat.woff2) format('woff2'); }
      @font-face { font-family: 'Orbitron'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Orbitron.woff2) format('woff2'); }
      @font-face { font-family: 'Oswald'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Oswald.woff2) format('woff2'); }
      @font-face { font-family: 'Pacifico'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Pacifico.woff2) format('woff2'); }
      @font-face { font-family: 'PermanentMarker'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/PermanentMarker.woff2) format('woff2'); }
      @font-face { font-family: 'PressStart2P'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/PressStart2P.woff2) format('woff2'); }
      @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Rajdhani.woff2) format('woff2'); }
      @font-face { font-family: 'Righteous'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Righteous.woff2) format('woff2'); }
      @font-face { font-family: 'RussoOne'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/RussoOne.woff2) format('woff2'); }
      @font-face { font-family: 'Satisfy'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Satisfy.woff2) format('woff2'); }
      @font-face { font-family: 'Teko'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Teko.woff2) format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: var(--canvas-w);
        height: var(--canvas-h);
        background: transparent;
        color: var(--texte);
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: var(--canvas-w);
        height: var(--canvas-h);
      }
      #voile-noir {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        z-index: 9999;
        transition: opacity 300ms ease;
      }
      .widget-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .widget {
        position: absolute;
        background: rgba(224, 224, 224, 0.15);
        border: 1px solid rgba(224, 224, 224, 0.6);
        transform-origin: center center;
        overflow: hidden;
      }
      /* Widget média morphé : canvas warpé (fill le widget) + source cachée
         (1px, opacity 0 — hors flux mais "rendue" pour que la vidéo décode). */
      .morph-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .morph-src {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      /* Widget trou : transparent (le trou est dans le canvas de fond via
         destination-out). Seul le cadre SVG est visible au-dessus du trou. */
      .widget.trou {
        background: transparent;
        border: none;
      }
      .widget img {
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;
        transform-origin: center center;
      }
      .widget video {
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;
        transform-origin: center center;
      }
      /* Média de fond des widgets à contenu (chat / input-viewer / speedrun) :
         premier enfant du widget, absolute z-index 0 → le contenu peint
         par-dessus (voir .chat-body / .widget.inputviewer > * / .widget.speedrun > *).
         Les règles globales .widget img/video donnent déjà 100%/object-fit. */
      .media-fond {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      /* Overlay cadre SVG widget : position absolute, inset 0, au-dessus du
         média, pointer-events:none pour ne pas bloquer. */
      .cadre-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
      /* Titre du widget (au-dessus ou en dessous) — hors .widget (non clippé
         par le cadre SVG). Positionné dans .widget-wrap (couvre toute la
         scène). Gradient de texte reprenant les couleurs du cadre actif. */
      .widget-titre {
        position: absolute;
        white-space: nowrap;
        pointer-events: none;
        z-index: 10;
        line-height: 1.1;
        font-weight: 400;
        text-align: center;
      }
      /* Titre du fond de l'application (intérieur haut/bas) — hors #bg (non
         clippé). Positionné sur #stage (couvre tout le canvas). Au-dessus du
         fond (z-index 1), sous les widgets. Gradient de texte reprenant les
         couleurs du cadre de l'application (cadreApp). */
      #bg-titre {
        position: absolute;
        white-space: nowrap;
        pointer-events: none;
        z-index: 1;
        line-height: 1.1;
        font-weight: 400;
        text-align: center;
      }
      /* Overlay cadre app : bord extérieur du canvas, au-dessus des widgets. */
      #cadre-app-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 100;
      }
      #bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }
      /* Canvas qui affiche le fond avec les trous (destination-out).
         L'img/video source est display:none, sert uniquement de source
         pour drawImage. */
      #bg-canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }
      #bg img, #bg video {
        display: none;
      }
      /* Widget chat — style ASH (classique, ancienne app Rust).
         Coins carrés, zébrage odd/even, avatar rond, badges emoji,
         pseudo coloré (tag IRCv3 color ou fallback HSL depuis le hash),
         séparateur « : », emojis visibles.
         Fond + messages en glass glow : backdrop-filter blur + bg
         semi-transparent + glow reprenant la couleur du cadre SVG. */
      .widget.chat {
        background: rgba(10, 10, 10, 0.35);
        backdrop-filter: blur(10px) saturate(140%);
        -webkit-backdrop-filter: blur(10px) saturate(140%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18), 0 0 18px rgba(255, 255, 255, 0.08);
        overflow: hidden;
        /* Colonne : barre viewers (flex-shrink 0) + chat-body (flex 1). */
        display: flex;
        flex-direction: column;
      }
      /* Barre viewers en tête du widget chat : œil + une pastille
         (logo plateforme + count) par plateforme live. Cachée tant qu'aucun
         count n'est connu (:empty → display:none, layout identique à avant). */
      .chat-viewers {
        display: flex;
        align-items: center;
        gap: 0.8em;
        padding: 0.3em 0.6em;
        flex-shrink: 0;
        position: relative;
        z-index: 1; /* au-dessus du média de fond (.media-fond z-index 0) */
        color: #fff;
        font-weight: 700;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        font-family: system-ui, "Segoe UI Emoji", "Apple Color Emoji",
          "Noto Color Emoji", sans-serif;
      }
      .chat-viewers:empty { display: none; }
      .chat-viewers .vplat { display: inline-flex; align-items: center; gap: 0.25em; }
      .chat-viewers .veye { opacity: 0.8; }
      .chat-viewers .logo { width: 1em; height: 1em; opacity: 0.85; }
      .chat-viewers .plat-badge {
        font-size: 0.55em;
        font-weight: 700;
        padding: 0 0.2rem;
        border-radius: 0.15rem;
        color: #fff;
        line-height: 1.4;
      }
      .chat-viewers .plat-badge.twitch { background: #9146ff; }
      .chat-viewers .plat-badge.kick { background: #53fc18; color: #000; }
      .chat-viewers .plat-badge.youtube { background: #ff0000; }
      .chat-viewers .plat-badge.tiktok { background: #000; }
      .chat-body {
        width: 100%;
        /* flex:1 au lieu de height:100% — la barre viewers prend sa place
           au-dessus sans faire déborder le widget. */
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 4px;
        padding-top: 5%;
        display: flex;
        flex-direction: column;
        gap: 0;
        /* Au-dessus du média de fond (.media-fond z-index 0). */
        position: relative;
        z-index: 1;
        pointer-events: none;
        font-family: system-ui, "Segoe UI Emoji", "Apple Color Emoji",
          "Noto Color Emoji", sans-serif;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      }
      .chat-body::-webkit-scrollbar { width: 6px; }
      .chat-body::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
      }
      .chat-msg {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        padding: 4px 6px 4px 10px;
        word-wrap: break-word;
        overflow-wrap: anywhere;
        line-height: 1.4;
        /* Glass glow : fond glass transparent (rgba + backdrop blur, zébrage
           odd/even). La bordure gradient couleur cadre est appliquée en inline
           par fillChatBody (border-image) — le CEF d'OBS ne recalcule pas
           border-image quand une var() change dynamiquement. */
        border: 1px solid;
        border-radius: 0; /* carré */
        backdrop-filter: blur(6px) saturate(130%);
        -webkit-backdrop-filter: blur(6px) saturate(130%);
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.06);
        background: rgba(255, 255, 255, 0.07);
      }
      /* Zébrage : 1 message sur 2 en noir complet (alternance stricte). */
      .chat-msg:nth-child(even) {
        background: #000;
      }
      /* Taille en em (suit la taille de police du widget). width/height
         explicites OBLIGATOIRES : la règle globale `.widget img` étire les
         images à 100% (widgets média) et écraserait les attributs HTML. */
      .chat-msg .avatar {
        width: 1.8em;
        height: 1.8em;
        flex-shrink: 0;
        border-radius: 50%;
        object-fit: cover;
        margin-top: 2px;
        margin-left: 4px;
        /* Anneau couleur cadre appliqué en inline par fillChatBody
           (box-shadow ring qui suit le border-radius — border-image ne le suit pas). */
      }
      .chat-msg .chat-contenu {
        flex: 1;
        min-width: 0;
        word-wrap: break-word;
        overflow-wrap: anywhere;
      }
      .chat-msg .badge {
        margin-right: 2px;
        font-size: 0.9em;
        vertical-align: middle;
      }
      .chat-msg .logo {
        flex-shrink: 0;
        align-self: center;
        opacity: 0.85;
        margin-right: 2px;
        vertical-align: middle;
      }
      .chat-msg .plat-badge {
        flex-shrink: 0;
        align-self: center;
        font-size: 0.55em;
        font-weight: 700;
        padding: 0 0.2rem;
        border-radius: 0.15rem;
        color: #fff;
        line-height: 1.4;
        margin-right: 0.1rem;
        vertical-align: middle;
      }
      .chat-msg .plat-badge.twitch { background: #9146ff; }
      .chat-msg .plat-badge.kick { background: #53fc18; color: #000; }
      .chat-msg .plat-badge.youtube { background: #ff0000; }
      .chat-msg .plat-badge.tiktok { background: #000; }
      .chat-msg .pseudo {
        font-weight: 700;
        margin-right: 2px;
      }
      .chat-msg .separateur {
        margin-right: 2px;
        opacity: 0.7;
      }
      .chat-msg .texte {
        word-wrap: break-word;
        overflow-wrap: anywhere;
      }

      /* Widget clip de bienvenue : CARTE verticale (portrait, type téléphone) —
         avatar rond centré en haut, pseudo + CTA + bio en dessous, puis <video>
         16:9 qui streame le clip depuis le CDN signé. La carte occupe le rect
         x/y/largeur/hauteur de la config. Toutes les tailles en cqw (container
         query width) → responsive au resize depuis le dashboard. */
      .widget.welcome-clip {
        width: 100%;
        height: auto;
        box-sizing: border-box;
        background: rgba(10, 10, 10, 0.92);
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8cqw;
        padding: 1.5cqw;
        color: var(--texte);
        font-family: system-ui, "Segoe UI Emoji", "Apple Color Emoji",
          "Noto Color Emoji", sans-serif;
        container-type: inline-size;
        container-name: wc;
      }
      .welcome-clip-entete {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5cqw;
        width: 100%;
        flex-shrink: 0;
        pointer-events: none;
      }
      .welcome-clip-avatar {
        width: 16cqw;
        height: 16cqw;
        max-width: 72px;
        max-height: 72px;
        min-width: 28px;
        min-height: 28px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        border: 2px solid rgba(255, 255, 255, 0.35);
      }
      .welcome-clip-pseudo {
        font-weight: 700;
        font-size: clamp(0.65rem, 3.5cqw, 1.1rem);
        line-height: 1.2;
        text-align: center;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .welcome-clip-cta {
        font-size: clamp(0.5rem, 2.2cqw, 0.72rem);
        opacity: 0.6;
        font-style: italic;
        line-height: 1.1;
        text-align: center;
      }
      .welcome-clip-bio {
        font-size: clamp(0.55rem, 2.5cqw, 0.82rem);
        opacity: 0.85;
        line-height: 1.3;
        text-align: center;
        max-width: 92%;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow-wrap: break-word;
      }
      .welcome-clip-video-wrap {
        width: 100%;
        flex-shrink: 0;
        position: relative;
        border-radius: 6px;
        overflow: hidden;
        background: #000;
        /* 16:9 via padding-bottom — technique robuste insensible au flex */
        padding-bottom: 56.25%;
      }
      .welcome-clip-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        border-radius: 6px;
      }

      /* ===== Input Viewer (clavier + souris) — glass sombre + keycaps verre 3D
         Widget de scène : keycaps qui s'allument quand pressées (mode
         clavier) ou visuel de souris (boutons + position). Tailles en cqw
         (container query) → responsive au resize du widget. Maj DOM directe
         par classe (pas de re-render) — non énergivore.
         Refonte 2026-09-14 : fond glass flouté (backdrop-filter), keycaps en
         relief verre 3D (gradient + reflet ::before + ombres internes/externes),
         état pressé = couleur choisie + glow. */
      .widget.inputviewer {
        background: rgba(12, 14, 22, 0.55);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        backdrop-filter: blur(14px) saturate(140%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.2cqw;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.08);
        container-type: inline-size;
        display: flex;
        flex-direction: column;
      }
      /* Contenu input-viewer au-dessus du média de fond (.media-fond z 0).
         :not(.cadre-overlay) OBLIGATOIRE — l'overlay du cadre SVG est un
         enfant direct du widget et doit garder son position:absolute
         z-index 5 (.cadre-overlay, spécificité plus faible que ce sélecteur
         → sans l'exclusion, le cadre disparaissait). */
      .widget.inputviewer > *:not(.media-fond):not(.cadre-overlay) {
        position: relative;
        z-index: 1;
      }
      /* ===== Widget speedrun — rendu identique au dashboard (WidgetSpeedrun) =====
         Pas de glass/blur, couleurs via variables CSS partagées (--texte, --gris,
         --gris-fonce, --message-ok-color, --message-user-action-color, --rayon-petit).
         Base font-size héritée (16px, comme le dashboard) — les unités em
         reproduisent les mêmes tailles que le dashboard, indépendamment de la
         taille du widget. */
      .widget.speedrun {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px;
        font-family: "Rajdhani", "Segoe UI", sans-serif;
        color: var(--texte);
        overflow: hidden;
        height: 100%;
        box-sizing: border-box;
      }
      /* Contenu speedrun au-dessus du média de fond (.media-fond z 0).
         :not(.cadre-overlay) — voir règle input-viewer ci-dessus. */
      .widget.speedrun > *:not(.media-fond):not(.cadre-overlay) {
        position: relative;
        z-index: 1;
      }
      /* En-tête : jeu + catégorie (gauche) + statut connexion (droite). */
      .sr-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.4em;
      }
      .sr-titre-jeu {
        font-size: 0.75em;
        font-weight: 600;
        color: var(--texte);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
        /* Ombre de lisibilité : titre clair sur fond sombre → ombre noire. */
        text-shadow: 0 1px 2px #000, 0 0 1px #000;
      }
      .sr-header .sr-cat {
        color: var(--gris);
        font-weight: 400;
      }
      .sr-placeholder {
        color: var(--gris);
        font-style: italic;
        font-weight: 400;
      }
      .sr-status {
        font-size: 0.7em;
        flex-shrink: 0;
      }
      .sr-status.ok { color: var(--message-ok-color); }
      .sr-status.attente { color: var(--message-user-action-color); }
      /* Timer : couleur pleine du cadre + ombre de contraste simple
         (--sr-ombre : noir ou blanc selon la luminance du cadre). Une seule
         couche — lisible sur tout fond. */
      .sr-timer {
        text-align: center;
        padding: 0.25em 0 0.15em;
      }
      .sr-timer .sr-timer-valeur {
        font-size: 2.16em;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        line-height: 1;
        color: var(--sr-grad-from, #e0e0e0);
        text-shadow: 0 2px 4px var(--sr-ombre, #000);
      }
      .sr-timer.sr-running .sr-timer-valeur {
        filter: drop-shadow(0 0 0.4em color-mix(in srgb, var(--sr-grad-from, #e0e0e0) 40%, transparent));
      }
      .sr-timer.sr-ended .sr-timer-valeur {
        filter: drop-shadow(0 0 0.5em color-mix(in srgb, var(--sr-grad-from, #e0e0e0) 50%, transparent));
      }
      /* Phase pill + compteur */
      .sr-meta {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5em;
      }
      .sr-phase-pill {
        font-size: 0.65em;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 0.06em 0.5em;
        border-radius: 999px;
        color: var(--gris);
        background: color-mix(in srgb, var(--gris) 15%, transparent);
      }
      .sr-phase-pill.sr-running { color: var(--message-ok-color); background: color-mix(in srgb, var(--message-ok-color) 15%, transparent); }
      .sr-phase-pill.sr-paused { color: var(--message-user-action-color); background: color-mix(in srgb, var(--message-user-action-color) 15%, transparent); }
      .sr-phase-pill.sr-ended { color: var(--message-ok-color); background: color-mix(in srgb, var(--message-ok-color) 20%, transparent); }
      .sr-compteur {
        font-size: 0.7em;
        color: var(--gris);
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 2px #000;
      }
      /* Barre de progression */
      .sr-barre {
        height: 0.2em;
        border-radius: 999px;
        background: color-mix(in srgb, var(--gris) 20%, transparent);
        overflow: hidden;
      }
      .sr-barre-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--sr-grad-from, #e0e0e0), var(--sr-grad-to, #9a9a9a));
        transition: width 0.3s ease;
      }
      /* Splits — rendu identique au dashboard : gradient border simple
         (padding-box/border-box), pas de glass/blur, pas d'alternance noir. */
      .sr-splits {
        display: flex;
        flex-direction: column;
        gap: 0.2em;
        overflow-y: auto;
        flex: 1;
        min-height: 0;
        padding-top: 0.25em;
        /* Scrollbar thin (comme le chat) — discrète sur fond sombre. */
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      }
      .sr-splits::-webkit-scrollbar { width: 5px; }
      .sr-splits::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 999px;
      }
      .sr-splits::-webkit-scrollbar-track { background: transparent; }
      .sr-seg {
        display: flex;
        align-items: center;
        gap: 0.4em;
        padding: 0.2em 0.4em;
        font-size: 0.78em;
        border: 1px solid transparent;
        border-radius: var(--rayon-petit);
        color: var(--gris);
        /* BG gradient : on garde la couleur du user (variable) mais on remplace
           la couleur claire par du noir profond → dégradé couleur user → noir.
           Teinte assombrie (35% sur noir) pour les splits non actifs afin que
           l'actif ressorte. */
        background: linear-gradient(135deg, color-mix(in srgb, var(--sr-grad-from, #e0e0e0) 35%, #000), #000000);
        transition: background 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      }
      .sr-seg-actif {
        /* Split en cours : dégradé couleur user pleine → noir + cadre fluo
           lumineux de la couleur variable (glow externe + interne). */
        background: linear-gradient(135deg, var(--sr-grad-from, #e0e0e0), #000000);
        border-color: var(--sr-grad-from, #e0e0e0);
        box-shadow:
          0 0 0.6em 0.15em var(--sr-grad-from, #e0e0e0),
          inset 0 0 0.5em color-mix(in srgb, var(--sr-grad-from, #e0e0e0) 25%, transparent);
        color: var(--texte);
      }
      .sr-seg-done {
        color: var(--gris);
        opacity: 0.6;
      }
      .sr-seg-idx {
        font-size: 0.85em;
        font-weight: 700;
        color: var(--gris);
        min-width: 1.4em;
        text-align: right;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 2px #000;
      }
      .sr-seg-actif .sr-seg-idx {
        color: var(--sr-grad-from, #e0e0e0);
        text-shadow: 0 0 0.4em var(--sr-grad-from, #e0e0e0), 0 1px 2px #000;
      }
      .sr-seg-nom {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-shadow: 0 1px 2px #000, 0 0 1px #000;
      }
      .sr-seg-pb {
        font-variant-numeric: tabular-nums;
        color: var(--gris);
        font-size: 0.9em;
        text-shadow: 0 1px 2px #000;
      }
      /* Temps de run (split réalisé) — affiché à droite du segment pour les
         splits déjà passés. Couleur du cadre (gradient) pour le distinguer du
         PB (gris). Masqué tant que le split n'est pas passé (vide). */
      .sr-seg-time {
        font-variant-numeric: tabular-nums;
        color: var(--sr-grad-from, #e0e0e0);
        font-size: 0.9em;
        font-weight: 600;
        text-shadow: 0 1px 2px #000;
        min-width: 0;
      }
      .sr-seg-time:empty { display: none; }
      /* Split actif : temps en couleur cadre + glow doux (une seule couche
         lumineuse + ombre noire de lisibilité). */
      .sr-seg-actif .sr-seg-time {
        color: var(--sr-grad-from, #e0e0e0);
        font-weight: 700;
        text-shadow:
          0 0 0.4em var(--sr-grad-from, #e0e0e0),
          0 1px 2px #000;
      }
      .iv-section {
        display: none;
        flex: 1;
        width: 100%;
        overflow: hidden;
      }
      .widget.inputviewer[data-mode="clavier"] .iv-section-clavier { display: flex; }
      .widget.inputviewer[data-mode="souris"] .iv-section-souris { display: flex; }
      .widget.inputviewer[data-mode="numpad"] .iv-section-numpad {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4%;
      }
      .widget.inputviewer[data-mode="manette"] .iv-section-manette { display: flex; }
      .iv-clavier {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        /* Marges larges gauche/droite (~8% de la largeur du widget) + marges
           verticales plus serrées pour grossir les keycaps. */
        padding: 1cqw 8cqw;
        gap: 0.3cqw;
        overflow: hidden;
      }
      .iv-rangee { display: flex; gap: 0.25cqw; width: 100%; }
      /* Keycap verre 3D : gradient vertical (haut clair → bas sombre), reflet
         top via ::before, ombre interne (creux) + ombre externe (profondeur). */
      .iv-touche {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 6cqw;
        padding: 0.15cqw 0.2cqw;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.18) 0%,
          rgba(255, 255, 255, 0.06) 50%,
          rgba(255, 255, 255, 0.03) 100%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 0.9cqw;
        color: #f0f0f0;
        font-size: 1.9cqw;
        line-height: 1;
        text-align: center;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
        white-space: nowrap;
        overflow: hidden;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.15) inset,
                    0 -1px 2px rgba(0, 0, 0, 0.3) inset,
                    0 2px 4px rgba(0, 0, 0, 0.35);
        transition: background 80ms ease, transform 80ms ease, box-shadow 80ms ease;
      }
      /* Reflet vitreux en haut de la keycap (verre poli). */
      .iv-touche::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 45%;
        border-radius: 0.9cqw 0.9cqw 0 0;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.25) 0%,
          rgba(255, 255, 255, 0) 100%);
        pointer-events: none;
      }
      .iv-touche.presse {
        background: linear-gradient(180deg,
          var(--inputviewer-couleur-presse, #8b5cf6) 0%,
          color-mix(in srgb, var(--inputviewer-couleur-presse, #8b5cf6) 70%, #000) 100%);
        border-color: var(--inputviewer-couleur-presse, #8b5cf6);
        outline: 3px solid var(--inputviewer-couleur-presse, #8b5cf6);
        outline-offset: 3px;
        color: #fff;
        transform: scale(0.92) translateY(0.1cqw);
        box-shadow: 0 0 16px 2px var(--inputviewer-couleur-presse, #8b5cf6),
                    0 1px 0 rgba(255, 255, 255, 0.3) inset,
                    0 -2px 4px rgba(0, 0, 0, 0.4) inset;
      }
      .iv-espaceur { flex: 0.6; visibility: hidden; }
      .iv-fleches {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25cqw;
        margin-top: 0.3cqw;
      }
      .iv-fleches .iv-rangee { width: 100%; justify-content: center; }
      .iv-fleches .iv-touche { flex: 0 0 6cqw; }
      /* Souris — forme de souris (corps ovale + 2 boutons + molette) */
      .iv-souris {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2cqw;
        height: 100%;
        width: 100%;
        padding: 1cqw 4cqw;
      }
      /* Corps souris : ovale vertical arrondi (haut bombé, bas arrondi). */
      .iv-souris-corps {
        position: relative;
        display: flex;
        align-items: stretch;
        width: 42cqw;
        height: 60cqw;
        max-width: 100%;
        padding: 2cqw 1.8cqw 5cqw;
        gap: 1cqw;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.16) 0%,
          rgba(255, 255, 255, 0.05) 55%,
          rgba(255, 255, 255, 0.02) 100%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 21cqw 21cqw 14cqw 14cqw;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.15) inset,
                    0 -2px 4px rgba(0, 0, 0, 0.25) inset,
                    0 6px 18px rgba(0, 0, 0, 0.4);
      }
      /* Reflet vitreux sur le haut du corps. */
      .iv-souris-corps::before {
        content: "";
        position: absolute;
        top: 0;
        left: 1.5cqw;
        right: 1.5cqw;
        height: 40%;
        border-radius: 9cqw 9cqw 0 0;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.22) 0%,
          rgba(255, 255, 255, 0) 100%);
        pointer-events: none;
      }
      /* Boutons G/D (verre 3D, prennent la largeur, hauteur ~60% du corps). */
      .iv-souris-bouton {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.14) 0%,
          rgba(255, 255, 255, 0.04) 60%,
          rgba(255, 255, 255, 0.02) 100%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 2.4cqw 2.4cqw 1.2cqw 1.2cqw;
        color: #f0f0f0;
        font-size: 3.6cqw;
        font-weight: 700;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.12) inset,
                    0 -1px 2px rgba(0, 0, 0, 0.25) inset;
        transition: background 80ms ease, transform 80ms ease, box-shadow 80ms ease;
      }
      .iv-souris-bouton::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 45%;
        border-radius: 2.4cqw 2.4cqw 0 0;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.22) 0%,
          rgba(255, 255, 255, 0) 100%);
        pointer-events: none;
      }
      /* Molette centrale : étroite, verticale, verre 3D. */
      .iv-souris-molette {
        position: relative;
        flex: 0 0 6cqw;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.14) 0%,
          rgba(255, 255, 255, 0.04) 60%,
          rgba(255, 255, 255, 0.02) 100%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 2.4cqw;
        color: #f0f0f0;
        font-size: 2.6cqw;
        font-weight: 700;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.12) inset,
                    0 -1px 2px rgba(0, 0, 0, 0.25) inset;
        transition: background 80ms ease, transform 80ms ease, box-shadow 80ms ease;
      }
      .iv-souris-molette::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 45%;
        border-radius: 2.4cqw 2.4cqw 0 0;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.22) 0%,
          rgba(255, 255, 255, 0) 100%);
        pointer-events: none;
      }
      .iv-souris-bouton.presse,
      .iv-souris-molette.presse {
        background: linear-gradient(180deg,
          var(--inputviewer-couleur-presse, #8b5cf6) 0%,
          color-mix(in srgb, var(--inputviewer-couleur-presse, #8b5cf6) 70%, #000) 100%);
        border-color: var(--inputviewer-couleur-presse, #8b5cf6);
        outline: 3px solid var(--inputviewer-couleur-presse, #8b5cf6);
        outline-offset: 3px;
        color: #fff;
        transform: scale(0.94) translateY(0.1cqw);
        box-shadow: 0 0 16px 2px var(--inputviewer-couleur-presse, #8b5cf6),
                    0 1px 0 rgba(255, 255, 255, 0.3) inset,
                    0 -2px 4px rgba(0, 0, 0, 0.4) inset;
      }
      .iv-souris-position {
        padding: 0.8cqw 1.6cqw;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1.2cqw;
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        font-size: 3cqw;
        color: rgba(240, 240, 240, 0.85);
        font-variant-numeric: tabular-nums;
      }

      /* ===== Numpad (pavé numérique) — glass + keycaps verre 3D ===== */
      .iv-numpad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 1fr;
        gap: 0.7cqw;
        width: 100%;
        height: 100%;
        align-content: center;
      }
      .iv-numpad-touche {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 6cqw;
        padding: 0.4cqw;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.18) 0%,
          rgba(255, 255, 255, 0.06) 50%,
          rgba(255, 255, 255, 0.03) 100%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 2.5cqw;
        color: #f0f0f0;
        font-size: 2cqw;
        font-weight: 600;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.15) inset,
                    0 -1px 2px rgba(0, 0, 0, 0.3) inset,
                    0 2px 4px rgba(0, 0, 0, 0.35);
        transition: background 80ms ease, transform 80ms ease, box-shadow 80ms ease;
      }
      .iv-numpad-touche::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 45%;
        border-radius: 2.5cqw 2.5cqw 0 0;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.25) 0%,
          rgba(255, 255, 255, 0) 100%);
        pointer-events: none;
      }
      .iv-numpad-touche.presse {
        background: linear-gradient(180deg,
          var(--inputviewer-couleur-presse, #8b5cf6) 0%,
          color-mix(in srgb, var(--inputviewer-couleur-presse, #8b5cf6) 70%, #000) 100%);
        border-color: var(--inputviewer-couleur-presse, #8b5cf6);
        outline: 3px solid var(--inputviewer-couleur-presse, #8b5cf6);
        outline-offset: 3px;
        color: #fff;
        transform: scale(0.92) translateY(0.1cqw);
        box-shadow: 0 0 16px 2px var(--inputviewer-couleur-presse, #8b5cf6),
                    0 1px 0 rgba(255, 255, 255, 0.3) inset,
                    0 -2px 4px rgba(0, 0, 0, 0.4) inset;
      }
      /* Touches double hauteur/largeur ( + , Enter , 0 ) */
      .iv-numpad-double-h { grid-row: span 2; }
      .iv-numpad-double-w { grid-column: span 2; }

      /* ===== Manette (gamepad) — glass + boutons verre 3D + skins ===== */
      .iv-manette {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.4cqw;
        width: 100%;
        height: 100%;
        padding: 0.2cqw 0.7cqw;
      }
      .iv-manette-rangee {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6cqw;
        width: 100%;
      }
      .iv-manette-gachettes { gap: 1.8cqw; }
      .iv-manette-principale { gap: 2.4cqw; }
      .iv-manette-sticks { gap: 3.5cqw; }
      /* Boutons manette (verre 3D, mêmes principes que keycaps) */
      .iv-manette-bouton {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 14.5cqw;
        min-height: 12cqw;
        padding: 0.4cqw;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.18) 0%,
          rgba(255, 255, 255, 0.06) 50%,
          rgba(255, 255, 255, 0.03) 100%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        color: #f0f0f0;
        font-size: 4cqw;
        font-weight: 700;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.15) inset,
                    0 -1px 2px rgba(0, 0, 0, 0.3) inset,
                    0 2px 4px rgba(0, 0, 0, 0.35);
        transition: background 80ms ease, transform 80ms ease, box-shadow 80ms ease;
      }
      .iv-manette-bouton::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 45%;
        border-radius: 50% 50% 0 0;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.25) 0%,
          rgba(255, 255, 255, 0) 100%);
        pointer-events: none;
      }
      .iv-manette-bouton.presse {
        background: linear-gradient(180deg,
          var(--inputviewer-couleur-presse, #8b5cf6) 0%,
          color-mix(in srgb, var(--inputviewer-couleur-presse, #8b5cf6) 70%, #000) 100%);
        border-color: var(--inputviewer-couleur-presse, #8b5cf6);
        outline: 3px solid var(--inputviewer-couleur-presse, #8b5cf6);
        outline-offset: 3px;
        color: #fff;
        transform: scale(0.92);
        box-shadow: 0 0 18px 2px var(--inputviewer-couleur-presse, #8b5cf6),
                    0 1px 0 rgba(255, 255, 255, 0.3) inset,
                    0 -2px 4px rgba(0, 0, 0, 0.4) inset;
      }
      /* D-Pad (grille 3x3) */
      .iv-manette-dpad {
        display: grid;
        grid-template-columns: repeat(3, auto);
        grid-template-rows: repeat(3, auto);
        gap: 0.4cqw;
      }
      .iv-manette-dpad .iv-manette-bouton { border-radius: 1.2cqw; min-width: 11cqw; min-height: 9cqw; }
      .iv-manette-dpad-diag {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 11cqw;
        height: 9cqw;
        font-size: 3.1cqw;
        color: rgba(240, 240, 240, 0.25);
        opacity: 0.4;
        transition: opacity 80ms, color 80ms;
      }
      .iv-manette-dpad-diag.presse {
        opacity: 1;
        color: var(--inputviewer-couleur-presse, #8b5cf6);
        text-shadow: 0 0 8px var(--inputviewer-couleur-presse, #8b5cf6),
                     0 0 4px var(--inputviewer-couleur-presse, #8b5cf6);
      }
      .iv-manette-dpad-centre { width: 11cqw; height: 9cqw; }
      /* Centre (Select/Start) */
      .iv-manette-centre {
        display: flex;
        flex-direction: column;
        gap: 1cqw;
      }
      .iv-manette-centre .iv-manette-bouton { min-width: 10cqw; min-height: 5.5cqw; border-radius: 1.2cqw; font-size: 2.7cqw; }
      /* Boutons face (losange) */
      .iv-manette-face {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4cqw;
      }
      .iv-manette-face-rangee {
        display: flex;
        gap: 0.4cqw;
        justify-content: center;
      }
      .iv-manette-face .iv-manette-bouton { min-width: 11cqw; min-height: 9cqw; }
      /* Joysticks */
      .iv-manette-stick-groupe {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6cqw;
      }
      .iv-manette-stick-zone {
        position: relative;
        width: 27cqw;
        height: 22cqw;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .iv-manette-stick-indicateur {
        position: absolute;
        width: 15.5cqw;
        height: 13cqw;
        border-radius: 50%;
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.2) 0%,
          rgba(255, 255, 255, 0.08) 100%);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.15) inset,
                    0 2px 4px rgba(0, 0, 0, 0.3);
        transform: translate(-50%, -50%);
        left: 50%;
        top: 50%;
        transition: transform 40ms ease-out;
      }
      .iv-manette-stick-indicateur.actif {
        background: linear-gradient(180deg,
          var(--inputviewer-couleur-presse, #8b5cf6) 0%,
          color-mix(in srgb, var(--inputviewer-couleur-presse, #8b5cf6) 70%, #000) 100%);
        border: 2px solid var(--inputviewer-couleur-presse, #8b5cf6);
        outline: 3px solid var(--inputviewer-couleur-presse, #8b5cf6);
        outline-offset: 3px;
        box-shadow: 0 0 14px 2px var(--inputviewer-couleur-presse, #8b5cf6);
      }
      .iv-manette-sticks .iv-manette-bouton { min-width: 9cqw; min-height: 5.5cqw; border-radius: 1.2cqw; font-size: 2.4cqw; }
      /* ===== Skins manette (labels via ::after sur data-bouton) ===== */
      /* Xbox : A/B/X/Y, LB/LT/RT/RB, View/Menu */
      .iv-manette[data-skin="xbox"] [data-bouton="0"]::after { content: "A"; }
      .iv-manette[data-skin="xbox"] [data-bouton="1"]::after { content: "B"; }
      .iv-manette[data-skin="xbox"] [data-bouton="2"]::after { content: "X"; }

      /* ===== Bandeau premier message =====
         Pleine largeur, en bas (défaut) ou en haut. Couleurs dérivées du
         cadre widget de la scène active (cf. résoudreCouleursCadre).
         Sans cadre actif → thème noir & blanc (--fond/--texte). */
      /* ===== Bandeau premier message =====
         Pleine largeur, en bas (défaut) ou en haut. Couleurs dérivées du
         cadre widget de la scène active (cf. résoudreCouleursCadre).
         Sans cadre actif → thème noir & blanc (--fond/--texte). */
      .bandeau-pm-root {
        position: absolute;
        left: 0;
        right: 0;
        z-index: 9998;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.45s ease;
      }
      .bandeau-pm-root.visible { opacity: 1; }
      .bandeau-pm-root.pos-bas { bottom: 0; transform: translateY(100%); }
      .bandeau-pm-root.pos-haut { top: 0; transform: translateY(-100%); }
      .bandeau-pm-root.pos-bas.visible { transform: translateY(0); }
      .bandeau-pm-root.pos-haut.visible { transform: translateY(0); }
      .bandeau-pm-root {
        transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.16, 1.08, 0.38, 0.98);
      }

      /* ===== Alertes Twitch (follow/raid/sub/resub/subgift/bits) =====
         Overlay autonome positionné par alerte-config (x/y/largeur — même
         mécanique que welcomeConfig ; hauteur auto = la carte s'ajuste à son
         contenu). z 9997 : sous bandeau 9998 et clips 9999. Carte texte
         au-dessus + média (image ou vidéo) dessous, son optionnel via
         /medias/. Cadre SVG = cadre widget de la scène (cf. appliquerCadreOverlay). */
      .alerte-root {
        position: absolute;
        z-index: 9997;
        pointer-events: none;
        opacity: 0;
        transition:
          opacity 0.35s ease,

      /* Média d'alerte (image ou vidéo) affiché sous le texte. Masqué par
         défaut ; affiché par playAlerte quand la config a un média. */
      .alerte-media {
        display: none;
        width: 100%;
        max-height: 60vh;
        object-fit: contain;
        border-radius: 8px;

      /* ===== Commandes chat (!commande → overlay diffusion) =====
         Même carte que les alertes (texte au-dessus + média dessous, cadre
         SVG = cadre widget de la scène). z 9996 : sous les alertes 9997. */
      .commande-root {
        position: absolute;
        z-index: 9996;
        pointer-events: none;
        opacity: 0;
        transition:
          opacity 0.35s ease,
          transform 0.4s cubic-bezier(0.16, 1.08, 0.38, 0.98);

      .commande-root.visible {
        opacity: 1;

      .commande-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.45em;

        border: 2px solid rgba(224, 224, 224, 0.85);

      .commande-texte {
        color: var(--commande-couleur, #ffffff);

        line-height: 1.15;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);

      /* ===== Pad numérique (16 touches Numpad × 3 plages → overlay diffusion) =====
         Même squelette que alertes/commandes (carte + média). z 9995 : sous
         les commandes 9996 et alertes 9997. Le pad est un déclenchement manuel
         par le streamer — il apparaît sous les alertes/commandes automatiques.
         Pas de texte (juste le média). Effets bounce/zoom optionnels. */
      .pad-root {
        position: absolute;
        z-index: 9995;
        pointer-events: none;
        opacity: 0;
        transition:
          opacity 0.3s ease,
          transform 0.3s cubic-bezier(0.16, 1.08, 0.38, 0.98);
        transform: scale(0.6);
      }
      .pad-root.visible {
        opacity: 1;
        transform: scale(1);
      }
      .pad-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0;

        position: relative;
      }
      .pad-media {
        display: none;
        width: 100%;
        max-height: 80vh;
        object-fit: contain;
        border-radius: 8px;
      }
      .pad-media.pad-bounce {
        animation: pad-bounce 0.6s infinite ease-in-out;
      }
      .pad-media.pad-zoom {
        animation: pad-zoom 1.2s infinite ease-in-out;
      }
      @keyframes pad-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
      @keyframes pad-zoom {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }

      .bandeau-pm-barre {
