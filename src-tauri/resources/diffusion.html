  <body>
    <div id="stage">
      <div id="bg">
        <canvas id="bg-canvas"></canvas>
      </div>
      <!-- Overlay équaliseur — inséré dans le DOM immédiatement après #bg :
           même z-index 0 → l'ordre DOM le départage, il peint au-dessus du
           fond et sous tous les widgets (ajoutés après, z ≥ 0). -->
      <div id="eq-root"><canvas id="eq-canvas"></canvas></div>
      <!-- Voile noir pour le fondu de changement de scène (fade to black).
           Transparent par défaut, passe à opacity 1 au changement de scène,
           puis revient à 0 une fois la nouvelle scène rendue sous le voile.
           pointer-events:none pour ne pas bloquer les overlays. -->
      <div id="voile-noir"></div>
      <!-- Clip « scène − rect caméra » en SVG evenodd : le CEF d'OBS ignore
           clip-path path() → url(#sos-cam-clip) est le fallback fiable.
           UN SEUL <path> à 2 sous-chemins : les enfants d'un clipPath sont
           UNIS (OR logique) → 2 <rect> frères ne peuvent jamais faire de
           trou. userSpaceOnUse = repère du .widget-wrap clippé (inset:0 →
           coords scène). Le <path> + width/height du svg sont mis à jour à
           chaque renderScene. z-index:-1 + pointer-events:none : ne peint
           rien. width/height réels — le 0×0 fait échouer url(#…) dans CEF. -->
      <svg id="sos-cam-clip-svg" width="1920" height="1080" style="position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:-1" aria-hidden="true">
        <clipPath id="sos-cam-clip" clipPathUnits="userSpaceOnUse" clip-rule="evenodd">
          <path id="sos-cam-clip-path" d="M0 0H1920V1080H0Z"/>
        </clipPath>
      </svg>
    </div>
    <script>
      // ZÉRO import Tauri. État uniquement via WebSocket snapshot.
      // Aucun texte visible à l'écran — logs console seulement.
      // Dims canvas = résolution OBS reçue via snapshot (canvasW/canvasH),
      // fallback 1920×1080 si absente. Widgets jamais rescalés.
      const stageEl = document.getElementById("stage");
      const bgEl = document.getElementById("bg");
      const bgCanvas = document.getElementById("bg-canvas");
      const bgCtx = bgCanvas.getContext("2d");
      const rootStyle = document.documentElement.style;
      // Voile noir pour le fondu de changement de scène (fade to black).
      const voileNoirEl = document.getElementById("voile-noir");
      // Path du clipPath SVG « scène − caméra » (d + dims svg mis à jour dans
      // renderScene).
      const camClipSvg = document.getElementById("sos-cam-clip-svg");
      const camClipPath = document.getElementById("sos-cam-clip-path");
      // Distance de perspective (px) du tilt 3D — même valeur pour les
      // widgets (.widget-3d), le fond (#bg) et la projection des trous.
      const PERSP = 800;
      // Durée d'une demi-transition (fade out ou fade in), en ms.
      const FONDU_DEMI = 300;
      // Id de la scène actuellement affichée (pour distinguer un CHANGEMENT de
      // scène — fondu — d'une simple édition de widgets — rendu direct).
      let currentSceneId = null;
      // Timer du rendu différé (au milieu du fondu, quand l'écran est noir).
      let fonduTimer = null;

      // Mode miniature dashboard (?preview dans l'URL — iframe de la section
      // Prévisualisation de la Toolbar) : TOUT le son est coupé et les vidéos
      // persistantes (widgets média + fond de scène) restent figées sur leur
      // frame mediaTime/bgTime — l'aperçu reste live (chat, alertes, overlays
      // éphémères, just-chatting…) sans doubler le décodage vidéo ni l'audio
      // de la source OBS. La page chargée sans le param (OBS) est inchangée.
      const PREVIEW = new URLSearchParams(location.search).has("preview");

      // Échelle backing→scène du canvas de fond (résolution adaptative).
      // Tout le dessin de peindreFond se fait en coords SCÈNE ; le transform
      // global bgCtx les projette dans le backing store réduit.
      let bgScaleX = 1;
      let bgScaleY = 1;

      function applyCanvasDims(scene) {
        const w = (scene && scene.canvasW) || 1920;
        const h = (scene && scene.canvasH) || 1080;
        rootStyle.setProperty("--canvas-w", w + "px");
        rootStyle.setProperty("--canvas-h", h + "px");
        // Résolution adaptative : le backing store suit la taille RÉELLE de la
        // Browser Source (window.innerWidth/Height). Source plus petite que le
        // canvas → drawImage travaille sur d'autant moins de pixels. La taille
        // CSS reste la résolution scène (le crop/rendu visible est identique,
        // juste moins dense — exactement ce qu'affiche OBS).
        var rw = window.innerWidth || w;
        var rh = window.innerHeight || h;
        var s = Math.min(1, rw / w, rh / h);
        if (!(s > 0)) s = 1;
        const bw = Math.max(1, Math.round(w * s));
        const bh = Math.max(1, Math.round(h * s));
        if (bgCanvas.width !== bw) bgCanvas.width = bw;
        if (bgCanvas.height !== bh) bgCanvas.height = bh;
        bgScaleX = bw / w;
        bgScaleY = bh / h;
      }

      const FIT_CSS = {
        ajuster: "contain",
        remplir: "cover",
        etirer: "fill",
        centrer: "none",
        vignette: "scale-down",
        etendre: "cover"
      };

      const VIDEO_EXT = ["mp4", "webm"];
      function kindFromMedia(rel) {
        const ext = (rel.split(".").pop() || "").toLowerCase();
        return VIDEO_EXT.indexOf(ext) >= 0 ? "video" : "image";
      }

      // Map id → { el, wrapEl, mediaEl, mediaKey, kind, mediaTime }.
      // On diff : MAJ style only sur les widgets existants, on ne touche
      // JAMAIS à video.src / currentTime / load() — la vidéo continue.
      // RÈGLE : currentTime ne bouge QUE si le nom de fichier change.
      // Drag, resize, rotateX/Y, z-index, mediaFit = style seulement.
      const widgetMap = new Map();

      // LSS en attente : stocké quand l'event WS "lss" arrive avant que le
      // widget speedrun soit créé dans widgetMap (race condition resync).
      // Appliqué au widget dès sa création dans renderScene.
      let pendingLss = null;
      // Dernier état consolidé reçu (event "etat" — resync complet émis par
      // le moteur quand la diffusion demande un resync). Rejoué si le widget
      // est recréé en cours de run (race condition resync, comme pendingLss).
      let pendingEtat = null;

      // Messages chat reçus via WS (type "chat"). Borné à 200.
      let chatMessages = [];
      const MAX_CHAT = 200;

      // Count viewers par plateforme (events WS "viewers", déjà dédupliqués
      // côté Rust). number = live, null/absent = hors-ligne ou inconnu.
      let viewersParPlateforme = {};
      const PLATS_VIEWERS = ["twitch", "youtube", "kick", "tiktok"];

      // Formate un count viewers en compact : 1234 → "1,2k" (virgule FR).
      function formatViewers(n) {
        if (n >= 1000) {
          var k = (n / 1000).toFixed(1).replace(/[.,]0$/, "");
          return k.replace(".", ",") + "k";
        }
        return String(n);
      }

      // Remplit la barre viewers d'un widget chat selon son filtre.
      // "unifie" → une pastille par plateforme live ; sinon seulement la
      // plateforme filtrée. Barre vidée (cachée par :empty) si rien à montrer.
      function fillViewersBar(barEl, filtre, taillePolice) {
        barEl.style.fontSize = taillePolice + "px";
        var plats = filtre === "unifie" ? PLATS_VIEWERS : [filtre];
        var items = "";
        for (var i = 0; i < plats.length; i++) {
          var p = plats[i];
          var n = viewersParPlateforme[p];
          if (typeof n !== "number") continue;
          items += '<span class="vplat">' + logoPlateforme(p)
            + '<span class="vcount">' + formatViewers(n) + '</span></span>';
        }
        barEl.innerHTML = items ? '<span class="veye">👁</span>' + items : "";
      }

      // Met à jour la barre viewers de tous les widgets chat (event "viewers").
      function rerenderViewersBars() {
        if (!currentScene || !currentScene.widgets) return;
        for (var i = 0; i < currentScene.widgets.length; i++) {
          var w = currentScene.widgets[i];
          if ((w.type || "media") !== "chat") continue;
          var entry = widgetMap.get(w.id);
          if (entry && entry.viewersBar) {
            fillViewersBar(entry.viewersBar, w.chatFiltre || "unifie", w.taillePolice || 16);
          }
        }
      }

      // Logo Twitch SVG (12px) — inline, pas de fichier à servir.
      const TWITCH_LOGO_SVG = '<svg class="logo" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">'
        + '<path fill="currentColor" d="M3 1L1.5 3.5V13H4.5V15H6L8 13H10.5L13.5 10V1H3ZM12 9.5L10 11.5H7L5 13.5V11.5H3V2H12V9.5Z"/>'
        + '<rect x="9" y="4" width="1" height="3"/><rect x="6" y="4" width="1" height="3"/></svg>';

      // Logo Kick SVG (K vert, marque Kick).
      const KICK_LOGO_SVG = '<svg class="logo" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">'
        + '<path fill="#53fc18" d="M5 2h4v6h2V6h2V4h2V2h4v6h-2v2h-2v4h2v2h2v6h-4v-2h-2v-2h-2v4H5z"/></svg>';

      // Retourne le logo/badge HTML selon la plateforme du message.
      // Twitch + Kick = SVG logo ; autres = badge texte coloré.
      function logoPlateforme(p) {
        if (p === "twitch") return TWITCH_LOGO_SVG;
        if (p === "kick") return KICK_LOGO_SVG;
        if (p === "youtube") return '<span class="plat-badge youtube">YT</span>';
        if (p === "tiktok") return '<span class="plat-badge tiktok">TT</span>';
        return "";
      }

      // ===== Widgets objectif (goal) =====
      // Dernières métriques communauté par plateforme (frames "communaute" de
      // viewers.rs — déjà dédupliquées côté Rust). viewers → barre existante.
      let communauteParPlateforme = {};
      const GOAL_MET_LABELS = {
        followers: "Followers", subs: "Subs", sub_points: "Points de subs",
        abonnes: "Abonnés", viewers: "Viewers"
      };
      // Creator Goals Twitch déclarés (frames "goal-twitch" : EventSub
      // channel.goal.* + poll viewers.rs) — widgets LIÉS par goalId.
      let goalsTwitchMap = {};
      const GOAL_TTYPE_LABELS = {
        follower: "Followers", subscription: "Subs",
        subscription_count: "Subs (total)", new_subscription: "Nouveaux subs",
        new_subscription_count: "Nouveaux subs (total)",
        new_bit: "Bits", new_cheerer: "Cheerers"
      };

      // Valeur live d'une métrique pour une plateforme. undefined = jamais
      // mesurée / plateforme hors-ligne → affichage « N/A » (jamais de
      // valeur fabriquée).
      function goalValeur(plat, met) {
        if (met === "viewers") return viewersParPlateforme[plat];
        var c = communauteParPlateforme[plat];
        return c ? c[met] : undefined;
      }

      // Libellé d'entête d'un widget goal : mode lié = description du goal
      // Twitch (fallback label du type Helix) ; mode manuel = métrique.
      function goalLabelEntete(w) {
        if (w.goalId) {
          var g = goalsTwitchMap[w.goalId];
          if (g) return g.description || GOAL_TTYPE_LABELS[g.goal_type] || "Objectif";
          return "Objectif Twitch"; // en attente de la 1re frame goal-twitch
        }
        return GOAL_MET_LABELS[w.goalMetrique || "followers"] || "Objectif";
      }

      // Maj DOM d'un widget goal : chiffres + barre + état « plein » +
      // statut « Terminé » (mode lié). Appelée sur frames communaute/viewers/
      // goal-twitch ET à la création/update.
      function majGoalValeur(entry, w) {
        if (!entry.goalActuelEl) return;
        var actuel, cible, termine = false;
        if (w.goalId) {
          // Mode lié : le compteur vient de Twitch (frames goal-twitch),
          // jamais des métriques locales.
          var g = goalsTwitchMap[w.goalId];
          actuel = g ? g.actuel : undefined;
          cible = g ? g.cible : 0;
          termine = !!(g && g.termine);
          if (entry.goalMetEl) entry.goalMetEl.textContent = goalLabelEntete(w);
        } else {
          actuel = goalValeur(w.goalPlateforme || "twitch", w.goalMetrique || "followers");
          cible = w.goalCible || 0;
        }
        entry.goalActuelEl.textContent =
          typeof actuel === "number" ? actuel.toLocaleString("fr-FR") : "N/A";
        entry.goalCibleEl.textContent = cible ? cible.toLocaleString("fr-FR") : "—";
        var pct = cible && typeof actuel === "number"
          ? Math.min(100, Math.round((actuel / cible) * 100)) : 0;
        entry.goalFillEl.style.width = pct + "%";
        entry.el.classList.toggle("goal-plein", cible > 0 && pct >= 100);
        if (entry.goalStatutEl) {
          entry.goalStatutEl.textContent = termine ? "Terminé" : "";
        }
      }

      // Re-maj tous les widgets goal MANUELS d'une plateforme (après frame
      // communaute/viewers). Les widgets liés (goalId) sont exclus — leur
      // valeur vient des frames goal-twitch, pas des métriques mesurées.
      function majGoalWidgets(plat) {
        if (!currentScene || !currentScene.widgets) return;
        for (var i = 0; i < currentScene.widgets.length; i++) {
          var w = currentScene.widgets[i];
          if ((w.type || "media") !== "goal") continue;
          if (w.goalId) continue;
          if ((w.goalPlateforme || "twitch") !== plat) continue;
          var entry = widgetMap.get(w.id);
          if (entry) majGoalValeur(entry, w);
        }
      }

      // Re-maj tous les widgets goal LIÉS (après frame goal-twitch).
      function majGoalWidgetsLies() {
        if (!currentScene || !currentScene.widgets) return;
        for (var i = 0; i < currentScene.widgets.length; i++) {
          var w = currentScene.widgets[i];
          if ((w.type || "media") !== "goal" || !w.goalId) continue;
          var entry = widgetMap.get(w.id);
          if (entry) majGoalValeur(entry, w);
        }
      }

      // Célébration one-shot sur frame "goal-atteint" (émise par viewers.rs
      // au crossing ≥ cible, une fois puis réarmée sous la cible). Contenue
      // dans le widget : voile + pulse ~6s, zéro interaction avec la file
      // d'alertes globale.
      function goalCelebrer(widgetId) {
        var entry = widgetMap.get(widgetId);
        if (!entry || entry.kind !== "goal" || !entry.goalCelebEl) return;
        entry.goalCelebEl.classList.add("visible");
        entry.el.classList.add("goal-fete");
        clearTimeout(entry.goalTimer);
        entry.goalTimer = setTimeout(function () {
          entry.goalCelebEl.classList.remove("visible");
          entry.el.classList.remove("goal-fete");
        }, 6000);
      }

      // Badges emoji — style ASH (ancienne app).
      // Mod = 🗡️, VIP = 💎, Sub = ⭐, Broadcaster = 👑.
      var BADGES_EMOJI = {
        mod: "🗡️",
        vip: "💎",
        sub: "⭐",
        broadcaster: "👑",
      };

      // Génère une couleur HSL déterministe depuis le hash d'un pseudo.
      // Fallback quand Twitch ne fournit pas de couleur (tag color vide).
      function couleurDepuisNom(username) {
        if (!username) return "hsl(0, 0%, 70%)";
        var hash = 0;
        for (var i = 0; i < username.length; i++) {
          hash = ((hash << 5) - hash + username.charCodeAt(i)) | 0;
        }
        var hue = Math.abs(hash) % 360;
        return "hsl(" + hue + ", 70%, 65%)";
      }

      // Couleur du pseudo : tag IRCv3 color (hex) si présent, sinon fallback HSL.
      function couleurPseudo(m) {
        if (m.color && m.color.length > 0) return m.color;
        return couleurDepuisNom(m.pseudo);
      }

      // Rend le contenu HTML interne d'un message chat (avatar + chat-contenu).
      // L'élément externe .chat-msg est créé par fillChatBody.
      function renderChatMsg(m, i, taillePolice) {
        var logo = logoPlateforme(m.plateforme);
        var avatarSize = Math.round(taillePolice * 1.8);
        var avatar = m.avatar
          ? '<img class="avatar" src="' + escapeHtml(m.avatar) + '" style="width:' + avatarSize + 'px;height:' + avatarSize + 'px;" alt="" referrerpolicy="no-referrer">'
          : "";
        var badges = renderBadges(m.badges);
        var couleur = couleurPseudo(m);
        return avatar
          + '<div class="chat-contenu">'
          + badges
          + logo
          + '<span class="pseudo" style="color: ' + couleur + ';">' + escapeHtml(m.pseudo) + '</span>'
          + '<span class="separateur">:</span>'
          + '<span class="texte">' + renderTexte(m) + '</span>'
          + '</div>';
      }

      // Remplace les emotes par des <img> aux positions fournies par Rust
      // (m.emotes : offsets UTF-16, fin EXCLUSIVE — unités de String.slice).
      // Texte entre segments échappé comme avant (XSS-safe). URL contrainte
      // à https:// : les URLs viennent des APIs emotes, jamais du chatter.
      // URL invalide → segment rendu en texte brut échappé (nom affiché).
      function renderTexte(m) {
        if (!m.emotes || m.emotes.length === 0) return escapeHtml(m.texte);
        var html = "";
        var pos = 0;
        var n = m.texte.length;
        for (var i = 0; i < m.emotes.length; i++) {
          var e = m.emotes[i];
          // Segment invalide/chevauchant → ignoré (défense, Rust trie déjà).
          if (e.debut < pos || e.debut >= e.fin || e.fin > n) continue;
          html += escapeHtml(m.texte.slice(pos, e.debut));
          if (typeof e.url === "string" && e.url.indexOf("https://") === 0) {
            html += '<img class="emote" src="' + escapeHtml(e.url) + '"'
              + ' alt="' + escapeHtml(e.nom) + '"'
              + ' title="' + escapeHtml(e.nom) + '"'
              + ' referrerpolicy="no-referrer">';
          } else {
            html += escapeHtml(m.texte.slice(e.debut, e.fin));
          }
          pos = e.fin;
        }
        html += escapeHtml(m.texte.slice(pos));
        return html;
      }

      // Remplit un élément .chat-body avec les messages filtrés.
      // Échappement HTML du pseudo + texte (sécurité XSS).
      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // Parse le tag IRC `badges` (ex. "moderator/1,subscriber/12,vip/1")
      // → tableau d'identifiants courts : mod / vip / sub / broadcaster.
      // Badges inconnus ignorés. Ordre conservé (mod avant vip avant sub).
      function parseBadges(raw) {
        if (!raw) return [];
        var out = [];
        var parts = raw.split(",");
        for (var i = 0; i < parts.length; i++) {
          var name = parts[i].split("/")[0];
          if (name === "moderator") out.push("mod");
          else if (name === "vip") out.push("vip");
          else if (name === "subscriber") out.push("sub");
          else if (name === "broadcaster") out.push("broadcaster");
        }
        return out;
      }

      // Construit le HTML des badges emoji pour un message (style ASH).
      function renderBadges(badgesRaw) {
        var ids = parseBadges(badgesRaw);
        var html = "";
        for (var i = 0; i < ids.length; i++) {
          var emoji = BADGES_EMOJI[ids[i]];
          if (emoji) {
            html += '<span class="badge" title="' + ids[i] + '">' + emoji + '</span>';
          }
        }
        return html;
      }

      // Construit le nœud DOM d'UN message (partagé par fillChatBody rebuild
      // et appendChatMessage incrémental). borderImg/avatarRing inline — le
      // CEF d'OBS ne recalcule pas border-image quand une var() change.
      // avecCadreSvg (mode bulles + cadre actif) : la bordure CSS est retirée
      // comme sur les widgets (applyCadreWidget → border:none) — l'overlay
      // SVG posé par decorerCadreMsg tient lieu de bordure.
      function creerNoeudChat(m, taillePolice, borderImg, avatarRing, avecCadreSvg) {
        var div = document.createElement("div");
        div.className = "chat-msg";
        if (avecCadreSvg) div.style.border = "none";
        else div.style.borderImage = borderImg;
        div.innerHTML = renderChatMsg(m, 0, taillePolice);
        var av = div.querySelector(".avatar");
        if (av) av.style.boxShadow = avatarRing;
        return div;
      }

      // Compteur d'unicité pour les ids de gradient SVG des bulles chat
      // (genererCadreSVG suffixe ses <defs> par idCadre — collision sinon).
      var chatMsgUid = 0;

      // Cadre à appliquer PAR MESSAGE en mode bulles : la CadreConfig de
      // scène TELLE QUELLE (mêmes valeurs que sur un widget objectif —
      // style, couleurs, strokeWidth). null = pas de cadre par message
      // (cadre inactif/stroke 0/sansCadre → fallback border-image dégradé).
      function cadreParMessage(scene, w) {
        var cadre = scene && scene.cadreWidget;
        if (!cadre || !cadre.actif || (cadre.strokeWidth || 0) <= 0) return null;
        if (w.sansCadre === true) return null;
        return cadre;
      }

      // strokeWidth ramené à l'échelle « bulle » : ratio 40% de la valeur
      // scène (calibrée pour un widget ~160px+ ; sur une bulle ~45px les
      // renderers dessinent ~3×ep en bande visible — sous-couche ep*2.2 +
      // traits internes — et leurs ornements ont un plancher 8-12px).
      // Le slider suit donc proportionnellement jusqu'à sw=20 puis sature :
      // plafond absolu 8px (sw=1 reste respecté, arrondi, plancher 1px).
      // Échelle partagée avec le widget goal via cadreGoal — cadre
      // visuellement identique.
      function cadreMsgScale(cadre) {
        var sw = cadre.strokeWidth || 4;
        var scaled = Math.max(1, Math.min(Math.round(sw * 0.4), 8));
        if (scaled === sw) return cadre;
        var c = {};
        for (var k in cadre) c[k] = cadre[k];
        c.strokeWidth = scaled;
        return c;
      }

      // Cadre à appliquer au widget GOAL : le cadre de scène ramené à
      // l'échelle « bulle » (cadreMsgScale) — le goal est un widget
      // compact (~280×90) où le stroke scène calibré ≥160px rendrait le
      // cadre disproportionné. Le cadre du goal a ainsi exactement la
      // même taille que celui des messages chat en mode bulles.
      function cadreGoal(scene) {
        var c = scene && scene.cadreWidget;
        return c ? cadreMsgScale(c) : c;
      }

      // Pose le cadre SVG réel sur une bulle aux dims connues : clip-path à
      // la forme du cadre + enfant .cadre-overlay — même traitement que
      // applyCadreWidget sur les widgets (objectif inclus).
      function decorerCadreMsgDims(div, cadre, W, H) {
        if (W <= 0 || H <= 0) return;
        cadre = cadreMsgScale(cadre);
        // Jamais d'anim sur les bulles : jusqu'à ~200 SVG par widget —
        // un animateMotion par message violerait le budget perf.
        if (cadre.animer === true) {
          var cs = {};
          for (var k in cadre) cs[k] = cadre[k];
          cs.animer = false;
          cadre = cs;
        }
        var clip = genererCadreClipPath(cadre, W, H);
        if (clip) {
          div.style.clipPath = clip;
          div.style.webkitClipPath = clip;
        }
        var overlay = document.createElement("div");
        overlay.className = "cadre-overlay";
        overlay.innerHTML = genererCadreSVG(cadre, W, H, "cm" + (chatMsgUid++));
        div.appendChild(overlay);
      }

      // Variante qui mesure la bulle (déjà insérée — la hauteur dépend du
      // contenu : texte wrappé, emotes).
      function decorerCadreMsg(div, cadre) {
        decorerCadreMsgDims(div, cadre, div.offsetWidth, div.offsetHeight);
      }

      function fillChatBody(bodyEl, filtre, taillePolice, gradFrom, gradTo, cadreMsg) {
        var msgs = filtre === "unifie"
          ? chatMessages
          : chatMessages.filter(function (m) { return m.plateforme === filtre; });
        bodyEl.style.fontSize = taillePolice + "px";
        // Rebuild complet (rare : création, changement filtre/taille/cadre).
        bodyEl.innerHTML = "";
        var gf = gradFrom || "#e0e0e0";
        var gt = gradTo || "#9a9a9a";
        var borderImg = "linear-gradient(135deg, " + gf + ", " + gt + ") 1";
        var avatarRing = "0 0 0 1px " + gf + ", 0 0 6px rgba(255,255,255,0.25)";
        for (var i = 0; i < msgs.length; i++) {
          bodyEl.appendChild(creerNoeudChat(msgs[i], taillePolice, borderImg, avatarRing, !!cadreMsg));
        }
        // Passe 2 : cadres par bulle — mesures en lecture seule (une seule
        // fois layout) puis écritures, sinon chaque offsetWidth suivant une
        // mutation force un reflow synchrone (×200).
        if (cadreMsg) {
          var kids = bodyEl.children;
          var dims = [];
          for (var k = 0; k < kids.length; k++) {
            dims.push([kids[k].offsetWidth, kids[k].offsetHeight]);
          }
          for (k = 0; k < kids.length; k++) {
            decorerCadreMsgDims(kids[k], cadreMsg, dims[k][0], dims[k][1]);
          }
        }
        bodyEl.scrollTop = bodyEl.scrollHeight;
      }

      // Push incrémental d'UN message dans les widgets chat — O(1) par widget
      // au lieu de reconstruire 200 messages (le spam de bots ne saccade
      // plus). Le DOM suit exactement le buffer : les messages retirés du
      // buffer (trim MAX_CHAT) retirent leurs noeuds correspondants dans
      // chaque widget filtré.
      function appendChatMessage(m) {
        chatMessages.push(m);
        var overflow = chatMessages.length - MAX_CHAT;
        var retired = overflow > 0 ? chatMessages.splice(0, overflow) : null;
        if (!currentScene || !currentScene.widgets) return;
        var chatGrad = gradientCadre(currentScene.cadreWidget);
        var gf = chatGrad.from || "#e0e0e0";
        var gt = chatGrad.to || "#9a9a9a";
        var borderImg = "linear-gradient(135deg, " + gf + ", " + gt + ") 1";
        var avatarRing = "0 0 0 1px " + gf + ", 0 0 6px rgba(255,255,255,0.25)";
        for (var i = 0; i < currentScene.widgets.length; i++) {
          var w = currentScene.widgets[i];
          if ((w.type || "media") !== "chat") continue;
          var entry = widgetMap.get(w.id);
          if (!entry || !entry.chatBody) continue;
          var filtre = w.chatFiltre || "unifie";
          var taille = w.taillePolice || 16;
          entry.chatBody.style.fontSize = taille + "px";
          // Retirer les noeuds dont le message source a quitté le buffer.
          if (retired) {
            var aRetirer = 0;
            for (var r = 0; r < retired.length; r++) {
              if (filtre === "unifie" || retired[r].plateforme === filtre) {
                aRetirer++;
              }
            }
            while (aRetirer > 0 && entry.chatBody.firstElementChild) {
              entry.chatBody.removeChild(entry.chatBody.firstElementChild);
              aRetirer--;
            }
          }
          // Append uniquement si le message passe le filtre du widget.
          if (filtre === "unifie" || m.plateforme === filtre) {
            var node = creerNoeudChat(m, taille, borderImg, avatarRing, !!entry.cadreMsg);
            entry.chatBody.appendChild(node);
            // Mode bulles + cadre actif : cadre SVG réel par message,
            // mesuré post-insertion (comme un widget objectif).
            if (entry.cadreMsg) decorerCadreMsg(node, entry.cadreMsg);
            entry.chatBody.scrollTop = entry.chatBody.scrollHeight;
          }
        }
      }

      // État du fond de scène : { mediaEl, mediaKey, kind, mediaTime }.
      // mediaEl (img/video) est display:none — sert uniquement de source
      // pour drawImage dans peindreFond(). Mode carrousel (bgSlides) :
      // slides[] d'imgs cachées remplace mediaEl — slideIdx/prevIdx/
      // fadeStart/nextAt pilotés par le tick de startBgLoop.
      let bgState = { mediaEl: null, mediaKey: "", kind: "", mediaTime: 0,
        slides: null, slidesKey: "", slideIdx: 0, prevIdx: -1, fadeStart: 0,
        fadeDur: 800, nextAt: 0 };
      // Morphing fond : offscreen + canvas GL + rendu (créés lazily au premier
      // morph — zéro coût tant que la scène n'a pas de bgMorphs).
      var bgMorphOff = null;
      var bgMorphCanvas = null;
      var bgMorphRendu = null;

      // Nom de fichier seul (sans dossier "medias/", sans query, sans URL).
      // C'est la seule clé qui détermine si on recrée le mediaEl.
      function mediaKey(rel) {
        if (!rel) return "";
        const noQuery = rel.split("?")[0];
        const parts = noQuery.split("/");
        return parts[parts.length - 1] || "";
      }

      // ===== Carrousels d'images (mediaSlides widget / bgSlides fond) =====
      // Liste non vide = actif et prioritaire sur le média unique (qui reste
      // stocké et redevient visible si la liste est vidée). Le timer tourne
      // ICI côté viewer — le dashboard ne commit que les mutations de
      // liste/intervalle, jamais les avances. Images uniquement, fondu
      // enchaîné fixe, boucle séquentielle.
      var SLIDES_FADE_MS = 800;

      // Clé de liste = JSON des rels (PAS l'intervalle : un changement de sec
      // ne doit pas reconstruire la pile — il recale juste le timer).
      function slidesKeyOf(list) {
        var rels = [];
        for (var i = 0; i < list.length; i++) rels.push((list[i] && list[i].rel) || "");
        return JSON.stringify(rels);
      }

      // Intervalle borné : défaut 5 s, min 1 s.
      function slidesSecOf(sec) {
        return Math.max(1, sec || 5);
      }

      function slidesArreter(entry) {
        if (!entry) return;
        if (entry.slideTimer) { clearInterval(entry.slideTimer); entry.slideTimer = null; }
        // Handler posé par slidesDemarrerMorph (imgs uniquement).
        if (entry.mediaEl && entry.mediaEl.tagName === "IMG") entry.mediaEl.onload = null;
      }

      // Construit la pile d'imgs du carrousel widget dans el (opacity 0 sauf
      // la slide courante, classe "visible"). Retourne les éléments dans
      // l'ordre de la liste.
      function slidesConstruire(el, list, w) {
        var els = [];
        for (var i = 0; i < list.length; i++) {
          var img = document.createElement("img");
          img.className = "slide";
          img.src = "/" + list[i].rel;
          applyMediaStyle(img, w);
          if (i === 0) img.classList.add("visible");
          el.appendChild(img);
          els.push(img);
        }
        return els;
      }

      function slidesAvancer(entry) {
        if (!entry.slidesEls || entry.slidesEls.length < 2) return;
        entry.slidesEls[entry.slideIdx].classList.remove("visible");
        entry.slideIdx = (entry.slideIdx + 1) % entry.slidesEls.length;
        entry.slidesEls[entry.slideIdx].classList.add("visible");
      }

      // (Re)démarre l'intervalle du carrousel widget. 1 slide = statique, pas
      // de timer. Mémorise slideSec : l'appelant ne relance que si l'intervalle
      // a changé (la pile et la slide courante survivent).
      function slidesDemarrer(entry, sec) {
        slidesArreter(entry);
        entry.slideSec = slidesSecOf(sec);
        if (!entry.slidesEls) return;
        // Fondu borné à la moitié de l'intervalle — la transition ne dépasse
        // jamais le temps d'affichage d'une slide.
        var fadeS = Math.min(SLIDES_FADE_MS / 1000, entry.slideSec * 0.5);
        for (var fi = 0; fi < entry.slidesEls.length; fi++) entry.slidesEls[fi].style.transitionDuration = fadeS + "s";
        if (entry.slidesEls.length < 2) return;
        entry.slideTimer = setInterval(function () { slidesAvancer(entry); }, entry.slideSec * 1000);
      }

      // Retire la pile de slides du DOM + le timer (carrousel → média unique).
      function slidesRetirer(entry) {
        slidesArreter(entry);
        if (entry.slidesEls) {
          for (var i = 0; i < entry.slidesEls.length; i++) entry.slidesEls[i].remove();
          entry.slidesEls = null;
        }
        entry.slideIdx = 0;
        entry.slidesKey = "";
        entry.slideSec = 0;
      }

      // Démarre l'intervalle « swap src » du carrousel sur une entry morph :
      // la source cachée mediaEl change de slide, le rendu GL frame-par-frame
      // suit sans autre travail. Lit entry.slidesList + entry.slideSec.
      function slidesDemarrerMorph(entry) {
        slidesArreter(entry);
        var l = entry.slidesList;
        if (!l || l.length < 2) return;
        entry.slideTimer = setInterval(function () {
          entry.slideIdx = (entry.slideIdx + 1) % l.length;
          var el = entry.mediaEl;
          // Chemin image = rendu one-shot : re-rendre le morph quand la
          // nouvelle slide est chargée (pas de boucle rAF pour les images).
          el.onload = function () { if (entry.dernierW) morphRendreWidget(entry, entry.dernierW); };
          el.src = "/" + l[entry.slideIdx].rel;
        }, entry.slideSec * 1000);
      }

      function applyWidgetStyle(el, w) {
        el.style.left = w.x + "px";
        el.style.top = w.y + "px";
        el.style.width = w.largeur + "px";
        el.style.height = w.hauteur + "px";
        // zIndex est sur le wrapper (.widget-wrap), pas sur .widget.
        const rx = w.rotateX || 0;
        const ry = w.rotateY || 0;
        el.style.transform = "perspective(800px) rotateX(" + rx + "deg) rotateY(" + ry + "deg)";
        // Widgets sansCadre (drop bibliothèque) : opt-out du contour 1px +
        // voile de fond — classe dédiée (UPDATE couvert, tous les kinds).
        el.classList.toggle("sans-cadre", w.sansCadre === true);
      }

      function applyMediaStyle(mediaEl, w) {
        const fit = w.mediaFit || "ajuster";
        mediaEl.style.objectFit = FIT_CSS[fit] || "contain";
        mediaEl.style.objectPosition = fit === "centrer" ? "center" : "50% 50%";
        // Zoom + rotation 2D + offset du média (cadre widget fixe, overflow:hidden coupe).
        // Miroir : scale ±1 combiné au zoom, dans l'espace local du média
        // (après rotate dans la liste = flip de la source, sémantique OBS).
        const zoom = w.mediaZoom || 1;
        const rot = w.mediaRot || 0;
        const ox = w.mediaOffsetX || 0;
        const oy = w.mediaOffsetY || 0;
        const mH = w.mediaMiroirH === true ? -1 : 1;
        const mV = w.mediaMiroirV === true ? -1 : 1;
        mediaEl.style.transform = "translate(" + ox + "px, " + oy + "px) rotate(" + rot + "deg) scale(" + (zoom * mH) + ", " + (zoom * mV) + ")";
        mediaEl.style.transformOrigin = "center center";
        // Effets visuels (brightness/contrast/hue-rotate/blur). La pixelisation
        // n'est pas gérée en DOM (pas d'équivalent CSS pur) — elle est appliquée
        // en canvas dans le chemin morph + le fond de scène.
        mediaEl.style.filter = chaineFilter(w.mediaLum || 0, w.mediaContraste || 0, w.mediaTeinte || 0, w.mediaFlou || 0);
      }

      function createMedia(w, kind) {
        if (kind === "video") {
          // OBS : muet, pas de contrôles ni de clic. play/pause/loop gérés par
          // applyMediaState selon mediaPaused (snapshot WS depuis le dashboard).
          const vid = document.createElement("video");
          vid.src = "/" + w.media;
          vid.muted = true;
          vid.setAttribute("playsinline", "");
          return vid;
        }
        const img = document.createElement("img");
        img.src = "/" + w.media; // /medias/xxx.png → même origine :4321
        return img;
      }

      // Applique l'état lecture/pause/loop/seek d'une vidéo widget selon
      // mediaPaused/mediaTime. Tracker entry.mediaTime pour ne reset
      // currentTime que sur changement (pas sur chaque snapshot).
      // Guard par tagName (pas entry.kind) : les widgets chat/input-viewer/
      // speedrun ont un kind propre ("chat", …) mais peuvent porter une
      // vidéo de fond dans entry.mediaEl.
      function applyMediaState(entry, w) {
        if (!entry.mediaEl || entry.mediaEl.tagName !== "VIDEO") return;
        const v = entry.mediaEl;
        const paused = w.mediaPaused !== false; // défaut true
        // Boucle A–B : les deux bornes définies et B > A = boucle sur le
        // segment [A, B[ (loop natif OFF — il ne boucle que la vidéo entière).
        // Les bornes vivent sur entry (réécrites à chaque snapshot) : le
        // listener posé UNE fois par élément lit toujours la valeur à jour.
        const a = (typeof w.mediaLoopA === "number") ? w.mediaLoopA : null;
        const b = (typeof w.mediaLoopB === "number") ? w.mediaLoopB : null;
        const ab = a !== null && b !== null && b > a;
        entry.loopA = ab ? a : null;
        entry.loopB = ab ? b : null;
        v.loop = !paused && !ab;
        if (!v.__abBound) {
          v.__abBound = true;
          v.addEventListener("timeupdate", function () {
            if (entry.loopB == null) return;
            // Confine la lecture au segment : ≥ B ou < A (seek hors bornes)
            // → retour à A. Epsilon sous A : le clamp keyframe du seek ne
            // doit pas re-déclencher en boucle.
            if (v.currentTime >= entry.loopB || v.currentTime < entry.loopA - 0.05) {
              try { v.currentTime = entry.loopA; } catch (e) {}
            }
          });
          // B au-delà de la durée → la vidéo se termine : reseek A + play.
          v.addEventListener("ended", function () {
            if (entry.loopB == null) return;
            try { v.currentTime = entry.loopA; } catch (e) {}
            v.play().catch(function () {});
          });
        }
        if (paused || PREVIEW) {
          if (!v.paused) v.pause();
        } else {
          if (v.paused) v.play().catch(function () {});
        }
        const t = w.mediaTime || 0;
        if (entry.mediaTime !== t) {
          try { v.currentTime = t; } catch (e) {}
          entry.mediaTime = t;
        }
      }

      // ===== Média de fond des widgets à contenu (chat / input-viewer /
      // speedrun) =====
      // Le média est inséré en PREMIER enfant du widget (class "media-fond",
      // absolute z-index 0) → le contenu (messages, keycaps, splits) peint
      // par-dessus (position:relative z-index 1 via CSS). Le fond glass du
      // widget reste visible dans les bandes du fit "ajuster" ; "remplir"
      // couvre tout. Appelé sur chaque snapshot (UPDATE + CREATE) des 3
      // branches concernées de renderScene.
      // NB input-viewer : le UPDATE remplace el.innerHTML quand mode/layout/
      // skin change → l'appelant resette mediaEl/mediaKey AVANT (l'élément
      // média est détruit par innerHTML).
      function syncMediaFond(entry, w) {
        var key = mediaKey(w.media);
        if (!w.media || !key) {
          if (entry.mediaEl) {
            entry.mediaEl.remove();
            entry.mediaEl = null;
            entry.mediaKey = "";
          }
          return;
        }
        if (entry.mediaKey !== key || !entry.mediaEl || entry.mediaEl.parentNode !== entry.el) {
          if (entry.mediaEl) entry.mediaEl.remove();
          var fondEl = createMedia(w, w.kind || kindFromMedia(w.media));
          fondEl.className = "media-fond";
          entry.el.insertBefore(fondEl, entry.el.firstChild);
          entry.mediaEl = fondEl;
          entry.mediaKey = key;
          entry.mediaTime = w.mediaTime || 0;
        }
        applyMediaStyle(entry.mediaEl, w);
        applyMediaState(entry, w);
      }

      // ===== Fond de scène : canvas destination-out =====
      // Le fond est dessiné sur #bg-canvas. Les trous (widgets w.trou=true)
      // sont EFFACÉS du canvas via destination-out → alpha 0 → OBS visible.

      // Calcule le rectangle source/dest pour drawImage selon le mode fit.
      // Retourne { sx, sy, sw, sh, dx, dy, dw, dh } ou null (centrer + img plus
      // petite que le canvas → pas de dessin).
      function fitRects(imgW, imgH, cw, ch, fit) {
        const ir = imgW / imgH;
        const cr = cw / ch;
        let dw, dh, dx, dy;
        if (fit === "etirer") {
          return { sx: 0, sy: 0, sw: imgW, sh: imgH, dx: 0, dy: 0, dw: cw, dh: ch };
        }
        if (fit === "centrer") {
          dw = imgW; dh = imgH; dx = (cw - dw) / 2; dy = (ch - dh) / 2;
          if (dw <= cw && dh <= ch) {
            return { sx: 0, sy: 0, sw: imgW, sh: imgH, dx, dy, dw, dh };
          }
          // Plus grand que le canvas → comme "ajuster" (scale-down).
          fit = "ajuster";
        }
        if (fit === "vignette") {
          // scale-down = min(naturel, contain)
          const scale = Math.min(cw / imgW, ch / imgH, 1);
          dw = imgW * scale; dh = imgH * scale;
          dx = (cw - dw) / 2; dy = (ch - dh) / 2;
          return { sx: 0, sy: 0, sw: imgW, sh: imgH, dx, dy, dw, dh };
        }
        if (fit === "remplir" || fit === "etendre") {
          // cover : remplit le canvas, crop le débordement
          if (ir > cr) {
            dh = ch; dw = ch * ir;
          } else {
            dw = cw; dh = cw / ir;
          }
          dx = (cw - dw) / 2; dy = (ch - dh) / 2;
          return { sx: 0, sy: 0, sw: imgW, sh: imgH, dx, dy, dw, dh };
        }
        // ajuster (contain) : tient dans le canvas, bands noires
        if (ir > cr) {
          dw = cw; dh = cw / ir;
        } else {
          dh = ch; dw = ch * ir;
        }
        dx = (cw - dw) / 2; dy = (ch - dh) / 2;
        return { sx: 0, sy: 0, sw: imgW, sh: imgH, dx, dy, dw, dh };
      }

      // Parse un path SVG (attribut d) en liste de points [x, y] en aplatissant
      // les courbes M/L/Q/C/Z en segments de droite. Utilisé pour découper le
      // trou du canvas de fond selon la forme du clip-path du cadre (cyberpunk,
      // story, hexagon, arrondis) au lieu d'un rectangle simple.
      function svgPathToPoints(d, steps) {
        steps = steps || 12;
        var pts = [];
        var cx = 0, cy = 0, startX = 0, startY = 0;
        var regex = /([MLCQZ])\s*([^MLCQZ]*)/gi;
        var match;
        while ((match = regex.exec(d)) !== null) {
          var cmd = match[1].toUpperCase();
          var args = match[2].trim().split(/[\s,]+/).filter(function (s) { return s.length > 0; }).map(parseFloat);
          switch (cmd) {
            case 'M':
              cx = args[0]; cy = args[1];
              startX = cx; startY = cy;
              pts.push([cx, cy]);
              break;
            case 'L':
              cx = args[0]; cy = args[1];
              pts.push([cx, cy]);
              break;
            case 'C':
              var x0 = cx, y0 = cy;
              for (var s = 1; s <= steps; s++) {
                var t = s / steps, t1 = 1 - t;
                var bx = t1*t1*t1*x0 + 3*t1*t1*t*args[0] + 3*t1*t*t*args[2] + t*t*t*args[4];
                var by = t1*t1*t1*y0 + 3*t1*t1*t*args[1] + 3*t1*t*t*args[3] + t*t*t*args[5];
                pts.push([bx, by]);
              }
              cx = args[4]; cy = args[5];
              break;
            case 'Q':
              var qx0 = cx, qy0 = cy;
              for (var qs = 1; qs <= steps; qs++) {
                var qt = qs / steps, qt1 = 1 - qt;
                var bx = qt1*qt1*qx0 + 2*qt1*qt*args[0] + qt*qt*args[2];
                var by = qt1*qt1*qy0 + 2*qt1*qt*args[1] + qt*qt*args[3];
                pts.push([bx, by]);
              }
              cx = args[2]; cy = args[3];
              break;
            case 'Z':
              pts.push([startX, startY]);
              break;
          }
        }
        return pts;
      }

      // Cache des points parsés par clip-path string (évite de re-parser à
      // chaque frame vidéo).
      var clipPathPointsCache = {};
      function getCadreClipPathPoints(clipStr) {
        if (!clipStr) return null;
        if (clipPathPointsCache.hasOwnProperty(clipStr)) return clipPathPointsCache[clipStr];
        var m = clipStr.match(/path\('([^']+)'\)/);
        if (!m) { clipPathPointsCache[clipStr] = null; return null; }
        var pts = svgPathToPoints(m[1]);
        clipPathPointsCache[clipStr] = pts;
        return pts;
      }

      // Peint le fond sur #bg-canvas avec les trous (destination-out).
      // Appelée à chaque snapshot (image) ou via rAF (vidéo).
      function peindreFond(scene) {
        // Coords LOGIQUES scène — le transform global projette dans le
        // backing store adaptatif (applyCanvasDims). Tous les calculs
        // (fit, offsets, trous, clip-paths) restent en pixels scène.
        const cw = (scene && scene.canvasW) || 1920;
        const ch = (scene && scene.canvasH) || 1080;
        bgCtx.setTransform(bgScaleX, 0, 0, bgScaleY, 0, 0);
        bgCtx.clearRect(0, 0, cw, ch);

        if (!bgState.mediaEl && !bgState.slides) return;
        const src = bgState.slides ? bgState.slides[bgState.slideIdx] : bgState.mediaEl;
        if (!src) return;
        // Slide précédente pendant la fenêtre de fondu (crossfade alpha) —
        // dessinée sous la courante avec alpha complémentaire.
        var srcPrev = null;
        var alphaCur = 1;
        if (bgState.slides && bgState.prevIdx >= 0 && bgState.fadeStart > 0) {
          var kFade = (performance.now() - bgState.fadeStart) / (bgState.fadeDur || SLIDES_FADE_MS);
          var sp = bgState.slides[bgState.prevIdx];
          if (kFade < 1 && sp && sp.complete && sp.naturalWidth > 0) {
            srcPrev = sp;
            alphaCur = kFade;
          } else {
            bgState.prevIdx = -1; // fondu terminé (ou image perdue)
          }
        }
        // Vidéo : readyState >= 2 (HAVE_CURRENT_DATA) pour drawImage.
        // Image : complete && naturalWidth > 0.
        const ready = bgState.kind === "video"
          ? (src.readyState >= 2)
          : (src.complete && src.naturalWidth > 0);
        if (!ready) return;

        const fit = scene.bgFit || "remplir";
        const r = fitRects(src.videoWidth || src.naturalWidth,
                           src.videoHeight || src.naturalHeight,
                           cw, ch, fit);
        if (!r) return;

        // Rotation 2D + offset du fond : transform du ctx autour du centre,
        // drawImage, puis reset. NB : bgZoom n'est PLUS peint ici — il est
        // appliqué en scale() sur #bg (renderBg), en espace écran APRÈS le
        // tilt, pour agrandir le plan projeté entier (couvre le canvas même
        // incliné) au lieu de ne grandir que dans le plan pré-tilt.
        const rot = (scene.bgRot || 0) * Math.PI / 180;
        const ox = scene.bgOffsetX || 0;
        const oy = scene.bgOffsetY || 0;
        // Effets visuels du fond (brightness/contrast/hue-rotate/blur + pixel).
        var bgFilter = chaineFilter(scene.bgLum || 0, scene.bgContraste || 0, scene.bgTeinte || 0, scene.bgFlou || 0);
        var bgPixel = scene.bgPixel || 0;
        // Miroir du fond : scale ±1 combiné au zoom (espace local du média).
        var bgMH = scene.bgMiroirH === true ? -1 : 1;
        var bgMV = scene.bgMiroirV === true ? -1 : 1;
        // Transform fond (zoom/rot/offset) + drawImage — factorisé pour le
        // chemin morphé (dessin redirigé vers l'offscreen avant warp GL).
        // Applique aussi les effets visuels (filter + pixelisation).
        function dessinerContenuFond(ctx) {
          ctx.save();
          ctx.globalCompositeOperation = "source-over";
          // Pixelisation : downscale→upscale sans lissage. Le filter est
          // appliqué sur le petit canvas, puis l'upscale est sans lissage.
          if (bgPixel > 0) {
            var pf = Math.max(1, bgPixel);
            var pw = Math.max(1, Math.round(cw / pf));
            var ph = Math.max(1, Math.round(ch / pf));
            var pix = document.createElement("canvas");
            pix.width = pw;
            pix.height = ph;
            var pctx = pix.getContext("2d");
            if (pctx) {
              pctx.filter = bgFilter;
              pctx.save();
              pctx.translate(pw / 2 + ox / pf, ph / 2 + oy / pf);
              pctx.rotate(rot);
              pctx.scale(bgMH, bgMV);
              pctx.translate(-pw / 2, -ph / 2);
              try {
                if (srcPrev) {
                  var rPp = fitRects(srcPrev.naturalWidth, srcPrev.naturalHeight, cw, ch, fit);
                  if (rPp) { pctx.globalAlpha = 1 - alphaCur; pctx.drawImage(srcPrev, rPp.sx, rPp.sy, rPp.sw, rPp.sh, rPp.dx / pf, rPp.dy / pf, rPp.dw / pf, rPp.dh / pf); }
                }
                pctx.globalAlpha = alphaCur;
                pctx.drawImage(src, r.sx, r.sy, r.sw, r.sh, r.dx / pf, r.dy / pf, r.dw / pf, r.dh / pf);
              } catch (e) {}
              pctx.restore();
              ctx.filter = "none";
              ctx.imageSmoothingEnabled = false;
              ctx.drawImage(pix, 0, 0, pw, ph, 0, 0, cw, ch);
              ctx.imageSmoothingEnabled = true;
              ctx.restore();
              return;
            }
          }
          ctx.filter = bgFilter;
          ctx.translate(cw / 2 + ox, ch / 2 + oy);
          ctx.rotate(rot);
          ctx.scale(bgMH, bgMV);
          ctx.translate(-cw / 2, -ch / 2);
          try {
            if (srcPrev) {
              var rPn = fitRects(srcPrev.naturalWidth, srcPrev.naturalHeight, cw, ch, fit);
              if (rPn) { ctx.globalAlpha = 1 - alphaCur; ctx.drawImage(srcPrev, rPn.sx, rPn.sy, rPn.sw, rPn.sh, rPn.dx, rPn.dy, rPn.dw, rPn.dh); }
            }
            ctx.globalAlpha = alphaCur;
            ctx.drawImage(src, r.sx, r.sy, r.sw, r.sh, r.dx, r.dy, r.dw, r.dh);
          } catch (e) {
            // drawImage peut échouer si la vidéo n'est pas prête → ignore.
          }
          ctx.globalAlpha = 1;
          ctx.filter = "none";
          ctx.restore();
        }

        // ===== Morphs du fond : offscreen (fit+transform) → GL warp → canvas.
        // Le warp est en coords canvas normalisées (là où l'utilisateur clique).
        var bgMorphs = scene.bgMorphs || [];
        if (bgMorphs.length) {
          if (!bgMorphOff) bgMorphOff = document.createElement("canvas");
          if (bgMorphOff.width !== cw) bgMorphOff.width = cw;
          if (bgMorphOff.height !== ch) bgMorphOff.height = ch;
          var octx = bgMorphOff.getContext("2d");
          if (octx) {
            octx.clearRect(0, 0, cw, ch);
            dessinerContenuFond(octx);
            if (!bgMorphRendu) {
              if (!bgMorphCanvas) bgMorphCanvas = document.createElement("canvas");
              try {
                bgMorphRendu = morphCreerRendu(bgMorphCanvas);
              } catch {
                bgMorphRendu = null;
              }
            }
            if (bgMorphRendu) {
              bgMorphRendu.rendre(bgMorphOff, bgMorphs);
              bgCtx.drawImage(bgMorphCanvas, 0, 0);
            } else {
              dessinerContenuFond(bgCtx);
            }
          } else {
            dessinerContenuFond(bgCtx);
          }
        } else {
          dessinerContenuFond(bgCtx);
        }

        // ===== Trous : destination-out =====
        // Efface alpha dans la zone de chaque widget trou. Le trou suit TOUTES
        // les transforms du widget (x y w h + rotateX/rotateY + perspective 800px),
        // même ordre que le CSS .widget-3d : rotateY puis rotateX puis perspective.
        // Si un cadre avec clip-path est actif, le trou suit la forme du clip-path
        // (coins biseautés cyberpunk, hexagone, etc.) au lieu d'un rectangle.
        function projectCorner(lx, ly, rx, ry, d) {
          const rxR = rx * Math.PI / 180;
          const ryR = ry * Math.PI / 180;
          // rotateY (autour de Y) : x' = cos(ry)*lx, z' = -sin(ry)*lx, y' = ly
          const x1 = Math.cos(ryR) * lx;
          const z1 = -Math.sin(ryR) * lx;
          const y1 = ly;
          // rotateX (autour de X) : y'' = cos(rx)*y' - sin(rx)*z', z'' = sin(rx)*y' + cos(rx)*z'
          const y2 = Math.cos(rxR) * y1 - Math.sin(rxR) * z1;
          const z2 = Math.sin(rxR) * y1 + Math.cos(rxR) * z1;
          // perspective(d) : w = 1 - z/d, px = x/w, py = y/w
          const w = 1 - z2 / d;
          return { x: x1 / w, y: y2 / w };
        }
        // Tilt du fond (snapshot) : compensation des trous — voir
        // unprojectCorner. Fond plat → identité, comportement inchangé.
        const bgRX = scene.bgRotX || 0;
        const bgRY = scene.bgRotY || 0;
        const bgZ = scene.bgZoom || 1;
        const bgTilt = bgRX !== 0 || bgRY !== 0;
        const bgCompense = bgTilt || bgZ !== 1;
        // Projection inverse du tilt 3D du fond (#bg subit perspective(2×cw)
        // rotateX rotateY en CSS, origin centre — voir renderBg).
        // projectCorner projette
        // local→écran ; ici on résout l'inverse écran→local (système 2×2 sur
        // lx, ly) pour que chaque trou, dessiné AVANT le tilt dans le canvas,
        // retombe à l'écran exactement sous son widget — jamais déplacé.
        function unprojectCorner(sx, sy, rx, ry, d) {
          const rxR = rx * Math.PI / 180;
          const ryR = ry * Math.PI / 180;
          const crx = Math.cos(rxR), srx = Math.sin(rxR);
          const cry = Math.cos(ryR), sry = Math.sin(ryR);
          const a = cry - (sx / d) * sry * crx;
          const b = (sx / d) * srx;
          const c = sry * (srx - (sy / d) * crx);
          const e = crx + (sy / d) * srx;
          const det = a * e - b * c;
          if (Math.abs(det) < 1e-9) return { x: sx, y: sy };
          return { x: (sx * e - b * sy) / det, y: (a * sy - sx * c) / det };
        }
        // Point écran (coords scène) → point canvas-local à travers le tilt.
        // Identité quand le fond est plat.
        function trouToCanvas(sx, sy) {
          if (!bgCompense) return { x: sx, y: sy };
          // Le transform de #bg est "scale(z) perspective rotateX rotateY" :
          // le scale est appliqué EN DERNIER aux coords écran → on divise
          // d'abord par z, puis on un-projette le tilt. d = cw×2 : perspective
          // du FOND (renderBg), pas PERSP=800 qui reste celle des widgets.
          const q = unprojectCorner((sx - cw / 2) / bgZ, (sy - ch / 2) / bgZ, bgRX, bgRY, cw * 2);
          return { x: q.x + cw / 2, y: q.y + ch / 2 };
        }
        // Dessine un trou (destination-out) depuis ses points ÉCRAN : avec un
        // fond tilté chaque point est converti via trouToCanvas (image
        // réciproque) — le trou reste aligné sous son widget plat ou tilté.
        function fillTrouEcran(pts) {
          var q = trouToCanvas(pts[0][0], pts[0][1]);
          bgCtx.beginPath();
          bgCtx.moveTo(q.x, q.y);
          for (var i = 1; i < pts.length; i++) {
            q = trouToCanvas(pts[i][0], pts[i][1]);
            bgCtx.lineTo(q.x, q.y);
          }
          bgCtx.closePath();
          bgCtx.fill();
        }
        bgCtx.save();
        bgCtx.globalCompositeOperation = "destination-out";
        const ws = scene.widgets || [];
        let n = 0;
        // Cadre widget actif ? Si oui, on récupère le clip-path pour découper
        // le trou selon la forme du cadre (et non un rectangle simple).
        var cadreWidget = scene.cadreWidget;
        var cadreWidgetActif = cadreWidget && cadreWidget.actif && (cadreWidget.strokeWidth || 0) > 0;
        for (let i = 0; i < ws.length; i++) {
          const w = ws[i];
          // Trous + caméra : le widget caméra est un trou — la source OBS
          // "SOS-Caméra" (dshow_input sous SOS-Diffusion) apparaît à travers.
          if (w.trou === true || w.type === "camera") {
            const rx = w.rotateX || 0;
            const ry = w.rotateY || 0;

            // Clip-path du cadre pour ce widget (forme du cadre, pas rectangle).
            // w.sansCadre = pas de cadre dessiné → trou rectangulaire (sinon
            // les coins du clip-path resteraient remplis sans cadre visible).
            var clipStr = null;
            if (cadreWidgetActif && w.sansCadre !== true) {
              clipStr = genererCadreClipPath(cadreWidget, w.largeur, w.hauteur);
            }
            var clipPts = getCadreClipPathPoints(clipStr);

            if (clipPts && clipPts.length > 1) {
              // Trou selon la forme du clip-path du cadre.
              const cx = w.x + w.largeur / 2;
              const cy = w.y + w.hauteur / 2;
              const hw = w.largeur / 2;
              const hh = w.hauteur / 2;
              // Points ÉCRAN du trou : clip-path translaté (widget plat) ou
              // projeté 3D (widget tilté). fillTrouEcran compense le tilt du
              // fond via trouToCanvas (identité si le fond est plat).
              var ptsEcran = [];
              for (var pi = 0; pi < clipPts.length; pi++) {
                if (rx === 0 && ry === 0) {
                  ptsEcran.push([clipPts[pi][0] + w.x, clipPts[pi][1] + w.y]);
                } else {
                  var p = projectCorner(clipPts[pi][0] - hw, clipPts[pi][1] - hh, rx, ry, PERSP);
                  ptsEcran.push([cx + p.x, cy + p.y]);
                }
              }
              fillTrouEcran(ptsEcran);
            } else if (rx === 0 && ry === 0) {
              if (bgCompense) {
                // Rectangle écran à un-projeter (fond tilté ou zoomé, widget plat).
                fillTrouEcran([[w.x, w.y], [w.x + w.largeur, w.y],
                               [w.x + w.largeur, w.y + w.hauteur], [w.x, w.y + w.hauteur]]);
              } else {
                // Fast path : rectangle AABB (pas de cadre ou cadre sans clip-path).
                bgCtx.fillRect(w.x, w.y, w.largeur, w.hauteur);
              }
            } else {
              // Quad projeté : 4 coins locaux (relatifs au centre, z=0)
              // projetés par la même matrice que .widget-3d, puis translatés.
              const cx = w.x + w.largeur / 2;
              const cy = w.y + w.hauteur / 2;
              const hw = w.largeur / 2;
              const hh = w.hauteur / 2;
              const c0 = projectCorner(-hw, -hh, rx, ry, PERSP);
              const c1 = projectCorner( hw, -hh, rx, ry, PERSP);
              const c2 = projectCorner( hw,  hh, rx, ry, PERSP);
              const c3 = projectCorner(-hw,  hh, rx, ry, PERSP);
              fillTrouEcran([[cx + c0.x, cy + c0.y], [cx + c1.x, cy + c1.y],
                             [cx + c2.x, cy + c2.y], [cx + c3.x, cy + c3.y]]);
            }
            n++;
          }
        }
        bgCtx.restore();
        bgCtx.globalCompositeOperation = "source-over";
      }

      // Boucle rAF pour le fond vidéo (sinon frame figée sans trou).
      // Skip-frame : currentTime inchangé (pause, seek posé, buffer stall)
      // → aucun repaint — la frame peinte est identique. Les changements de
      // paramètres (zoom/rot/trous/morphs) repeignent via le chemin snapshot
      // (renderBg/appliquerSnapshot → peindreFond), pas via cette boucle.
      let rafId = 0;
      let bgDernierT = -1;
      function startBgLoop() {
        if (rafId) return;
        function tick() {
          // JC : percer les trous de la scène DÉRIVÉE (caméra + chat seuls),
          // pas ceux de la scène réelle — sinon les captures OBS réapparaissent
          // sous les anciens rects pendant JC.
          var sceneTick = jcDeriverScene(currentScene);
          var v = bgState.mediaEl;
          if (bgState.kind === "video" && v && v.currentTime !== bgDernierT) {
            bgDernierT = v.currentTime;
            peindreFond(sceneTick);
          }
          // Carrousel de fond : avance à nextAt (image suivante déjà chargée)
          // + repeint chaque frame pendant la fenêtre de fondu.
          if (bgState.slides && bgState.slides.length > 1) {
            var now = performance.now();
            var inFade = bgState.prevIdx >= 0 && (now - bgState.fadeStart) < (bgState.fadeDur || SLIDES_FADE_MS);
            if (now >= bgState.nextAt) {
              var next = (bgState.slideIdx + 1) % bgState.slides.length;
              var nimg = bgState.slides[next];
              if (nimg && nimg.complete && nimg.naturalWidth > 0) {
                var secBg = slidesSecOf(currentScene && currentScene.bgSlidesSec);
                bgState.prevIdx = bgState.slideIdx;
                bgState.slideIdx = next;
                bgState.fadeStart = now;
                // Fondu borné à la moitié de l'intervalle.
                bgState.fadeDur = Math.min(SLIDES_FADE_MS, secBg * 500);
                bgState.nextAt = now + secBg * 1000;
                peindreFond(sceneTick);
              } else {
                bgState.nextAt = now + 500; // image pas prête → re-tester
              }
            } else if (inFade) {
              peindreFond(sceneTick);
            }
          }
          rafId = requestAnimationFrame(tick);
        }
        rafId = requestAnimationFrame(tick);
      }
      function stopBgLoop() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
      }

      // Applique l'état lecture/pause/loop/seek de la vidéo fond selon
      // bgPaused/bgTime. Tracker bgState.mediaTime pour ne reset currentTime
      // que sur changement.
      function applyBgState(state, scene) {
        if (!state.mediaEl || state.kind !== "video") return;
        const v = state.mediaEl;
        const paused = scene.bgPaused !== false; // défaut true
        // Boucle A–B du fond — même règle que applyMediaState (bornes sur
        // state, listener timeupdate/ended posé une fois par élément).
        const a = (typeof scene.bgLoopA === "number") ? scene.bgLoopA : null;
        const b = (typeof scene.bgLoopB === "number") ? scene.bgLoopB : null;
        const ab = a !== null && b !== null && b > a;
        state.loopA = ab ? a : null;
        state.loopB = ab ? b : null;
        v.loop = !paused && !ab;
        if (!v.__abBound) {
          v.__abBound = true;
          v.addEventListener("timeupdate", function () {
            if (state.loopB == null) return;
            if (v.currentTime >= state.loopB || v.currentTime < state.loopA - 0.05) {
              try { v.currentTime = state.loopA; } catch (e) {}
            }
          });
          v.addEventListener("ended", function () {
            if (state.loopB == null) return;
            try { v.currentTime = state.loopA; } catch (e) {}
            v.play().catch(function () {});
          });
        }
        if (paused || PREVIEW) {
          if (!v.paused) v.pause();
        } else {
          if (v.paused) v.play().catch(function () {});
        }
        const t = scene.bgTime || 0;
        if (state.mediaTime !== t) {
          try { v.currentTime = t; } catch (e) {}
          state.mediaTime = t;
        }
      }

        // projection inverse dans peindreFond → ils restent sous leurs widgets.
        const bgTiltX = scene.bgRotX || 0;

          bgState.prevIdx = -1;
          bgState.fadeStart = 0;
          bgState.nextAt = 0;

          return;

          // avancée par le tick de startBgLoop + fondu dans peindreFond =====

          if (bgState.slidesKey !== lkey || !bgState.slides) {
            if (bgState.mediaEl) { bgEl.removeChild(bgState.mediaEl); bgState.mediaEl = null; }

            bgState.slideIdx = 0;
            bgState.prevIdx = -1;
            bgState.fadeStart = 0;
            bgState.nextAt = performance.now() + slidesSecOf(scene.bgSlidesSec) * 1000;
            bgState.kind = "image";
            bgState.mediaKey = "slides:" + lkey;
            bgState.mediaTime = 0;
            bgDernierT = -1;
            // Peindre dès que la 1re image est chargée (snapshot courant en
            // param — currentScene peut avoir avancé d'ici le load).
            var img0 = bgState.slides[0];
            if (img0) {
              if (img0.complete && img0.naturalWidth > 0) {

          bgState.slidesKey = "";
          bgState.slideIdx = 0;
          bgState.prevIdx = -1;
          bgState.fadeStart = 0;
          bgState.nextAt = 0;

          bgEl.appendChild(mediaEl);
          bgState.mediaEl = mediaEl;
          bgState.mediaKey = key;
          bgState.kind = kind;
          bgState.mediaTime = scene.bgTime || 0;
          bgDernierT = -1; // nouveau média → forcer le 1er repaint du tick.
          applyBgState(bgState, scene);
          // Image : peindre quand loaded. Vidéo : rAF loop.
          if (kind === "video") {
            startBgLoop();
          } else {
            mediaEl.addEventListener("load", function () { peindreFond(scene); });
            // Au cas où déjà cached :
            if (mediaEl.complete) peindreFond(scene);
          }
        } else if (bgState.mediaEl) {
          applyBgState(bgState, scene);
        }
      }

      function createBgMedia(scene, kind) {

      function ivGenererClavierHTML(layout, carre) {
        var rangees = layout === "qwerty" ? IV_CLAVIER_QWERTY : IV_CLAVIER_AZERTY;
        var html = '<div class="iv-section iv-section-clavier"><div class="iv-kb">'
          + ivChassisHTML(carre)
          + '<div class="iv-kb-keys"><div class="iv-clavier">';
        for (var r = 0; r < rangees.length; r++) {
          html += '<div class="iv-rangee">';
          for (var t = 0; t < rangees[r].length; t++) {
            html += ivToucheHTML(rangees[r][t]);

          html += "</div>";
        }
        html += '<div class="iv-fleches">'
          + '<div class="iv-rangee"><div class="iv-touche" data-touche="ArrowUp">▲</div></div>'
          + '<div class="iv-rangee">'

          + '<div class="iv-touche" data-touche="ArrowRight">►</div>'
          + "</div></div>";
        html += "</div></div></div></div>";
        return html;
      }

      // ===== Skin 8BitDo ProFight : fightpad réaliste en SVG inline =====
      // Corps de manette dessiné en SVG (viewBox 760x420, "meet" → responsive
      // natif). Les zones cliquables gardent data-bouton/data-dpad sur des <g>
      // → majInputViewerEtat toggle .presse sans changement. Pas de sticks.
      // Fills de base = gradients en <defs> (url) ; .presse les écrase en CSS.
      function ivGenererManette8BitDoSVG() {
        // Bouton face : ombre portée sous la pastille + pastille gradient +
        // reflet + label. btn = index data-bouton (mapping standard Gamepad).
        function face(btn, cx, cy, lbl) {
          return '<g data-bouton="' + btn + '" class="iv-fig-btn">'
            + '<circle class="iv-fig-btn-shadow" cx="' + cx + '" cy="' + (cy + 4) + '" r="28"/>'
            + '<circle class="iv-fig-face" cx="' + cx + '" cy="' + cy + '" r="27" fill="url(#ivg-btn)"/>'
            + '<ellipse class="iv-fig-sheen" cx="' + cx + '" cy="' + (cy - 12) + '" rx="15" ry="6"/>'
            + '<text class="iv-fig-lbl" x="' + cx + '" y="' + cy + '">' + lbl + '</text></g>';
        }
        // Zone pressable d'un bras de la croix : invisible au repos, elle
        // s'illumine à .presse. La flèche est gravée sur la croix de base.
        function zone(dir, x, y, w, h) {
          return '<g data-dpad="' + dir + '" class="iv-fig-dpad">'
            + '<rect class="iv-fig-zone" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="10"/></g>';
        }
        // Diagonale : point discret qui s'allume quand 2 bras sont pressés.
        function diag(dir, cx, cy) {
          return '<g data-dpad="' + dir + '"><circle class="iv-fig-diag" cx="' + cx + '" cy="' + cy + '" r="7"/></g>';
        }
        // Gâchette d'épaule : capsule qui dépasse au-dessus du corps.
        function shoulder(btn, x, lbl) {
          return '<g data-bouton="' + btn + '" class="iv-fig-btn">'
            + '<rect class="iv-fig-shoulder" x="' + x + '" y="16" width="150" height="80" rx="32" fill="url(#ivg-btn)"/>'
            + '<rect class="iv-fig-sheen" x="' + (x + 12) + '" y="24" width="126" height="20" rx="10"/>'
            + '<text class="iv-fig-lbl" x="' + (x + 75) + '" y="46">' + lbl + '</text></g>';
        }
        // Select/Start : petite pilule bas-centre.
        function pill(btn, x, lbl) {
          return '<g data-bouton="' + btn + '" class="iv-fig-btn">'
            + '<circle class="iv-fig-btn-shadow" cx="' + (x + 31) + '" cy="310" r="17"/>'
            + '<rect class="iv-fig-pill" x="' + x + '" y="288" width="62" height="26" rx="13" fill="url(#ivg-btn)"/>'
            + '<text class="iv-fig-lbl iv-fig-lbl-sm" x="' + (x + 31) + '" y="301">' + lbl + '</text></g>';
        }
        return '<div class="iv-section iv-section-manette"><div class="iv-manette iv-manette-fig" data-skin="8bitdo">'
          + '<svg class="iv-fig-canvas" viewBox="0 0 760 420" preserveAspectRatio="xMidYMid meet">'
          + '<defs>'
          + '<linearGradient id="ivg-corps" x1="0" y1="0" x2="0" y2="1">'
          + '<stop offset="0" stop-color="#3a3f4d"/><stop offset="0.45" stop-color="#262a33"/><stop offset="1" stop-color="#14161c"/>'
          + '</linearGradient>'
          + '<linearGradient id="ivg-btn" x1="0" y1="0" x2="0" y2="1">'
          + '<stop offset="0" stop-color="#4a5060"/><stop offset="1" stop-color="#22252d"/>'
          + '</linearGradient>'
          + '<linearGradient id="ivg-cross" x1="0" y1="0" x2="0" y2="1">'
          + '<stop offset="0" stop-color="#2f333e"/><stop offset="1" stop-color="#1c1f26"/>'
          + '</linearGradient>'
          + '<radialGradient id="ivg-dish" cx="0.5" cy="0.45" r="0.62">'
          + '<stop offset="0" stop-color="#20242c"/><stop offset="1" stop-color="#101318"/>'
          + '</radialGradient>'
          + '</defs>'
          // Épaules ZL/ZR (dessinées AVANT le corps : seul le chapeau dépasse).
          + shoulder(6, 118, "ZL") + shoulder(7, 492, "ZR")
          // Corps : silhouette fightpad (haut plat, flancs arrondis, bas
          // légèrement aplati) + panneau interne en retrait pour le relief.
          + '<path class="iv-fig-corps" fill="url(#ivg-corps)" d="M58 200 C58 108 138 58 243 58 L517 58 C622 58 702 108 702 200 C702 252 674 294 614 322 C550 352 466 362 380 362 C294 362 210 352 146 322 C86 294 58 252 58 200 Z"/>'
          + '<path class="iv-fig-corps-inner" d="M78 202 C78 124 150 76 250 76 L510 76 C610 76 682 124 682 202 C682 246 656 282 604 306 C546 332 464 342 380 342 C296 342 214 332 156 306 C104 282 78 246 78 202 Z"/>'
          // Boutons déco haut-centre + home (bouton 16 du mapping standard).
          + '<circle class="iv-fig-deco" cx="352" cy="108" r="7"/>'
          + '<circle class="iv-fig-deco" cx="408" cy="108" r="7"/>'
          + '<g data-bouton="16" class="iv-fig-btn"><circle class="iv-fig-home" cx="380" cy="140" r="11" fill="url(#ivg-btn)"/></g>'
          // D-pad : dish radial + vraie croix (2 barres) + zones pressables
          // invisibles + diagonales + moyeu.
          + '<circle class="iv-fig-dish" cx="178" cy="220" r="92" fill="url(#ivg-dish)"/>'
          + '<rect class="iv-fig-cross" x="154" y="152" width="48" height="136" rx="10" fill="url(#ivg-cross)"/>'
          + '<rect class="iv-fig-cross" x="110" y="196" width="136" height="48" rx="10" fill="url(#ivg-cross)"/>'
          + diag("haut-gauche", 130, 172) + diag("haut-droite", 226, 172)
          + diag("bas-gauche", 130, 268) + diag("bas-droite", 226, 268)
          + zone("haut", 156, 154, 44, 60)
          + zone("bas", 156, 226, 44, 60)
          + zone("gauche", 112, 198, 60, 44)
          + zone("droite", 184, 198, 60, 44)
          + '<text class="iv-fig-lbl iv-fig-arrow" x="178" y="163">▲</text>'
          + '<text class="iv-fig-lbl iv-fig-arrow" x="178" y="277">▼</text>'
          + '<text class="iv-fig-lbl iv-fig-arrow" x="121" y="220">◄</text>'
          + '<text class="iv-fig-lbl iv-fig-arrow" x="235" y="220">►</text>'
          + '<circle class="iv-fig-hub" cx="178" cy="220" r="30" fill="url(#ivg-cross)"/>'
          + '<circle class="iv-fig-hub-dot" cx="178" cy="220" r="9"/>'
          // Boutons face : 2 rangées de 3 (X Y L / A B R), légèrement
          // remontées en suivant la pente du corps.
          + face(2, 468, 166, "X") + face(3, 558, 160, "Y") + face(4, 648, 166, "L")
          + face(0, 468, 254, "A") + face(1, 558, 260, "B") + face(5, 648, 254, "R")
          // Select + Start.
          + pill(8, 318, "SELECT") + pill(9, 400, "START")
          + "</svg></div></div>";
      }

      // ===== Skin Xbox : manette réaliste en SVG inline =====
      // Silhouette à grips asymétriques, sticks décalés (gauche haut, droite
      // bas), face en losange A/B/X/Y colorée, triggers LT/RT derrière le
      // corps, bumpers LB/RB sur le bord supérieur, View/Menu/Xbox au centre.
      // Même contrat que le skin 8bitdo : <g data-bouton>/<g data-dpad> +
      // <g data-stick-indicateur class="iv-fig-stick"> pour les caps mobiles.
      function ivGenererManetteXboxSVG() {
        // Bouton face : ombre + pastille + reflet + lettre colorée (classe).
        function face(btn, cx, cy, lbl, lblCls) {
          return '<g data-bouton="' + btn + '" class="iv-fig-btn">'
            + '<circle class="iv-fig-btn-shadow" cx="' + cx + '" cy="' + (cy + 4) + '" r="26"/>'
            + '<circle class="iv-fig-face" cx="' + cx + '" cy="' + cy + '" r="25" fill="url(#ivgx-btn)"/>'
            + '<ellipse class="iv-fig-sheen" cx="' + cx + '" cy="' + (cy - 11) + '" rx="14" ry="5"/>'
            + '<text class="iv-fig-lbl ' + lblCls + '" x="' + cx + '" y="' + cy + '">' + lbl + '</text></g>';
        }
        // Stick analogique : base fixe + cap mobile (transform JS en px).
        // Le cap porte AUSSI data-bouton (10/11) → clic L3/R3 illumine.
        function stick(cx, cy, cote, btn) {
          return '<circle class="iv-fig-stick-base" cx="' + cx + '" cy="' + cy + '" r="48" fill="url(#ivgx-dish)"/>'
            + '<g class="iv-fig-stick" data-stick-indicateur="' + cote + '" data-bouton="' + btn + '">'
            + '<circle class="iv-fig-btn-shadow" cx="' + cx + '" cy="' + (cy + 4) + '" r="31"/>'
            + '<circle class="iv-fig-stick-cap" cx="' + cx + '" cy="' + cy + '" r="30" fill="url(#ivgx-btn)"/>'
            + '<circle class="iv-fig-stick-ring" cx="' + cx + '" cy="' + cy + '" r="18"/></g>';
        }
        // Zone pressable invisible sur un bras de la croix du D-pad.
        function zone(dir, x, y, w, h) {
          return '<g data-dpad="' + dir + '" class="iv-fig-dpad">'
            + '<rect class="iv-fig-zone" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="10"/></g>';
        }
        function diag(dir, cx, cy) {
          return '<g data-dpad="' + dir + '"><circle class="iv-fig-diag" cx="' + cx + '" cy="' + cy + '" r="5"/></g>';
        }
        // Trigger (derrière le corps) et bumper (sur le bord supérieur).
        function trigger(btn, cx, lbl) {
          return '<g data-bouton="' + btn + '" class="iv-fig-btn">'
            + '<rect class="iv-fig-shoulder" x="' + (cx - 70) + '" y="6" width="140" height="80" rx="30" fill="url(#ivgx-btn)"/>'
            + '<text class="iv-fig-lbl" x="' + cx + '" y="36">' + lbl + '</text></g>';
        }
        function bumper(btn, cx, lbl) {
          return '<g data-bouton="' + btn + '" class="iv-fig-btn">'
            + '<rect class="iv-fig-shoulder" x="' + (cx - 82) + '" y="50" width="164" height="42" rx="21" fill="url(#ivgx-btn)"/>'
            + '<rect class="iv-fig-sheen" x="' + (cx - 70) + '" y="56" width="140" height="12" rx="6"/>'
            + '<text class="iv-fig-lbl" x="' + cx + '" y="72">' + lbl + '</text></g>';
        }
        return '<div class="iv-section iv-section-manette"><div class="iv-manette iv-manette-fig" data-skin="xbox">'
          + '<svg class="iv-fig-canvas" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet">'
          + '<defs>'
          + '<linearGradient id="ivgx-corps" x1="0" y1="0" x2="0" y2="1">'
          + '<stop offset="0" stop-color="#33373f"/><stop offset="0.45" stop-color="#21242b"/><stop offset="1" stop-color="#121418"/>'
          + '</linearGradient>'
          + '<linearGradient id="ivgx-btn" x1="0" y1="0" x2="0" y2="1">'
          + '<stop offset="0" stop-color="#454b57"/><stop offset="1" stop-color="#1f2229"/>'
          + '</linearGradient>'
          + '<linearGradient id="ivgx-cross" x1="0" y1="0" x2="0" y2="1">'
          + '<stop offset="0" stop-color="#2c3038"/><stop offset="1" stop-color="#191c21"/>'
          + '</linearGradient>'
          + '<radialGradient id="ivgx-dish" cx="0.5" cy="0.45" r="0.62">'
          + '<stop offset="0" stop-color="#1e2128"/><stop offset="1" stop-color="#0e1114"/>'
          + '</radialGradient>'
          + '</defs>'
          // Triggers LT/RT derrière le corps (seul le haut dépasse).
          + trigger(6, 170, "LT") + trigger(7, 590, "RT")
          // Corps : arcade haute + deux grips qui descendent aux coins.
          + '<path class="iv-fig-corps" fill="url(#ivgx-corps)" d="M380 64 C215 64 80 114 70 198 C62 268 80 336 120 372 C150 400 200 388 216 346 C226 318 254 300 287 300 L473 300 C506 300 534 318 544 346 C560 388 610 400 640 372 C680 336 698 268 690 198 C680 114 545 64 380 64 Z"/>'
          + '<path class="iv-fig-sheen-line" d="M108 152 C195 96 565 96 652 152"/>'
          // Bumpers LB/RB posés sur le bord supérieur du corps.
          + bumper(4, 170, "LB") + bumper(5, 590, "RB")
          // Bouton Xbox (home, bouton 16) + View (8) / Menu (9).
          + '<g data-bouton="16" class="iv-fig-btn"><circle class="iv-fig-btn-shadow" cx="380" cy="109" r="20"/><circle class="iv-fig-face" cx="380" cy="105" r="19" fill="url(#ivgx-btn)"/><text class="iv-fig-lbl" x="380" y="105" style="font-size:18px">✕</text></g>'
          + '<g data-bouton="8" class="iv-fig-btn"><circle class="iv-fig-face" cx="335" cy="148" r="13" fill="url(#ivgx-btn)"/>'
          + '<rect class="iv-fig-ico" x="329" y="143" width="7" height="8" rx="1"/><rect class="iv-fig-ico" x="334" y="146" width="7" height="8" rx="1"/></g>'
          + '<g data-bouton="9" class="iv-fig-btn"><circle class="iv-fig-face" cx="425" cy="148" r="13" fill="url(#ivgx-btn)"/>'
          + '<rect class="iv-fig-ico" x="419" y="141" width="12" height="2.4" rx="1"/><rect class="iv-fig-ico" x="419" y="146" width="12" height="2.4" rx="1"/><rect class="iv-fig-ico" x="419" y="151" width="12" height="2.4" rx="1"/></g>'
          // Stick gauche (haut) — cap mobile data-stick-indicateur.
          + stick(195, 175, "gauche", 10)
          // D-pad satellite (bas-gauche) : dish + croix + zones + diagonales.
          + '<circle class="iv-fig-dish" cx="195" cy="300" r="56" fill="url(#ivgx-dish)"/>'
          + '<rect class="iv-fig-cross" x="173" y="262" width="44" height="76" rx="10" fill="url(#ivgx-cross)"/>'
          + '<rect class="iv-fig-cross" x="157" y="278" width="76" height="44" rx="10" fill="url(#ivgx-cross)"/>'
          + diag("haut-gauche", 161, 266) + diag("haut-droite", 229, 266)
          + diag("bas-gauche", 161, 334) + diag("bas-droite", 229, 334)
          + zone("haut", 175, 264, 40, 32)
          + zone("bas", 175, 304, 40, 32)
          + zone("gauche", 159, 280, 32, 40)
          + zone("droite", 199, 280, 32, 40)
          + '<circle class="iv-fig-hub" cx="195" cy="300" r="14" fill="url(#ivgx-cross)"/>'
          // Boutons face en losange : Y haut, X gauche, B droite, A bas.
          + face(3, 560, 122, "Y", "iv-fig-lbl-y")
          + face(2, 507, 170, "X", "iv-fig-lbl-x")
          + face(1, 613, 170, "B", "iv-fig-lbl-b")
          + face(0, 560, 218, "A", "iv-fig-lbl-a")
          // Stick droit (bas).
          + stick(560, 300, "droite", 11)
          + "</svg></div></div>";
      }

      // ===== Skin PlayStation : DualSense réaliste en SVG inline =====
      // Sticks symétriques en bas, D-pad à 4 bras séparés, symboles ✕○□△
      // colorés, touchpad central cliquable (bouton 17), Share/Options.
      function ivGenererManettePsSVG() {
        // Bouton face : ombre + pastille + symbole coloré (△□○✕).
        function face(btn, cx, cy, lbl, lblCls) {

            + '<circle class="iv-fig-btn-shadow" cx="' + cx + '" cy="' + (cy + 4) + '" r="26"/>'

        function stick(cx, cy, cote, btn) {
