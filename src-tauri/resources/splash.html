<!DOCTYPE html>
<!--
  Splash de démarrage StreamOS — servi par le protocole custom
  streamos-splash://localhost/ (handler dans splash.rs).
  __USER__ / __GREETING__ : placeholders remplacés à la volée par Rust
  (pseudo Windows via env USERNAME + salutation traduite via langue.json).
  /wallpaper : fond d'écran Windows de l'utilisateur — 404 si indisponible
  (couleur unie, slideshow sans image, lecture refusée) → le dégradé du
  thème glace reste en dessous (les calques CSS d'une image absente sont
  transparents). Jamais bloquant par design.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>StreamOS</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e5e7eb;
        background-color: #08080f;
        /* Calques (bas → haut) : base nuit + halos aurora du thème glace,
           wallpaper Windows, voile sombre de lisibilité. Si /wallpaper
           renvoie 404, son calque est transparent : les halos restent. */
        background-image:
          linear-gradient(rgba(8, 8, 15, 0.55), rgba(8, 8, 15, 0.78)),
          url("/wallpaper"),
          radial-gradient(65% 60% at 97% 52%, rgba(139, 92, 246, 0.35), transparent 72%),
          radial-gradient(50% 58% at 106% 82%, rgba(249, 115, 22, 0.32), transparent 70%),
          radial-gradient(40% 45% at 103% 30%, rgba(236, 72, 153, 0.22), transparent 72%),
          radial-gradient(70% 62% at -6% 100%, rgba(249, 115, 22, 0.45), transparent 68%);
        background-size: cover, cover, auto, auto, auto, auto;
        background-position: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .carte {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        animation: apparition 0.45s ease-out;
      }
      .mascotte {
        width: 110px;
        height: 110px;
        object-fit: contain;
        /* Halo doux derrière la mascotte (fond transparent du PNG). */
        filter: drop-shadow(0 0 18px rgba(139, 92, 246, 0.45));
      }
      .salutation {
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
      }
      .salutation .nom {
        background: linear-gradient(135deg, #f97316, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sous-titre {
        font-size: 0.78rem;
        color: #b8bccf;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      }
      /* Spinner : trois points façon « chargement » Discord. */
      .points { display: flex; gap: 7px; margin-top: 6px; }
      .points span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f97316, #8b5cf6);
        animation: pulsation 1.1s ease-in-out infinite;
      }
      .points span:nth-child(2) { animation-delay: 0.18s; }
      .points span:nth-child(3) { animation-delay: 0.36s; }
      @keyframes pulsation {
        0%, 100% { transform: scale(0.7); opacity: 0.35; }
        50% { transform: scale(1); opacity: 1; }
      }
      @keyframes apparition {
        from { opacity: 0; transform: translateY(8px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="carte">
      <img class="mascotte" src="/mascotte" alt="" />
      <div class="salutation">__GREETING__ <span class="nom">__USER__</span></div>
      <div class="sous-titre">StreamOS</div>
      <div class="points" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </body>
</html>
