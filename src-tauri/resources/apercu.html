<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aperçu — StreamOS</title>
    <style>
      /* Fond en dur — NE PAS dépendre de theme-sos.css (non chargé ici). */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #statut {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8a8a8f;
        font: 13px system-ui, "Segoe UI", sans-serif;
        text-align: center;
        padding: 1rem;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="ecran"></canvas>
    <div id="statut">En attente du moteur…</div>
    <script>
      // Projecteur natif : affiche l'aperçu réduit du moteur Rust via poll
      // IPC — la commande `moteur_apercu` démarre la session si rien ne
      // tourne (fenêtre ouverte = demande) et renvoie le dernier buffer
      // `[w u32 LE][h u32 LE][pts_us i64 LE][RGBA]` (vide = pas encore de
      // frame). Cadence et résolution : réglages `apercu` de moteur.json,
      // lus via `moteur_apercu_config` pour aligner le poll.
      var TAURI = window.__TAURI__;
      var ecran = document.getElementById("ecran");
      var ctx = ecran.getContext("2d");
      var statut = document.getElementById("statut");
      // Canvas source à la taille exacte de la frame aperçu — dessiné
      // letterboxé dans la fenêtre.
      var src = document.createElement("canvas");
      var sctx = src.getContext("2d");
      var dernierPts = -1;

      window.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      // Letterbox : l'aperçu est dessiné au ratio du canvas moteur, centré,
      // sur fond noir — la fenêtre est librement redimensionnable.
      function dessiner() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, ecran.width, ecran.height);
        if (src.width === 0 || src.height === 0) return;
        var s = Math.min(ecran.width / src.width, ecran.height / src.height);
        var w = Math.round(src.width * s);
        var h = Math.round(src.height * s);
        ctx.drawImage(src, (ecran.width - w) / 2, (ecran.height - h) / 2, w, h);
      }

      function ajuster() {
        var w = ecran.clientWidth;
        var h = ecran.clientHeight;
        if (w > 0 && h > 0 && (ecran.width !== w || ecran.height !== h)) {
          ecran.width = w;
          ecran.height = h;
          dessiner();
        }
      }
      window.addEventListener("resize", ajuster);

      async function tick() {
        try {
          var buf = await TAURI.core.invoke("moteur_apercu");
          if (!buf || buf.byteLength < 16) {
            statut.textContent = "En attente du moteur…";
            return;
          }
          var dv = new DataView(buf);
          var w = dv.getUint32(0, true);
          var h = dv.getUint32(4, true);
          var pts = dv.getBigInt64(8, true);
          if (w === 0 || h === 0 || buf.byteLength !== 16 + w * h * 4) return;
          // Frame déjà affichée (poll plus rapide que l'émission, ou scène
          // figée) : rien à renvoyer au canvas.
          if (pts === dernierPts && src.width === w && src.height === h) return;
          dernierPts = pts;
          // RGBA8 direct — le moteur fait déjà le swap (ex-BGRA) en Rust.
          var px = new Uint8ClampedArray(buf, 16);
          if (src.width !== w || src.height !== h) {
            src.width = w;
            src.height = h;
          }
          sctx.putImageData(new ImageData(px, w, h), 0, 0);
          dessiner();
          statut.textContent = "";
        } catch (e) {
          // Erreur de commande (moteur en panne, mode OBS…) : affichée,
          // le poll continue — une reprise du moteur la fait disparaître.
          statut.textContent = String(e);
        }
      }

      // Le poll épouse la cadence d'émission réglée (10/15/30 fps) —
      // défaut 30 ; la dedupe par pts absorbe les frames répétées.
      function demarrer(intervalleMs) {
        ajuster();
        tick();
        setInterval(tick, intervalleMs);
      }

      ajuster();
      TAURI.core.invoke("moteur_apercu_config")
        .then(function (cfg) {
          var fps = cfg && cfg.fps >= 1 && cfg.fps <= 60 ? cfg.fps : 30;
          demarrer(Math.ceil(1000 / fps));
        })
        .catch(function () { demarrer(100); });
    </script>
  </body>
</html>
