<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat pop-out</title>
    <style>
      /* Fond en dur — NE PAS dépendre de theme-sos.css (non chargé ici). */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: #0e0e10;
        color: #efeff1;
        font-family: system-ui, "Segoe UI Emoji", "Apple Color Emoji",
          "Noto Color Emoji", sans-serif;
        overflow: hidden;
        /* Sélection de texte désactivée (parité dashboard — aucun champ
           de saisie dans cette fenêtre, exemption inutile). */
        -webkit-user-select: none;
        user-select: none;
      }
      /* Chat body : même style que diffusion.html (bulles + zébrage). */
      .chat-body {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-wrap: break-word;
        word-break: break-word;
        padding: 0.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        font-family: system-ui, "Segoe UI Emoji", "Apple Color Emoji",
          "Noto Color Emoji", sans-serif;
      }
      .chat-msg {
        display: flex;
        align-items: baseline;
        gap: 0.25rem;
        padding: 0.2rem 0.3rem;
        border-radius: 0.3rem;
        line-height: 1.25;
      }
      .chat-msg.pair {
        background: rgba(255, 255, 255, 0.05);
      }
      .chat-msg .avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        flex-shrink: 0;
        align-self: center;
        object-fit: cover;
      }
      .chat-msg .badge {
        font-size: 0.6em;
        padding: 0 0.25rem;
        border-radius: 0.2rem;
        margin-right: 0.1rem;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
        align-self: center;
        line-height: 1.4;
      }
      .chat-msg .badge.mod { background: #00ad03; }
      .chat-msg .badge.vip { background: #e005b9; }
      .chat-msg .badge.sub { background: #6b35c9; }
      .chat-msg .badge.broadcaster { background: #9146ff; }
      .chat-msg .logo {
        flex-shrink: 0;
        align-self: center;
        opacity: 0.85;
      }
      .chat-msg .plat-badge {
        flex-shrink: 0;
        align-self: center;
        font-size: 0.55em;
        font-weight: 700;
        padding: 0 0.2rem;
        border-radius: 0.15rem;
        color: #fff;
        line-height: 1.4;
        margin-right: 0.1rem;
      }
      .chat-msg .plat-badge.twitch { background: #9146ff; }
      .chat-msg .plat-badge.kick { background: #53fc18; color: #000; }
      .chat-msg .plat-badge.youtube { background: #ff0000; }
      .chat-msg .plat-badge.tiktok { background: #000; }
      .chat-msg .pseudo {
        font-weight: 600;
        flex-shrink: 0;
      }
      .chat-msg .texte {
        flex: 1;
        min-width: 0;
      }
      /* Emote inline dans le texte (officielles Twitch + BTTV/7TV/FFZ).
         Hauteur 1.5em = convention chat Twitch (~taille ligne). width:auto
         préserve le ratio des emotes larges. */
      .chat-msg .emote {
        width: auto;
        height: 1.5em;
        vertical-align: middle;
        margin: -0.1em 0.1em;
      }
      /* Mode « bulles » (parité diffusion.html : ≥1 widget chat de la scène
         en chatStyle "bulles") — messages détachés, zébrage off, vrai cadre
         SVG par message via .cadre-overlay (position:relative requis). */
      .chat-body.bulles { gap: 0.45rem; }
      .chat-body.bulles .chat-msg { position: relative; }
      .cadre-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
    </style>
  </head>
  <body style="background:#0e0e10;color:#efeff1;margin:0">
    <div class="chat-body" id="chatBody"></div>
    <script>
      // Pop-out chat : WS :4321 en dur, bulles seulement (pas de scène, pas d'OBS).
      // Même rendu que diffusion.html (avatar + badges + logo + pseudo + texte).

      // Neutralise le menu contextuel natif de la webview (parité dashboard
      // — voir src/main.ts).
      window.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      var chatMessages = [];
      var MAX_CHAT = 200;
      var chatBody = document.getElementById("chatBody");

      var TWITCH_LOGO_SVG = '<svg class="logo" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">'
        + '<path fill="currentColor" d="M3 1L1.5 3.5V13H4.5V15H6L8 13H10.5L13.5 10V1H3ZM12 9.5L10 11.5H7L5 13.5V11.5H3V2H12V9.5Z"/>'
        + '<rect x="9" y="4" width="1" height="3"/><rect x="6" y="4" width="1" height="3"/></svg>';

      var KICK_LOGO_SVG = '<svg class="logo" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">'
        + '<path fill="#53fc18" d="M5 2h4v6h2V6h2V4h2V2h4v6h-2v2h-2v4h2v2h2v6h-4v-2h-2v-2h-2v4H5z"/></svg>';

      function logoPlateforme(p) {
        if (p === "twitch") return TWITCH_LOGO_SVG;
        if (p === "kick") return KICK_LOGO_SVG;
        if (p === "youtube") return '<span class="plat-badge youtube">YT</span>';
        if (p === "tiktok") return '<span class="plat-badge tiktok">TT</span>';
        return "";
      }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function parseBadges(raw) {
        if (!raw) return [];
        var out = [];
        var parts = raw.split(",");
        for (var i = 0; i < parts.length; i++) {
          var name = parts[i].split("/")[0];
          if (name === "moderator") out.push("mod");
          else if (name === "vip") out.push("vip");
          else if (name === "subscriber") out.push("sub");
          else if (name === "broadcaster") out.push("broadcaster");
        }
        return out;
      }

      function renderBadges(badgesRaw) {
        var ids = parseBadges(badgesRaw);
        var html = "";
        for (var i = 0; i < ids.length; i++) {
          html += '<span class="badge ' + ids[i] + '">' + ids[i] + '</span>';
        }
        return html;
      }

      function fillChatBody() {
        chatBody.innerHTML = "";
        for (var i = 0; i < chatMessages.length; i++) {
          var m = chatMessages[i];
          var div = document.createElement("div");
          // Zébrage pair seulement en mode compact — en bulles, chaque
          // message est une carte autonome au fond uniforme.
          div.className = "chat-msg" + (!chatBulles && i % 2 === 0 ? " pair" : "");
          var logo = logoPlateforme(m.plateforme);
          var avatar = m.avatar
            ? '<img class="avatar" src="' + escapeHtml(m.avatar) + '" width="24" height="24" alt="" referrerpolicy="no-referrer">'
            : "";
          var badges = renderBadges(m.badges);
          div.innerHTML = avatar
            + badges
            + logo
            + '<span class="pseudo">' + escapeHtml(m.pseudo) + "</span>"
            + '<span class="texte">' + renderTexte(m) + "</span>";
          chatBody.appendChild(div);
        }
        // Cadre SVG réel par bulle : mesures en lecture seule puis
        // écritures (évite un reflow synchrone par message).
        if (chatBulles && sceneCadre) {
          var kids = chatBody.children;
          var dims = [];
          for (var k = 0; k < kids.length; k++) {
            dims.push([kids[k].offsetWidth, kids[k].offsetHeight]);
          }
          for (k = 0; k < kids.length; k++) {
            decorerCadreMsg(kids[k], sceneCadre, dims[k][0], dims[k][1]);
          }
        }
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      // Remplace les emotes par des <img> aux positions fournies par Rust
      // (m.emotes : offsets UTF-16, fin EXCLUSIVE — unités de String.slice).
      // Texte entre segments échappé (XSS-safe). URL contrainte à https:// :
      // jamais d'URL chatter. Identique à renderTexte de diffusion.html.
      function renderTexte(m) {
        if (!m.emotes || m.emotes.length === 0) return escapeHtml(m.texte);
        var html = "";
        var pos = 0;
        var n = m.texte.length;
        for (var i = 0; i < m.emotes.length; i++) {
          var e = m.emotes[i];
          // Segment invalide/chevauchant → ignoré (défense, Rust trie déjà).
          if (e.debut < pos || e.debut >= e.fin || e.fin > n) continue;
          html += escapeHtml(m.texte.slice(pos, e.debut));
          if (typeof e.url === "string" && e.url.indexOf("https://") === 0) {
            html += '<img class="emote" src="' + escapeHtml(e.url) + '"'
              + ' alt="' + escapeHtml(e.nom) + '"'
              + ' title="' + escapeHtml(e.nom) + '"'
              + ' referrerpolicy="no-referrer">';
          } else {
            html += escapeHtml(m.texte.slice(e.debut, e.fin));
          }
          pos = e.fin;
        }
        html += escapeHtml(m.texte.slice(pos));
        return html;
      }

      // ===== Cadres SVG — port de diffusion.html (parité mode « bulles ») =====
      // Bloc dupliqué volontairement : pas de module JS partagé entre les
      // pages statiques (même convention que renderTexte/parseBadges).
      // Toute évolution des cadres doit être reportée ici.

      function clampStrokeWidth(sw) {
        var n = Number(sw);
        return Number.isFinite(n) ? Math.max(1, Math.min(20, n)) : 4;
      }
      function bpmHexValide(h) {
        return /^#[0-9a-f]{6}$/i.test(String(h || ""));
      }
      function bpmAssombrir(hex, ratio) {
        var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ""));
        if (!m) return "#0a0a0a";
        var r = Math.min(1, Math.max(0, Number(ratio) || 0));
        var n = parseInt(m[1], 16);
        var rr = Math.round(((n >> 16) & 0xff) * (1 - r));
        var gg = Math.round(((n >> 8) & 0xff) * (1 - r));
        var bb = Math.round((n & 0xff) * (1 - r));
        function pad(v) { return v.toString(16).padStart(2, "0"); }
        return "#" + pad(rr) + pad(gg) + pad(bb);
      }
      function bpmEclaircir(hex, ratio) {
        var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ""));
        if (!m) return "#f5f5f5";
        var r = Math.min(1, Math.max(0, Number(ratio) || 0));
        var n = parseInt(m[1], 16);
        var rr = Math.round(((n >> 16) & 0xff) + (255 - ((n >> 16) & 0xff)) * r);
        var gg = Math.round(((n >> 8) & 0xff) + (255 - ((n >> 8) & 0xff)) * r);
        var bb = Math.round((n & 0xff) + (255 - (n & 0xff)) * r);
        function pad(v) { return v.toString(16).padStart(2, "0"); }
        return "#" + pad(rr) + pad(gg) + pad(bb);
      }
      function mgAngleToCoords(angle) {
        var rad = angle * Math.PI / 180;
        var dx = Math.cos(rad), dy = Math.sin(rad);
        var scale = 50 / Math.max(Math.abs(dx), Math.abs(dy), 0.001);
        return {
          x1: Math.round(50 - dx * scale), y1: Math.round(50 - dy * scale),
          x2: Math.round(50 + dx * scale), y2: Math.round(50 + dy * scale)
        };
      }

      function renderCadreInline(style, W, H, couleur, couleurFin, strokeWidth, idCadre, gradientAngle, animer) {
        var c = /^#[0-9a-f]{6}$/i.test(couleur || "") ? couleur : "#ffffff";
        var cFin = /^#[0-9a-f]{6}$/i.test(couleurFin || "") ? couleurFin : c;
        var ep = clampStrokeWidth(strokeWidth);
        var offset = ep / 2;
        var rx = style === "arrondis" ? 8 : 0;
        var angle = isFinite(gradientAngle) ? gradientAngle : 135;
        var rad = angle * Math.PI / 180;
        var dx = Math.cos(rad), dy = Math.sin(rad);
        var scale = 50 / Math.max(Math.abs(dx), Math.abs(dy), 0.001);
        var gx1 = Math.round(50 - dx * scale), gy1 = Math.round(50 - dy * scale);
        var gx2 = Math.round(50 + dx * scale), gy2 = Math.round(50 + dy * scale);
        var gradId = "grad-cadre-" + (idCadre || "d").replace(/[^a-zA-Z0-9_-]/g, "-") + "-" + style;
        // Comète (animer) : segment balayant le tracé du bord — recette
        // thin-line (pathLength=100 + dashoffset SMIL). SUR le bord : la
        // marge est rognée par overflow:hidden/clip-path du parent.
        var rectPath = rx > 0
          ? "M " + rx + " 0 L " + (W - rx) + " 0 Q " + W + " 0 " + W + " " + rx + " L " + W + " " + (H - rx) + " Q " + W + " " + H + " " + (W - rx) + " " + H + " L " + rx + " " + H + " Q 0 " + H + " 0 " + (H - rx) + " L 0 " + rx + " Q 0 0 " + rx + " 0 Z"
          : "M 0 0 L " + W + " 0 L " + W + " " + H + " L 0 " + H + " Z";
        var comet = animer
          ? '<path d="' + rectPath + '" fill="none" stroke="' + cFin + '" stroke-width="' + Math.max(1.2, ep * 0.7) + '" stroke-linecap="round" pathLength="100" stroke-dasharray="7 93" stroke-dashoffset="0">'
            + '<animate attributeName="stroke-dashoffset" from="0" to="-100" dur="4s" repeatCount="indefinite"/></path>'
          : "";
        return '<svg width="' + (W + offset * 2) + '" height="' + (H + offset * 2) + '" viewBox="-' + offset + ' -' + offset + ' ' + (W + offset * 2) + ' ' + (H + offset * 2) + '" preserveAspectRatio="none" style="position:absolute;top:-' + offset + 'px;left:-' + offset + 'px;pointer-events:none;z-index:5;">'
          + '<defs><linearGradient id="' + gradId + '" x1="' + gx1 + '%" y1="' + gy1 + '%" x2="' + gx2 + '%" y2="' + gy2 + '%">'
          + '<stop offset="0%" stop-color="' + c + '" stop-opacity="1"/>'
          + '<stop offset="100%" stop-color="' + cFin + '" stop-opacity="1"/>'
          + '</linearGradient></defs>'
          + '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="' + rx + '" ry="' + rx + '" fill="none" stroke="url(#' + gradId + ')" stroke-width="' + ep + '"/>'
          + comet
          + '</svg>';
      }

      function getCyberpunkBevelSize(sw) {
        return Math.max(8, Math.round(clampStrokeWidth(sw) * 3.5));
      }
      function getCyberpunkClipPath(W, H, sw) {
        var s = Math.min(getCyberpunkBevelSize(sw), W / 4, H / 4);
        return "path('M " + s + " 0 L " + (W - s) + " 0 L " + W + " " + s + " L " + W + " " + (H - s) + " L " + (W - s) + " " + H + " L " + s + " " + H + " L 0 " + (H - s) + " L 0 " + s + " Z')";
      }
      function renderCyberpunk(W, H, idCadre, strokeWidth, couleur, couleurFin, gradientAngle, animer) {
        var c1 = bpmHexValide(couleur) ? couleur : "#ffffff";
        var c2 = bpmHexValide(couleurFin) ? couleurFin : bpmAssombrir(c1, 0.35);
        var c3 = "#ffffff";
        var gc = mgAngleToCoords(isFinite(gradientAngle) ? gradientAngle : 135);
        var ep = clampStrokeWidth(strokeWidth);
        var offset = ep / 2;
        var bevel = getCyberpunkBevelSize(ep);
        var margin = Math.max(6, ep * 1.4);
        var svgW = W + offset * 2 + margin * 2;
        var svgH = H + offset * 2 + margin * 2;
        var viewX = -(offset + margin);
        var viewY = -(offset + margin);
        var uid = (idCadre || "d").replace(/[^a-zA-Z0-9_-]/g, "-");
        var gradId = "grad-cyberpunk-" + uid;
        var gradInnerId = "grad-inner-" + uid;
        var clipPathId = "clip-cyberpunk-" + uid;
        var pathBorder = "M " + bevel + " 0 L " + (W - bevel) + " 0 L " + W + " " + bevel + " L " + W + " " + (H - bevel) + " L " + (W - bevel) + " " + H + " L " + bevel + " " + H + " L 0 " + (H - bevel) + " L 0 " + bevel + " Z";
        var d = Math.max(2, ep * 0.8);
        var b = Math.min(bevel * 1.6, W / 5, H / 5);
        var traitFin = Math.max(0.8, ep * 0.22);
        function bracketCoin(cx, cy, sx, sy) {
          var X = function (x) { return cx + x * sx; };
          var Y = function (y) { return cy + y * sy; };
          var plaque = "M " + X(b + d) + " " + Y(-d) + " L " + X(bevel * 0.55) + " " + Y(-d) + " L " + X(-d) + " " + Y(bevel * 0.55) + " L " + X(-d) + " " + Y(b + d) + " L " + X(-d * 2.2) + " " + Y(b + d) + " L " + X(-d * 2.2) + " " + Y(bevel * 0.35) + " L " + X(bevel * 0.35) + " " + Y(-d * 2.2) + " L " + X(b + d) + " " + Y(-d * 2.2) + " Z";
          var chevron = "M " + X(bevel * 0.9) + " " + Y(-d * 3.4) + " L " + X(bevel * 0.28) + " " + Y(-d * 3.4) + " L " + X(-d * 3.4) + " " + Y(bevel * 0.28) + " L " + X(-d * 3.4) + " " + Y(bevel * 0.9);
          var chevron2 = "M " + X(bevel * 0.62) + " " + Y(-d * 4.6) + " L " + X(bevel * 0.34) + " " + Y(-d * 4.6) + " L " + X(-d * 4.6) + " " + Y(bevel * 0.34) + " L " + X(-d * 4.6) + " " + Y(bevel * 0.62);
          var dx = X(bevel * 0.62), dy = Y(bevel * 0.62);
          var dr = Math.max(1.4, ep * 0.4);
          return "<g>" +
            '<path d="' + plaque + '" fill="' + c2 + '" fill-opacity="0.28" stroke="' + c1 + '" stroke-width="' + traitFin + '" stroke-linejoin="miter"/>' +
            '<path d="' + chevron + '" fill="none" stroke="' + c2 + '" stroke-width="' + traitFin + '" opacity="0.85"/>' +
            '<path d="' + chevron2 + '" fill="none" stroke="' + c2 + '" stroke-width="' + traitFin + '" opacity="0.4"/>' +
            '<circle cx="' + dx + '" cy="' + dy + '" r="' + dr + '" fill="' + c3 + '" stroke="' + c1 + '" stroke-width="' + Math.max(0.6, ep * 0.12) + '"/>' +
            "</g>";
        }
        var brackets = bracketCoin(0, 0, 1, 1) + bracketCoin(W, 0, -1, 1) + bracketCoin(W, H, -1, -1) + bracketCoin(0, H, 1, -1);
        var co = Math.max(2, ep);
        var pr = Math.max(1, ep * 0.28);
        var midX = W / 2, midY = H / 2;
        var segH = Math.min(bevel * 1.4, W / 8);
        var segV = Math.min(bevel * 1.4, H / 8);
        var circuits = [
          '<path d="M ' + (midX - segH * 2.2) + " " + -co + " L " + (midX - segH * 0.4) + " " + -co + '" stroke="' + c1 + '" stroke-width="' + traitFin + '" opacity="0.8"/>',
          '<circle cx="' + (midX - segH * 2.2) + '" cy="' + -co + '" r="' + pr + '" fill="' + c1 + '"/>',
          '<path d="M ' + (midX + segH * 0.4) + " " + -co + " L " + (midX + segH * 2.2) + " " + -co + '" stroke="' + c1 + '" stroke-width="' + traitFin + '" opacity="0.8"/>',
          '<circle cx="' + (midX + segH * 2.2) + '" cy="' + -co + '" r="' + pr + '" fill="' + c1 + '"/>',
          '<path d="M ' + (midX - segH * 2.2) + " " + (H + co) + " L " + (midX - segH * 0.4) + " " + (H + co) + '" stroke="' + c2 + '" stroke-width="' + traitFin + '" opacity="0.8"/>',
          '<circle cx="' + (midX - segH * 2.2) + '" cy="' + (H + co) + '" r="' + pr + '" fill="' + c2 + '"/>',
          '<path d="M ' + (midX + segH * 0.4) + " " + (H + co) + " L " + (midX + segH * 2.2) + " " + (H + co) + '" stroke="' + c2 + '" stroke-width="' + traitFin + '" opacity="0.8"/>',
          '<circle cx="' + (midX + segH * 2.2) + '" cy="' + (H + co) + '" r="' + pr + '" fill="' + c2 + '"/>',
          '<path d="M ' + -co + " " + (midY - segV) + " L " + -co + " " + (midY + segV) + '" stroke="' + c2 + '" stroke-width="' + traitFin + '" opacity="0.8"/>',
          '<circle cx="' + -co + '" cy="' + (midY + segV) + '" r="' + pr + '" fill="' + c2 + '"/>',
          '<path d="M ' + (W + co) + " " + (midY - segV) + " L " + (W + co) + " " + (midY + segV) + '" stroke="' + c1 + '" stroke-width="' + traitFin + '" opacity="0.8"/>',
          '<circle cx="' + (W + co) + '" cy="' + (midY - segV) + '" r="' + pr + '" fill="' + c1 + '"/>'
        ].join("\n    ");
        // Code-barres (marge haut-droite) : micro-data signature cyberpunk.
        var barH = Math.max(4, ep * 1.1);
        var barY = -margin * 0.55 - barH / 2;
        var barUnit = Math.max(0.8, ep * 0.28);
        var barX0 = W - bevel * 0.2 - barUnit * 26;
        var barPattern = [1, 1, 0.5, 2, 0.5, 1, 3, 1, 0.5, 0.5, 2, 1];
        var bx = barX0;
        var barcode = "";
        for (var bi = 0; bi < barPattern.length; bi++) {
          var bw = barPattern[bi] * barUnit;
          barcode += '<rect x="' + bx + '" y="' + barY + '" width="' + bw + '" height="' + barH + '" fill="' + (bi % 3 === 0 ? c1 : c2) + '" opacity="0.85"/>';
          bx += bw + barUnit;
        }
        // Runner lumineux (UN groupe, UN animateMotion le long du bord) —
        // émis seulement si animer (toggle « Animer » de la modale).
        var dotR = Math.max(1.8, ep * 0.55);
        var runner = animer
          ? '<g opacity="0.95"><animateMotion dur="5s" repeatCount="indefinite" path="' + pathBorder + '"/>'
            + '<circle r="' + (dotR * 2.6) + '" fill="' + c1 + '" opacity="0.35"/><circle r="' + dotR + '" fill="' + c3 + '"/></g>'
          : "";
        return '<svg width="' + svgW + '" height="' + svgH + '" viewBox="' + viewX + " " + viewY + " " + svgW + " " + svgH + '" preserveAspectRatio="none" style="position:absolute;top:-' + (offset + margin) + "px;left:-" + (offset + margin) + 'px;pointer-events:none;z-index:5;">'
          + "<defs>"
          + '<clipPath id="' + clipPathId + '"><path d="' + pathBorder + '"/></clipPath>'
          + '<linearGradient id="' + gradId + '" x1="' + gc.x1 + '%" y1="' + gc.y1 + '%" x2="' + gc.x2 + '%" y2="' + gc.y2 + '%"><stop offset="0%" stop-color="' + c1 + '"/><stop offset="50%" stop-color="' + c2 + '"/><stop offset="100%" stop-color="' + c1 + '"/></linearGradient>'

        }).join("");
        // Nœud voyageur : UN groupe animé le long du bord (path= direct,
        // pas de mpath — support universel).
        var voyageur = animer
          ? "<g><animateMotion dur=\"6s\" repeatCount=\"indefinite\" path=\"" + borderPath + "\"/>"
            + '<circle r="' + Math.max(2.2, ep * 0.5) + '" fill="' + p.clair + '" opacity="0.4"/>'
            + '<circle r="' + Math.max(1.4, ep * 0.32) + '" fill="#ffffff"/></g>'
          : "";
        return '<svg width="' + svgW + '" height="' + svgH + '" viewBox="-' + margin + " -" + margin + " " + svgW + " " + svgH + '" preserveAspectRatio="none" style="position:absolute;top:-' + margin + "px;left:-" + margin + 'px;pointer-events:none;z-index:5;">'
          + "<defs>"
          + '<linearGradient id="' + gradId + '" x1="' + gc.x1 + '%" y1="' + gc.y1 + '%" x2="' + gc.x2 + '%" y2="' + gc.y2 + '%"><stop offset="0%" stop-color="' + p.principal + '"/><stop offset="100%" stop-color="' + p.profond + '"/></linearGradient>'
          + '<clipPath id="' + clipId + '"><path d="' + borderPath + '"/></clipPath>'
          + "</defs>"
          + '<g clip-path="url(#' + clipId + ')">'
          + '<path d="' + borderPath + '" fill="none" stroke="' + p.principal + '" stroke-width="' + (ep * 2.2) + '" stroke-linejoin="miter" opacity="0.2"/>'
          + '<path d="' + borderPath + '" fill="none" stroke="url(#' + gradId + ')" stroke-width="' + ep + '" stroke-linejoin="miter"/>'
          + '<path d="' + borderPath + '" fill="none" stroke="' + p.clair + '" stroke-width="' + Math.max(1, ep * 0.3) + '" stroke-linejoin="miter" opacity="0.6"/>'
          + "</g>"
          + cornerHexes + glyphes
          + '<g opacity="0.85">' + noeuds + "</g>"
          + voyageur
          + '<path d="' + borderPath + '" fill="none" stroke="' + p.clair + '" stroke-width="' + Math.max(1, ep * 0.2) + '" stroke-linejoin="miter" opacity="0.4" transform="translate(' + (ep * 0.6) + " " + (ep * 0.6) + ") scale(" + Math.max(0.01, 1 - (ep * 1.2) / W) + " " + Math.max(0.01, 1 - (ep * 1.2) / H) + ')"/>'
          + "</svg>";
      }

      function getMGStyleClipSize(sw) {
        return Math.max(10, Math.round(clampStrokeWidth(sw) * 3));
      }
      function getMGStyleClipPath(W, H, sw) {
        var s = Math.min(getMGStyleClipSize(sw), W / 4, H / 4);
        var sx = s, sy = s * 0.7;
        return "path('M " + sx + " 0 L " + (W - sx) + " 0 L " + W + " " + sy + " L " + W + " " + (H - sy) + " L " + (W - sx) + " " + H + " L " + sx + " " + H + " L 0 " + (H - sy) + " L 0 " + sy + " Z')";
      }
      function renderMGStyle(W, H, idCadre, strokeWidth, couleur, couleurFin, gradientAngle, animer) {
        var cPrincipal = (couleur && /^#[0-9a-f]{6}$/i.test(couleur)) ? couleur : "#ffffff";
        var cAccent = (couleurFin && /^#[0-9a-f]{6}$/i.test(couleurFin)) ? couleurFin : "#000000";
        var angle = isFinite(gradientAngle) ? gradientAngle : 135;
        var gc = mgAngleToCoords(angle);
        var ep = clampStrokeWidth(strokeWidth);
        var offset = ep / 2;
        var s = Math.min(getMGStyleClipSize(ep), W / 4, H / 4);
        var sx = s, sy = s * 0.7;
        var margin = Math.max(10, ep * 2.5);
        var svgW = W + offset * 2 + margin * 2, svgH = H + offset * 2 + margin * 2;
        var viewX = -(offset + margin), viewY = -(offset + margin);
        var uid = (idCadre || "d").replace(/[^a-zA-Z0-9_-]/g, "-");
        var gradId = "grad-mg-" + uid, clipId = "clip-mg-" + uid, stripeId = "stripe-mg-" + uid;
        var x0 = 0, y0 = 0, x1 = W, y1 = H, midX = W / 2, midY = H / 2;
        var borderPath = ["M " + (x0 + sx) + " " + y0, "L " + (x1 - sx) + " " + y0, "L " + x1 + " " + (y0 + sy), "L " + x1 + " " + (y1 - sy), "L " + (x1 - sx) + " " + y1, "L " + (x0 + sx) + " " + y1, "L " + x0 + " " + (y1 - sy), "L " + x0 + " " + (y0 + sy), "Z"].join(" ");
        var stripeSize = Math.max(5, ep * 1.5);
        var cornerTriangles = [
          "M " + x0 + " " + y0 + " L " + (x0 + sx) + " " + y0 + " L " + x0 + " " + (y0 + sy) + " Z",
          "M " + x1 + " " + y0 + " L " + (x1 - sx) + " " + y0 + " L " + x1 + " " + (y0 + sy) + " Z",
          "M " + x1 + " " + y1 + " L " + (x1 - sx) + " " + y1 + " L " + x1 + " " + (y1 - sy) + " Z",
          "M " + x0 + " " + y1 + " L " + (x0 + sx) + " " + y1 + " L " + x0 + " " + (y1 - sy) + " Z"
        ].map(function (d) { return '<path d="' + d + '" fill="url(#' + stripeId + ')" opacity="0.85"/>'; }).join("\n    ");
        var bracketLen = Math.max(14, ep * 4), bracketGap = Math.max(4, ep * 1.2), traitFin = Math.max(1, ep * 0.45);
        function bracketCoin(cx, cy, dx, dy) {
          var X = function (x) { return cx + x * dx; };
          var Y = function (y) { return cy + y * dy; };
          return "M " + X(-bracketGap) + " " + Y(bracketLen) + " L " + X(-bracketGap) + " " + Y(-bracketGap) + " L " + X(bracketLen) + " " + Y(-bracketGap);
        }
        var brackets = [bracketCoin(x0, y0, 1, 1), bracketCoin(x1, y0, -1, 1), bracketCoin(x1, y1, -1, -1), bracketCoin(x0, y1, 1, -1)]
          .map(function (d) { return '<path d="' + d + '" fill="none" stroke="' + cAccent + '" stroke-width="' + traitFin + '" stroke-linecap="square"/>'; }).join("");
        var angleMarkR = Math.max(4, ep * 1.2);
        var angleMarks = [
          { cx: x0 + sx, cy: y0, rot: 0 }, { cx: x1 - sx, cy: y0, rot: 90 },
          { cx: x1 - sx, cy: y1, rot: 180 }, { cx: x0 + sx, cy: y1, rot: 270 }
        ].map(function (m) {
          var rad = (m.rot + 90) * Math.PI / 180;
          var ex = m.cx + angleMarkR * Math.cos(rad), ey = m.cy + angleMarkR * Math.sin(rad);
          return '<path d="M ' + (m.cx + angleMarkR) + ' ' + m.cy + ' A ' + angleMarkR + ' ' + angleMarkR + ' 0 0 1 ' + ex + ' ' + ey + '" fill="none" stroke="' + cAccent + '" stroke-width="' + traitFin + '" opacity="0.6"/>';
        }).join("");
        var circuitStroke = Math.max(0.8, ep * 0.3), circuitPad = Math.max(6, ep * 1.8);
        var circuits = [
          "M " + (-circuitPad) + " " + (sy + 20) + " L " + (-circuitPad) + " " + (midY - 30) + " L " + (-circuitPad + 8) + " " + (midY - 22) + " L " + (-circuitPad + 8) + " " + (midY + 22) + " L " + (-circuitPad) + " " + (midY + 30) + " L " + (-circuitPad) + " " + (H - sy - 20),
          "M " + (W + circuitPad) + " " + (sy + 20) + " L " + (W + circuitPad) + " " + (midY - 30) + " L " + (W + circuitPad - 8) + " " + (midY - 22) + " L " + (W + circuitPad - 8) + " " + (midY + 22) + " L " + (W + circuitPad) + " " + (midY + 30) + " L " + (W + circuitPad) + " " + (H - sy - 20)
        ].map(function (d) { return '<path d="' + d + '" fill="none" stroke="' + cAccent + '" stroke-width="' + circuitStroke + '" opacity="0.35" stroke-linejoin="miter"/>'; }).join("\n    ");
        var circuitNodes = [
          { x: -circuitPad, y: sy + 20 }, { x: -circuitPad, y: H - sy - 20 },
          { x: W + circuitPad, y: sy + 20 }, { x: W + circuitPad, y: H - sy - 20 },
          { x: -circuitPad + 8, y: midY - 22 }, { x: -circuitPad + 8, y: midY + 22 },
          { x: W + circuitPad - 8, y: midY - 22 }, { x: W + circuitPad - 8, y: midY + 22 }
        ].map(function (n) { return '<circle cx="' + n.x + '" cy="' + n.y + '" r="' + Math.max(1.5, ep * 0.35) + '" fill="' + cAccent + '" opacity="0.5"/>'; }).join("");
        var diodeR = Math.max(2.5, ep * 0.6), diodeX = midX, diodeY = -margin * 0.4;
        // animer → balayage radar : segment accentué sur le tracé du bord
        // (dashoffset SMIL sur pathLength=100 — recette thin-line). SUR le
        // bord : la marge est rognée par overflow:hidden/clip-path du
        // parent → visible sur widgets ET bord du canvas.
        var sweep = animer
          ? '<path d="' + borderPath + '" fill="none" stroke="' + cAccent + '" stroke-width="' + Math.max(1.2, ep * 0.55) + '" stroke-linecap="round" pathLength="100" stroke-dasharray="8 92" stroke-dashoffset="0">'
            + '<animate attributeName="stroke-dashoffset" from="0" to="-100" dur="4.5s" repeatCount="indefinite"/></path>'
          : "";
        var bangW = Math.max(2, ep * 0.55), bangH = Math.max(12, ep * 3.5), bangX = W + margin * 0.3, bangY = -margin * 0.25;
        var tickCount = 9, tickW = Math.max(1, ep * 0.25), tickH = Math.max(3, ep * 0.8), tickStart = sx + 4, tickEnd = W - sx - 4;
        var ticks = [];
        for (var ti = 0; ti < tickCount; ti++) {
          var tt = tickCount > 1 ? ti / (tickCount - 1) : 0.5;
          var tx = tickStart + tt * (tickEnd - tickStart);
          var isMajor = ti === Math.floor(tickCount / 2);
          var isMid = ti % 2 === 0;
          var th = isMajor ? tickH * 1.8 : isMid ? tickH * 1.2 : tickH;
          ticks.push('<rect x="' + (tx - tickW / 2) + '" y="' + (H + ep * 0.3) + '" width="' + tickW + '" height="' + th + '" fill="' + cAccent + '" opacity="' + (isMajor ? 0.9 : isMid ? 0.6 : 0.35) + '"/>');
        }
        return '<svg width="' + svgW + '" height="' + svgH + '" viewBox="' + viewX + " " + viewY + " " + svgW + " " + svgH + '" preserveAspectRatio="none" style="position:absolute;top:-' + (offset + margin) + "px;left:-" + (offset + margin) + 'px;pointer-events:none;z-index:5;">'
          + "<defs>"
          + '<linearGradient id="' + gradId + '" x1="' + gc.x1 + '%" y1="' + gc.y1 + '%" x2="' + gc.x2 + '%" y2="' + gc.y2 + '%"><stop offset="0%" stop-color="' + cPrincipal + '"/><stop offset="100%" stop-color="' + cAccent + '"/></linearGradient>'
          + '<clipPath id="' + clipId + '"><path d="' + borderPath + '"/></clipPath>'
          + '<pattern id="' + stripeId + '" patternUnits="userSpaceOnUse" width="' + stripeSize + '" height="' + stripeSize + '" patternTransform="rotate(45)"><rect width="' + (stripeSize / 2) + '" height="' + stripeSize + '" fill="' + cPrincipal + '"/><rect x="' + (stripeSize / 2) + '" width="' + (stripeSize / 2) + '" height="' + stripeSize + '" fill="' + cAccent + '"/></pattern>'
          + "</defs>"
          + cornerTriangles
          + '<g clip-path="url(#' + clipId + ')">'
          + '<path d="' + borderPath + '" fill="none" stroke="' + cPrincipal + '" stroke-width="' + (ep * 2) + '" stroke-linejoin="miter" opacity="0.18"/>'
          + '<path d="' + borderPath + '" fill="none" stroke="url(#' + gradId + ')" stroke-width="' + ep + '" stroke-linejoin="miter"/>'
          + '<path d="' + borderPath + '" fill="none" stroke="' + cAccent + '" stroke-width="' + Math.max(0.8, ep * 0.25) + '" stroke-linejoin="miter" opacity="0.55"/>'
          + "</g>"
          + brackets
          + angleMarks
          + circuits
          + circuitNodes
          + '<circle cx="' + diodeX + '" cy="' + diodeY + '" r="' + (diodeR * 2) + '" fill="' + cAccent + '" opacity="0.2"/>'
          + '<circle cx="' + diodeX + '" cy="' + diodeY + '" r="' + diodeR + '" fill="' + cAccent + '" stroke="' + cPrincipal + '" stroke-width="' + Math.max(0.5, ep * 0.15) + '"/>'
          + '<g><rect x="' + (bangX - bangW / 2) + '" y="' + (bangY - bangH) + '" width="' + bangW + '" height="' + (bangH * 0.72) + '" fill="' + cAccent + '"/><rect x="' + (bangX - bangW / 2) + '" y="' + (bangY - bangH * 0.12) + '" width="' + bangW + '" height="' + bangW + '" fill="' + cAccent + '"/></g>'
          + ticks.join("")
          + sweep
          + "</svg>";
      }

      // --- Arena ---
      // Bordure néon « console rétro » (réf. Xbox 360) : octogone allongé,
      // canal sombre sous un tube lumineux double filet, médaillons « orb »
      // (anneau + croix X incurvée) sertis sur les 4 biseaux, cartouches
      // sombres à cheval (haut décalé droite, bas centré), ailerons
      // triangulaires latéraux, nœuds aux 8 sommets. Tout sur le tracé ou
      // clippé dans la forme — marge rognée, intérieur libre.
      function getArenaBevels(sw) {
        var ep = clampStrokeWidth(sw);
        return { bx: Math.max(16, Math.round(ep * 4.2)), by: Math.max(10, Math.round(ep * 2.4)) };
      }
      function getArenaClipPath(W, H, sw) {
        var b = getArenaBevels(sw);
        var bx = Math.min(b.bx, W / 4), by = Math.min(b.by, H / 4);
        return "path('M " + bx + " 0 L " + (W - bx) + " 0 L " + W + " " + by + " L " + W + " " + (H - by) + " L " + (W - bx) + " " + H + " L " + bx + " " + H + " L 0 " + (H - by) + " L 0 " + by + " Z')";
      }
      function renderArena(W, H, idCadre, strokeWidth, couleur, couleurFin, gradientAngle, animer) {
        var principal = bpmHexValide(couleur) ? couleur : "#ffffff";
        var profond = bpmHexValide(couleurFin) ? couleurFin : bpmAssombrir(principal, 0.35);
        var clair = bpmEclaircir(principal, 0.5);
        var gc = mgAngleToCoords(isFinite(gradientAngle) ? gradientAngle : 135);
        var ep = clampStrokeWidth(strokeWidth);
        var offset = ep / 2;
        var b = getArenaBevels(ep);
        var bx = Math.min(b.bx, W / 4), by = Math.min(b.by, H / 4);
        var margin = Math.max(4, ep);
        var svgW = W + offset * 2 + margin * 2, svgH = H + offset * 2 + margin * 2;
        var viewX = -(offset + margin), viewY = -(offset + margin);
        var uid = (idCadre || "d").replace(/[^a-zA-Z0-9_-]/g, "-");
        var gradId = "grad-arena-" + uid, orbGradId = "orb-grad-arena-" + uid, clipId = "clip-arena-" + uid;
        var borderPath = "M " + bx + " 0 L " + (W - bx) + " 0 L " + W + " " + by + " L " + W + " " + (H - by) + " L " + (W - bx) + " " + H + " L " + bx + " " + H + " L 0 " + (H - by) + " L 0 " + by + " Z";
        var d = Math.max(2.5, ep * 1.1), di = d * 1.4;
        var echoPath = "M " + (bx + di) + " " + d + " L " + (W - bx - di) + " " + d + " L " + (W - d) + " " + (by + di) + " L " + (W - d) + " " + (H - by - di) + " L " + (W - bx - di) + " " + (H - d) + " L " + (bx + di) + " " + (H - d) + " L " + d + " " + (H - by - di) + " L " + d + " " + (by + di) + " Z";
        var orbR = Math.max(6, Math.min(bx, by) * 1.25, ep * 2);
        var orbW = Math.max(1.6, ep * 0.55);
        var bevelLen = Math.hypot(bx, by) || 1;
        var orbCentres = [
          [bx / 2 + (by / bevelLen) * orbR * 0.22, by / 2 + (bx / bevelLen) * orbR * 0.22],
          [W - bx / 2 - (by / bevelLen) * orbR * 0.22, by / 2 + (bx / bevelLen) * orbR * 0.22],
          [W - bx / 2 - (by / bevelLen) * orbR * 0.22, H - by / 2 - (bx / bevelLen) * orbR * 0.22],
          [bx / 2 + (by / bevelLen) * orbR * 0.22, H - by / 2 - (bx / bevelLen) * orbR * 0.22]
        ];
        var orbs = orbCentres.map(function (c) {
          var xr = orbR * 0.6;
          return "<g>"
            + '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="' + orbR + '" fill="rgba(6,10,4,0.65)" stroke="' + clair + '" stroke-width="' + orbW + '"/>'
            + '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="' + (orbR - orbW * 0.9) + '" fill="url(#' + orbGradId + ')" opacity="0.9"/>'
            + '<path d="M ' + (c[0] - xr) + " " + (c[1] - xr) + " Q " + c[0] + " " + c[1] + " " + (c[0] + xr) + " " + (c[1] + xr) + " M " + (c[0] + xr) + " " + (c[1] - xr) + " Q " + c[0] + " " + c[1] + " " + (c[0] - xr) + " " + (c[1] + xr) + '" fill="none" stroke="#ffffff" stroke-width="' + Math.max(1.4, ep * 0.5) + '" stroke-linecap="round" opacity="0.95"/>'
            + "</g>";
        }).join("");
        var orbsGroupe = animer
          ? '<g>' + orbs + '<animate attributeName="opacity" values="1;0.55;1" dur="3.5s" repeatCount="indefinite"/></g>'
          : "<g>" + orbs + "</g>";
        var traitFin = Math.max(1.2, ep * 0.35);
        var cw = Math.max(18, bx * 1.15), ch = Math.max(4.5, ep * 1.7), cd = cw * 0.3;
        var dotPt = Math.max(1.4, ep * 0.45);
        function cartouche(cx, cy, tx, ty) {
          var nx = -ty, ny = tx;
          var P = function (t, n) { return (cx + tx * t + nx * n) + " " + (cy + ty * t + ny * n); };
          var hexa = "M " + P(-cw + cd, -ch) + " L " + P(cw - cd, -ch) + " L " + P(cw, 0) + " L " + P(cw - cd, ch) + " L " + P(-cw + cd, ch) + " L " + P(-cw, 0) + " Z";
          var barre = "M " + P(-cw * 0.5, ch * 0.35) + " L " + P(cw * 0.5, ch * 0.35);
          var ptG = P(-cw + cd * 1.2, ch * 0.35).split(" ");
          var ptD = P(cw - cd * 1.2, ch * 0.35).split(" ");
          return '<path d="' + hexa + '" fill="rgba(6,10,4,0.75)" stroke="' + clair + '" stroke-width="' + traitFin + '"/>'
            + '<path d="' + barre + '" fill="none" stroke="' + clair + '" stroke-width="' + Math.max(1, traitFin * 0.7) + '" opacity="0.6"/>'
            + '<circle cx="' + ptG[0] + '" cy="' + ptG[1] + '" r="' + dotPt + '" fill="' + clair + '"/>'
            + '<circle cx="' + ptD[0] + '" cy="' + ptD[1] + '" r="' + dotPt + '" fill="' + clair + '"/>';
        }
        var wingL = Math.max(5, ep * 2.2), wingT = Math.max(7, ep * 3);

          var kite = "M " + P(-wingT, -wingL * 0.35) + " L " + P(0, wingL) + " L " + P(wingT, -wingL * 0.35) + " L " + P(0, -wingL) + " Z";
          return '<path d="' + kite + '" fill="rgba(6,10,4,0.7)" stroke="' + clair + '" stroke-width="' + traitFin + '"/>';
        }
        var decors = (W > cw * 4 && H > wingT * 4)
          ? cartouche(W * 0.72, 0, 1, 0) + cartouche(W / 2, H, 1, 0)
            + aileron(0, H / 2, 1, 0) + aileron(W, H / 2, -1, 0)
          : "";
        var sommets = [
          [bx, 0], [W - bx, 0], [W, by], [W, H - by],
          [W - bx, H], [bx, H], [0, H - by], [0, by]
        ];
        var noeudR = Math.max(1.3, ep * 0.35);
        var noeuds = sommets.map(function (n) {
          return '<circle cx="' + n[0] + '" cy="' + n[1] + '" r="' + noeudR + '" fill="' + clair + '"/>';
        }).join("");
        var dotR = Math.max(1.8, ep * 0.5);
        var voyageur = animer
          ? "<g>" + '<animateMotion dur="5s" repeatCount="indefinite" path="' + borderPath + '"/>'
            + '<circle r="' + (dotR * 2.4) + '" fill="' + clair + '" opacity="0.35"/>'
            + '<circle r="' + dotR + '" fill="#ffffff"/>' + "</g>"
          : "";
        return '<svg width="' + svgW + '" height="' + svgH + '" viewBox="' + viewX + " " + viewY + " " + svgW + " " + svgH + '" preserveAspectRatio="none" style="position:absolute;top:-' + (offset + margin) + "px;left:-" + (offset + margin) + 'px;pointer-events:none;z-index:5;">'
          + "<defs>"
          + '<linearGradient id="' + gradId + '" x1="' + gc.x1 + '%" y1="' + gc.y1 + '%" x2="' + gc.x2 + '%" y2="' + gc.y2 + '%"><stop offset="0%" stop-color="' + principal + '"/><stop offset="100%" stop-color="' + profond + '"/></linearGradient>'
          + '<radialGradient id="' + orbGradId + '" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="' + clair + '"/><stop offset="100%" stop-color="' + profond + '"/></radialGradient>'
          + '<clipPath id="' + clipId + '"><path d="' + borderPath + '"/></clipPath>'
          + "</defs>"
          + '<g clip-path="url(#' + clipId + ')">'
          + '<path d="' + borderPath + '" fill="none" stroke="rgba(6,10,4,0.55)" stroke-width="' + (ep * 3.4) + '" stroke-linejoin="miter"/>'
          + '<path d="' + borderPath + '" fill="none" stroke="' + principal + '" stroke-width="' + (ep * 2.6) + '" stroke-linejoin="miter" opacity="0.28"/>'
          + '<path d="' + borderPath + '" fill="none" stroke="url(#' + gradId + ')" stroke-width="' + ep + '" stroke-linejoin="miter"/>'
          + '<path d="' + borderPath + '" fill="none" stroke="' + clair + '" stroke-width="' + Math.max(0.8, ep * 0.2) + '" stroke-linejoin="miter" opacity="0.5"/>'
          + '<path d="' + echoPath + '" fill="none" stroke="' + clair + '" stroke-width="' + Math.max(1, ep * 0.28) + '" stroke-linejoin="miter" opacity="0.75"/>'
          + noeuds
          + decors
          + orbsGroupe
          + "</g>"
          + voyageur
          + "</svg>";
      }

      // --- Tribal ---
      // Encre « tatouage tribal » classique : QUE des courbes pleines.
      // Silhouette aux coins balayés en courbes concaves ; sur chaque arête
      // un motif symétrique (pointe-étoile centrale rentrante, griffes-crocs
      // pleines en éventail, fines balayures vers les coins) ; équerres de
      // visée arrondies en retrait des coins. Marge rognée, centre libre.
      function getTribalCorner(sw) {
        var ep = clampStrokeWidth(sw);
        return { cx: Math.max(12, Math.round(ep * 3)), cy: Math.max(9, Math.round(ep * 2.4)) };
      }
      function tribalPath(W, H, sw) {
        var c = getTribalCorner(sw);
        var cx = Math.min(c.cx, W / 4), cy = Math.min(c.cy, H / 4);
        return "M " + cx + " 0 L " + (W - cx) + " 0 "
          + "Q " + (W - cx * 0.15) + " " + (cy * 0.15) + " " + W + " " + cy + " "
          + "L " + W + " " + (H - cy) + " "
          + "Q " + (W - cx * 0.15) + " " + (H - cy * 0.15) + " " + (W - cx) + " " + H + " "
          + "L " + cx + " " + H + " "
          + "Q " + (cx * 0.15) + " " + (H - cy * 0.15) + " 0 " + (H - cy) + " "
          + "L 0 " + cy + " "
          + "Q " + (cx * 0.15) + " " + (cy * 0.15) + " " + cx + " 0 Z";
      }
      function getTribalClipPath(W, H, sw) {
        return "path('" + tribalPath(W, H, sw) + "')";
      }
      function pointeCentrale(P, c, w, h) {
        return "M " + P(c, -h * 0.2)
          + " Q " + P(c + w * 0.22, h * 0.3) + " " + P(c + w, h * 0.4)
          + " Q " + P(c + w * 0.26, h * 0.5) + " " + P(c, h)
          + " Q " + P(c - w * 0.26, h * 0.5) + " " + P(c - w, h * 0.4)
          + " Q " + P(c - w * 0.22, h * 0.3) + " " + P(c, -h * 0.2) + " Z";
      }
      function griffe(P, t0, s, w, h, L) {
        return "M " + P(t0, h * 0.06)
          + " Q " + P(t0 + s * L * 0.3, h * 1.05) + " " + P(t0 + s * L, h * 0.12)
          + " Q " + P(t0 + s * L * 0.55, h * 0.4) + " " + P(t0 + s * w, h * 0.02)
          + " Z";
      }
      function balayure(P, t0, t1, peak, ep) {
        var mid = (t0 + t1) / 2;
        var th = Math.max(0.9, ep * 0.3);
        return "M " + P(t0, ep * 0.35)
          + " Q " + P(mid, peak) + " " + P(t1, ep * 0.3)
          + " Q " + P(mid, peak + th) + " " + P(t0, ep * 0.35 + th * 0.6)
          + " Z";
      }
      function motifBord(x1, y1, x2, y2, nx, ny, ep) {
        var len = Math.hypot(x2 - x1, y2 - y1) || 1;
        var dx = (x2 - x1) / len, dy = (y2 - y1) / len;
        var P = function (t, prof) { return (x1 + dx * t + nx * prof) + " " + (y1 + dy * t + ny * prof); };
        var hMax = Math.max(9, ep * 2.4);
        var pad = hMax * 1.9;
        var demi = len / 2 - pad;
        if (demi < hMax * 1.5) return { corps: "", balayures: "" };
        var c = len / 2;
        var corps = [], balayures = [];
        var sw = hMax * 0.38;
        corps.push(pointeCentrale(P, c, sw, hMax * 1.1));
        var nGriffe = demi > hMax * 3.6 ? 2 : 1;
        for (var si = 0; si < 2; si++) {
          var s = si === 0 ? 1 : -1;
          var cur = c + s * (sw + hMax * 0.55);
          for (var i = 0; i < nGriffe; i++) {
            var k = 1 - i * 0.3;
            corps.push(griffe(P, cur, s, hMax * 0.42 * k, hMax * k, hMax * 1.45 * k + hMax * 0.4));
            cur += s * (hMax * 1.85 * k + hMax * 0.45);
          }
          var b0 = cur + s * hMax * 0.2;
          var b1 = s > 0 ? len - pad * 0.25 : pad * 0.25;
          if (Math.abs(b1 - b0) > hMax * 1.6) {
            balayures.push(balayure(P, b0, b1, -ep * 0.15, ep));
            balayures.push(balayure(P, b0 + s * hMax * 0.15, b1, hMax * 0.55, ep));
          }
        }
        return { corps: corps.join(" "), balayures: balayures.join(" ") };
      }
      function equerre(cx0, cy0, sx, sy, ix, iy, ax, ay, r) {
        var X = function (v) { return cx0 + v * sx; };
        var Y = function (v) { return cy0 + v * sy; };
        return "M " + X(ix + ax) + " " + Y(iy)
          + " L " + X(ix + r) + " " + Y(iy)
          + " Q " + X(ix) + " " + Y(iy) + " " + X(ix) + " " + Y(iy + r)
          + " L " + X(ix) + " " + Y(iy + ay);
      }
      function renderTribal(W, H, idCadre, strokeWidth, couleur, couleurFin, gradientAngle, animer) {
        var principal = bpmHexValide(couleur) ? couleur : "#111111";
        var profond = bpmHexValide(couleurFin) ? couleurFin : bpmAssombrir(principal, 0.4);
        var clair = bpmEclaircir(principal, 0.4);
        var gc = mgAngleToCoords(isFinite(gradientAngle) ? gradientAngle : 135);
        var ep = clampStrokeWidth(strokeWidth);
        var offset = ep / 2;
        var c = getTribalCorner(ep);
        var cx = Math.min(c.cx, W / 4), cy = Math.min(c.cy, H / 4);
        var margin = Math.max(4, ep);
        var svgW = W + offset * 2 + margin * 2, svgH = H + offset * 2 + margin * 2;
        var viewX = -(offset + margin), viewY = -(offset + margin);
        var uid = (idCadre || "d").replace(/[^a-zA-Z0-9_-]/g, "-");
        var gradId = "grad-tribal-" + uid, clipId = "clip-tribal-" + uid;
        var borderPath = tribalPath(W, H, ep);
        var mHaut = motifBord(cx * 1.15, 0, W - cx * 1.15, 0, 0, 1, ep);
        var mDroite = motifBord(W, cy * 1.15, W, H - cy * 1.15, -1, 0, ep);
        var mBas = motifBord(W - cx * 1.15, H, cx * 1.15, H, 0, -1, ep);
        var mGauche = motifBord(0, H - cy * 1.15, 0, cy * 1.15, 1, 0, ep);
        var corps = mHaut.corps + " " + mDroite.corps + " " + mBas.corps + " " + mGauche.corps;
        var sweeps = mHaut.balayures + " " + mDroite.balayures + " " + mBas.balayures + " " + mGauche.balayures;
        var motif = "<g>"
          + (animer ? '<animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>' : "")
          + '<path d="' + sweeps + '" fill="url(#' + gradId + ')" opacity="0.85"/>'
          + '<path d="' + corps + '" fill="url(#' + gradId + ')"/></g>';
        var ix = Math.min(W * 0.09, Math.max(cx * 1.6, ep * 2.6));
        var iy = Math.min(H * 0.11, Math.max(cy * 1.6, ep * 2.6));
        var ax = Math.max(12, W * 0.045);
        var ay = Math.max(9, H * 0.05);
        var eqW = Math.max(1.3, ep * 0.45);
        var equerres = W > 130 && H > 90
          ? '<path d="' + equerre(0, 0, 1, 1, ix, iy, ax, ay, 2.5) + " "
            + equerre(W, 0, -1, 1, ix, iy, ax, ay, 2.5) + " "
            + equerre(W, H, -1, -1, ix, iy, ax, ay, 2.5) + " "
            + equerre(0, H, 1, -1, ix, iy, ax, ay, 2.5)
            + '" fill="none" stroke="' + clair + '" stroke-width="' + eqW + '" stroke-linecap="round" opacity="0.85"/>'
          : "";
        var dotR = Math.max(1.8, ep * 0.5);
        var voyageur = animer
          ? "<g>" + '<animateMotion dur="5.5s" repeatCount="indefinite" path="' + borderPath + '"/>'
            + '<circle r="' + (dotR * 2.4) + '" fill="' + clair + '" opacity="0.35"/>'
            + '<circle r="' + dotR + '" fill="#ffffff"/>' + "</g>"
          : "";
        return '<svg width="' + svgW + '" height="' + svgH + '" viewBox="' + viewX + " " + viewY + " " + svgW + " " + svgH + '" preserveAspectRatio="none" style="position:absolute;top:-' + (offset + margin) + "px;left:-" + (offset + margin) + 'px;pointer-events:none;z-index:5;">'
          + "<defs>"
          + '<linearGradient id="' + gradId + '" x1="' + gc.x1 + '%" y1="' + gc.y1 + '%" x2="' + gc.x2 + '%" y2="' + gc.y2 + '%"><stop offset="0%" stop-color="' + principal + '"/><stop offset="100%" stop-color="' + profond + '"/></linearGradient>'
          + '<clipPath id="' + clipId + '"><path d="' + borderPath + '"/></clipPath>'
          + "</defs>"
          + '<g clip-path="url(#' + clipId + ')">'
          + '<path d="' + borderPath + '" fill="none" stroke="rgba(6,6,6,0.5)" stroke-width="' + (ep * 3.2) + '" stroke-linejoin="miter"/>'
          + '<path d="' + borderPath + '" fill="none" stroke="' + principal + '" stroke-width="' + (ep * 2.4) + '" stroke-linejoin="miter" opacity="0.22"/>'
          + '<path d="' + borderPath + '" fill="none" stroke="url(#' + gradId + ')" stroke-width="' + ep + '" stroke-linejoin="miter"/>'
          + '<path d="' + borderPath + '" fill="none" stroke="' + clair + '" stroke-width="' + Math.max(0.8, ep * 0.2) + '" stroke-linejoin="miter" opacity="0.45"/>'
          + motif
          + equerres
          + "</g>"
          + voyageur
          + "</svg>";
      }

      var CADRES_RENDERERS = {
        cyberpunk: renderCyberpunk,
        story: renderStory,
        "thin-line": renderThinLine,
        hexagon: renderHexagon,
        mgstyle: renderMGStyle,
        arena: renderArena,
        tribal: renderTribal
      };
      var CADRES_CLIP_PATHS = {
        cyberpunk: getCyberpunkClipPath,
        story: getStoryClipPath,
        "thin-line": getThinLineClipPath,
        hexagon: getHexagonClipPath,
        mgstyle: getMGStyleClipPath,
        arena: getArenaClipPath,
        tribal: getTribalClipPath
      };

      function genererCadreSVG(cadre, W, H, idCadre) {
        if (!cadre) return "";
        var style = cadre.style || "carre";
        var strokeWidth = cadre.strokeWidth || 4;
        var couleur = cadre.couleur || "#ffffff";
        var couleurFin = cadre.couleurFin || "";
        var gradientAngle = isFinite(cadre.gradientAngle) ? cadre.gradientAngle : 135;
        if (style === "arrondis" || style === "carre") {
          return renderCadreInline(style, W, H, couleur, couleurFin, strokeWidth, idCadre, gradientAngle, cadre.animer === true);
        }
        var fn = CADRES_RENDERERS[style];
        if (fn) {
          return fn(W, H, idCadre, strokeWidth, couleur, couleurFin, gradientAngle, cadre.animer === true);
        }
        return "";
      }

      function genererCadreClipPath(cadre, W, H) {
        if (!cadre) return null;
        var style = cadre.style || "carre";
        var strokeWidth = cadre.strokeWidth || 4;
        if (style === "arrondis") {
          var r = Math.min(8, W / 4, H / 4);
          return "path('M " + r + " 0 L " + (W - r) + " 0 Q " + W + " 0 " + W + " " + r + " L " + W + " " + (H - r) + " Q " + W + " " + H + " " + (W - r) + " " + H + " L " + r + " " + H + " Q 0 " + H + " 0 " + (H - r) + " L 0 " + r + " Q 0 0 " + r + " 0 Z')";
        }
        if (style === "carre") return null;
        var fn = CADRES_CLIP_PATHS[style];
        if (!fn) return null;
        try { return fn(W, H, strokeWidth); } catch (e) { return null; }
      }

      // ===== Mode « bulles » : cadre SVG par message (parité diffusion) =====
      // sceneCadre = cadreWidget de la scène (cadre actif + strokeWidth > 0)
      // — mêmes valeurs que sur un widget objectif. chatBulles = ≥1 widget
      // chat de la scène en chatStyle "bulles" (le pop-out n'est lié à
      // aucun widget précis → majorité simple).
      var sceneCadre = null;
      var chatBulles = false;
      var dernierCadreKey = "";
      var chatMsgUid = 0;

      // Lit cadreWidget + chatStyle des widgets depuis un snapshot scène.
      // Rebuild du chat seulement si la signature a changé.
      function majEtatCadre(scene) {
        var c = scene.cadreWidget;
        if (!c || !c.actif || (c.strokeWidth || 0) <= 0) c = null;
        var bulles = (scene.widgets || []).some(function (w) {
          return (w.type || "media") === "chat" && w.chatStyle === "bulles";
        });
        var key = (bulles ? "b" : "c") + "|" + (c
          ? [c.style, c.strokeWidth, c.couleur, c.couleurFin, c.gradientAngle, c.animer === true ? "a1" : "a0"].join("|")
          : "");
        if (key === dernierCadreKey) return;
        dernierCadreKey = key;
        sceneCadre = c;
        chatBulles = bulles;
        chatBody.classList.toggle("bulles", bulles);
        fillChatBody();
      }

      // strokeWidth plafonné pour les bulles (parité diffusion) : 2px
      // max quelle que soit la valeur scène — les renderers dessinent
      // ~3×ep en bande visible et leurs ornements ont un plancher 8-12px.
      function cadreMsgScale(cadre) {
        var sw = cadre.strokeWidth || 4;
        var scaled = Math.max(1, Math.min(sw, 2));
        if (scaled === sw) return cadre;
        var c = {};
        for (var k in cadre) c[k] = cadre[k];
        c.strokeWidth = scaled;
        return c;
      }

      // Pose le cadre SVG réel sur une bulle aux dims connues : clip-path à
      // la forme + enfant .cadre-overlay (même traitement qu'applyCadreWidget).
      function decorerCadreMsg(div, cadre, W, H) {
        if (W <= 0 || H <= 0) return;
        cadre = cadreMsgScale(cadre);
        // Jamais d'anim sur les bulles : jusqu'à ~200 SVG par widget —
        // un animateMotion par message violerait le budget perf.
        if (cadre.animer === true) {
          var cs = {};
          for (var k in cadre) cs[k] = cadre[k];
          cs.animer = false;
          cadre = cs;
        }
        var clip = genererCadreClipPath(cadre, W, H);
        if (clip) {
          div.style.clipPath = clip;
          div.style.webkitClipPath = clip;
        }
        var overlay = document.createElement("div");
        overlay.className = "cadre-overlay";
        overlay.innerHTML = genererCadreSVG(cadre, W, H, "cm" + (chatMsgUid++));
        div.appendChild(overlay);
      }

      // WS en dur sur :4321 (même path que diffusion.html = /ws).
      var WS_URL = "ws://127.0.0.1:4321/ws";

      function connect() {
        var ws = new WebSocket(WS_URL);

        ws.onclose = function () {
          setTimeout(connect, 2000);
        };

        ws.onerror = function () {
        };

        ws.onmessage = function (ev) {
          try {
            var msg = JSON.parse(ev.data);
            if (msg.type === "chat" && msg.message) {
              chatMessages.push(msg.message);
              if (chatMessages.length > MAX_CHAT) {
                chatMessages = chatMessages.slice(chatMessages.length - MAX_CHAT);
              }
              fillChatBody();
            } else if (msg.type === "snapshot" && msg.scene) {
              // Snapshot scène : cadreWidget + chatStyle des widgets →
              // parité « bulles » avec diffusion (rebuild si changé).
              majEtatCadre(msg.scene);
            }
          } catch (e) {
          }
        };
      }

      connect();
    </script>
  </body>
</html>
